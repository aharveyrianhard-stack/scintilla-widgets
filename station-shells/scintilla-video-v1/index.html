<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>SCINTILLA · video pane</title>
<!-- ============================================================================
     SCINTILLA · /pane-video — BUILT FOR THE PANE, not a page squeezed into one.

     Why this exists. /feed-a and /feed-b are full pages. Dropped into a deck
     slot they spend their height on chrome — header, chip row, tools row, a
     hint paragraph, a footer — and the videos end up below the fold. Alan
     opened the deck and saw "Nothing is playing and nothing was chosen for
     you" with no video to click. The data was fine (2,980 videos, every one
     with a thumbnail). The layout was the bug.

     So this is a different thing, sized for a box:
       · THUMBNAILS FIRST. A grid that counts its own columns from its own
         width — 1 column in a phone slot, 5 across an Apple TV third. The
         first thing in the pane is always a picture of a video.
       · ONE thin bar of chrome. Nothing else competes for height.
       · CLICK ONE AND IT PLAYS IN PLACE. The grid gives way to the player
         inside the same box. Back is one tap and you are on the grid again.
       · IT STILL NEVER PICKS FOR YOU. Opens on the grid. ?v= is the only
         preselect, because that is you asking by id.

     PICTURE-IN-PICTURE. The pane keeps the chosen video in its own URL
     (?v=), so whatever hosts it can lift the exact same view — same video —
     into a floating Document Picture-in-Picture window. The deck's PiP
     button does that. Where the browser supports Document PiP and we are
     top-level, the button here does it directly.

     Params: ?feed=personal|scintilla|soundscapes|golf|ai_research|fitness|market
             · ?mode=grid|videos|shorts (GRID · VIDEOS · SHORTS tabs; ?list=shorts still works)
             · ?list=default|subscribed|watch · ?v=VIDEOID
             · ?autoplay=1 · ?limit=60 (10-200) · ?t=MU · ?cols=N (force)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-PANEVIDEO-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-btn-size:8px; --ipad-btn-pad-y:3px; --ipad-btn-pad-x:7px;
  --ipad-title-size:9.5px; --ipad-caption-size:9px;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; display:flex; flex-direction:column;
  overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }

/* ---- ONE thin bar. This is the entire chrome budget. ---- */
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px;
  padding-top:calc(4px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  background:var(--panel2); overflow:hidden; }
#bar::-webkit-scrollbar{ display:none; }
.k{ flex:none; color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; }
.btn{ flex:none; font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink3); cursor:pointer;
  text-decoration:none; white-space:nowrap; }
button.btn{ appearance:none; border-radius:0; font-family:var(--mono); line-height:normal; }
.btn:hover{ color:var(--ink); border-color:var(--hair); }
.btn.on{ color:var(--crk); border-color:var(--crk); }
.btn.out{ color:var(--vol); border-color:rgba(255,138,0,.35); }
.btn:disabled{ color:var(--mute); border-color:var(--line); cursor:default; opacity:.48; }
#chips{ flex:1 1 0; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
#chips::-webkit-scrollbar{ display:none; }
/* GRID · VIDEOS · SHORTS sit first in the chip row; a hairline separates them from the list chips.
   Same .btn as every other control — no new colour, the active tab uses the existing "on" state. */
#chips .sep{ flex:none; width:1px; height:11px; background:var(--line); margin:0 3px; align-self:center; }
#q{ display:none; flex:1 1 90px; min-width:70px; background:var(--bg); border:1px solid var(--line);
  color:var(--ink); font-family:var(--mono); font-size:11px; padding:3px 6px; outline:none;
  border-radius:0; -webkit-appearance:none; }
body.searching #q{ display:block; }
#q:focus{ border-color:var(--crk); }
#bFull{ margin-left:0; }
/* Once the profile select is on the bar it names the feed; the label beside it said the same word. */
body.has-profile-select .k{ display:none; }
/* An awaiting channel explains itself in sentence case; the shouting caps are for one-line states. */
.msg.note{ text-transform:none; letter-spacing:.04em; font-size:9.5px; line-height:1.6; color:var(--ink3);
  max-width:560px; margin:0 auto; }
.msg.note b{ color:var(--ink2); font-weight:600; letter-spacing:.08em; }
/* The one step, as a button in the pane's own palette: no new colour, no white. */
.msg.note a.step{ display:inline-block; margin-top:8px; padding:3px 8px; color:var(--crk); border:1px solid var(--hair);
  text-decoration:none; letter-spacing:.1em; text-transform:uppercase; font-size:8px; }
.msg.note a.step:hover{ border-color:var(--crk); }

/* ---- THE GRID. Thumbnails, counted from our own width. ---- */
#grid{ flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; display:grid; gap:1px; align-content:start;
  grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); background:var(--line); }
.card{ background:var(--bg); cursor:pointer; display:flex; flex-direction:column; min-width:0; }
.card:hover{ background:var(--panel2); }
.card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
.thumb{ position:relative; width:100%; aspect-ratio:16/9; background:#12121c; overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.star{ position:absolute; top:0; right:0; width:34px; height:34px; padding:0; z-index:2;
  box-sizing:border-box; border:0; border-radius:0; background:transparent;
  color:var(--ink); cursor:pointer;
  -webkit-text-stroke:.35px #000; text-shadow:0 1px 3px #000,0 0 8px #000,0 0 2px #000; }
.star > span{ position:absolute; top:1px; right:1px; font:19px/1 var(--mono); }
.star:hover{ color:var(--ink); }
.star.on{ color:var(--vol); }
.star.unk{ opacity:.65; }
#wlFlash{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:60; pointer-events:none;
  font:600 11px/1.5 var(--mono); letter-spacing:.05em; color:#ffd24a;
  background:rgba(10,12,16,.92); border:1px solid #2a2f3a; border-radius:6px; padding:6px 12px;
  opacity:0; transition:opacity .18s; max-width:88%; text-align:center; }
#wlFlash.show{ opacity:1; }
.dur{ position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.82); color:#fff;
  font-size:8px; padding:1px 4px; letter-spacing:.02em; }
/* A stream on air says LIVE; one still to come says when it starts, on the
   desk's own clock. Same corner, same size — only the wording changes. */
.dur.live{ letter-spacing:.08em; }  /* the dot and the spacing carry it — no new colour is introduced */
.dur.live::before{ content:"\25CF"; font-size:7px; margin-right:3px; vertical-align:1px; }
.dur.soon{ color:var(--ink3); letter-spacing:.04em; }
.tk{ position:absolute; left:3px; top:3px; background:rgba(0,212,255,.9); color:#04040a;
  font-size:8px; padding:1px 4px; letter-spacing:.04em; font-weight:600; }
.cap{ padding:4px 5px 6px; }
.cap .t{ color:var(--ink2); font-size:9.5px; line-height:1.3; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
/* ---- THE CHANNEL LINE — legible, on purpose. ----
   It used to be painted in --mute (#3A3A52). Against the card's own
   background (#0A0A0F) that is a MEASURED contrast ratio of 1.79:1 — under a
   quarter of the 4.5:1 that small text needs to be read, and Alan's report
   was exactly that: "I can barely see them... the name of the channel, I can
   barely see it too."

   --mute is a HAIRLINE colour. It is right for a divider and wrong for a word.
   The line is now painted in real reading inks, and the hierarchy is kept by
   the GAP between them rather than by pushing the bottom one into the dark:

     title    --ink2  #C6C8DE  11.96:1   loudest
     channel  --ink3  #9A9AB6   7.22:1   read at a glance
     age      --dim   #868AAA   5.86:1   reports, never competes

   Both new values clear WCAG AA (4.5:1) on the card background AND on the
   lighter hover background (6.95:1 / 5.64:1). Neither is white or near-white:
   #9A9AB6 and #868AAA are mid greys inside the existing monochrome ramp, and
   the near-white inks are deliberately NOT used here.
   9px with a half-step of weight, because at this size a monospace face loses
   its strokes before it loses its colour. */
.cap .s{ color:var(--ink3); font-size:9px; font-weight:500; margin-top:3px; overflow:hidden;
  white-space:nowrap; display:flex; align-items:baseline; gap:6px; }
.cap .s .ch{ min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--ink3); }
/* HOW LONG AGO IT WAS POSTED — the empty space at the right of the channel
   line, which is where it was asked for. One step quieter than the channel
   name: it reports, it never competes with the title. Tabular figures so the
   label does not twitch in width as the number ticks over. */
.cap .s .age{ flex:0 0 auto; margin-left:auto; color:var(--dim);
  font-variant-numeric:tabular-nums; }
/* very small slots: drop the caption, the picture is the interface */
body.tiny .cap .s{ display:none; }
body.tiny .cap{ padding:3px 4px 4px; }
body.tiny .cap .t{ -webkit-line-clamp:2; font-size:9px; }
html[data-view="desk"] .btn{ font-size:9px; padding:4px 8px; }
html[data-view="desk"] .cap .t{ font-size:11px; }
html[data-view="desk"] .cap .s{ font-size:10px; }
html[data-view="ipad"] .btn{ font-size:var(--ipad-btn-size); padding:var(--ipad-btn-pad-y) var(--ipad-btn-pad-x); }
html[data-view="ipad"] .cap .t{ font-size:var(--ipad-title-size); }
html[data-view="ipad"] .cap .s{ font-size:var(--ipad-caption-size); }
html[data-view="compact"] .btn{ font-size:7px; padding:2px 5px; }
html[data-view="compact"] .cap .t{ font-size:8.5px; }

/* ---- THE PLAYER. Same box, no navigation away. ---- */
#stage{ display:none; flex:1 1 0; min-height:0; flex-direction:column; }
body.playing #stage{ display:flex; }
body.playing #grid{ display:none; }
#video{ flex:1 1 0; min-height:0; position:relative; background:#000; }
#video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
#transport{ display:none; flex:1 1 0; min-width:0; align-items:center; justify-content:flex-end; gap:4px;
  overscroll-behavior:contain; touch-action:manipulation; }
body.playing #transport{ display:flex; }
#nowq{ flex:none; color:var(--mute); font-size:7.5px; letter-spacing:.08em; white-space:nowrap; }
.transport{ width:48px; padding-left:0; padding-right:0; text-align:center; }
#bMenu{ width:32px; padding-left:0; padding-right:0; text-align:center; }
#bContinue{ display:none; color:var(--vol); border-color:rgba(255,138,0,.55); }
body[data-autoplay-blocked="true"] #bContinue{ display:inline-block; }
#more{ position:fixed; z-index:5; right:6px; top:calc(32px + env(safe-area-inset-top)); width:min(190px,calc(100% - 12px));
  padding:5px; border:1px solid var(--hair); background:rgba(10,10,15,.98); box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:flex; flex-direction:column; gap:4px; }
#more[hidden]{ display:none; }
#more .btn{ width:100%; text-align:left; overflow:hidden; text-overflow:ellipsis; }
#more a.btn{ display:block; }
body.playing #chips{ display:none; }
@media (max-width:480px){
  body.playing .k{ display:none; }
}
@media (max-width:340px){
  #transport{ gap:2px; }
  .transport{ width:38px; }
  #bMenu{ width:28px; }
  #bContinue{ max-width:92px; padding-left:4px; padding-right:4px; overflow:hidden; text-overflow:ellipsis; }
}
.msg{ grid-column:1/-1; padding:16px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; text-align:center; background:var(--bg); }
</style>
</head>
<body>
<div id="bar">
  <span class="k" id="kk">FEED</span>
  <select id="feedProfile" class="btn" title="switch channel profile"
          aria-label="Channel profile" style="display:none"></select>
  <span class="btn" id="bBack" style="display:none">‹ grid</span>
  <span id="chips"></span>
  <span id="transport" aria-label="video queue controls">
    <button class="btn transport" id="bPrev" type="button" aria-label="previous video">‹ prev</button>
    <span id="nowq" aria-live="polite"></span>
    <button class="btn" id="bContinue" type="button">tap to continue</button>
    <button class="btn transport" id="bNext" type="button" aria-label="next video">next ›</button>
    <button class="btn" id="bMenu" type="button" aria-label="more video actions" aria-controls="more" aria-expanded="false">•••</button>
  </span>
  <span class="btn" id="bFull" title="expand this pane">⛶</span>
</div>
<div id="more" role="menu" hidden>
  <button class="btn" id="bWatch" type="button" role="menuitem"></button>
  <button class="btn" id="bSubscribe" type="button" role="menuitem" style="display:none"></button>
  <a class="btn out" id="bYt" role="menuitem" target="_blank" rel="noopener">open in youtube ↗</a>
  <button class="btn" id="bPip" type="button" role="menuitem" style="display:none" title="float this video in its own always-on-top window">picture in picture</button>
  <button class="btn" id="bMenuFull" type="button" role="menuitem">expand pane</button>
  <button class="btn" id="bCover" type="button" role="menuitem" style="display:none" title="intentionally expand this video across X">cover X</button>
</div>
<div id="grid"><div class="msg">loading…</div></div>
<div id="stage">
  <div id="video"></div>
</div>
<script>
"use strict";
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
const PUBLIC = "sb_publishable_AutibLpFtTns-WHAg67Pvw_I0HmjqE9";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries; let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + r.status);
      else throw new Error("pg " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 400 * (i + 1) + Math.random() * 250));
  }

}
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);
const VIEW_PROFILES = ["auto","desk","ipad","display","compact"];
let VIEW_PROFILE = VIEW_PROFILES.includes(QS.get("view")) ? QS.get("view") : "auto";
document.documentElement.dataset.view = VIEW_PROFILE;
function applyIpadPaneScale(forced) {
  const raw = Math.min(innerWidth / 410, innerHeight / 180);
  const scale = VIEW_PROFILE === "ipad"
    ? Math.max(.72, Math.min(1.08, Number.isFinite(+forced) ? +forced : raw)) : 1;
  const root = document.documentElement.style;
  root.setProperty("--ipad-btn-size", (8 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-btn-pad-y", (3 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-btn-pad-x", (7 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-title-size", (9.5 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-caption-size", (9 * scale).toFixed(2) + "px");
}
applyIpadPaneScale();
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* ── CHANNEL PROFILES ────────────────────────────────────────────────────────────────────────
   The pane used to accept exactly three hard-coded feed words. Profiles are now a registry, so a
   new channel is one row here instead of a code change in four places.

   PROVENANCE IS NOT OVERWRITTEN. A profile is a VIEW over youtube_feed.subscription_accounts; it
   never rewrites that column and never assumes a row belongs to the profile being viewed. A row
   with no account is UNSCOPED - it is not this profile's content and is not counted as though it
   were (see coverage below).

   A profile is only offered when the feed actually carries its account. Measured on the 200 most
   recent rows on 2026-09-21: personal 30, scintilla 34, unscoped 136, multi-account 0, and NO
   soundscapes rows at all. So soundscapes and golf are declared here and stay disabled with a
   visible reason until their account key appears in the data - an empty profile that looks
   working is worse than one that says what it is waiting for. */
const FEED_PROFILES = [
  { key: "personal",    account: "personal",    label: "PERSONAL" },
  { key: "scintilla",   account: "scintilla",   label: "SCINTILLA",
    waiting: "not connected", note: "its YouTube sign-in is not connected, so new subscriptions are missed; the videos here come from the channel list saved before that. Connect SCINTILLA once and the sweep reads its subscriptions again within the hour" },
  /* 23 Sep, Alan: "The four new YouTube channels — they've never been awaiting. They've been ready for
     a long time. They're channels in my YouTube account." The channels exist on YouTube; what does not
     exist yet is their connection to the sweep. Each channel is ONE account key here, in the deck's
     VIDEO_FEEDS and in the three collector functions. Until rows carry the key, the entry stays in the
     list and says in plain words what it is waiting for and where the one step is — never a blank
     list, never a greyed word (Alan: "the drop-downs are empty, seems funky"). */
  { key: "soundscapes", account: "soundscapes", label: "SOUNDSCAPES",
    waiting: "not connected yet", note: "waiting for its YouTube sign-in. Connect the SOUNDSCAPES channel once and the sweep collects its subscriptions within the hour" },
  { key: "golf",        account: "golf",        label: "GOLF",
    waiting: "not connected yet", note: "waiting for its YouTube sign-in. Connect the GOLF channel once and the sweep collects its subscriptions within the hour" },
  { key: "ai_research", account: "ai_research", label: "AI RESEARCH",
    waiting: "not connected yet", note: "waiting for its YouTube sign-in. Connect the AI RESEARCH channel once and the sweep collects its subscriptions within the hour" },
  { key: "fitness",     account: "fitness",     label: "FITNESS",
    waiting: "not connected yet", note: "waiting for its YouTube sign-in. Connect the FITNESS channel once and the sweep collects its subscriptions within the hour" },
  { key: "market",      account: null,          label: "MARKET SEARCH" }
];
/* The one step lives on one page: it shows every channel's live connection state and runs Google's
   own sign-in for the channel you pick. It never sees a password and never calls yt-act. */
const CONNECT_PAGE = "/youtube-connect/";
const FEED_PROFILE_KEYS = FEED_PROFILES.map((profile) => profile.key);
const FEED   = FEED_PROFILE_KEYS.includes(QS.get("feed")) ? QS.get("feed") : "personal";
const FEED_PROFILE = FEED_PROFILES.find((profile) => profile.key === FEED) || FEED_PROFILES[0];
/* The on-screen panes are independent stored feeds.  YouTube actions are not:
   Watch Later and Subscribe deliberately use Alan's one healthy Personal
   Google connection, never a second SCINTILLA device-code connection. */
const YOUTUBE_ACCOUNT = "personal";
/* ---- HOW FAR DOWN THE GRID GOES ----
   Alan: "there seems to be some limit of how much downwards I can scroll in
   the grid that I don't like."  He was right, and it was not a CSS height and
   not a virtualisation window. It was THE RESULT SET. This pane asked the
   database for `limit=60` and then stopped forever: the deck mounts it with
   no ?limit at all, so it took that 60, and on the SCINTILLA feed a further
   account filter runs over those same 60 rows client-side — MEASURED on
   2026-09-22: 60 rows requested, 44 tiles painted. Forty-four tiles was the
   floor of the grid, with roughly three thousand videos behind it.

   Two changes, and they are different things:
     · the PAGE is bigger (200, ceiling 500) — one request now brings a real
       screenful of history instead of a handful;
     · the page is no longer the END. Reaching the bottom asks for the next
       page and appends it, up to MAX_ROWS, which exists only so a phone does
       not try to hold three thousand <img> tags at once. */
const LIMIT  = Math.max(10, Math.min(500, +(QS.get("limit") || 200)));
const MAX_ROWS = Math.max(LIMIT, Math.min(2000, +(QS.get("max") || 1000)));
let PAGE_AT = 0;          /* rows REQUESTED so far — the next page's offset */
let PAGE_MORE = true;     /* the last page came back full, so there is more behind it */
let PAGE_BUSY = false;
const TICK   = (QS.get("t") || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
const START  = (QS.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
const AUTO   = QS.get("autoplay") === "1";
const FORCE  = +(QS.get("cols") || 0);

/* Personal is its own subscribed feed.  SCINTILLA is the shared Hub social
   discovery grid: unscoped discovery plus channels deliberately subscribed
   to SCINTILLA.  Its Subscribe action adds a channel to that durable feed;
   it never asks the browser for Google device-code authorization. */
const SUBSCRIBED = {
  id: "default", n: "subscribed",
  q: "&subscription_accounts=cs." + encodeURIComponent("{" + FEED + "}")
};
const SCINTILLA_SUBSCRIBED = {
  id: "subscribed", n: "subscribed",
  q: "&subscription_accounts=cs." + encodeURIComponent("{scintilla}")
};
/* A LIST says WHICH rows (this feed's subscriptions, the shared grid, the saved set, market
   search). Whether shorts are in it is no longer a list's business: that is the MODE below. The old
   "shorts" and "all market" chips were the same idea folded into a list, and they are kept as
   URLs (?list=shorts, ?list=all) so nothing that linked here breaks. */
const LISTS = FEED === "market" ? [

/* ── PROFILE COVERAGE (honest, never inferred) ───────────────────────────────────────────────

/* PRESENCE PER CHANNEL (23 Sep 2026). A channel used to count as ready only if its videos appeared in the

function waitForYouTubePlayerApi() {

/* The card star may only claim saved-or-not from a LANDED read. Before the shared

   said state, never painted as "unsaved". */

    return '<button class="star unk" data-star="' + esc(v.video_id) + '" aria-label="watch-later state unknown" title="watch-later state unknown — ' + why + ' · a click retries the read"><span aria-hidden="true">?</span></button>';

/* ---- HOW LONG AGO IT WAS POSTED ----
   The thumbnail corner already carries the video's LENGTH (13:33). Length is
   not age, and the two must never be read as one number, so the age lives on
   the channel line instead, right-aligned into the space that was empty.

   published_at — the video's own publish instant, handed over by the feed as
   an ISO timestamp — is the ONLY thing allowed to produce an age here. The
   database does hold a collection time (the sweep stamp on youtube_videos, the
   pass that first saw the row) and it is deliberately not a fallback: a video
   we caught a day late would otherwise announce itself as minutes old. A row
   with no usable publish time gets no age at all rather than a wrong one.

   Every step floors rather than rounds, so the label is the age the video has
   certainly reached, never one it has not. */
const VIDEO_AGE_NONE = "";
const VIDEO_PUBLISHED_SHAPE = /^\d{4}-\d{2}-\d{2}[T ]/;
function videoPublishedMs(value) {
  /* published_at is a timestamptz, so the feed always hands it over as
     YYYY-MM-DD... Anything else is refused rather than guessed at: Date.parse
     is generous enough to read the string "0" as the year 2000, and a guess
     that lands is worse than no age at all. */
  if (typeof value !== "string" || !VIDEO_PUBLISHED_SHAPE.test(value)) return null;
  const t = Date.parse(value);
  return isFinite(t) && t > 0 ? t : null;
}
function videoAgeLabel(value, nowMs) {
  const t = videoPublishedMs(value);
  if (t == null) return VIDEO_AGE_NONE;
  const now = isFinite(nowMs) ? nowMs : Date.now();
  const s = (now - t) / 1000;
  /* A publish time in the future is a clock difference or a scheduled
     premiere, not an age. A minute of skew reads as new; past that, refuse. */
  if (s < -60) return VIDEO_AGE_NONE;
  if (s < 120) return "just now";
  const m = s / 60;   if (m < 60) return Math.floor(m) + "m ago";
  const h = m / 60;   if (h < 24) return Math.floor(h) + "h ago";
  const d = h / 24;   if (d < 2) return "yesterday";
  if (d < 7) return Math.floor(d) + "d ago";
  const w = d / 7;    if (w < 9) return Math.floor(w) + "w ago";
  const mo = d / 30.44; if (mo < 12) return Math.floor(mo) + "mo ago";
  return Math.floor(d / 365.25) + "y ago";
}
/* A stream's age is counted from when it went on air, never from the date it
   carried while it was still only scheduled. A row from before the feed knew
   about stream times still has published_at and reads exactly as it did. */
function videoWhen(v) { return (v && (v.feed_at || v.published_at)) || ""; }
function videoAgeHTML(v) {
  const when = videoWhen(v);
  const label = videoAgeLabel(when);
  if (!label) return "";
  return '<span class="age" data-published="' + esc(String(when)) + '">' + esc(label) + "</span>";
}
/* The corner of the thumbnail: LIVE while a stream is on air, the start time
   while one is still to come, the video's length otherwise. Times are New York,
   the clock the rest of the Station runs on, and a start on another day carries
   that day with it. */
const START_TIME_NY = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
const START_DAY_NY  = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });
const NY_DAY        = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" });
function startLabel(value, nowMs) {
  const t = videoPublishedMs(value);
  if (t == null) return "";
  const at = new Date(t);
  const now = new Date(isFinite(nowMs) ? nowMs : Date.now());
  const time = START_TIME_NY.format(at).replace(/\s?([AP])M/, (m, half) => half.toLowerCase() + "m");
  return NY_DAY.format(at) === NY_DAY.format(now) ? time : START_DAY_NY.format(at) + " " + time;
}
function videoBadgeHTML(v) {
  if (v && v.live_state === "live") return '<span class="dur live">LIVE</span>';
  if (v && v.live_state === "upcoming") {
    const label = startLabel(v.starts_at);
    return label ? '<span class="dur soon">' + esc(label) + "</span>" : "";
  }
  return v && v.duration ? '<span class="dur">' + esc(v.duration) + "</span>" : "";
}
/* The Station stays open for hours, so a label written this morning must not
   still claim "2h ago" tonight. The ages are re-read in place on the pass the
   feed already runs and whenever the tab comes back to the front: no timer per
   tile, no extra request, no repaint of the grid. */
function paintAges() {
  const now = Date.now();
  for (const n of document.querySelectorAll("#grid .age")) {
    const label = videoAgeLabel(n.dataset.published, now);
    if (n.textContent !== label) n.textContent = label;
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") paintAges(); });

function cardHTML(v) {
  return '<div class="card' + (CUR && CUR.video_id === v.video_id ? " on" : "") + '" data-v="' + esc(v.video_id) + '">' +
      '<div class="thumb"><img loading="lazy" decoding="async" src="' +
        esc(v.thumb_url || ("https://i.ytimg.com/vi/" + v.video_id + "/mqdefault.jpg")) + '" alt="">' +
        starHTML(v) +
        (v.tickers ? '<span class="tk">' + esc(String(v.tickers).split(",")[0]) + "</span>" : "") +
        videoBadgeHTML(v) +
      "</div>" +
      '<div class="cap"><div class="t">' + esc(v.title) + "</div>" +
      '<div class="s"><span class="ch">' + esc(v.channel || "") + "</span>" + videoAgeHTML(v) + "</div></div>" +
    "</div>";
}
function visibleRows() {
  const rows = LIST === "watch" ? ROWS.filter((v) => WATCH.has(v.video_id)) : ROWS;
  return rows.filter((v) => inMode(v));
}
/* A full repaint replaces every child of the scroller, which momentarily takes
   its scrollHeight to zero — the browser then clamps scrollTop and Alan is
   thrown back to the top of the grid. Harmless at forty tiles; intolerable
   once the grid runs to hundreds. The position is taken and put back. */
/* M51: putting the same scrollTop back is not enough once the list has grown or
   shrunk above the fold — the same number lands on a different video, which is
   what a refresh under Alan's hand feels like. The tile under the top edge is
   remembered by its id and put back exactly where it was. */
function scrollAnchor(grid) {
  const top = grid.scrollTop;
  for (const card of grid.querySelectorAll(".card")) {
    if (card.offsetTop + card.offsetHeight > top) return { id: card.dataset.v || null, delta: card.offsetTop - top, top };
  }
  return { id: null, delta: 0, top };
}
function restoreAnchor(grid, anchor) {
  if (!anchor) return;
  if (anchor.id) {
    const card = grid.querySelector('.card[data-v="' + anchor.id.replace(/"/g, '\\"') + '"]');
    if (card) { grid.scrollTop = Math.max(0, card.offsetTop - anchor.delta); return; }
  }
  grid.scrollTop = anchor.top;
}
function paint() {
  const grid = el("grid"), keep = scrollAnchor(grid);
  const rows = visibleRows();
  if (!rows.length) {
    grid.innerHTML = ACCOUNT_EMPTY
      ? '<div class="msg note"><b>' + esc(FEED_PROFILE.label) + "</b> has no videos here yet \u2014 " +
        esc(FEED_PROFILE.note || "this channel is not connected yet") + '. <a class="step" href="' + CONNECT_PAGE +
        "?account=" + encodeURIComponent(FEED_PROFILE.account) + '" target="_blank" rel="noopener">connect ' +
        esc(FEED_PROFILE.label) + " \u2197</a></div>"
      : '<div class="msg">' + (MODE === "shorts" ? "no shorts in this list" : MODE === "videos" ? "no videos in this list (shorts are under SHORTS)" : "no videos in this list") + "</div>";
    return;
  }
  grid.innerHTML = rows.map(cardHTML).join("");
  restoreAnchor(grid, keep);
}
/* Appending is deliberately NOT a repaint: the new page is added after the
   tiles already on screen, so nothing under Alan's eye or finger moves. */
function appendCards(rows) {
  if (!rows.length) return;
  const grid = el("grid");
  const msg = grid.querySelector(".msg"); if (msg) { paint(); return; }
  grid.insertAdjacentHTML("beforeend", rows.map(cardHTML).join(""));
}
/* One delegated listener on the grid instead of two per tile: appended pages
   are live the moment they land, with no wiring pass to forget. A click still
   arrives inside the user's own gesture, which is what lets the primed
   YouTube player start without asking the browser again. */
function wireGrid() {
  el("grid").addEventListener("click", (event) => {
    const star = event.target.closest(".star");
    if (star) { event.stopPropagation(); toggleWatch(BYID[star.dataset.star]); return; }
    const card = event.target.closest(".card");
    if (card && BYID[card.dataset.v]) playFromUserGesture(BYID[card.dataset.v]);
  });
  el("grid").addEventListener("scroll", () => {
    const grid = el("grid");
    if (grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 600) loadMore();
  }, { passive:true });
  /* M51: while the pointer is in the list, the two-minute pass does not repaint under it.
     The refresh is not skipped and not forgotten — it is held, and runs the moment the
     pointer leaves. */
  for (const ev of ["pointerenter", "pointermove", "pointerdown"])
    el("grid").addEventListener(ev, () => { POINTER_IN_LIST = true; }, { passive:true });
  el("grid").addEventListener("pointerleave", () => { POINTER_IN_LIST = false; runHeldRefresh(); }, { passive:true });
}
/* The whole decision in one place, so it can be tested without a browser. */
function videoRefreshPlan(state) {
  if (!state.visible) return { load:false, hold:false, why:"the pane is not on screen" };
  if (state.playing) return { load:false, hold:false, why:"a video is playing" };
  if (state.pagedPast) return { load:false, hold:false, why:"the grid is paged past the first page" };
  if (state.pointerInList) return { load:false, hold:true, why:"Alan's pointer is in the list" };
  return { load:true, hold:false, why:"nothing is under his hand" };
}
function runHeldRefresh() {
  if (!REFRESH_HELD) return;
  const plan = videoRefreshPlan({ visible: document.visibilityState === "visible", playing: !!CUR,
    pagedPast: PAGE_AT > LIMIT, pointerInList: POINTER_IN_LIST });
  if (plan.hold) return;
  REFRESH_HELD = false;
  if (plan.load) load(false, true);
}

function paintChips() {
  const box = el("chips"); box.innerHTML = "";
  for (const [id, label] of MODES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn mode" + (id === MODE ? " on" : "");
    b.textContent = label;
    b.setAttribute("aria-pressed", id === MODE ? "true" : "false");
    b.title = id === "grid" ? "everything in this list — videos and shorts together"

/* ---- WHEN A STREAM ACTUALLY HAPPENED ----
   YouTube dates a live stream from when it was SCHEDULED, so a stream that ran
   this morning arrives carrying yesterday's date and sinks below a day of
   ordinary uploads — measured 23 Sep, 242 newer rows sat above one that had
   gone on air four hours earlier, and the first page is 200. feed_at is the
   feed's answer to "when did this happen": the actual start when there is one,
   the scheduled start for something still to come, the publish time otherwise.
   The grid is ordered by it. */
const FEED_SELECT = "video_id,title,channel,channel_id,tickers,duration,is_short,thumb_url,published_at,subscription_accounts";
const FEED_SELECT_LIVE = FEED_SELECT + ",feed_at,live_state,starts_at";
let FEED_LIVE_OK = true;
function feedQuery(offset) {
  let q = "youtube_feed?select=" + (FEED_LIVE_OK ? FEED_SELECT_LIVE : FEED_SELECT) +
          "&order=" + (FEED_LIVE_OK ? "feed_at" : "published_at") + ".desc&limit=" + LIMIT +
          (offset ? "&offset=" + offset : "");
  const chosen = LISTS.find((l) => l.id === LIST);
  if (LIST === "watch") {
    q += "&video_id=in.(" + Array.from(WATCH).slice(0, 200).map(encodeURIComponent).join(",") + ")";
  } else q += chosen.q;
  q += modeClause(MODE);
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  return q;
}
/* The stream times arrive with a database change of their own. Before that
   change lands the columns do not exist and the read comes back 400, so the
   first refusal drops this session back to the publish time — one failed read,
   never an empty grid, and no second failure after it. */
async function readFeed(offset) {
  try { return await pg(feedQuery(offset)); }
  catch (e) {
    if (!FEED_LIVE_OK) throw e;
    FEED_LIVE_OK = false;
    return pg(feedQuery(offset));
  }
}
/* The SCINTILLA grid keeps unscoped discovery rows and rows the SCINTILLA
   account carries, and drops the rest. It runs over EVERY page, which is
   why a page that arrives full can still add only a few tiles — and why
   "is there more behind this?" is answered by the raw page size, never by
   how many tiles survived the filter. */
function filterFeedRows(rows) {
  const accountsFor = (video) => Array.isArray(video?.subscription_accounts)
    ? video.subscription_accounts.map((account) => String(account).toLowerCase()) : [];
  return (Array.isArray(rows) ? rows : []).filter((video) => {
    if (FEED !== "scintilla" || LIST === "watch") return true;
    const accounts = accountsFor(video);
    return !accounts.length || accounts.includes("scintilla");
  });
}
/* Reaching the bottom of the grid asks for the page behind it. Watch Later is
   a fixed set of ids, so it has no page behind it and says so. */
async function loadMore() {
  if (PAGE_BUSY || !PAGE_MORE || LIST === "watch" || ROWS.length >= MAX_ROWS) return;
  PAGE_BUSY = true;
  try {
    const rows = await readFeed(PAGE_AT);
    const raw = Array.isArray(rows) ? rows : [];
    PAGE_AT += raw.length;
    PAGE_MORE = raw.length >= LIMIT && PAGE_AT < MAX_ROWS;
    const known = new Set(ROWS.map((v) => v.video_id));
    const added = filterFeedRows(raw).filter((v) => !known.has(v.video_id));
    if (added.length) {
      ROWS = ROWS.concat(added);
      for (const v of added) BYID[v.video_id] = v;
      appendCards(added); refreshTransport();
    }
    /* A page that filtered down to nothing must not look like the end of the
       feed: keep pulling until something lands or the feed genuinely runs out. */
    if (!added.length && PAGE_MORE) { PAGE_BUSY = false; return loadMore(); }
    fillViewport();
  } catch (e) { /* a failed page is not the end of the feed; the next scroll retries */ }
  finally { PAGE_BUSY = false; }
}
/* A first page that does not even fill the pane would leave nothing to scroll,
   so the "reaching the bottom" trigger could never fire. Pull until the grid
   overflows its own box at least once. */
function fillViewport() {
  const grid = el("grid");
  if (PAGE_MORE && !PAGE_BUSY && grid.scrollHeight <= grid.clientHeight + 40) loadMore();
}

async function load(forceWatch, quiet) {
  if (!quiet && !ROWS.length) el("grid").innerHTML = '<div class="msg">loading…</div>';
  if (LIST === "watch") {
    try { await syncWatch(!!forceWatch); }
    catch (e) {
      WATCH_READY = false; WATCH_ERROR = e.message || "Watch Later unavailable";
    }
  }
  PAGE_AT = 0; PAGE_MORE = LIST !== "watch";
  if (LIST === "watch") {
    if (WATCH_ERROR) {
      if (quiet && ROWS.length) return;
      ROWS = []; BYID = {};
      el("grid").innerHTML = '<div class="msg">the watch-later read failed — the saved list is unavailable, not empty · retrying at the next refresh</div>';
      relayout(); return;
    }
    if (!WATCH.size) { ROWS = []; BYID = {}; paint(); relayout(); return; }
  }
  let rows;
  try { rows = await readFeed(0); }
  catch (e) {
    if (!quiet || !ROWS.length) el("grid").innerHTML = '<div class="msg">feed unavailable</div>';
    return;
  }
  const raw = Array.isArray(rows) ? rows : [];
  PAGE_AT = raw.length;
  PAGE_MORE = LIST !== "watch" && raw.length >= LIMIT && PAGE_AT < MAX_ROWS;
  ACCOUNT_EMPTY = false;
  if (!raw.length && FEED_PROFILE.account && LIST !== "watch") {
    try {
      const any = await pg("youtube_feed?select=video_id&subscription_accounts=cs." +
        encodeURIComponent("{" + FEED_PROFILE.account + "}") + "&limit=1", 1);
      ACCOUNT_EMPTY = Array.isArray(any) && !any.length;
    } catch (_) {}
  }
  if (!FEED_PRESENCE.size) await readFeedPresence();
  paintFeedProfileSelector(raw);
  const nextRows = filterFeedRows(raw);
  const signature = (items) => items.map((v) => [v.video_id, v.title, v.channel, v.published_at,
    v.feed_at || "", v.live_state || "", v.duration || "",
    Array.isArray(v.subscription_accounts) ? v.subscription_accounts.join("+") : ""].join("|")).join("\n");
  const changed = signature(nextRows) !== signature(ROWS.slice(0, nextRows.length));
  ROWS = nextRows;
  BYID = {}; for (const v of ROWS) BYID[v.video_id] = v;
  if (changed || !quiet) { paint(); relayout(); refreshTransport(); }
  fillViewport();
  /* the ONLY preselect: you asked for a video by id */
  if (START && BYID[START]) play(BYID[START], AUTO);
}

function togglePaneFull() {
  parent.postMessage({ type: "SCINTILLA_DECK_TOGGLE_FULL" }, location.origin);
  setMenuOpen(false);
}
el("bFull").addEventListener("click", togglePaneFull);
el("bMenuFull").addEventListener("click", togglePaneFull);
el("bWatch").addEventListener("click", () => { toggleWatch(CUR); setMenuOpen(false); });
el("bSubscribe").addEventListener("click", () => { subscribeToChannel(CUR); setMenuOpen(false); });
el("bYt").addEventListener("click", () => setMenuOpen(false));
el("bCover").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_MEDIA_COVER_X" }, location.origin);
  setMenuOpen(false);
});
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    relayout(); postChrome(); return;
  }
  if (event.data?.type === "SCINTILLA_DECK_FULL_STATE") {
    const stage = +event.data.stage || 0;
    el("bFull").textContent = stage === 2 ? "↙ youtube" : stage === 1 ? "↙ normal" : "⛶";
    el("bFull").title = stage === 2 ? "return to YouTube region" : stage === 1 ? "return to normal media layout" : "expand across YouTube region";
    el("bMenuFull").textContent = stage === 2 ? "return to youtube region" : stage === 1 ? "return to normal layout" : "expand pane";
    el("bCover").style.display = event.data.canCoverX ? "" : "none";
  }
});
async function start() {
  paintChips(); paintFeedProfileSelector([]); wireGrid(); relayout(); postChrome(); load();
  syncSharedVideoPositions();
  /* Prime one official player object behind the hidden stage.  Selecting or
     advancing a video then loads into this same object rather than replacing
     the iframe, retaining the browser's playback grant across the queue. */
  ensureOfficialYouTubePlayer().catch(() => {});
  /* Start the shared local saved-set read alongside the ordinary feed.  This
     never contacts YouTube, and means opening Watch Later normally has its
     IDs ready instead of placing that database read on the click path. */
  syncWatch().then(() => { refreshWatchButton(); if (ROWS.length) paint(); }).catch(() => {
    /* A failed read is never data: name it, and let the button and card stars paint
       UNKNOWN rather than "unsaved". The 120s pass and any star click retry the read. */
    WATCH_READY = false; WATCH_ERROR = WATCH_ERROR || "the saved-list read failed";
    refreshWatchButton(); if (ROWS.length) paint();
  });
  /* Keep the stored feed current without touching the YouTube API on every
     pass. */
  setInterval(() => {
    /* The ages are refreshed on every pass, whether or not the feed moved and
       whether or not a video is playing — an unchanged list still gets older. */
    paintAges();
    /* Once Alan has paged down into the history, the two-minute pass must NOT
       reload page one: that would throw away everything he scrolled to and
       drop him back at the top. A paged grid gets fresh ages and nothing else;
       the next list or feed change reloads it properly. */
    const plan = videoRefreshPlan({ visible: document.visibilityState === "visible", playing: !!CUR,
      pagedPast: PAGE_AT > LIMIT, pointerInList: POINTER_IN_LIST });
    if (plan.hold) REFRESH_HELD = true;
    if (plan.load) load(false, true);
  }, 120000);
}
start();

var STATION_ACTIVITY_PANE = "video";
/* ---- M51: TELL THE DECK WHEN ALAN IS USING THIS PANE --------------------------------------------
   The deck watches for a newer version of itself and reloads when the Station looks idle, but it
   can only hear pointer, wheel, key and scroll events in its OWN document: everything that happens
   inside this frame is invisible to it. That is why a feed being scrolled was reloaded under his
   hand (24 Sep). One message, on the same postMessage path the X pane uses for "live", at most once
   a second, carrying nothing but the fact that this pane is in use. */
(function reportStationActivity() {
  if (window.parent === window) return;
  var last = 0;
  var send = function () {
    var now = Date.now();
    if (now - last < 1000) return;
    last = now;
    try { window.parent.postMessage({ sc: "station-activity", pane: STATION_ACTIVITY_PANE, at: now }, location.origin); } catch (e) {}
  };
  var events = ["pointermove", "pointerdown", "wheel", "touchstart", "touchmove", "keydown", "scroll"];
  for (var i = 0; i < events.length; i++)
    window.addEventListener(events[i], send, { passive: true, capture: true });
})();
</script>
