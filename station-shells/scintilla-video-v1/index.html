<title>SCINTILLA · video pane</title>
<!-- ============================================================================
     SCINTILLA · /pane-video — BUILT FOR THE PANE, not a page squeezed into one.

     Why this exists. /feed-a and /feed-b are full pages. Dropped into a deck
     slot they spend their height on chrome — header, chip row, tools row, a
     hint paragraph, a footer — and the videos end up below the fold. Alan
     opened the deck and saw "Nothing is playing and nothing was chosen for
     you" with no video to click. The data was fine (2,980 videos, every one
     with a thumbnail). The layout was the bug.

     So this is a different thing, sized for a box:
       · THUMBNAILS FIRST. A grid that counts its own columns from its own
         width — 1 column in a phone slot, 5 across an Apple TV third. The
         first thing in the pane is always a picture of a video.
       · ONE thin bar of chrome. Nothing else competes for height.
       · CLICK ONE AND IT PLAYS IN PLACE. The grid gives way to the player
         inside the same box. Back is one tap and you are on the grid again.
       · IT STILL NEVER PICKS FOR YOU. Opens on the grid. ?v= is the only
         preselect, because that is you asking by id.

     PICTURE-IN-PICTURE. The pane keeps the chosen video in its own URL
     (?v=), so whatever hosts it can lift the exact same view — same video —
     into a floating Document Picture-in-Picture window. The deck's PiP
     button does that. Where the browser supports Document PiP and we are
     top-level, the button here does it directly.

     Params: ?feed=personal|scintilla|market · ?list=default|all|shorts|watch · ?v=VIDEOID
             · ?autoplay=1 · ?limit=60 (10-200) · ?t=MU · ?cols=N (force)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-PANEVIDEO-001.
     ============================================================================ -->

  const host = document.createElement("div"); host.id = "ytPlayer";
  el("video").appendChild(host);
}
function playerEventVideoId(event) {
  try { return String(event?.target?.getVideoData?.()?.video_id || ""); } catch (_) { return ""; }
}
function playerEventMatchesRequest(event, request = YT_PLAYER_REQUEST) {
  if (!request || request.token !== PLAYER_TOKEN) return false;
  const deliveredId = playerEventVideoId(event);
  return !deliveredId || deliveredId === request.video.video_id;
}
function isUnembeddablePlayerError(code) {
  return [101, 150, 153].includes(Number(code));
}
function setAutoplayBlockedState(blocked, request = YT_PLAYER_REQUEST) {
  PLAYER_AUTOPLAY_BLOCKED = !!blocked;
  document.body.dataset.autoplayBlocked = blocked ? "true" : "false";
  if (blocked) console.warn("Station YouTube autoplay blocked", request?.video?.video_id || "");
}
function clearPlayerFallback() {
  if (PLAYER_FALLBACK) clearTimeout(PLAYER_FALLBACK);
  PLAYER_FALLBACK = 0;
}
function handlePlayerStateChange(event) {
  const request = YT_PLAYER_REQUEST;
  if (!playerEventMatchesRequest(event, request)) return;
  PLAYER_ACCEPTED_TOKEN = request.token; clearPlayerFallback();
  captureActiveVideoPosition(event.target);
  if (Number(event.data) === 1) setAutoplayBlockedState(false, request);
  if (Number(event.data) !== 0 || PLAYER_ENDED_TOKEN === request.token) return;
  PLAYER_ENDED_TOKEN = request.token;
  clearPlayerPositionPoll();
  clearVideoPosition(request.video.video_id);
  PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
  advanceQueue();
}
function handlePlayerError(event) {
  const request = YT_PLAYER_REQUEST;
  if (!playerEventMatchesRequest(event, request) || !isUnembeddablePlayerError(event.data) ||
      PLAYER_ERROR_TOKEN === request.token) return;
  PLAYER_ERROR_TOKEN = request.token; clearPlayerFallback();
  const nextSkipped = new Set(request.skipped); nextSkipped.add(request.video.video_id);
  el("nowt").textContent = "skipping unavailable video…";
  setTimeout(() => { if (request.token === PLAYER_TOKEN) advanceQueue(nextSkipped); }, 900);
}
function handleAutoplayBlocked(event) {
  const request = YT_PLAYER_REQUEST;
  if (request?.auto && playerEventMatchesRequest(event, request)) setAutoplayBlockedState(true, request);
}
function ensureOfficialYouTubePlayer() {
  if (YT_PLAYER && YT_PLAYER_READY) return Promise.resolve(YT_PLAYER);
  if (YT_PLAYER_CREATE) return YT_PLAYER_CREATE;
  ensureYouTubePlayerHost();
  YT_PLAYER_CREATE = waitForYouTubePlayerApi().then(() => new Promise((resolve) => {
    YT_PLAYER = new YT.Player("ytPlayer", {
      width:"100%", height:"100%",
      playerVars:{ autoplay:0, rel:0, playsinline:1, modestbranding:1, origin:location.origin },
      events:{
        onReady:(event) => {
          YT_PLAYER_READY = true;
          try {
            const frame = event.target.getIframe();
            frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
          } catch (_) {}
          resolve(event.target);
        },
        onStateChange:handlePlayerStateChange,
        onError:handlePlayerError,
        onAutoplayBlocked:handleAutoplayBlocked
      }
    });
  })).catch((error) => {
    YT_PLAYER_CREATE = null; YT_PLAYER = null; YT_PLAYER_READY = false;
    throw error;
  });
  return YT_PLAYER_CREATE;
}
function applyPlayerRequest(player, request) {
  if (!player || !playerEventMatchesRequest(null, request)) return;
  const video = { videoId:request.video.video_id, startSeconds:request.resumeAt || 0 };
  try {
    const frame = player.getIframe();
    frame.title = request.video.title || request.video.video_id;
  } catch (_) {}
  PLAYER_ACCEPTED_TOKEN = 0; PLAYER_ENDED_TOKEN = 0; PLAYER_ERROR_TOKEN = 0;
  setAutoplayBlockedState(false, request);
  if (request.auto) player.loadVideoById(video); else player.cueVideoById(video);
  startPlayerPositionPoll(request.token);
}
function advanceQueue(skipped = new Set()) {
  if (!CUR) return;
  const next = nextQueuedVideo(queueRows(ROWS, LIST, WATCH), CUR.video_id, skipped);
  if (!next) { el("nowt").textContent = "end of queue · " + (CUR.title || CUR.video_id); return; }
  play(next, true, true, skipped);
}
function armPlayerFallback(token, skipped) {
  clearPlayerFallback();
  PLAYER_FALLBACK = setTimeout(() => {
    if (token !== PLAYER_TOKEN || PLAYER_ACCEPTED_TOKEN === token || !CUR) return;
    const nextSkipped = new Set(skipped); nextSkipped.add(CUR.video_id);
    el("nowt").textContent = "skipping unavailable video…";
    advanceQueue(nextSkipped);
  }, 10000);
}
async function play(v, auto, queued = false, skipped = new Set()) {
  if (!v) return;
  captureActiveVideoPosition();
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback();
  const token = ++PLAYER_TOKEN;
  const resumeAt = await resumePositionBeforePlay(v.video_id);
  if (token !== PLAYER_TOKEN) return;
  CUR = v;
  PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
  YT_PLAYER_REQUEST = { token, video:v, auto:!!auto, queued:!!queued, skipped:new Set(skipped), resumeAt };
  document.body.classList.add("playing");
  el("nowt").textContent = (v.title || v.video_id) + (v.channel ? "  ·  " + v.channel : "");
  el("bBack").style.display = "";
  el("bYt").style.display = ""; el("bYt").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.video_id);
  el("bYt").textContent = IOS ? "app ↗" : "youtube ↗";
  el("bPip").style.display = canPip() ? "" : "none";
  refreshSubscribeButton(v);
  syncUrl();
  if (queued) armPlayerFallback(token, skipped);
  try {
    const player = await ensureOfficialYouTubePlayer();
    if (token === PLAYER_TOKEN) applyPlayerRequest(player, YT_PLAYER_REQUEST);
  } catch (error) {
    if (token === PLAYER_TOKEN) console.error("Station YouTube player unavailable", error);
  }
}
function back() {
  captureActiveVideoPosition();
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback(); ++PLAYER_TOKEN; YT_PLAYER_REQUEST = null; PLAYER_ACCEPTED_TOKEN = 0;
  try { if (YT_PLAYER_READY) YT_PLAYER.stopVideo(); } catch (_) {}
  CUR = null;
  document.body.classList.remove("playing");
  for (const b of ["bBack", "bPip", "bYt", "bSubscribe"]) el(b).style.display = "none";
  syncUrl(); paint();
}
el("bBack").addEventListener("click", back);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { captureActiveVideoPosition(); saveActiveVideoPosition(true); }
});
window.addEventListener("pagehide", () => { captureActiveVideoPosition(); saveActiveVideoPosition(true); });

/* ---- PICTURE-IN-PICTURE ----
   Document PiP hosts real DOM, so it can carry the YouTube player into a
   floating always-on-top window. It needs a top-level context, so inside a
   deck pane this button hides and the DECK's pip button does the same job
   from the top level using this pane's own ?v= URL. */
function canPip() {
  try { return !!window.documentPictureInPicture && window.top === window.self; } catch (e) { return false; }
}
el("bPip").addEventListener("click", async () => {
  if (!CUR || !canPip()) return;
  try {
    const w = await documentPictureInPicture.requestWindow({ width: 480, height: 300 });
    const d = w.document;
    d.body.style.cssText = "margin:0;background:#000;height:100%";
    d.documentElement.style.height = "100%";
    const f = d.createElement("iframe");
    f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(CUR.video_id) +
            "?playsinline=1&rel=0&modestbranding=1&autoplay=1";
    d.body.appendChild(f);
  } catch (e) { /* user dismissed, or the browser said no */ }
});

/* ---- render ---- */
function paint() {
  const q = "";
  let rows = LIST === "watch" ? ROWS.filter((v) => WATCH.has(v.video_id)) : ROWS;
  rows = q ? rows.filter((v) => ((v.title || "") + " " + (v.channel || "") + " " + (v.tickers || "")).toLowerCase().indexOf(q) >= 0) : rows;
  if (!rows.length) { el("grid").innerHTML = '<div class="msg">' + (q ? "nothing matches" : "no videos in this list") + "</div>"; return; }
  el("grid").innerHTML = rows.map((v) =>
    '<div class="card' + (CUR && CUR.video_id === v.video_id ? " on" : "") + '" data-v="' + esc(v.video_id) + '">' +
      '<div class="thumb"><img loading="lazy" decoding="async" src="' +
        esc(v.thumb_url || ("https://i.ytimg.com/vi/" + v.video_id + "/mqdefault.jpg")) + '" alt="">' +
        (FEED === "scintilla" ? '<button class="star' + (WATCH.has(v.video_id) ? " on" : "") + '" data-star="' + esc(v.video_id) +
          '" aria-label="' + (WATCH.has(v.video_id) ? "remove from" : "save to") + ' SCINTILLA Watch Later" title="' +
          (WATCH.has(v.video_id) ? "remove from" : "save to") + ' SCINTILLA · Watch Later"><span aria-hidden="true">' +
          (WATCH.has(v.video_id) ? "★" : "☆") + '</span></button>' : "") +
        (v.tickers ? '<span class="tk">' + esc(String(v.tickers).split(",")[0]) + "</span>" : "") +
        (v.duration ? '<span class="dur">' + esc(v.duration) + "</span>" : "") +
      "</div>" +
      '<div class="cap"><div class="t">' + esc(v.title) + "</div>" +
      '<div class="s">' + esc(v.channel || "") + "</div></div>" +
    "</div>").join("");
  for (const n of el("grid").querySelectorAll(".card"))
    n.addEventListener("click", () => play(BYID[n.dataset.v], true));
  for (const n of el("grid").querySelectorAll(".star"))
    n.addEventListener("click", (e) => { e.stopPropagation(); toggleWatch(BYID[n.dataset.star]); });
}

function paintChips() {
  const box = el("chips"); box.innerHTML = "";
  for (const l of LISTS) {
    const b = document.createElement("span");
    b.className = "btn" + (l.id === LIST ? " on" : "");
    b.textContent = l.n;
    b.addEventListener("click", () => { LIST = l.id; paintChips(); load(LIST === "watch"); });
    box.appendChild(b);
  }
}

async function load(forceWatch, quiet) {
  if (!quiet && !ROWS.length) el("grid").innerHTML = '<div class="msg">loading…</div>';
  if (LIST === "watch") {
    try { await syncWatch(!!forceWatch); }
    catch (e) {
      WATCH_READY = false; WATCH_ERROR = e.message || "Watch Later unavailable";
    }
  }
  let q = "youtube_feed?select=video_id,title,channel,channel_id,tickers,duration,is_short,thumb_url,published_at,subscription_accounts" +
          "&order=published_at.desc&limit=" + LIMIT;
  const chosen = LISTS.find((l) => l.id === LIST);
  if (LIST === "watch") {
    if (WATCH_ERROR) {
      if (quiet && ROWS.length) return;
      ROWS = []; BYID = {};
      el("grid").innerHTML = '<div class="msg">YouTube reconnect required</div>';
      relayout(); return;
    }
    if (!WATCH.size) { ROWS = []; BYID = {}; paint(); relayout(); return; }
    q += "&video_id=in.(" + Array.from(WATCH).slice(0, 200).map(encodeURIComponent).join(",") + ")";
  } else q += chosen.q;
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  let rows;
  try { rows = await pg(q); }
  catch (e) {
    if (!quiet || !ROWS.length) el("grid").innerHTML = '<div class="msg">feed unavailable</div>';
    return;
  }
  const accountsFor = (video) => Array.isArray(video?.subscription_accounts)
    ? video.subscription_accounts.map((account) => String(account).toLowerCase()) : [];
  const nextRows = (Array.isArray(rows) ? rows : []).filter((video) => {
    if (FEED !== "scintilla" || LIST === "watch") return true;
    const accounts = accountsFor(video);
    return !accounts.length || accounts.includes("scintilla");
  });
  const signature = (items) => items.map((v) => [v.video_id, v.title, v.channel, v.published_at,
    Array.isArray(v.subscription_accounts) ? v.subscription_accounts.join("+") : ""].join("|")).join("\n");
  const changed = signature(nextRows) !== signature(ROWS);
  ROWS = nextRows;
  BYID = {}; for (const v of ROWS) BYID[v.video_id] = v;
  if (changed || !quiet) { paint(); relayout(); }
  /* the ONLY preselect: you asked for a video by id */
  if (START && BYID[START]) play(BYID[START], AUTO);
}

el("bFull").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_TOGGLE_FULL" }, location.origin);
});
el("bSubscribe").addEventListener("click", () => subscribeToChannel(CUR));
el("bCover").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_MEDIA_COVER_X" }, location.origin);
});
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    relayout(); return;
  }
  if (event.data?.type === "SCINTILLA_DECK_FULL_STATE") {
    const stage = +event.data.stage || 0;
    el("bFull").textContent = stage === 2 ? "↙ youtube" : stage === 1 ? "↙ normal" : "⛶";
    el("bFull").title = stage === 2 ? "return to YouTube region" : stage === 1 ? "return to normal media layout" : "expand across YouTube region";
    el("bCover").style.display = event.data.canCoverX ? "" : "none";
  }
});
async function start() {
  paintChips(); relayout(); load();
  syncSharedVideoPositions();
  /* Prime one official player object behind the hidden stage.  Selecting or
     advancing a video then loads into this same object rather than replacing
     the iframe, retaining the browser's playback grant across the queue. */
  ensureOfficialYouTubePlayer().catch(() => {});
  /* Start the shared local saved-set read alongside the ordinary feed.  This
     never contacts YouTube, and means opening Watch Later normally has its
     IDs ready instead of placing that database read on the click path. */
  syncWatch().catch(() => { WATCH_READY = false; });
  /* Keep the stored feed current without touching the YouTube API on every
     pass. */
  setInterval(() => {
    if (document.visibilityState === "visible" && !CUR) load(false, true);
  }, 120000);
}
start();
</script>
