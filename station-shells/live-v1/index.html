<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · live chart</title>
<!-- W2 (22 Oct 2026). Alan, 22 Oct ~17:55 ET: "Our own … chart … from trading live bars from the whole tape … the trading view is
     more delayed … I feel like the big charts are my lines … If we can make it, I might not need to draw there." Earlier the same
     day: "It doesn't work for executing trades … It's not precise enough. I need the bars, I need everything."
     THIS SHELL is the house answer to the free TradingView embed (tv-v1) for the WIDGETS wall's two big slots: candles and volume
     from the chart API (Massive, the consolidated tape, extended hours 04:00-20:00 ET), intervals 1m 5m 15m 30m 1h 1D, VWAP from the
     full volume with two session anchors (09:30 and 04:00, labelled), a crosshair with price and time, a precise price axis, and
     his clouds drawn exactly as chart-v1 draws them (the same arithmetic file, the same painting code - pinned byte-identical by
     tests/station-w2-live-chart-20261022.test.mjs).
     ADDRESS: ?symbol=SPY&tf=5m standalone; tv-v1's own keys are read too (?t= ?tf=1|5|15|30|60|D ?n= ?bare=1), so a WIDGETS slot
     can be pointed here by changing the shell's path only. ?clouds=0|1 and ?steps=1 as on chart-v1.
     WHERE EVERY NUMBER COMES FROM: one client, /_provider/provider.js - marketCandles for the bars, marketQuotes for the live price.
     Nothing is fetched around it. The bars are the provider's COMPLETED bars, exactly as served; the bar still forming is shown the
     way chart-v1 shows it (P3, 28 Sep): the live price from the stream, one dashed step and a hollow ring after the last completed
     bar, never drawn as a finished candle. On 1D the API itself serves today's forming bar (forming=1, P7), drawn hollow.
     LIVE, AND WHAT IT COSTS: see LIVE below. The age of the last completed bar is always printed on the strip.
     WHAT IT DOES NOT DO: no line drawing (not in this pass), no deck change (the coordinator wires the TV <-> LIVE switch), no
     writes anywhere except, when standalone (not ?bare), the clouds switch's own key as chart-v1 does.
     W5 (22 Oct, ~19:10 ET, Alan: "just as long as you keep the exact same VWAP thing that I have, and … my clouds … these lines for
     previous day high, previous day low, pre-market high, pre-market low … I need it to fucking work"):
       - HIS VWAP: TradingView's VWAP anchored at his session's start (04:00 on stocks, 18:00 - the CME day - on futures) with Band #1
         (one standard deviation, TradingView's formula); the 09:30 line stays, fainter.
       - HIS DAY LEVELS: PDH PDL PDO PDC (the previous regular session), PMH PML (today's pre-market), OPEN (today's 09:30); futures:
         the previous CME session, no pre-market. Names merged where they would touch, PDH / PDL heavier.
       - HIS CLOUDS V17: the current session's bars carry the averages with the current session's close (the live price while it
         forms), as his TradingView study does; earlier sessions as chart-v1.
       - FUTURES (ESUSD NQUSD CLUSD GCUSD SIUSD): the 18:00-17:00 session, no pre/after-market shading, the live price from FMP.
       - IT MUST NOT FAIL: late = amber, stale or not answering = red and the chart steps back; a failed read is tried again in 15 s,
         30 s, then every 60 s until it answers; a symbol the API does not track says so in words.
     W6 (22 Oct): his Day Levels in his indicator's own default look, style E (pine/SCINTILLA_Day_Levels.pine): short lines just right
       of the newest bar, the names to their right, levels within 0.12 % of each other sharing one label, one amber family, no white,
       nothing on the price axis; the levels themselves (W5's rules) unchanged. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --line2:#252538; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --dim:#868AAA;
  --mute:#6E6E80; --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --late:#c8953a; --vwap:#F2B33D;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink3); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
#strip{ flex:none; height:22px; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--panel2);
  border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
#strip .sym{ color:var(--ink2); letter-spacing:.14em; font-size:10px; text-transform:uppercase; }
#strip input.sym{ width:62px; background:transparent; border:1px solid var(--line2); padding:1px 4px; font:10px var(--mono);
  outline:none; }
#strip input.sym:focus{ border-color:var(--crk); color:var(--crk); }
#strip .tfs{ display:flex; gap:2px; margin-left:2px; }
#strip button{ font:9px var(--mono); letter-spacing:.08em; color:var(--ink3); background:transparent; border:1px solid transparent;
  padding:1px 6px; cursor:pointer; border-radius:0; }
#strip button:hover{ color:var(--ink2); border-color:var(--line2); }
#strip button.on{ color:var(--crk); border-color:var(--crk); }
#strip .px{ color:var(--ink3); font-size:10px; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
#strip .px[data-day="up"]{ color:var(--bull); }
#strip .px[data-day="down"]{ color:var(--bear); }
#strip .state{ margin-left:auto; color:var(--mute); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
#strip .state b{ color:var(--dim); font-weight:600; }
#strip .state[data-late="1"] b{ color:var(--late); }
/* W5: stale or not answering - red, and the chart itself steps back so it can never pass for live */
#strip .state[data-level="stale"] b, #strip .state[data-level="down"] b{ color:var(--bear); }
#area[data-level="stale"] #cv, #area[data-level="down"] #cv{ opacity:.5; }
/* W8: in synced mode the parent owns the interval and the clouds; the ticker box is this chart's own and always shows */
body.sync #tfs, body.sync #cloudsBtn{ display:none; }
body.sync #strip .sym{ display:inline-block; }
/* W3 (22 Oct): LIVE · TV on the strip - this shell is LIVE; TV asks the deck to swap the slot to tv-v1 with the same symbol and interval */
#strip .src{ display:flex; gap:2px; margin-left:4px; padding-left:6px; border-left:1px solid var(--line); }
#strip .src button.on{ color:var(--bull); border-color:var(--bull); cursor:default; }
@media (max-width:640px){ #strip{ gap:4px; padding:0 5px; } #strip button{ padding:1px 4px; } #strip .tfs{ margin-left:0; }
  #readout{ font-size:10px; } }
#area{ flex:1 1 0; min-height:0; position:relative; overflow:hidden; touch-action:none; cursor:crosshair;
  -webkit-user-select:none; user-select:none; }
#area.panning{ cursor:grabbing; }
#cv, #ov{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#ov{ pointer-events:none; }
#readout{ position:absolute; left:8px; top:6px; z-index:2; pointer-events:none; font:600 11px var(--mono); line-height:1.45;
  letter-spacing:.01em; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; text-shadow:0 0 3px #05060c; }
#readout .k{ color:var(--mute); font-weight:600; margin-left:7px; }
#readout .k:first-child{ margin-left:0; }
#readout .up{ color:var(--bull); } #readout .down{ color:var(--bear); }
#readout .vw{ color:var(--vwap); }
#readout .when{ color:var(--dim); margin-left:9px; }
#readout .note{ color:var(--late); margin-left:7px; }
#msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; text-align:center; padding:20px; z-index:3; pointer-events:none; }
#msg[hidden]{ display:none; }
/* W13 (Alan, 23 Oct: "the ticker and the percentage could be bigger … I don't like all of the data above. I'm more visual than numerical"):
   the strip is the chart's header - the ticker and the day % big enough to read across a room on a TV, the price beside them, the RVol
   tube by the ticker; the intervals, LIVE · TV, CLOUDS and the state stay small on the right. --hd is the big size, from this frame's own
   width (a 2560 WIDGETS slot ~38 px, 1920 ~30 px, an iPad pair side ~17 px). */
:root{ --hd:clamp(17px, 2.5vw, 38px); }
#strip{ height:calc(var(--hd) * 1.42); gap:calc(var(--hd) * .34); }
#strip .sym, #strip input.sym{ font:700 var(--hd) var(--mono); letter-spacing:.03em; color:var(--ink); }
#strip input.sym{ width:5.6ch; border-color:transparent; padding:0 2px; }
#strip input.sym:hover{ border-color:var(--line2); }
#strip .day{ display:inline-block; font:700 var(--hd) var(--mono); letter-spacing:0; font-variant-numeric:tabular-nums; color:var(--ink3);
  transform-origin:left center; }
#strip .day[data-day="up"]{ color:var(--bull); }
#strip .day[data-day="down"]{ color:var(--bear); }
#strip .px{ font-size:calc(var(--hd) * .58); color:var(--ink2); }
/* the RVol tube: the lenses' and the FAVORITES tape's thermometer laid flat - the dark tube, its 1x and 2x ticks, the meter's gradient to
   the multiple (3x the end), the multiple beside it */
#rv{ display:inline-flex; align-items:center; gap:.45em; font-size:calc(var(--hd) * .4); }
#rv i{ display:block; width:calc(var(--hd) * 3.2); height:calc(var(--hd) * .3); border-radius:calc(var(--hd) * .15); background:#1d1d1b;
  border:1px solid #33332f; position:relative; overflow:hidden; }
#rv i::before{ content:""; position:absolute; inset:0; z-index:1; opacity:.7; background:linear-gradient(#8c8b83,#8c8b83) 33% 0 / 1px 100% no-repeat, linear-gradient(#8c8b83,#8c8b83) 66% 0 / 1px 100% no-repeat; }
#rv i::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--rv, 0%); background:linear-gradient(90deg, #3987e5, #fab219 55%, #ec835a); transition:width .8s; }
#rv em{ font-style:normal; color:var(--ink3); font-variant-numeric:tabular-nums; min-width:2.6em; }
#rv.hot em{ color:#ec835a; }
#rv.old{ opacity:.45; }
/* the words, when something is unusual ("2.3× its usual day") */
#why{ flex:0 1 auto; font-size:calc(var(--hd) * .4); color:var(--late); letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
/* the state yields its room first (it keeps its first word: live, closed, stale, no reply) */
#strip .state{ flex:0 4 auto; min-width:4.5em; }
#why b{ font-weight:700; }
#why .up{ color:var(--bull); } #why .down{ color:var(--bear); } #why .vol{ color:#ec835a; }
/* FLASHES (W13 - the rules W12 uses): one bright pulse when it starts, a steady glow while it holds */
@keyframes scFlash{ 0%{ filter:brightness(2.3) saturate(1.5); transform:scale(1.16); } 55%{ filter:brightness(1.45); transform:scale(1.04); } 100%{ filter:none; transform:none; } }
#strip .day.glow{ text-shadow:0 0 .3em currentColor, 0 0 .8em currentColor; }
#strip .day.pulse, #rv.pulse, #why.pulse{ animation:scFlash 1.2s ease-out 1; }
#rv.glow i{ border-color:#ec835a; box-shadow:0 0 .45em #ec835a, 0 0 1em rgba(236,131,90,.6); }
#rv.glow em{ color:#ec835a; text-shadow:0 0 .4em #ec835a; }
#rv{ transform-origin:left center; }
</style>
</head>
<body>
<div id="strip">
  <span class="sym" id="sym"></span>
  <span id="rv" title="relative volume: this name's pace against its usual day (the Hub's RVol, board_volume.rvol_at_time) - the tube, 3× the end"><i></i><em>—</em></span>
  <span class="day" id="day"></span>
  <span class="px" id="px"></span>
  <span id="why"></span>
  <span class="tfs" id="tfs" role="group" aria-label="Interval"></span>
  <span class="src" id="src" role="group" aria-label="Chart source"><button type="button" id="srcLive" class="on" aria-pressed="true" title="this chart: the house live chart - the whole tape, bars seconds after their close, VWAP to the cent, his clouds">LIVE</button><button type="button" id="srcTv" title="TradingView's embed in this slot instead (delayed, Cboe One volume; its drawing tools)">TV</button></span>
  <button type="button" id="cloudsBtn" title="His clouds: the 13/21-day EMAs and 50/200-day SMAs, daily-locked, as chart-v1 draws them">CLOUDS</button>
  <span class="state" id="state"></span>
</div>
<div id="area">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="readout"></div>
  <div id="msg">loading</div>
</div>
<script src="/_provider/provider.js"></script>
<!-- His clouds: the arithmetic and geometry chart-v1 uses, unchanged (pure functions; reads no data, draws nothing). -->
<script src="/_indicators/station-clouds.js"></script>
<script>
/* ONE SOURCE (2026-09-22): no database client here. Every bar and price comes from the chart API through SC_PROVIDER. */
try { scBindProviderClient(); } catch (_) {}
"use strict";

/* ---- the address ---------------------------------------------------------------------------------------------------- */
const QS = new URLSearchParams(location.search);
const CLEAN = (t) => String(t || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 12);
/* The six intervals. key = this shell's name, tv = tv-v1's code (the deck remembers a slot's interval in these), api = the
   provider client's width, history = completed bars read on load (about three extended sessions on 5m). */
const TFS = Object.freeze([
  Object.freeze({ key:"1m",  tv:"1",  api:"1m",  ms:60000,    history:960 }),
  Object.freeze({ key:"5m",  tv:"5",  api:"5m",  ms:300000,   history:600 }),
  Object.freeze({ key:"15m", tv:"15", api:"15m", ms:900000,   history:400 }),
  Object.freeze({ key:"30m", tv:"30", api:"30m", ms:1800000,  history:400 }),
  Object.freeze({ key:"1h",  tv:"60", api:"1h",  ms:3600000,  history:400 }),
  Object.freeze({ key:"1D",  tv:"D",  api:"1D",  ms:86400000, history:500, daily:true })
]);
function tfOf(value) {
  const s = String(value == null ? "" : value).trim();
  return TFS.find((x) => x.key === s || x.tv === s || x.key.toLowerCase() === s.toLowerCase()) || TFS[1];
}
let SYMBOL = CLEAN(QS.get("symbol") || QS.get("t")) || "SPY";
let TF = tfOf(QS.get("tf"));
const N = /^[12]$/.test(QS.get("n") || "") ? +QS.get("n") : 1;
const BARE = QS.get("bare") === "1";
if (BARE) document.body.classList.add("bare");
/* W8 - SYNCED MODE (&sync=1), the contract a parent that drives several charts uses (the WIDGETS deck, pair-v1): the parent owns the
   timeframe and the clouds for every chart - this strip's interval buttons and CLOUDS step aside and it obeys
   { sc:"chart", tf:"1m|5m|15m|30m|1h|1D", clouds:true|false } - while each chart keeps its own ticker: a box on the strip, always
   visible, whose Enter switches this chart and tells the parent { type:"SCINTILLA_CHART_TICKER", n, ticker }. Without sync=1 nothing
   changes. */
const SYNC = QS.get("sync") === "1";
if (SYNC) document.body.classList.add("sync");
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
/* THE CLOUDS, as chart-v1 reads them: on unless somebody turned them off. The Station dock owns the wall's switch (key
   station.clouds, told to chart frames as { sc:"chart", clouds }); ?clouds= wins for one load. Standalone, the strip's
   switch remembers the same key chart-v1 does; inside the deck (?bare=1) it never writes - the dock owns the key. */
const CLOUD_STATE_KEY = "station.clouds";
let CLOUDS_ON = QS.has("clouds") ? QS.get("clouds") !== "0" : lsGet(CLOUD_STATE_KEY) !== "0";
const CLOUD_EXTRAS = Object.freeze({ ema8: QS.get("ema8") === "1", sma100: QS.get("sma100") === "1" });
let CLOUD_STEPS = QS.has("steps") ? QS.get("steps") === "1" : lsGet("station.clouds.steps") === "1";

/* ---- New York time --------------------------------------------------------------------------------------------------- */
const ET_FMT = new Intl.DateTimeFormat("en-CA", { timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", second:"2-digit", weekday:"short", hourCycle:"h23" });
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ET_CACHE = new Map();
function etParts(ms) {
  const hit = ET_CACHE.get(ms);
  if (hit) return hit;
  const p = {};
  for (const x of ET_FMT.formatToParts(new Date(ms))) p[x.type] = x.value;
  const hh = +p.hour % 24, mm = +p.minute;
  const out = { day:p.year + "-" + p.month + "-" + p.day, year:+p.year, month:+p.month, date:+p.day, min:hh * 60 + mm,
    sec:+p.second, dow:p.weekday, hhmm:String(hh).padStart(2, "0") + ":" + p.minute };
  if (ET_CACHE.size > 20000) ET_CACHE.clear();
  ET_CACHE.set(ms, out);
  return out;
}
/* W5 (22 Oct): THE FUTURES the chart API serves (FMP, CME Globex): 18:00-17:00 New York, each session named by the date it
   closes on (an 18:05 bar on Thursday belongs to Friday's session), no pre- or after-market. Everything else is a US stock day. */
const FUTURES = Object.freeze(["ESUSD", "NQUSD", "CLUSD", "GCUSD", "SIUSD"]);
function isFutures(sym) { return FUTURES.includes(String(sym || "").toUpperCase()); }
/* the session a bar belongs to: the New York date for a stock; for futures the date of the 17:00 close that ends it */
function sessionDay(ms, fut) { return etParts(fut ? ms + 6 * 3600000 : ms).day; }
/* When the chart API serves bars. Stocks: weekdays 04:00-20:00 New York. Futures: Sunday 18:00 to Friday 17:00, less 17:00-18:00
   every day. Holidays are not listed here; a day that brings no bars slows the poll by itself (see LIVE). */
function inSession(ms, fut) {
  const e = etParts(ms);
  if (fut) {
    if (e.dow === "Sat") return false;
    if (e.dow === "Sun") return e.min >= 1080;
    if (e.dow === "Fri") return e.min < 1020;
    return e.min < 1020 || e.min >= 1080;
  }
  return e.dow !== "Sat" && e.dow !== "Sun" && e.min >= 240 && e.min < 1200;
}

/* ---- VWAP, from the full volume ---------------------------------------------------------------------------------------
   TradingView's definition (W1 measured its widget against it): sum(hlc3 x volume) / sum(volume), cumulative from the anchor,
   reset every New York day. Two anchors, each one of TradingView's own session modes:
     0400 - the extended session: every bar that opens at or after 04:00 and before 20:00 (TradingView's VWAP on an
            extended-hours chart);
     0930 - the regular session: every bar that holds a minute of 09:30-16:00 (TradingView's VWAP on a regular-hours chart).
            On 1m-30m bars that is exactly 09:30-16:00. The chart API's 1h bars are clock-aligned, so the 09:00 bar (09:00-10:00)
            is the first one and carries half an hour of pre-market volume - stated, not hidden.
   The volume is the provider's per-bar volume: the whole consolidated tape, not one venue. Returns one value per bar, NaN
   where the bar is outside its anchor's session. Pure. */
function hlc3(b) { return (b.h + b.l + b.c) / 3; }
/* W5: HIS VWAP is TradingView's built-in one with Band #1: the anchor is his session's start - 04:00 on his extended stock charts,
   18:00 (the CME day) on futures - and the band is one standard deviation either side, TradingView's definition (ta.vwap):
   variance = sum(volume x hlc3^2) / sum(volume) - vwap^2, floored at 0; band = vwap +/- mult x sqrt(variance).
   anchor "1800": every bar of the CME session (the day named by its close). Pure. */
const VWAP_BAND_MULT = 1;
function vwapCalc(bars, tfMs, anchor, mult) {
  const n = bars.length, vwap = new Array(n).fill(NaN), upper = new Array(n).fill(NaN), lower = new Array(n).fill(NaN);
  let day = null, pv = 0, vv = 0, p2v = 0;
  for (let i = 0; i < n; i++) {
    const b = bars[i], e = etParts(b.t), key = anchor === "1800" ? sessionDay(b.t, true) : e.day;
    if (key !== day) { day = key; pv = 0; vv = 0; p2v = 0; }
    const endMin = e.min + tfMs / 60000;
    const inside = anchor === "0930" ? endMin > 570 && e.min < 960 : anchor === "1800" ? true : e.min >= 240 && e.min < 1200;
    if (!inside || (!(b.v > 0) && vv === 0)) continue;
    if (b.v > 0) { const s = hlc3(b); pv += s * b.v; vv += b.v; p2v += s * s * b.v; }
    if (vv > 0) {
      const w = pv / vv, sd = Math.sqrt(Math.max(p2v / vv - w * w, 0));
      vwap[i] = w; upper[i] = w + mult * sd; lower[i] = w - mult * sd;
    }
  }
  return { vwap, upper, lower };
}
function vwapSeries(bars, tfMs, anchor) { return vwapCalc(bars, tfMs, anchor, VWAP_BAND_MULT).vwap; }

/* W5: HIS DAY LEVELS ("SCINTILLA · Day Levels" on his TradingView, its rules read off IWM against the chart API's bars):
   PDH / PDL - the previous REGULAR session's (09:30-16:00) high and low; PDO / PDC - its first open and last close;
   PMH / PML - today's pre-market (04:00-09:30) high and low; OPEN - today's 09:30 open. A futures session has no pre-market and
   no separate regular session: PD* are the previous CME session's (18:00-17:00), OPEN is today's 18:00 open, no PMH / PML.
   "Today" is the session of the newest bar. A level whose session has not happened yet is absent, never guessed. Pure. */
function dayLevels(bars, fut, dailyBars) {
  if (!bars || bars.length < 2) return null;
  const today = sessionDay(bars[bars.length - 1].t, fut);
  const regular = (b) => { const m = etParts(b.t).min; return fut || (m >= 570 && m < 960); };
  let prev = null;
  for (let i = bars.length - 1; i >= 0; i--) {
    const d = sessionDay(bars[i].t, fut);
    if (d < today && regular(bars[i])) { prev = d; break; }
  }
  const out = { today, prev, levels:[] };
  const add = (key, value) => { if (Number.isFinite(value)) out.levels.push({ key, value }); };
  /* futures: the provider's daily bar IS the CME session - taken when the daily read has it (its 5-minute bars can miss one:
     FMP's NQ series had no 08:45 bar on 22 Oct, and the session low 29,033 was in it) */
  const day = fut && prev && Array.isArray(dailyBars) ? dailyBars.find((d) => !d.forming && sessionDay(d.t, true) === prev) : null;
  if (day) { add("PDH", day.h); add("PDL", day.l); add("PDO", day.o); add("PDC", day.c); out.prevFrom = "daily"; }
  else if (prev) {
    const pb = bars.filter((b) => sessionDay(b.t, fut) === prev && regular(b));
    add("PDH", Math.max(...pb.map((b) => b.h))); add("PDL", Math.min(...pb.map((b) => b.l)));
    add("PDO", pb[0].o); add("PDC", pb[pb.length - 1].c); out.prevFrom = "5m";
  }
  const tb = bars.filter((b) => sessionDay(b.t, fut) === today);
  if (!fut) {
    const pm = tb.filter((b) => { const m = etParts(b.t).min; return m >= 240 && m < 570; });
    if (pm.length) { add("PMH", Math.max(...pm.map((b) => b.h))); add("PML", Math.min(...pm.map((b) => b.l))); }
  }
  const open = tb.find(regular);
  if (open) add("OPEN", open.o);
  out.from = tb.length ? tb[0].t : null;
  return out;
}

/* ---- W13: the header - the ticker and the day % big, the price beside them, the RVol tube, and what is unusual, flashing --------
   FLASHES, the rules W12 uses on the lenses, the tapes and the volume panel: the day % at least 2x the name's usual day (the Hub's own bar,
   SC_HB_X_UNUSUAL = 2, "about 1 day in 20"); RVol at least 2x. One bright pulse when it starts, a steady glow while it holds, and the words
   beside it ("2.3× its usual day", "2.1× its usual volume"). LOT SIZE and BLOCK: the store keeps no per-name reading (board_volume carries
   RVol only; the volume-pulse feed's lot size and blocks are the SPY + QQQ + DIA + IWM basket's, the volume panel's) - none on a chart. */
const FLASH_X = 2;
/* what is unusual now (pure): the day's move in the name's own units, and its RVol */
function unusualNow(pct, usual, stale, rvol) {
  const out = [];
  const x = Number.isFinite(pct) && usual > 0 && !stale ? Math.abs(pct) / usual : null;
  if (x != null && x >= FLASH_X) out.push({ key:"day", x:+x.toFixed(2), side:pct >= 0 ? "up" : "down", words:x.toFixed(1) + "× its usual day", short:x.toFixed(1) + "× day" });
  if (Number.isFinite(rvol) && rvol >= FLASH_X) out.push({ key:"rvol", x:rvol, side:"vol", words:rvol.toFixed(1) + "× its usual volume", short:rvol.toFixed(1) + "× vol" });
  return out;
}
const FLASHING = { day:false, rvol:false, since:{}, pulses:0 };
function flash(node, on, key) {
  const was = FLASHING[key];
  FLASHING[key] = on;
  node.classList.toggle("glow", on);
  if (on && !was) { FLASHING.since[key] = Date.now(); FLASHING.pulses++; node.classList.remove("pulse"); void node.offsetWidth; node.classList.add("pulse"); }
  else if (!on) node.classList.remove("pulse");
}
function paintHeader() {
  const q = S.quote, pct = q && S.prevClose ? (q.price / S.prevClose - 1) * 100 : null;
  const px = el("px"), day = el("day"), rv = el("rv"), why = el("why");
  const pxText = q ? fmtPx(q.price) : "", dayText = pct == null ? "" : (pct >= 0 ? "+" : "−") + Math.abs(pct).toFixed(2) + "%";
  if (px.textContent !== pxText) px.textContent = pxText;
  if (day.textContent !== dayText) day.textContent = dayText;
  day.dataset.day = pct == null ? "" : pct >= 0 ? "up" : "down";
  const mine = HUBN.sym === SYMBOL, r = mine ? HUBN.rvol : null, usual = mine ? HUBN.usual : null, stale = usual != null && usualStale(HUBN.usualDate);
  const rvFresh = r != null && rvolFresh(HUBN.rvolTs);
  /* the tube: the name's RVol, 3x the end */
  rv.classList.toggle("hot", r != null && r >= 1.5); rv.classList.toggle("cold", r != null && r < .7); rv.classList.toggle("old", r != null && !rvFresh);
  const rvText = r == null ? "—" : r.toFixed(1) + "×";
  if (rv.lastChild.textContent !== rvText) rv.lastChild.textContent = rvText;
  rv.firstChild.style.setProperty("--rv", Math.round(Math.min(1, (r || 0) / 3) * 100) + "%");
  rv.title = "relative volume: " + SYMBOL + "'s pace against its usual day - " + (r == null ? "no reading in the store" : r.toFixed(2) + "× (the Hub's RVol, board_volume.rvol_at_time" + (HUBN.rvolTs ? ", " + HUBN.rvolTs.slice(11, 16) + " UTC" : "") + ")") + " - the tube, 3× the end";
  day.title = usual == null ? "the day's move against yesterday's close - no usual day stored for " + SYMBOL
    : "usual day ±" + usual.toFixed(1) + "% over 60 sessions (ticker_heartbeat_daily.usual_day_60, to " + HUBN.usualDate + (stale ? " - more than a week old, not a current reading" : "") + ")" +
      (pct == null ? "" : " · today " + (Math.abs(pct) / usual).toFixed(1) + "× its usual day");
  /* unusual: a pulse when it starts, a glow while it holds, the words */
  const U = unusualNow(pct, usual, stale, rvFresh ? r : null);
  flash(day, U.some((u) => u.key === "day"), "day");
  flash(rv, U.some((u) => u.key === "rvol"), "rvol");
  const narrow = document.body.clientWidth < 760;   /* an iPad pair's side: the short words */
  const html = U.map((u) => '<b class="' + u.side + '" title="' + u.words + '">' + (narrow ? u.short : u.words) + "</b>").join(" · ");
  if (why.innerHTML !== html) why.innerHTML = html;
  S.unusual = U;
}

/* ---- the strip: symbol, intervals, clouds, the live price, and the age of the last bar --------------------------------- */
function paintStrip() {
  const sym = el("sym");
  if (sym.tagName !== "INPUT" && (!BARE || SYNC)) {
    const input = document.createElement("input"); input.className = "sym"; input.id = "sym"; input.spellcheck = false;
    input.setAttribute("aria-label", "Symbol"); input.addEventListener("keydown", (e) => { if (e.key === "Enter") { tickerTyped(input.value); input.blur(); } });
    sym.replaceWith(input);
  }
  const s = el("sym");
  if (s.tagName === "INPUT") { if (document.activeElement !== s) s.value = SYMBOL; } else s.textContent = SYMBOL;
  const tfs = el("tfs");
  if (tfs.childElementCount !== TFS.length) {
    tfs.innerHTML = "";
    for (const x of TFS) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = x.key; b.dataset.tf = x.key;
      b.title = x.key + " bars from the whole tape"; b.addEventListener("click", () => setTf(x.key)); tfs.appendChild(b);
    }
  }
  for (const b of tfs.children) { const on = b.dataset.tf === TF.key; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); }
  const cb = el("cloudsBtn"); cb.classList.toggle("on", CLOUDS_ON); cb.setAttribute("aria-pressed", CLOUDS_ON ? "true" : "false");
  paintHeader();
  const q = S.quote, st = el("state"), now = Date.now(), last = lastCompleted(S.bars);
  const html = stateText(now, last, q, document.body.clientWidth, FUT, S.readFails + (S.quoteFails >= 3 ? 2 : 0));
  if (st.innerHTML !== html.text) st.innerHTML = html.text;
  st.dataset.late = html.late ? "1" : "0";
  /* W5: never a frozen chart that looks live - stale or not answering, the strip says so in red and the chart steps back */
  st.dataset.level = html.level; area.dataset.level = html.level; S.stateLevel = html.level;
}
/* THE AGE OF THE LAST BAR, always on the strip: which bar is the newest completed one and how long ago it closed (the bar
   still forming is the live price's, see LIVE). Narrow slots keep the age and drop the words around it. */
/* W5 - the levels: ok; late (amber) - in session, the newest bar more than one interval and 90 s overdue; stale (red) - more than
   three intervals and 10 minutes overdue; down (red) - two reads in a row got no answer ("no reply · retrying"). */
function stateText(now, last, q, width, fut, fails) {
  if (S.loading) return { text:"loading", late:false, level:"ok" };
  if (!last) return { text:S.error ? (fails >= 2 || !S.errorNamed ? "<b>no reply</b> · retrying" : "no bars") : "", late:!!S.error, level:S.error ? "down" : "ok" };
  const e = etParts(last.t), open = inSession(now, fut);
  const label = TF.daily ? e.date + " " + MON[e.month - 1] : e.hhmm;
  const age = TF.daily ? null : now - (last.t + TF.ms);
  const stale = !TF.daily && open && age > 3 * TF.ms + 600000;
  const level = fails >= 2 ? "down" : stale ? "stale" : (!TF.daily && open && age > TF.ms + 90000) || fails === 1 ? "late" : "ok";
  const late = level !== "ok";
  const head = level === "down" ? "<b>no reply</b> · retrying" : level === "stale" ? "<b>stale</b>" : open ? "<b>live</b>" : "<b>closed</b>";
  if (width < 640) return { text:head + " · bar " + label + (age == null ? "" : " · " + ageText(age)), late, level };
  let text = head + (width >= 900 ? (fut ? " · CME session 18:00" : " · whole tape") : "") + " · last bar " + label + (age == null ? "" : " · closed " + ageText(age) + " ago");
  if (width >= 900 && q && Number.isFinite(q.at)) text += " · price " + ageText(now - q.at) + " old";
  return { text, late, level };
}
function showMsg(text) { const m = el("msg"); if (text) { m.textContent = text; m.hidden = false; } else m.hidden = true; }

/* ---- changes ------------------------------------------------------------------------------------------------------------ */
function tell() {
  if (window.parent === window) return;
  /* NOT tv-v1's SCINTILLA_TV_STATE: the WIDGETS deck re-points a slot to the TradingView shell when it hears that one.
     The same fields, its own name, for the coordinator to wire; the interval in tv-v1's codes so one memory serves both. */
  try { parent.postMessage({ type:"SCINTILLA_LIVE_STATE", n:N, ticker:SYMBOL, interval:TF.tv, tf:TF.key }, location.origin); } catch (_) {}
}
function keepAddress() {
  if (BARE || window.parent !== window) return;
  const q = new URLSearchParams(location.search); q.delete("t"); q.set("symbol", SYMBOL); q.set("tf", TF.key);
  try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (_) {}
}
/* the strip's ticker box: this chart switches; in synced mode the parent is told which chart and which ticker (n from &n=) */
function tickerTyped(value) {
  const t = CLEAN(value);
  if (!t) { paintStrip(); return; }
  if (SYNC && window.parent !== window) { try { parent.postMessage({ type:"SCINTILLA_CHART_TICKER", n:N, ticker:t }, location.origin); } catch (_) {} }
  setSymbol(t);
}
function setSymbol(value) {
  const t = CLEAN(value); if (!t || t === SYMBOL) { paintStrip(); return; }
  SYMBOL = t; document.title = "Station · " + SYMBOL + " · " + TF.key + " · live"; keepAddress(); tell(); loadAll();
}
function setTf(value) {
  const next = tfOf(value); if (next === TF) return;
  TF = next; S.spacing = TF.daily ? 6 : 7; document.title = "Station · " + SYMBOL + " · " + TF.key + " · live"; keepAddress(); tell(); loadAll();
}
function setClouds(on) {
  const next = !!on; if (next === CLOUDS_ON) return;
  CLOUDS_ON = next;
  if (!BARE) { try { localStorage.setItem(CLOUD_STATE_KEY, CLOUDS_ON ? "1" : "0"); } catch (_) {} }
  if (CLOUDS_ON) readClouds();
  S.cloudMap = null; paintStrip(); draw();
}
el("cloudsBtn").addEventListener("click", () => setClouds(!CLOUDS_ON));
/* W3: TV asks the deck for the other shell in this slot, the symbol and the interval (in tv-v1's codes) carried; the deck remembers the choice */
el("srcTv").addEventListener("click", () => { if (window.parent === window) return; try { parent.postMessage({ type:"SCINTILLA_CHART_SRC", n:N, src:"tv", ticker:SYMBOL, interval:TF.tv }, location.origin); } catch (_) {} });
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  const d = e.data;
  if (d.sc === "chart") {
    if (typeof d.clouds === "boolean") setClouds(d.clouds);
    if (typeof d.steps === "boolean") { CLOUD_STEPS = d.steps; draw(); }
    /* W8: a synced chart takes the parent's timeframe; a new timeframe and a new ticker in one message are one load */
    const tf = SYNC && d.tf && TFS.some((x) => x.key === d.tf || x.tv === d.tf) ? tfOf(d.tf) : null;
    const t = d.ticker ? CLEAN(d.ticker) : "";
    if (tf && t && t !== SYMBOL && tf !== TF) { TF = tf; S.spacing = TF.daily ? 6 : 7; setSymbol(t); return; }
    if (tf) setTf(tf.key);
    if (t) setSymbol(t);
    /* W11: the window the parent shows every chart - fitted to this chart's own bars, and never posted back */
    if (SYNC && d.view && typeof d.view === "object" && d.view.span > 0 && (d.view.end == null || Number.isFinite(d.view.end)))
      applyView({ span:+d.view.span, end:d.view.end == null ? null : +d.view.end });
    return;
  }
  if (d.type === "SCINTILLA_TV_INTERVAL" || d.type === "SCINTILLA_LIVE_INTERVAL") setTf(d.interval);
});

/* ---- W11: the synced view - a parent shows every chart the same clock window -------------------------------------------------
   OBEYED: { sc:"chart", view:{ span, end } } fits this chart's own bars in that window (applyView) and posts nothing back.
   POSTED: after his wheel, drag or double-click only, at most ten a second (the last one always sent):
   { type:"SCINTILLA_CHART_VIEW", n, view:{ span, end } }. A new symbol or timeframe keeps the window when at least ten bars of the new
   interval fit it (5m -> 15m keeps the clock window; a few hours on 1D does not, and the chart opens pinned at its default zoom). */
/* bars may be up to 160 px wide, so a deep 5m zoom keeps its clock window on 15m (13 bars across a slot need ~60 px); the wheel shares the range */
const VIEW_MIN_BARS = 10, VIEW_POST_MS = 100, SPACING_MAX = 160;
function currentView() {
  const P = S.plot;
  if (!P || S.bars.length < 2) return null;
  const v = visibleBars(S.bars.length, P.right, P.plotW, P.spacing);
  return viewOf(S.bars, v.first, v.last, TF.ms, S.viewRight == null);
}
function applyView(view, afterLoad) {
  S.timeView = view;
  if (!S.plot || S.bars.length < 2) return;
  const w = windowBars(S.bars, view, TF.ms);
  if (!w || w.count < VIEW_MIN_BARS) { if (!afterLoad) draw(); return; }
  /* twice: the right margin (forming step, names) depends on the bar width */
  for (let pass = 0; pass < 2; pass++) {
    const P = S.plot;
    if (w.pinned) { S.viewRight = null; S.spacing = Math.max(2, Math.min(SPACING_MAX, P.plotW / (w.count + P.rightPad))); }
    else { S.viewRight = w.last; S.spacing = Math.max(2, Math.min(SPACING_MAX, P.plotW / w.count)); }
    draw();
  }
}
let viewPostAt = 0, viewPostTimer = 0;
function postViewSoon() {
  if (!SYNC || window.parent === window) return;
  clearTimeout(viewPostTimer);
  viewPostTimer = setTimeout(() => {
    viewPostAt = Date.now();
    const view = currentView();
    if (!view) return;
    S.timeView = view;
    try { parent.postMessage({ type:"SCINTILLA_CHART_VIEW", n:N, view }, location.origin); } catch (_) {}
  }, Math.max(0, VIEW_POST_MS - (Date.now() - viewPostAt)));
}

/* ---- the pointer: crosshair, wheel to zoom, drag to pan, double-click back to now ----------------------------------------- */
function local(e) { const r = area.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
let drag = null;
area.addEventListener("pointermove", (e) => {
  const p = local(e);
  if (drag && S.plot) {
    const dx = p.x - drag.x;
    if (Math.abs(dx) > 2) area.classList.add("panning");
    S.viewRight = Math.min(S.plot.edge, Math.max(10, drag.right - dx / S.spacing));
    if (S.viewRight >= S.plot.edge - .01) S.viewRight = null;
    S.hover = p; draw(); postViewSoon(); return;
  }
  S.hover = p; drawOverlay(); paintReadout();
});
area.addEventListener("pointerleave", () => { S.hover = null; drawOverlay(); paintReadout(); });
area.addEventListener("pointerdown", (e) => {
  if (!S.plot) return;
  drag = { x:local(e).x, right:S.viewRight == null ? S.plot.edge : S.viewRight };
  try { area.setPointerCapture(e.pointerId); } catch (_) {}
});
const endDrag = () => { drag = null; area.classList.remove("panning"); };
area.addEventListener("pointerup", endDrag); area.addEventListener("pointercancel", endDrag);
area.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!S.plot) return;
  const before = S.spacing;
  S.spacing = Math.max(2, Math.min(SPACING_MAX, S.spacing * Math.exp(-e.deltaY * .0015)));
  if (S.viewRight != null) {
    /* keep the bar under the pointer where it is */
    const p = local(e), atPointer = S.viewRight - (S.plot.plotW - p.x) / before;
    S.viewRight = atPointer + (S.plot.plotW - p.x) / S.spacing;
  }
  draw(); postViewSoon();
}, { passive:false });
area.addEventListener("dblclick", () => { S.viewRight = null; S.spacing = TF.daily ? 6 : 7; draw(); postViewSoon(); });
addEventListener("resize", () => draw());
/* the deck cannot see a pointer inside a frame: say, once a second at most, that this pane is in use (chart-v1's message) */
(function reportStationActivity() {
  if (window.parent === window) return;
  let last = 0;
  const send = () => { const now = Date.now(); if (now - last < 1000) return; last = now;
    try { window.parent.postMessage({ sc:"station-activity", pane:"live-v1-" + N, at:now }, location.origin); } catch (_) {} };
  for (const ev of ["pointermove", "pointerdown", "wheel", "keydown"]) addEventListener(ev, send, { passive:true, capture:true });
})();

/* A proof can read what the pane holds and shows; nothing here changes it. */
window.SC_LIVE = Object.freeze({
  snapshot: () => ({ symbol:SYMBOL, tf:TF.key, n:N, bare:BARE, clouds:CLOUDS_ON, loading:S.loading, error:S.error,
    bars:S.bars.map((b) => Object.assign({}, b)), quote:S.quote && Object.assign({}, S.quote), prevClose:S.prevClose,
    vw930:S.vw930.slice(), vw400:S.vw400.slice(), tags:(S.tags || []).slice(), cloudLabels:S.cloudLabels || null,
    timeView:S.timeView, visible:S.plot ? (() => { const v = visibleBars(S.bars.length, S.plot.right, S.plot.plotW, S.plot.spacing); return { first:v.first, last:v.last,
      firstT:S.bars[v.first] ? S.bars[v.first].t : null, lastT:S.bars[v.last] ? S.bars[v.last].t : null, pinned:S.viewRight == null, spacing:S.plot.spacing }; })() : null,
    fut:FUT, vwMain:S.vwMain.slice(), vwUp:S.vwUp.slice(), vwLo:S.vwLo.slice(), levels:S.levels, levelsDrawn:S.levelsDrawn || null,
    cloudToday:S.cloudToday && Object.assign({}, S.cloudToday), readFails:S.readFails, quoteFails:S.quoteFails, level:S.stateLevel || null,
    cloudRows:S.cloudRows ? S.cloudRows.length : 0, forming:formingNow(), plot:S.plot && { first:S.plot.first, last:S.plot.last,
      right:S.plot.right, spacing:S.plot.spacing, plotW:S.plot.plotW, plotH:S.plot.plotH, yLo:S.plot.yLo, yHi:S.plot.yHi },
    readout:el("readout").textContent, readoutIx:+el("readout").dataset.ix, state:el("state").textContent,
    crosshair:S.crosshair || null, nextRead:S.nextRead || null, log:S.log.slice(),
    ribbon:{ shown:S.ribbonShown || null, worker:!!RIBBON.worker, failed:RIBBON.failed, asked:RIBBON.asked, got:RIBBON.got, paintedHere:RIBBON.paintedHere },
    header:{ day:el("day").textContent, px:el("px").textContent, rvol:HUBN.sym === SYMBOL ? HUBN.rvol : null, rvolText:el("rv").lastChild.textContent,
      usual:HUBN.sym === SYMBOL ? HUBN.usual : null, usualDate:HUBN.usualDate, unusual:(S.unusual || []).slice(), why:el("why").textContent,
      flashing:{ day:FLASHING.day, rvol:FLASHING.rvol }, pulses:FLASHING.pulses, fontPx:parseFloat(getComputedStyle(el("day")).fontSize) || null } }),
  xOf: (i) => S.plot ? S.plot.X(i) : null,
  POLL
});

document.title = "Station · " + SYMBOL + " · " + TF.key + " · live";
paintStrip(); tell(); loadAll();
</script>
