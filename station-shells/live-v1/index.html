<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · live chart</title>
<!-- W2 (22 Oct 2026). Alan, 22 Oct ~17:55 ET: "Our own … chart … from trading live bars from the whole tape … the trading view is
     more delayed … I feel like the big charts are my lines … If we can make it, I might not need to draw there." Earlier the same
     day: "It doesn't work for executing trades … It's not precise enough. I need the bars, I need everything."
     THIS SHELL is the house answer to the free TradingView embed (tv-v1) for the WIDGETS wall's two big slots: candles and volume
     from the chart API (Massive, the consolidated tape, extended hours 04:00-20:00 ET), intervals 1m 5m 15m 30m 1h 1D, VWAP from the
     full volume with two session anchors (09:30 and 04:00, labelled), a crosshair with price and time, a precise price axis, and
     his clouds drawn exactly as chart-v1 draws them (the same arithmetic file, the same painting code - pinned byte-identical by
     tests/station-w2-live-chart-20261022.test.mjs).
     ADDRESS: ?symbol=SPY&tf=5m standalone; tv-v1's own keys are read too (?t= ?tf=1|5|15|30|60|D ?n= ?bare=1), so a WIDGETS slot
     can be pointed here by changing the shell's path only. ?clouds=0|1 and ?steps=1 as on chart-v1.
     WHERE EVERY NUMBER COMES FROM: one client, /_provider/provider.js - marketCandles for the bars, marketQuotes for the live price.
     Nothing is fetched around it. The bars are the provider's COMPLETED bars, exactly as served; the bar still forming is shown the
     way chart-v1 shows it (P3, 28 Sep): the live price from the stream, one dashed step and a hollow ring after the last completed
     bar, never drawn as a finished candle. On 1D the API itself serves today's forming bar (forming=1, P7), drawn hollow.
     LIVE, AND WHAT IT COSTS: see LIVE below. The age of the last completed bar is always printed on the strip.
     WHAT IT DOES NOT DO: no line drawing (not in this pass), no deck change (the coordinator wires the TV <-> LIVE switch), no
     writes anywhere except, when standalone (not ?bare), the clouds switch's own key as chart-v1 does. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --line2:#252538; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --dim:#868AAA;
  --mute:#6E6E80; --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --late:#c8953a; --vwap:#F2B33D;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink3); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
#strip{ flex:none; height:22px; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--panel2);
  border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
#strip .sym{ color:var(--ink2); letter-spacing:.14em; font-size:10px; text-transform:uppercase; }
#strip input.sym{ width:62px; background:transparent; border:1px solid var(--line2); padding:1px 4px; font:10px var(--mono);
  outline:none; }
#strip input.sym:focus{ border-color:var(--crk); color:var(--crk); }
#strip .tfs{ display:flex; gap:2px; margin-left:2px; }
#strip button{ font:9px var(--mono); letter-spacing:.08em; color:var(--ink3); background:transparent; border:1px solid transparent;
  padding:1px 6px; cursor:pointer; border-radius:0; }
#strip button:hover{ color:var(--ink2); border-color:var(--line2); }
#strip button.on{ color:var(--crk); border-color:var(--crk); }
#strip .px{ color:var(--ink3); font-size:10px; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
#strip .px[data-day="up"]{ color:var(--bull); }
#strip .px[data-day="down"]{ color:var(--bear); }
#strip .state{ margin-left:auto; color:var(--mute); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
#strip .state b{ color:var(--dim); font-weight:600; }
#strip .state[data-late="1"] b{ color:var(--late); }
body.bare #strip .sym{ display:none; }
@media (max-width:640px){ #strip{ gap:4px; padding:0 5px; } #strip button{ padding:1px 4px; } #strip .tfs{ margin-left:0; }
  #readout{ font-size:10px; } }
#area{ flex:1 1 0; min-height:0; position:relative; overflow:hidden; touch-action:none; cursor:crosshair;
  -webkit-user-select:none; user-select:none; }
#area.panning{ cursor:grabbing; }
#cv, #ov{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#ov{ pointer-events:none; }
#readout{ position:absolute; left:8px; top:6px; z-index:2; pointer-events:none; font:600 11px var(--mono); line-height:1.45;
  letter-spacing:.01em; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; text-shadow:0 0 3px #05060c; }
#readout .k{ color:var(--mute); font-weight:600; margin-left:7px; }
#readout .k:first-child{ margin-left:0; }
#readout .up{ color:var(--bull); } #readout .down{ color:var(--bear); }
#readout .vw{ color:var(--vwap); }
#readout .when{ color:var(--dim); margin-left:9px; }
#readout .note{ color:var(--late); margin-left:7px; }
#msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; text-align:center; padding:20px; z-index:3; pointer-events:none; }
#msg[hidden]{ display:none; }
</style>
</head>
<body>
<div id="strip">
  <span class="sym" id="sym"></span>
  <span class="tfs" id="tfs" role="group" aria-label="Interval"></span>
  <button type="button" id="cloudsBtn" title="His clouds: the 13/21-day EMAs and 50/200-day SMAs, daily-locked, as chart-v1 draws them">CLOUDS</button>
  <span class="px" id="px"></span>
  <span class="state" id="state"></span>
</div>
<div id="area">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="readout"></div>
  <div id="msg">loading</div>
</div>
<script src="/_provider/provider.js"></script>
<!-- His clouds: the arithmetic and geometry chart-v1 uses, unchanged (pure functions; reads no data, draws nothing). -->
<script src="/_indicators/station-clouds.js"></script>
<script>
/* ONE SOURCE (2026-09-22): no database client here. Every bar and price comes from the chart API through SC_PROVIDER. */
try { scBindProviderClient(); } catch (_) {}
"use strict";

/* ---- the address ---------------------------------------------------------------------------------------------------- */
const QS = new URLSearchParams(location.search);
const CLEAN = (t) => String(t || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 12);
/* The six intervals. key = this shell's name, tv = tv-v1's code (the deck remembers a slot's interval in these), api = the
   provider client's width, history = completed bars read on load (about three extended sessions on 5m). */
const TFS = Object.freeze([
  Object.freeze({ key:"1m",  tv:"1",  api:"1m",  ms:60000,    history:960 }),
  Object.freeze({ key:"5m",  tv:"5",  api:"5m",  ms:300000,   history:600 }),
  Object.freeze({ key:"15m", tv:"15", api:"15m", ms:900000,   history:400 }),
  Object.freeze({ key:"30m", tv:"30", api:"30m", ms:1800000,  history:400 }),
  Object.freeze({ key:"1h",  tv:"60", api:"1h",  ms:3600000,  history:400 }),
  Object.freeze({ key:"1D",  tv:"D",  api:"1D",  ms:86400000, history:500, daily:true })
]);
function tfOf(value) {
  const s = String(value == null ? "" : value).trim();
  return TFS.find((x) => x.key === s || x.tv === s || x.key.toLowerCase() === s.toLowerCase()) || TFS[1];
}
let SYMBOL = CLEAN(QS.get("symbol") || QS.get("t")) || "SPY";
let TF = tfOf(QS.get("tf"));
const N = /^[12]$/.test(QS.get("n") || "") ? +QS.get("n") : 1;
const BARE = QS.get("bare") === "1";
if (BARE) document.body.classList.add("bare");
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
/* THE CLOUDS, as chart-v1 reads them: on unless somebody turned them off. The Station dock owns the wall's switch (key
   station.clouds, told to chart frames as { sc:"chart", clouds }); ?clouds= wins for one load. Standalone, the strip's
   switch remembers the same key chart-v1 does; inside the deck (?bare=1) it never writes - the dock owns the key. */
const CLOUD_STATE_KEY = "station.clouds";
let CLOUDS_ON = QS.has("clouds") ? QS.get("clouds") !== "0" : lsGet(CLOUD_STATE_KEY) !== "0";
const CLOUD_EXTRAS = Object.freeze({ ema8: QS.get("ema8") === "1", sma100: QS.get("sma100") === "1" });
let CLOUD_STEPS = QS.has("steps") ? QS.get("steps") === "1" : lsGet("station.clouds.steps") === "1";

/* ---- New York time --------------------------------------------------------------------------------------------------- */
const ET_FMT = new Intl.DateTimeFormat("en-CA", { timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", second:"2-digit", weekday:"short", hourCycle:"h23" });
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ET_CACHE = new Map();
function etParts(ms) {
  const hit = ET_CACHE.get(ms);
  if (hit) return hit;
  const p = {};
  for (const x of ET_FMT.formatToParts(new Date(ms))) p[x.type] = x.value;
  const hh = +p.hour % 24, mm = +p.minute;
  const out = { day:p.year + "-" + p.month + "-" + p.day, year:+p.year, month:+p.month, date:+p.day, min:hh * 60 + mm,
    sec:+p.second, dow:p.weekday, hhmm:String(hh).padStart(2, "0") + ":" + p.minute };
  if (ET_CACHE.size > 20000) ET_CACHE.clear();
  ET_CACHE.set(ms, out);
  return out;
}
/* The extended session the chart API serves: weekdays 04:00-20:00 New York. Holidays are not listed here; a day that brings no
   bars slows the poll by itself (see LIVE). */
function inSession(ms) {
  const e = etParts(ms);
  return e.dow !== "Sat" && e.dow !== "Sun" && e.min >= 240 && e.min < 1200;
}

/* ---- VWAP, from the full volume ---------------------------------------------------------------------------------------
   TradingView's definition (W1 measured its widget against it): sum(hlc3 x volume) / sum(volume), cumulative from the anchor,
   reset every New York day. Two anchors, each one of TradingView's own session modes:
     0400 - the extended session: every bar that opens at or after 04:00 and before 20:00 (TradingView's VWAP on an
            extended-hours chart);
     0930 - the regular session: every bar that holds a minute of 09:30-16:00 (TradingView's VWAP on a regular-hours chart).
            On 1m-30m bars that is exactly 09:30-16:00. The chart API's 1h bars are clock-aligned, so the 09:00 bar (09:00-10:00)
            is the first one and carries half an hour of pre-market volume - stated, not hidden.
   The volume is the provider's per-bar volume: the whole consolidated tape, not one venue. Returns one value per bar, NaN
   where the bar is outside its anchor's session. Pure. */
function hlc3(b) { return (b.h + b.l + b.c) / 3; }
function vwapSeries(bars, tfMs, anchor) {
  const out = new Array(bars.length).fill(NaN);
  let day = null, pv = 0, vv = 0;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i], e = etParts(b.t);
    if (e.day !== day) { day = e.day; pv = 0; vv = 0; }
    const endMin = e.min + tfMs / 60000;
    const inside = anchor === "0930" ? endMin > 570 && e.min < 960 : e.min >= 240 && e.min < 1200;
    if (!inside || (!(b.v > 0) && vv === 0)) continue;
    if (b.v > 0) { pv += hlc3(b) * b.v; vv += b.v; }
    out[i] = vv > 0 ? pv / vv : NaN;
  }
  return out;
}

/* ---- precise numbers ------------------------------------------------------------------------------------------------
   A price is printed with as many decimals as the provider sent (764.0373 stays 764.0373; 764.13 is 764.13), never fewer than
   two (four under a dollar): the shortest text that reads back as exactly the same number. */
function fmtPx(v) {
  if (!Number.isFinite(v)) return "—";
  const min = Math.abs(v) < 1 ? 4 : 2;
  for (let d = min; d <= 8; d++) if (+v.toFixed(d) === v) return v.toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
  return v.toLocaleString("en-US", { minimumFractionDigits:min, maximumFractionDigits:8 });
}
/* Shares, rounded to the share (the tape carries fractional shares from odd-lot prints; the bar keeps the exact number). */
function fmtVol(v) { return Number.isFinite(v) ? Math.round(v).toLocaleString("en-US") : "—"; }
/* VWAP is a computed average, printed to the cent - the precision it is compared at. */
function fmtVwap(v) { return Number.isFinite(v) ? v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }) : "—"; }
/* Tags on the price axis must not sit on each other: the live price keeps its height, the others step away (pure). */
function spreadTags(tags, gap, top, bottom) {
  const fixed = tags.filter((t) => t.fixed), free = tags.filter((t) => !t.fixed).sort((a, b) => a.y - b.y);
  const placed = fixed.map((t) => Object.assign({}, t, { at:t.y }));
  for (const t of free) {
    let at = t.y;
    for (let pass = 0; pass < 8; pass++) {
      const hit = placed.find((p) => Math.abs(p.at - at) < gap);
      if (!hit) break;
      at = t.y >= hit.at ? hit.at + gap : hit.at - gap;
    }
    placed.push(Object.assign({}, t, { at:Math.max(top, Math.min(bottom, at)) }));
  }
  return placed;
}
/* The price axis: round levels, and as many decimals as the step itself needs (chart-v1's rule: a gridline at 12.5 reads
   12.5, never 13). */
function niceStep(range, ticks) {
  const raw = Math.max(Number.EPSILON, range / Math.max(1, ticks));
  const pow = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / pow;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * pow;
}
function stepDecimals(step) {
  for (let d = 0; d <= 6; d++) { const s = step * Math.pow(10, d); if (Math.abs(s - Math.round(s)) < 1e-9) return d; }
  return 6;
}
function ageText(ms) {
  if (!Number.isFinite(ms)) return "—";
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s";
  if (s < 86400) return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min";
  return Math.floor(s / 86400) + " d " + Math.floor((s % 86400) / 3600) + " h";
}

/* ---- the series -------------------------------------------------------------------------------------------------------
   The provider client hands rows newest first ({ timestamp in seconds, open, high, low, close, volume, forming }); the chart
   keeps them oldest first as { t ms, o, h, l, c, v, forming }. A read of the newest bars replaces everything from its first
   bar on (a corrected bar is taken as served) and keeps what came before. Pure. */
function barsFromRows(rows) {
  return (Array.isArray(rows) ? rows : []).map((r) => ({ t:Number(r.timestamp) * 1000, o:+r.open, h:+r.high, l:+r.low, c:+r.close,
    v:+r.volume, forming:r.forming === true }))
    .filter((b) => Number.isFinite(b.t) && [b.o, b.h, b.l, b.c].every(Number.isFinite))
    .sort((a, b) => a.t - b.t);
}
function mergeTail(series, tail, keep) {
  if (!tail.length) return series.slice();
  const from = tail[0].t;
  const out = series.filter((b) => b.t < from && !b.forming).concat(tail);
  return keep && out.length > keep ? out.slice(out.length - keep) : out;
}
function lastCompleted(series) {
  for (let i = series.length - 1; i >= 0; i--) if (!series[i].forming) return series[i];
  return null;
}
/* THE BAR STILL FORMING, the way chart-v1 decides it (chApplyLivePoint): a live price belongs on the chart only when its own
   observation time is later than the last completed bar's period - never inside it, never in the future. Returns the
   bucket's start time, or null. 1D is a session question, not a clock one. Pure. */
function formingBucket(quoteAt, last, tfMs, daily, now) {
  if (!Number.isFinite(quoteAt) || !last) return null;
  if (quoteAt > (Number.isFinite(now) ? now : Date.now()) + tfMs) return null;
  if (daily) {
    const qd = etParts(quoteAt).day, ld = etParts(last.t).day;
    return qd > ld ? Date.parse(qd + "T04:00:00Z") : null;
  }
  if (quoteAt < last.t + tfMs) return null;
  return Math.floor(quoteAt / tfMs) * tfMs;
}

/* ---- LIVE ------------------------------------------------------------------------------------------------------------
   The chart API serves COMPLETED bars only, and serves each one within seconds of its close (it asks Massive for the
   session on every read). Reads go through marketCandles with forming:true: on 1D that brings today's forming bar (P7); on
   the intraday widths the API answers that it has none and serves the completed bars - and the forming read skips the
   client's half-hour bar store and carries max-age 15 instead of 60, which is what keeps a 1m or 5m chart current.
   THE SCHEDULE (one chart):
     price - marketQuotes every 5 s (the stream's last trade; the API answers from memory, max-age 2).
     bars  - one read of the newest bars 3 s after every bar closes (1m: every minute; 5m: every five), and if the bar is
             not in yet, again every 15 s, at most three more times; nothing in between. After three closes in a row that
             brought nothing (a quiet name after hours, a holiday), once a minute until one does. Outside 04:00-20:00 ET
             (the 20:00 close itself still read), every 5 minutes. 1D: every 60 s while the API serves today's forming bar
             or the regular session is on, otherwise every 5 minutes.
   Pure: when the next bar read is due. */
const POLL = Object.freeze({ quoteMs:5000, lagMs:3000, retryMs:15000, retries:3, quietMs:60000, dailyMs:60000, idleMs:300000 });
function nextBarRead(now, tfMs, lastOpen, tries, idle, daily, formingServed) {
  if (daily) {
    const m = etParts(now).min, regular = inSession(now) && m >= 565 && m < 980;
    return { at:now + (formingServed || regular ? POLL.dailyMs : POLL.idleMs), why:"daily" };
  }
  if (!inSession(now) && !inSession(now - 120000)) return { at:now + POLL.idleMs, why:"closed" };
  if (idle) return { at:now + POLL.quietMs, why:"quiet" };
  const closedOpen = Math.floor(now / tfMs) * tfMs - tfMs;          /* the bar whose period ended most recently */
  const nextClose = Math.floor(now / tfMs) * tfMs + tfMs;
  if (Number.isFinite(lastOpen) && lastOpen < closedOpen && tries < POLL.retries)
    return { at:now + POLL.retryMs, why:"retry" };
  return { at:nextClose + POLL.lagMs, why:"close" };
}

/* ---- state ------------------------------------------------------------------------------------------------------------ */
const COL = Object.freeze({ bg:"#0A0A0F", bull:"#00FFA3", bear:"#FF2D55", dim:"#868AAA", ink3:"#9A9AB6", mute:"#6E6E80",
  grid:"rgba(134,138,170,.085)", ext:"rgba(134,138,170,.04)", late:"#c8953a",
  vwap930:"#F2B33D", vwap400:"#B88A35", volUp:"rgba(0,255,163,.26)", volDown:"rgba(255,45,85,.26)" });
const S = {
  bars:[], prevClose:null, quote:null, cloudRows:null, cloudTicker:null, cloudMap:null, cloudAt:0, cloudAsked:0,
  vw930:[], vw400:[], gen:0, loading:true, error:null, lastRead:null, readAt:0, tries:0, misses:0, idle:false,
  spacing:7, viewRight:null, hover:null, plot:null, log:[]
};
const el = (id) => document.getElementById(id);
const cv = el("cv"), ov = el("ov"), area = el("area");
function note(kind, ok, extra) {
  S.log.push(Object.assign({ at:Date.now(), kind, ok }, extra || {}));
  if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
}

/* ---- reads ----------------------------------------------------------------------------------------------------------- */
async function readBars(limit) {
  const rows = await SC_PROVIDER.marketCandles(SYMBOL, TF.api, { limit, forming:true });
  return barsFromRows(rows);
}
function recompute() {
  S.vw930 = TF.daily ? [] : vwapSeries(S.bars, TF.ms, "0930");
  S.vw400 = TF.daily ? [] : vwapSeries(S.bars, TF.ms, "0400");
  S.cloudMap = null;
}
async function loadAll() {
  const gen = ++S.gen;
  S.loading = true; S.error = null; S.bars = []; S.quote = null; S.prevClose = null; S.viewRight = null; S.hover = null;
  S.tries = 0; S.misses = 0; S.idle = false;
  paintStrip(); showMsg("loading " + SYMBOL + " · " + TF.key); draw();
  clearTimeout(barTimer);
  try {
    const bars = await readBars(TF.history);
    if (gen !== S.gen) return;
    note("bars", true, { n:bars.length, limit:TF.history });
    if (bars.length < 2) throw new Error("the chart API served " + bars.length + " " + TF.key + " bars for " + SYMBOL);
    S.bars = bars; S.readAt = Date.now(); S.loading = false;
    recompute(); showMsg(null); draw();
  } catch (error) {
    if (gen !== S.gen) return;
    note("bars", false, { error:String(error && (error.scAbsence || error.message) || error).slice(0, 160) });
    S.loading = false; S.error = String(error && (error.scAbsence || error.message) || error);
    showMsg(SYMBOL + " · " + TF.key + " · " + S.error);
  }
  readQuote();
  if (CLOUDS_ON) readClouds();
  scheduleBars();
  paintStrip();
}
let barTimer = 0;
function scheduleBars() {
  clearTimeout(barTimer);
  const last = lastCompleted(S.bars), newest = S.bars[S.bars.length - 1];
  const plan = nextBarRead(Date.now(), TF.ms, last ? last.t : NaN, S.tries, S.idle, !!TF.daily, !!(newest && newest.forming));
  S.nextRead = plan;
  barTimer = setTimeout(pollBars, Math.max(1000, plan.at - Date.now()));
}
async function pollBars() {
  const gen = S.gen, before = lastCompleted(S.bars);
  try {
    /* the newest bars only: enough to cover a missed close or two and any bar the provider corrected */
    const tail = await readBars(TF.daily ? 5 : 24);
    if (gen !== S.gen) return;
    const merged = mergeTail(S.bars, tail, TF.history * 2);
    const after = lastCompleted(merged);
    const grew = !!(after && (!before || after.t > before.t));
    note("tail", true, { n:tail.length, newest:after ? after.t : null, grew });
    S.bars = merged; S.readAt = Date.now(); recompute();
    if (grew) { S.tries = 0; S.misses = 0; S.idle = false; }
    else if (!TF.daily) {
      S.tries++;
      const closed = Math.floor(Date.now() / TF.ms) * TF.ms - TF.ms;
      if (S.tries > POLL.retries && after && after.t < closed) { S.misses++; S.tries = 0; if (S.misses >= 3) S.idle = true; }
    }
    draw();
  } catch (error) {
    if (gen !== S.gen) return;
    note("tail", false, { error:String(error && (error.scAbsence || error.message) || error).slice(0, 160) });
  }
  paintStrip();
  scheduleBars();
}
async function readQuote() {
  const gen = S.gen, sym = SYMBOL;
  try {
    const rows = await SC_PROVIDER.marketQuotes([sym]);
    if (gen !== S.gen) return;
    const q = (rows || []).find((r) => r && r.ticker === sym);
    note("quote", !!q);

  if (Number.isFinite(live)) want.push({ key:"live", value:live, text:fmtPx(live), bg:dayUp == null ? COL.dim : dayUp ? COL.bull : COL.bear, ink:"#05060C", y:Y(live), fixed:true });
  return want;
}
function tagHeights(Y, top, bottom, first, last) {
  return spreadTags(wantedTags(Y, first, last), 15, top + 7, bottom - 7).map((t) => t.at);
}
function drawLine(ctx, arr, first, last, X, Y, ink, width, dash) {
  ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.lineJoin = "round";
  ctx.beginPath();
  let pen = false, prevDay = null;
  for (let i = first; i <= last; i++) {
    const v = arr[i], day = etParts(S.bars[i].t).day;
    if (!Number.isFinite(v)) { pen = false; continue; }
    if (!pen || day !== prevDay) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v));
    pen = true; prevDay = day;
  }
  ctx.stroke(); ctx.restore();
}
function timeTicks(bars, first, last, X) {
  const out = [];
  if (last <= first) return out;
  const minGap = 88;
  if (TF.daily) {
    let prevMonth = null, lastX = -Infinity;
    for (let i = first; i <= last; i++) {
      const e = etParts(bars[i].t + 12 * 3600000), key = e.year * 12 + e.month;
      if (key !== prevMonth && prevMonth !== null && X(i) - lastX >= minGap) {
        out.push({ x:X(i), text:e.month === 1 ? String(e.year) : MON[e.month - 1], day:e.month === 1 }); lastX = X(i);
      }
      prevMonth = key;
    }
    return out;
  }
  /* times on round New York minutes while a day holds several labels; past that, the dates alone */
  const tfMin = TF.ms / 60000, perPx = tfMin / S.spacing;
  const stepMin = [5, 10, 15, 30, 60, 120, 240].find((m) => m >= minGap * perPx && m >= tfMin) || 0;
  let prevDay = null, lastX = -Infinity;
  for (let i = first; i <= last; i++) {
    const e = etParts(bars[i].t), x = X(i);
    if (e.day !== prevDay) {
      if (prevDay !== null && x - lastX >= minGap * (stepMin ? .6 : 1)) { out.push({ x, text:MON[e.month - 1] + " " + e.date, day:true }); lastX = x; }
      prevDay = e.day; continue;
    }
    if (stepMin && e.min % stepMin === 0 && x - lastX >= minGap) { out.push({ x, text:e.hhmm, day:false }); lastX = x; }
  }
  return out;
}

/* ---- the crosshair: price and time, on its own layer (moving the pointer repaints this layer only) ------------------------ */
/* the bar under the pointer: X(i) = plotW - (right - i) x spacing - spacing / 2, solved for i */
function hoverIndex() {
  const P = S.plot, H = S.hover;
  if (!P || !H) return null;
  const ix = Math.round(P.right - (P.plotW - P.spacing / 2 - H.x) / P.spacing);
  return Number.isFinite(ix) ? Math.max(P.first, Math.min(P.last, ix)) : null;
}
function drawOverlay() {
  const w = area.clientWidth, h = area.clientHeight, dpr = window.devicePixelRatio || 1;
  const ctx = sizeCanvas(ov, w, h, dpr);
  const P = S.plot, H = S.hover;
  S.crosshair = null;
  if (!P || !H || H.x < 0 || H.x > P.plotW || H.y < 0 || H.y > P.plotH) return;
  const ix = hoverIndex(), b = S.bars[ix];
  if (!b) return;
  const x = P.X(ix), y = H.y;
  ctx.save();
  ctx.strokeStyle = COL.dim; ctx.globalAlpha = .62; ctx.lineWidth = .75; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, P.plotH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(P.plotW, Math.round(y) + .5); ctx.stroke();
  ctx.restore();
  /* the price at the pointer, on the axis - to the cent, finer when the axis itself is finer */
  let price = null;
  if (y >= P.padT && y <= P.priceBottom) {
    price = P.yLo + (1 - (y - P.padT) / P.priceH) * (P.yHi - P.yLo);
    const dec = Math.max(2, stepDecimals(niceStep(P.yHi - P.yLo, Math.max(3, Math.round(P.priceH / 34)))) + 1);
    const text = price.toLocaleString("en-US", { minimumFractionDigits:dec, maximumFractionDigits:dec });
    ctx.save(); ctx.fillStyle = "#252538"; ctx.fillRect(P.plotW + 1, Math.round(y - 8), AXIS_W - 1, 16);
    ctx.fillStyle = COL.ink3; ctx.font = "600 10px " + MONO; ctx.textBaseline = "middle"; ctx.fillText(text, P.plotW + 5, y + .5); ctx.restore();
    price = +price.toFixed(dec);
  }
  /* the bar's time, on the time axis */
  const e = etParts(b.t);
  const when = TF.daily ? e.dow + " " + e.date + " " + MON[e.month - 1] + " " + e.year : e.dow + " " + e.date + " " + MON[e.month - 1] + " " + e.hhmm;
  ctx.save(); ctx.font = "600 10px " + MONO;
  const tw = Math.ceil(ctx.measureText(when).width) + 10, tx = Math.max(0, Math.min(P.plotW - tw, x - tw / 2));
  ctx.fillStyle = "#252538"; ctx.fillRect(tx, P.plotH + 1, tw, TIME_H - 1);
  ctx.fillStyle = COL.ink3; ctx.textBaseline = "middle"; ctx.textAlign = "center"; ctx.fillText(when, tx + tw / 2, P.plotH + TIME_H / 2 + 1);
  ctx.restore();
  S.crosshair = { ix, t:b.t, price, when };
}
function readoutHtml(b, ix, hovering) {
  const up = b.c >= b.o, cls = up ? "up" : "down", e = etParts(b.t), narrow = area.clientWidth < 700;
  const when = TF.daily ? e.dow + " " + e.date + " " + MON[e.month - 1] + " " + e.year
    : (narrow ? "" : e.dow + " ") + e.date + " " + MON[e.month - 1] + " " + e.hhmm + (narrow ? "" : " ET");
  const v = (k, val) => '<span class="k">' + k + '</span> <span class="' + cls + '">' + val + "</span> ";
  let html = v("O", fmtPx(b.o)) + v("H", fmtPx(b.h)) + v("L", fmtPx(b.l)) + v("C", fmtPx(b.c)) +
    '<span class="k">V</span> <span>' + fmtVol(b.v) + "</span> " + '<span class="when">' + when + "</span>";
  if (b.forming) html += ' <span class="note">forming</span>';
  else if (!hovering && !narrow) html += ' <span class="k">last completed</span>';
  if (!TF.daily) {
    /* after 16:00 the regular session's VWAP has stopped: its 16:00 value is printed, and says so */
    let a = S.vw930[ix], after = "";
    if (!Number.isFinite(a) && etParts(b.t).min >= 960) {
      for (let j = ix - 1; j >= 0 && etParts(S.bars[j].t).day === etParts(b.t).day; j--) if (Number.isFinite(S.vw930[j])) { a = S.vw930[j]; after = " (16:00)"; break; }
    }
    const c = S.vw400[ix];
    html += "<br>" + '<span class="k">VWAP 09:30</span> <span class="vw">' + fmtVwap(a) + after + "</span> " +
      '<span class="k">VWAP 04:00</span> <span class="vw">' + fmtVwap(c) + "</span>";
  }
  return html;
}
function paintReadout() {
  const box = el("readout");
  const P = S.plot;
  if (!P || !S.bars.length) { box.innerHTML = ""; return; }
  const hovering = !!(S.hover && S.crosshair);
  const ix = hovering ? S.crosshair.ix : S.bars.lastIndexOf(lastCompleted(S.bars));
  const b = S.bars[ix];
  const html = b ? readoutHtml(b, ix, hovering) : "";
  if (box.innerHTML !== html) box.innerHTML = html;
  box.dataset.ix = String(ix);
}

/* ---- the strip: symbol, intervals, clouds, the live price, and the age of the last bar --------------------------------- */
function paintStrip() {
  const sym = el("sym");
  if (sym.tagName !== "INPUT" && !BARE) {
    const input = document.createElement("input"); input.className = "sym"; input.id = "sym"; input.spellcheck = false;
    input.setAttribute("aria-label", "Symbol"); input.addEventListener("keydown", (e) => { if (e.key === "Enter") { setSymbol(input.value); input.blur(); } });
    sym.replaceWith(input);
  }
  const s = el("sym");
  if (s.tagName === "INPUT") { if (document.activeElement !== s) s.value = SYMBOL; } else s.textContent = SYMBOL;
  const tfs = el("tfs");
  if (tfs.childElementCount !== TFS.length) {
    tfs.innerHTML = "";
    for (const x of TFS) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = x.key; b.dataset.tf = x.key;
      b.title = x.key + " bars from the whole tape"; b.addEventListener("click", () => setTf(x.key)); tfs.appendChild(b);
    }
  }
  for (const b of tfs.children) { const on = b.dataset.tf === TF.key; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); }
  const cb = el("cloudsBtn"); cb.classList.toggle("on", CLOUDS_ON); cb.setAttribute("aria-pressed", CLOUDS_ON ? "true" : "false");
  const px = el("px"), q = S.quote;
  if (q) {
    const pct = S.prevClose ? (q.price / S.prevClose - 1) * 100 : null;
    px.textContent = fmtPx(q.price) + (pct == null ? "" : "  " + (pct >= 0 ? "+" : "−") + Math.abs(pct).toFixed(2) + "%");
    px.dataset.day = pct == null ? "" : pct >= 0 ? "up" : "down";
  } else { px.textContent = ""; px.dataset.day = ""; }
  const st = el("state"), now = Date.now(), last = lastCompleted(S.bars);
  const html = stateText(now, last, q, document.body.clientWidth);
  if (st.innerHTML !== html.text) st.innerHTML = html.text;
  st.dataset.late = html.late ? "1" : "0";
}
/* THE AGE OF THE LAST BAR, always on the strip: which bar is the newest completed one and how long ago it closed (the bar
   still forming is the live price's, see LIVE). Narrow slots keep the age and drop the words around it. */
function stateText(now, last, q, width) {
  if (S.loading) return { text:"loading", late:false };
  if (!last) return { text:S.error ? "no bars" : "", late:false };
  const e = etParts(last.t), open = inSession(now);
  const label = TF.daily ? e.date + " " + MON[e.month - 1] : e.hhmm;
  const age = TF.daily ? null : now - (last.t + TF.ms);
  const late = !TF.daily && open && age > TF.ms + 90000;
  const head = open ? "<b>live</b>" : "<b>closed</b>";
  if (width < 640) return { text:head + " · bar " + label + (age == null ? "" : " · " + ageText(age)), late };
  let text = head + (width >= 900 ? " · whole tape" : "") + " · last bar " + label + (age == null ? "" : " · closed " + ageText(age) + " ago");
  if (width >= 900 && q && Number.isFinite(q.at)) text += " · price " + ageText(now - q.at) + " old";
  return { text, late };
}
function showMsg(text) { const m = el("msg"); if (text) { m.textContent = text; m.hidden = false; } else m.hidden = true; }

/* ---- changes ------------------------------------------------------------------------------------------------------------ */
function tell() {
  if (window.parent === window) return;
  /* NOT tv-v1's SCINTILLA_TV_STATE: the WIDGETS deck re-points a slot to the TradingView shell when it hears that one.
     The same fields, its own name, for the coordinator to wire; the interval in tv-v1's codes so one memory serves both. */
  try { parent.postMessage({ type:"SCINTILLA_LIVE_STATE", n:N, ticker:SYMBOL, interval:TF.tv, tf:TF.key }, location.origin); } catch (_) {}
}
function keepAddress() {
  if (BARE || window.parent !== window) return;
  const q = new URLSearchParams(location.search); q.delete("t"); q.set("symbol", SYMBOL); q.set("tf", TF.key);
  try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (_) {}
}
function setSymbol(value) {
  const t = CLEAN(value); if (!t || t === SYMBOL) { paintStrip(); return; }
  SYMBOL = t; document.title = "Station · " + SYMBOL + " · " + TF.key + " · live"; keepAddress(); tell(); loadAll();
}
function setTf(value) {
  const next = tfOf(value); if (next === TF) return;
  TF = next; S.spacing = TF.daily ? 6 : 7; document.title = "Station · " + SYMBOL + " · " + TF.key + " · live"; keepAddress(); tell(); loadAll();
}
function setClouds(on) {
  const next = !!on; if (next === CLOUDS_ON) return;
  CLOUDS_ON = next;
  if (!BARE) { try { localStorage.setItem(CLOUD_STATE_KEY, CLOUDS_ON ? "1" : "0"); } catch (_) {} }
  if (CLOUDS_ON) readClouds();
  S.cloudMap = null; paintStrip(); draw();
}
el("cloudsBtn").addEventListener("click", () => setClouds(!CLOUDS_ON));
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  const d = e.data;
  if (d.sc === "chart") {
    if (typeof d.clouds === "boolean") setClouds(d.clouds);
    if (typeof d.steps === "boolean") { CLOUD_STEPS = d.steps; draw(); }
    if (d.ticker) setSymbol(d.ticker);
    return;
  }
  if (d.type === "SCINTILLA_TV_INTERVAL" || d.type === "SCINTILLA_LIVE_INTERVAL") setTf(d.interval);
});

/* ---- the pointer: crosshair, wheel to zoom, drag to pan, double-click back to now ----------------------------------------- */
function local(e) { const r = area.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
let drag = null;
area.addEventListener("pointermove", (e) => {
  const p = local(e);
  if (drag && S.plot) {
    const dx = p.x - drag.x;
    if (Math.abs(dx) > 2) area.classList.add("panning");
    S.viewRight = Math.min(S.plot.edge, Math.max(10, drag.right - dx / S.spacing));
    if (S.viewRight >= S.plot.edge - .01) S.viewRight = null;
    S.hover = p; draw(); return;
  }
  S.hover = p; drawOverlay(); paintReadout();
});
area.addEventListener("pointerleave", () => { S.hover = null; drawOverlay(); paintReadout(); });
area.addEventListener("pointerdown", (e) => {
  if (!S.plot) return;
  drag = { x:local(e).x, right:S.viewRight == null ? S.plot.edge : S.viewRight };
  try { area.setPointerCapture(e.pointerId); } catch (_) {}
});
const endDrag = () => { drag = null; area.classList.remove("panning"); };
area.addEventListener("pointerup", endDrag); area.addEventListener("pointercancel", endDrag);
area.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!S.plot) return;
  const before = S.spacing;
  S.spacing = Math.max(2, Math.min(40, S.spacing * Math.exp(-e.deltaY * .0015)));
  if (S.viewRight != null) {
    /* keep the bar under the pointer where it is */
    const p = local(e), atPointer = S.viewRight - (S.plot.plotW - p.x) / before;
    S.viewRight = atPointer + (S.plot.plotW - p.x) / S.spacing;
  }
  draw();
}, { passive:false });
area.addEventListener("dblclick", () => { S.viewRight = null; S.spacing = TF.daily ? 6 : 7; draw(); });
addEventListener("resize", () => draw());
/* the deck cannot see a pointer inside a frame: say, once a second at most, that this pane is in use (chart-v1's message) */
(function reportStationActivity() {
  if (window.parent === window) return;
  let last = 0;
  const send = () => { const now = Date.now(); if (now - last < 1000) return; last = now;
    try { window.parent.postMessage({ sc:"station-activity", pane:"live-v1-" + N, at:now }, location.origin); } catch (_) {} };
  for (const ev of ["pointermove", "pointerdown", "wheel", "keydown"]) addEventListener(ev, send, { passive:true, capture:true });
})();

/* A proof can read what the pane holds and shows; nothing here changes it. */
window.SC_LIVE = Object.freeze({
  snapshot: () => ({ symbol:SYMBOL, tf:TF.key, n:N, bare:BARE, clouds:CLOUDS_ON, loading:S.loading, error:S.error,
    bars:S.bars.map((b) => Object.assign({}, b)), quote:S.quote && Object.assign({}, S.quote), prevClose:S.prevClose,
    vw930:S.vw930.slice(), vw400:S.vw400.slice(), tags:(S.tags || []).slice(), cloudLabels:S.cloudLabels || null,
    cloudRows:S.cloudRows ? S.cloudRows.length : 0, forming:formingNow(), plot:S.plot && { first:S.plot.first, last:S.plot.last,
      right:S.plot.right, spacing:S.plot.spacing, plotW:S.plot.plotW, plotH:S.plot.plotH, yLo:S.plot.yLo, yHi:S.plot.yHi },
    readout:el("readout").textContent, readoutIx:+el("readout").dataset.ix, state:el("state").textContent,
    crosshair:S.crosshair || null, nextRead:S.nextRead || null, log:S.log.slice() }),
  xOf: (i) => S.plot ? S.plot.X(i) : null,
  POLL
});

document.title = "Station · " + SYMBOL + " · " + TF.key + " · live";
paintStrip(); tell(); loadAll();
</script>
