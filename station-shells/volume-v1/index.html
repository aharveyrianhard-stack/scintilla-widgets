<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · volume</title>
<!-- W1C (22 Oct 2026). Alan: "the widget for my volume, like you're just throwing it like that. No … check the session that made it, the
     .com bubble analysis session … that's just a little bubble. That format right there is perfect for my PIP, but I already have that. I
     want something that's good for this area … resize the volume so that the line chart is actually a graph … it even had different colors."
     THIS SHELL is the volume graph of his research session's page (volume-pulse: https://volume-pulse-pied.vercel.app/), drawn the same
     way from the same public feed (/api/heartbeat, CORS open): the combined SPY + QQQ + DIA + IWM volume per 5-minute bar today as a
     multiple of the usual for that time of day, 04:00–20:00; the line blue under the warm level (1.5×), amber to 2×, hot orange over it;
     the "normal" and "2×" lines; the block dots on their lane (green = the bar closed up, red = down, size = the bar's volume); the beating
     dot on the last full bar; the dashed "now" ring on the forming bar while the market is open. A compact head for a column: the current
     multiple big, the four lights small (Volume · Direction · VWAP · Last hour, the page's own rules at its default thresholds 1.2× and
     1.5×), TRADE SIZE and the last BLOCK with its side, BUY / SELL % of the last minutes. Refresh every 8 s while a session is open, every
     2 minutes closed. Reads one public GET; writes nothing. The pill meter stays his PiP. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --hair:#2A2A3C; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --mute:#6E6E80; --dim:#55556A;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  /* the research session's own colours (meter.js): the line blue, warm amber, hot orange, the dot, the tube */
  --glow:#3987e5; --warm:#fab219; --hot:#ec835a; --up:#19b419; --dn:#e05252; --tube:#1d1d1b; --tubeb:#33332f; }
/* W7 (22 Oct, Alan): "I just don't like how you're organizing the volume thing … slim down the volume thing … the current multiple with one pulsing
   dot and a thermometer … 2 minute and 5 minute … the buttons above VWAP direction are still like tiny". One column, read from a TV: the NOW row
   (the dot, the multiple, the tube), the two labelled halves (2-MIN FLOW: who is in control; 5-MIN: does it sustain), two big badges, trade size
   and the block, the 5-minute close countdown. One pulsing thing on the panel - the dot. No graph. */
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; gap:6px; padding:8px 10px; box-sizing:border-box; }
.row{ display:flex; align-items:center; gap:10px; }
.k{ font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
#now{ gap:12px; }
#dot{ width:16px; height:16px; border-radius:50%; background:var(--glow); box-shadow:0 0 10px var(--glow); animation:vmpulse var(--b,1.6s) ease-out infinite; flex:none; }
body.warm #dot{ background:var(--warm); box-shadow:0 0 12px var(--warm); } body.hot #dot{ background:var(--hot); box-shadow:0 0 16px var(--hot); } body.shut #dot{ animation:none; background:#55554f; box-shadow:none; }
@keyframes vmpulse{ 0%{ transform:scale(1); opacity:1; } 60%{ transform:scale(1.9); opacity:.25; } 100%{ transform:scale(1); opacity:1; } }
#num{ font-size:46px; font-weight:800; letter-spacing:-.03em; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; }
body.warm #num{ color:var(--warm); } body.hot #num{ color:var(--hot); }
#tube{ position:relative; width:12px; height:46px; border-radius:6px; background:var(--tube); border:1px solid var(--tubeb); overflow:hidden; flex:none; }
#fill{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(var(--hot), var(--warm) 45%, var(--glow)); transition:height .8s; height:0; }
.tick{ position:absolute; left:0; right:0; height:1px; background:#8c8b83; opacity:.7; }
#of{ color:var(--ink3); font-size:10px; line-height:1.3; } #of b{ color:var(--ink2); font-weight:600; font-variant-numeric:tabular-nums; }
#of .st{ color:var(--mute); font-size:8px; letter-spacing:.14em; text-transform:uppercase; }
#halves{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.half{ background:var(--panel2); border:1px solid var(--line); padding:6px 8px; display:flex; flex-direction:column; gap:3px; min-width:0; }
.half .k{ display:flex; justify-content:space-between; } .half .k em{ font-style:normal; color:var(--dim); letter-spacing:.04em; }
.half .big{ font-size:30px; font-weight:800; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.half .big .up{ color:var(--bull); } .half .big .dn{ color:var(--bear); } .half .big small{ font-size:10px; font-weight:600; color:var(--ink3); letter-spacing:.08em; }
.half .sub{ font-size:9px; color:var(--ink3); letter-spacing:.04em; }
#five .big b{ color:var(--ink); } body.warm #five .big b{ color:var(--warm); } body.hot #five .big b{ color:var(--hot); }
#badges{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.badge{ display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--hair); background:var(--panel2); font-size:14px; font-weight:700; letter-spacing:.06em; color:var(--mute); text-transform:uppercase; min-width:0; }
.badge i{ width:12px; height:12px; border-radius:50%; background:#3a3a37; flex:none; }
.badge.green{ color:var(--ink); border-color:rgba(25,180,25,.7); } .badge.green i{ background:var(--up); box-shadow:0 0 12px var(--up); }
.badge.red{ color:var(--ink); border-color:rgba(224,82,82,.7); } .badge.red i{ background:var(--dn); box-shadow:0 0 12px var(--dn); }
.badge.amber{ color:var(--ink); border-color:rgba(250,178,25,.7); } .badge.amber i{ background:var(--warm); box-shadow:0 0 12px var(--warm); }
.badge span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#size{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
#size .cell{ display:flex; flex-direction:column; gap:2px; min-width:0; } #size .v{ font-size:20px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#size .v small{ font-size:10px; font-weight:600; margin-left:5px; color:var(--ink3); } #size .v .up{ color:var(--bull); } #size .v .dn{ color:var(--bear); }
#count{ margin-top:auto; display:flex; align-items:baseline; gap:10px; }
#count .mmss{ font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1; color:var(--ink2); font-variant-numeric:tabular-nums; }
#count.flash .mmss{ animation:closeflash 1.2s ease-out 1; }
@keyframes closeflash{ 0%{ color:var(--crk); text-shadow:0 0 22px rgba(0,212,255,.9); } 100%{ color:var(--ink2); text-shadow:none; } }
#msg{ color:var(--mute); font-size:9px; } #msg:empty{ display:none; }
body.narrow{ gap:4px; padding:6px 8px; } body.narrow #num{ font-size:30px; } body.narrow .half .big{ font-size:20px; } body.narrow .badge{ font-size:11px; padding:5px 7px; } body.narrow #size .v{ font-size:15px; } body.narrow #count .mmss{ font-size:22px; } body.narrow #halves, body.narrow #badges, body.narrow #size{ grid-template-columns:1fr; }
@media (prefers-reduced-motion: reduce){ #dot{ animation:none; } #count.flash .mmss{ animation:none; } }
</style>
</head>
<body>
<div class="row" id="now"><span id="dot"></span><span id="num" aria-live="polite">—</span><span id="tube"><span id="fill"></span><span class="tick" style="bottom:33%"></span><span class="tick" style="bottom:66%"></span></span><span id="of">of a usual 5 minutes<br>—<br><span class="st" id="state">loading</span></span></div>
<div id="halves">
  <div class="half" id="two"><span class="k">2-min flow<em>who is in control now</em></span><span class="big"><span class="up" id="buy">—</span><small>buy</small><span class="dn" id="sell">—</span><small>sell</small></span><span class="sub" id="twoSub"></span></div>
  <div class="half" id="five"><span class="k">5-min multiple<em>does it sustain</em></span><span class="big"><b id="fiveX">—</b><small>of usual</small></span><span class="sub" id="fiveSub"></span></div>
</div>
<div id="badges"><span class="badge" id="bVwap"><i></i><span>VWAP</span></span><span class="badge" id="bDir"><i></i><span>Direction</span></span></div>
<div id="size"><span class="cell"><span class="k">trade size</span><span class="v" id="tsize">—</span></span><span class="cell"><span class="k">last block</span><span class="v" id="block">—</span></span></div>
<div id="count"><span class="mmss" id="mmss">—:——</span><span class="k">to the 5-min close</span></div>
<div id="msg"></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const FEED = "https://volume-pulse-pied.vercel.app/api/heartbeat";
  const OPEN_MS = 8000, CLOSED_MS = 120000, RETRY_MS = 30000;
  const T1 = 1.2, T2 = 1.5;   /* the page's default thresholds: amber at 1.2×, green at 1.5× */
  const fmtVol = (v) => v == null ? "—" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "K" : String(Math.round(v));
  const xx = (r) => r == null ? "—" : r.toFixed(1) + "×";
  const pct = (x) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "%";
  let data = null, timer = null, lastLoadAt = 0;
  function level(r) { return r == null ? "none" : r >= 2 ? "hot" : r >= 1.5 ? "warm" : "calm"; }
  /* the page's four lights, as it computes them (lights() on its index.html), on the market group */
  function lights(bars) {
    const n = bars.length, out = {}; const r = (b) => (b.usual ? b.vol / b.usual : 0);
    if (n < 3) out.vol = { s: "off", label: "Volume", why: "needs 3 finished 5-minute bars" };
    else { const l3 = bars.slice(-3).map(r), mn = Math.min(...l3); const s = mn >= T2 ? "green" : mn >= T1 ? "amber" : "off";
      out.vol = { s, label: "Volume", why: s === "off" ? `no streak: last 3 bars ${l3.map(xx).join(", ")}` : `3 bars in a row at ${xx(mn)}+` }; }
    if (n < 3) out.dir = { s: "off", label: "Direction", why: "needs 3 finished bars" };
    else { const from = n >= 4 ? bars[n - 4].lvl : 1, move = (bars[n - 1].lvl / from - 1) * 100; const volOn = out.vol.s !== "off";
      const s = volOn && move >= 0.15 ? "green" : volOn && move <= -0.15 ? "red" : "off";
      out.dir = { s, label: "Direction " + (move >= 0 ? "↑" : "↓"), why: `price ${move >= 0 ? "up" : "down"} ${Math.abs(move).toFixed(2)}% over the last 3 bars` + (volOn ? "" : ", volume not elevated") }; }
    if (!n) out.vwap = { s: "off", label: "VWAP", why: "no bars yet" };
    else { const l6 = bars.slice(-6), up = l6.filter((b) => b.vw > 0).length, now = bars[n - 1].vw; const s = up === l6.length ? "green" : up === 0 ? "red" : "amber";
      out.vwap = { s, label: s === "red" ? "Below VWAP" : "Above VWAP", why: s === "green" ? `held above VWAP ${l6.length} bars (now ${pct(now)})` : s === "red" ? `below VWAP ${l6.length} bars (now ${pct(now)})` : `crossing VWAP: above in ${up} of ${l6.length} (now ${pct(now)})` }; }
    const lh = bars.filter((b) => b.t >= "15:00");
    if (!lh.length) out.hour = { s: "off", label: "Last hour", why: "lights up from 15:00 ET" };
    else { const vr = lh.reduce((s, b) => s + b.vol, 0) / Math.max(1, lh.reduce((s, b) => s + b.usual, 0)), rp = bars[n - 1].rp;
      const third = rp >= 2 / 3 ? "top" : rp <= 1 / 3 ? "bottom" : "middle";
      const s = third === "top" && vr >= T2 ? "green" : third === "top" && vr >= T1 ? "amber" : third === "bottom" && vr >= T1 ? "red" : "off";
      out.hour = { s, label: "Last hour", why: `since 15:00 volume ${xx(vr)} normal; price in the ${third} third of the day's range` }; }
    return out;
  }
  /* W7: no graph - the panel is the numbers; the only pulsing thing on it is the dot */
  function render() {
    const L = data.latest, F = data.forming, st = data.marketState;
    const useF = data.live && st === "open" && F && F.pace != null;
    const r = useF ? F.pace : L ? L.ratio : null, lv = level(r);
    document.body.classList.toggle("warm", lv === "warm"); document.body.classList.toggle("hot", lv === "hot"); document.body.classList.toggle("shut", !data.live);
    document.body.style.setProperty("--b", Math.max(0.5, Math.min(2.2, 1.7 / Math.max(r || 1, 0.6))) + "s");
    $("num").textContent = r == null ? "—" : r.toFixed(1) + "×";
    $("fill").style.height = (r == null ? 0 : Math.round(Math.min(1, r / 3) * 100)) + "%";   /* the tube: 3× is the top, the ticks at 1× and 2× */
    const now = String(data.nyClock || "").slice(0, 5);
    $("of").innerHTML = `of a usual 5 minutes${useF ? " · forming " + F.t : L ? " · last full bar " + L.t : ""}<br>day <b>${data.dayRatio != null ? data.dayRatio.toFixed(2) + "×" : "—"}</b>${data.peak ? " · peak <b>" + data.peak.t + " " + xx(data.peak.ratio) + "</b>" : ""}<br><span class="st">${st === "open" ? "market open" : st === "pre-market" ? "pre-market" : st === "after-hours" ? "after hours" : "closed"} · ${now} ET</span>`;
    /* the 2-minute flow: who is in control now */
    const flow = data.flow || {};
    $("buy").textContent = flow.buyPct != null ? flow.buyPct + "%" : "—"; $("sell").textContent = flow.sellPct != null ? flow.sellPct + "%" : "—";
    $("twoSub").textContent = (flow.mins ? "last " + flow.mins + " min" : "") + (flow.asOf ? " · as of " + flow.asOf : "") + (flow.buySize ? " · avg buy " + flow.buySize + " sh, sell " + flow.sellSize + " sh" : "");
    /* the 5-minute multiple: does it sustain - the last full bar and the one before it */
    const done = (data.slots || []).filter((x) => x.ratio != null), last = done[done.length - 1], prev = done[done.length - 2];
    $("fiveX").textContent = last ? last.ratio.toFixed(1) + "×" : "—";
    $("fiveSub").textContent = last ? `${last.t} bar · ${fmtVol(last.vol)} vs usual ${fmtVol(last.usual)}` + (prev ? ` · before it ${prev.ratio.toFixed(1)}×` : "") : "";
    /* the badges */
    const Lg = lights((data.signals && data.signals.market) || []);
    const badge = (id, l) => { const e = $(id); e.className = "badge " + (l.s === "off" ? "" : l.s); e.querySelector("span").textContent = l.label; e.title = l.why; };
    badge("bVwap", Lg.vwap); badge("bDir", Lg.dir);
    /* trade size and the block */
    const sz = data.size || {}, nowS = sz.now || sz.last || {}, lastS = sz.last || {}, blk = lastS.block || nowS.block || null;
    const side = (d) => d === "up" ? '<small class="up">▲ up</small>' : d === "down" ? '<small class="dn">▼ down</small>' : "";
    $("tsize").innerHTML = (nowS.x != null ? nowS.x.toFixed(2) + "×" : "—") + side(nowS.dir) + (nowS.t ? `<small>${nowS.t}</small>` : "");
    $("block").innerHTML = blk ? `${blk.sym} ${blk.x != null ? blk.x.toFixed(2) + "×" : ""}` + side(blk.dir) : "—";
  }
  /* the 5-minute candle-close countdown (New York clock), flashing at each close (W4) */
  const NY = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  let lastBoundary = -1;
  function countdown() {
    const p = Object.fromEntries(NY.formatToParts(new Date()).map((x) => [x.type, x.value]));
    const secs = (Number(p.hour) * 60 + Number(p.minute)) * 60 + Number(p.second), left = 300 - (secs % 300), boundary = Math.floor(secs / 300);
    $("mmss").textContent = String(Math.floor(left / 60)) + ":" + String(left % 60).padStart(2, "0");
    if (lastBoundary >= 0 && boundary !== lastBoundary) { const c = $("count"); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); c.dataset.closedAt = p.hour + ":" + p.minute; }
    lastBoundary = boundary;
  }
  countdown(); setInterval(countdown, 1000);
  function msg(t) { $("msg").textContent = t || ""; }
  async function load() {
    clearTimeout(timer); lastLoadAt = Date.now(); let wait = RETRY_MS;
    try {
      const r = await fetch(FEED, { cache: "no-store" }); const j = await r.json();
      if (j.error) msg("the feed did not answer: " + j.error); else { data = j; msg(""); render(); wait = j.marketState === "open" || j.marketState === "pre-market" || j.marketState === "after-hours" ? OPEN_MS : CLOSED_MS; }
    } catch (e) { msg("could not reach volume-pulse — retrying"); }
    timer = setTimeout(load, wait);
  }
  const fit = () => { document.body.classList.toggle("narrow", document.documentElement.clientWidth < 300); };
  new ResizeObserver(fit).observe(document.documentElement);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoadAt > OPEN_MS) load(); });
  load();
})();
</script>
</body>
</html>
