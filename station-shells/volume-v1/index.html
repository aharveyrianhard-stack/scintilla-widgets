<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · volume</title>
<!-- W1C (22 Oct 2026). Alan: "the widget for my volume, like you're just throwing it like that. No … check the session that made it, the
     .com bubble analysis session … that's just a little bubble. That format right there is perfect for my PIP, but I already have that. I
     want something that's good for this area … resize the volume so that the line chart is actually a graph … it even had different colors."
     THIS SHELL is the volume graph of his research session's page (volume-pulse: https://volume-pulse-pied.vercel.app/), drawn the same
     way from the same public feed (/api/heartbeat, CORS open): the combined SPY + QQQ + DIA + IWM volume per 5-minute bar today as a
     multiple of the usual for that time of day, 04:00–20:00; the line blue under the warm level (1.5×), amber to 2×, hot orange over it;
     the "normal" and "2×" lines; the block dots on their lane (green = the bar closed up, red = down, size = the bar's volume); the beating
     dot on the last full bar; the dashed "now" ring on the forming bar while the market is open. A compact head for a column: the current
     multiple big, the four lights small (Volume · Direction · VWAP · Last hour, the page's own rules at its default thresholds 1.2× and
     1.5×), TRADE SIZE and the last BLOCK with its side, BUY / SELL % of the last minutes. Refresh every 8 s while a session is open, every
     2 minutes closed. Reads one public GET; writes nothing. The pill meter stays his PiP. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --hair:#2A2A3C; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --mute:#6E6E80; --dim:#55556A;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  /* the research session's own colours (index.html + meter.js): the line blue, warm amber, hot orange, the dot, the tube, its greys */
  --vline:#3987e5; --glow:#3987e5; --warm:#fab219; --hot:#ec835a; --up:#19b419; --dn:#e05252; --grid:#2a2a28; --vtext:#9a9a94; --tube:#1d1d1b; --tubeb:#33332f; }
/* W10 (23 Oct, Alan): "The volume widgets, you removed the graph now? … I don't like descriptions … what about the lot size?" - the research
   page's own graph is back (its line, its colours, the normal and 2x lines, the block dots, its glowing pulsing dot at NOW), the last two hours
   wide enough to read; above it the numbers, big, with short labels and nothing else: the multiple with the tube, the 5-minute countdown, the
   2-minute BUY / SELL, LOT SIZE with its direction and time, the last BLOCK, and VOLUME · DIRECTION · VWAP · LAST HOUR as badges. */
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; gap:6px; padding:7px 10px 4px; box-sizing:border-box; }
.row{ display:flex; align-items:center; gap:10px; }
.k{ font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
#now{ gap:10px; }
#dot{ width:14px; height:14px; border-radius:50%; background:var(--glow); box-shadow:0 0 10px var(--glow); animation:vmpulse var(--b,1.6s) ease-out infinite; flex:none; }
body.warm #dot{ background:var(--warm); box-shadow:0 0 12px var(--warm); } body.hot #dot{ background:var(--hot); box-shadow:0 0 16px var(--hot); } body.shut #dot{ animation:none; background:#55554f; box-shadow:none; }
@keyframes vmpulse{ 0%{ transform:scale(1); opacity:1; } 60%{ transform:scale(1.9); opacity:.25; } 100%{ transform:scale(1); opacity:1; } }
#num{ font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; }
body.warm #num{ color:var(--warm); } body.hot #num{ color:var(--hot); }
#tube{ position:relative; width:12px; height:40px; border-radius:6px; background:var(--tube); border:1px solid var(--tubeb); overflow:hidden; flex:none; }
#fill{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(var(--hot), var(--warm) 45%, var(--glow)); transition:height .8s; height:0; }
.tick{ position:absolute; left:0; right:0; height:1px; background:#8c8b83; opacity:.7; }
#bar5{ display:flex; flex-direction:column; gap:2px; } #bar5 .k{ font-size:7.5px; } #bar5 b{ font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums; }
#count{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
#count .mmss{ font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1; color:var(--ink2); font-variant-numeric:tabular-nums; }
#count.flash .mmss{ animation:closeflash 1.2s ease-out 1; }
@keyframes closeflash{ 0%{ color:var(--crk); text-shadow:0 0 22px rgba(0,212,255,.9); } 100%{ color:var(--ink2); text-shadow:none; } }
#nums{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.cell{ background:var(--panel2); border:1px solid var(--line); padding:5px 8px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.cell .k{ display:flex; justify-content:space-between; } .cell .k em{ font-style:normal; color:var(--dim); letter-spacing:.06em; }
.cell .big{ font-size:26px; font-weight:800; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:7px; white-space:nowrap; overflow:hidden; }
.cell .big .up{ color:var(--bull); } .cell .big .dn{ color:var(--bear); } .cell .big small{ font-size:9px; font-weight:600; color:var(--ink3); letter-spacing:.1em; }
#badges{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.badge{ display:flex; align-items:center; gap:7px; padding:5px 9px; border:1px solid var(--hair); background:var(--panel2); font-size:14px; font-weight:700; letter-spacing:.06em; color:var(--mute); text-transform:uppercase; min-width:0; }
.badge i{ width:10px; height:10px; border-radius:50%; background:#3a3a37; flex:none; }
.badge.green{ color:var(--ink); border-color:rgba(25,180,25,.7); } .badge.green i{ background:var(--up); box-shadow:0 0 10px var(--up); }
.badge.red{ color:var(--ink); border-color:rgba(224,82,82,.7); } .badge.red i{ background:var(--dn); box-shadow:0 0 10px var(--dn); }
.badge.amber{ color:var(--ink); border-color:rgba(250,178,25,.7); } .badge.amber i{ background:var(--warm); box-shadow:0 0 10px var(--warm); }
.badge span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#chart{ position:relative; flex:1 1 0; min-height:120px; margin:2px 2px 0; }
#chart svg{ position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible; }
.beat-ring{ transform-box:fill-box; transform-origin:center; animation:ring var(--beat,1.6s) ease-out infinite; }
@keyframes ring{ 0%{ transform:scale(1); opacity:.9; } 100%{ transform:scale(var(--spread,2.6)); opacity:0; } }
.beat-core{ transform-box:fill-box; transform-origin:center; animation:thump var(--beat,1.6s) ease-in-out infinite; }
@keyframes thump{ 0%,100%{ transform:scale(1); } 12%{ transform:scale(1.35); } 24%{ transform:scale(1); } 36%{ transform:scale(1.18); } 50%{ transform:scale(1); } }
.tip{ position:absolute; transform:translate(-50%,-120%); background:#1c1c1b; border:1px solid #333330; border-radius:6px; padding:4px 8px; font-size:10px; white-space:nowrap; pointer-events:none; display:none; color:var(--ink); z-index:2; }
.tip span{ color:var(--vtext); }
#msg{ color:var(--mute); font-size:9px; } #msg:empty{ display:none; }
body.narrow{ gap:4px; padding:6px 8px; } body.narrow #num{ font-size:28px; } body.narrow .cell .big{ font-size:18px; } body.narrow .badge{ font-size:10px; padding:4px 7px; } body.narrow #count .mmss{ font-size:20px; } body.narrow #nums, body.narrow #badges{ grid-template-columns:1fr; }
@media (prefers-reduced-motion: reduce){ #dot, .beat-ring, .beat-core{ animation:none; } #count.flash .mmss{ animation:none; } }
</style>
</head>
<body>
<div class="row" id="now"><span id="dot"></span><span id="num" aria-live="polite">—</span><span id="tube"><span id="fill"></span><span class="tick" style="bottom:33%"></span><span class="tick" style="bottom:66%"></span></span><span id="bar5"><span class="k" id="barLab">5 min</span><b id="barVal">—</b><span class="k" id="state">loading</span></span><span id="count"><span class="mmss" id="mmss">—:——</span><span class="k">close</span></span></div>
<div id="nums">
  <div class="cell"><span class="k">2 min<em id="flowAt"></em></span><span class="big"><span class="up" id="buy">—</span><small>buy</small><span class="dn" id="sell">—</span><small>sell</small></span></div>
  <div class="cell"><span class="k">lot size<em id="sizeAt"></em></span><span class="big" id="tsize">—</span></div>
  <div class="cell"><span class="k">block<em id="blockAt"></em></span><span class="big" id="block">—</span></div>
  <div class="cell"><span class="k">day<em>peak</em></span><span class="big" id="dayX">—</span></div>
</div>
<div id="badges"><span class="badge" id="bVol"><i></i><span>Volume</span></span><span class="badge" id="bDir"><i></i><span>Direction</span></span><span class="badge" id="bVwap"><i></i><span>VWAP</span></span><span class="badge" id="bHour"><i></i><span>Last hour</span></span></div>
<div id="chart"><div class="tip" id="tip"></div></div>
<div id="msg"></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const FEED = "https://volume-pulse-pied.vercel.app/api/heartbeat";
  const OPEN_MS = 8000, CLOSED_MS = 120000, RETRY_MS = 30000;
  const T1 = 1.2, T2 = 1.5;   /* the page's default thresholds: amber at 1.2×, green at 1.5× */
  const fmtVol = (v) => v == null ? "—" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "K" : String(Math.round(v));
  const xx = (r) => r == null ? "—" : r.toFixed(1) + "×";
  const pct = (x) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "%";
  let data = null, timer = null, lastLoadAt = 0;
  function level(r) { return r == null ? "none" : r >= 2 ? "hot" : r >= 1.5 ? "warm" : "calm"; }
  /* the page's four lights, as it computes them (lights() on its index.html), on the market group */
  function lights(bars) {
    const n = bars.length, out = {}; const r = (b) => (b.usual ? b.vol / b.usual : 0);
    if (n < 3) out.vol = { s: "off", label: "Volume", why: "needs 3 finished 5-minute bars" };
    else { const l3 = bars.slice(-3).map(r), mn = Math.min(...l3); const s = mn >= T2 ? "green" : mn >= T1 ? "amber" : "off";
      out.vol = { s, label: "Volume", why: s === "off" ? `no streak: last 3 bars ${l3.map(xx).join(", ")}` : `3 bars in a row at ${xx(mn)}+` }; }
    if (n < 3) out.dir = { s: "off", label: "Direction", why: "needs 3 finished bars" };
    else { const from = n >= 4 ? bars[n - 4].lvl : 1, move = (bars[n - 1].lvl / from - 1) * 100; const volOn = out.vol.s !== "off";
      const s = volOn && move >= 0.15 ? "green" : volOn && move <= -0.15 ? "red" : "off";
      out.dir = { s, label: "Direction " + (move >= 0 ? "↑" : "↓"), why: `price ${move >= 0 ? "up" : "down"} ${Math.abs(move).toFixed(2)}% over the last 3 bars` + (volOn ? "" : ", volume not elevated") }; }
    if (!n) out.vwap = { s: "off", label: "VWAP", why: "no bars yet" };
    else { const l6 = bars.slice(-6), up = l6.filter((b) => b.vw > 0).length, now = bars[n - 1].vw; const s = up === l6.length ? "green" : up === 0 ? "red" : "amber";
      out.vwap = { s, label: s === "red" ? "Below VWAP" : "Above VWAP", why: s === "green" ? `held above VWAP ${l6.length} bars (now ${pct(now)})` : s === "red" ? `below VWAP ${l6.length} bars (now ${pct(now)})` : `crossing VWAP: above in ${up} of ${l6.length} (now ${pct(now)})` }; }
    const lh = bars.filter((b) => b.t >= "15:00");
    if (!lh.length) out.hour = { s: "off", label: "Last hour", why: "lights up from 15:00 ET" };
    else { const vr = lh.reduce((s, b) => s + b.vol, 0) / Math.max(1, lh.reduce((s, b) => s + b.usual, 0)), rp = bars[n - 1].rp;
      const third = rp >= 2 / 3 ? "top" : rp <= 1 / 3 ? "bottom" : "middle";
      const s = third === "top" && vr >= T2 ? "green" : third === "top" && vr >= T1 ? "amber" : third === "bottom" && vr >= T1 ? "red" : "off";
      out.hour = { s, label: "Last hour", why: `since 15:00 volume ${xx(vr)} normal; price in the ${third} third of the day's range` }; }
    return out;
  }
  /* W10: the research page's graph, the last two hours (24 traded slots), its line under the heat gradient, the normal and 2x lines, the block
     dots on their lane, and its glowing pulsing dot at NOW - the one pulsing thing besides the meter's dot */
  function draw() {
    const box = $("chart"), W = box.clientWidth, H = box.clientHeight;
    box.querySelectorAll("svg").forEach((s) => s.remove());
    if (!data || !W || !H) return;
    const all = data.slots.map((s, i) => ({ ...s, i })).filter((s) => s.ratio != null);
    const slots = all.slice(-24), n = slots.length; if (n < 2) return;
    const done = slots.map((s, i) => ({ ...s, i }));
    const maxR = Math.max(2.5, ...done.map((s) => s.ratio)) * 1.08;
    const B = (data.blocks && data.blocks.items) || [];
    const narrow = W < 420;
    const padL = 4, padR = narrow ? 34 : 44, padT = 14, padB = narrow ? 40 : 46;
    const laneY = H - (narrow ? 26 : 30);
    const x = (i) => padL + (i / (n - 1)) * (W - padL - padR);
    const y = (r) => padT + (1 - r / maxR) * (H - padT - padB);
    const fs = narrow ? 9 : 11;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Combined volume of SPY, QQQ, DIA and IWM per 5-minute bar, the last two hours, as a multiple of normal for that time">`;
    svg += `<defs><linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="${y(0)}" x2="0" y2="${y(maxR)}">
      <stop offset="0" stop-color="var(--vline)"/><stop offset="${(1.45 / maxR).toFixed(4)}" stop-color="var(--vline)"/>
      <stop offset="${(1.55 / maxR).toFixed(4)}" stop-color="var(--warm)"/><stop offset="${(1.95 / maxR).toFixed(4)}" stop-color="var(--warm)"/>
      <stop offset="${(2.05 / maxR).toFixed(4)}" stop-color="var(--hot)"/><stop offset="1" stop-color="var(--hot)"/></linearGradient>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3987e5" stop-opacity=".22"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></linearGradient></defs>`;
    for (const [r, label, dash, col] of [[2, "2×", "2 6", "var(--grid)"], [1, "normal", "6 6", "#4a4a46"]]) {
      svg += `<line x1="${padL}" x2="${W - padR}" y1="${y(r)}" y2="${y(r)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="${dash}"/>`;
      svg += `<text x="${W - padR + 5}" y="${y(r) + 4}" fill="var(--vtext)" font-size="${fs}">${label}</text>`;
    }
    const first = slots[0].t, slotOf = (t) => (Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5)) - (Number(first.slice(0, 2)) * 60 + Number(first.slice(3, 5)))) / 5;
    const maxBV = Math.max(1, ...B.map((b) => b.v)); const stack = {};
    svg += `<line x1="${padL}" x2="${W - padR}" y1="${laneY}" y2="${laneY}" stroke="var(--grid)" stroke-width="1"/>`;
    svg += `<text x="${W - padR + 5}" y="${laneY + 3}" fill="var(--vtext)" font-size="${fs - 1}">blocks</text>`;
    for (const b of B) { const i = Math.floor(slotOf(b.t)); if (i < 0 || i > n - 1) continue; const k = (stack[i] = (stack[i] || 0) + 1) - 1;
      const rr = (narrow ? 2 : 3) + (narrow ? 5 : 7) * Math.sqrt(b.v / maxBV), col = b.dir === "up" ? "var(--up)" : "var(--dn)";
      svg += `<circle cx="${x(slotOf(b.t)).toFixed(1)}" cy="${(laneY - k * 6).toFixed(1)}" r="${rr.toFixed(1)}" fill="${col}" fill-opacity=".8" stroke="#0a0a0f" stroke-width="1"/>`; }
    slots.forEach((s, i) => { if (i % (narrow ? 6 : 3) === 0) svg += `<text x="${x(i)}" y="${H - 4}" fill="var(--vtext)" font-size="${fs}" text-anchor="${i === 0 ? "start" : "middle"}">${s.t.replace(/^0/, "")}</text>`; });
    const pts = done.map((s) => `${x(s.i).toFixed(1)},${y(s.ratio).toFixed(1)}`);
    svg += `<polygon points="${x(0).toFixed(1)},${y(0)} ${pts.join(" ")} ${x(n - 1).toFixed(1)},${y(0)}" fill="url(#fill)"/>`;
    svg += `<polyline points="${pts.join(" ")}" fill="none" stroke="url(#heat)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const L = done[n - 1], r = L.ratio, lv = level(r);
    const col = lv === "hot" ? "var(--hot)" : lv === "warm" ? "var(--warm)" : "var(--glow)";
    const core = Math.max(5, Math.min(13, 5 + (r - 0.8) * 5)), beat = Math.max(0.55, Math.min(2.2, 1.7 / Math.max(r, 0.6))), spread = Math.max(1.8, Math.min(4.5, 1.6 + r * 1.2));
    if (data.live) svg += `<circle class="beat-ring" cx="${x(n - 1)}" cy="${y(r)}" r="${core}" fill="none" stroke="${col}" stroke-width="2" style="--beat:${beat}s;--spread:${spread}"/>`;
    svg += `<circle class="${data.live ? "beat-core" : ""}" cx="${x(n - 1)}" cy="${y(r)}" r="${core}" fill="${col}" style="--beat:${beat}s;filter:drop-shadow(0 0 ${(5 + r * 7).toFixed(0)}px ${col})"/>`;
    const F = data.forming;
    if (data.live && data.marketState === "open" && F && F.pace != null) { const fi = Math.min(n, Math.max(0, slotOf(F.t))), fl = level(F.pace), fc = fl === "hot" ? "var(--hot)" : fl === "warm" ? "var(--warm)" : "var(--glow)";
      svg += `<circle cx="${x(fi)}" cy="${y(Math.min(F.pace, maxR))}" r="6" fill="none" stroke="${fc}" stroke-width="2" stroke-dasharray="3 3"/><text x="${x(fi)}" y="${y(Math.min(F.pace, maxR)) - 10}" fill="${fc}" font-size="${fs - 1}" text-anchor="middle">now</text>`; }
    svg += `<line id="xh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="#55554f" stroke-width="1" visibility="hidden"/></svg>`;
    box.insertAdjacentHTML("afterbegin", svg);
    const s = box.querySelector("svg"), xh = s.querySelector("#xh"), tip = $("tip");
    const show = (ev) => { const rect = box.getBoundingClientRect(), px = ev.clientX - rect.left; const i = Math.max(0, Math.min(n - 1, Math.round(((px - padL) / (W - padL - padR)) * (n - 1)))), sl = slots[i]; if (!sl) return;
      const cx = x(i); xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("visibility", "visible"); tip.style.display = "block"; tip.style.left = Math.max(70, Math.min(W - 70, cx)) + "px"; tip.style.top = y(sl.ratio) + "px";
      tip.innerHTML = `${sl.t} · <b>${sl.ratio.toFixed(2)}×</b> <span>· ${fmtVol(sl.vol)} vs usual ${fmtVol(sl.usual)}</span>`; };
    box.onpointermove = show; box.onpointerdown = show; box.onpointerleave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  }
  /* the last trade size the feed carried - out of hours the feed drops it, so the last one seen is kept here, with its time (never a bare dash) */
  let LAST_SIZE = null;
  function render() {
    const L = data.latest, F = data.forming, st = data.marketState;
    const useF = data.live && st === "open" && F && F.pace != null;
    const r = useF ? F.pace : L ? L.ratio : null, lv = level(r);
    document.body.classList.toggle("warm", lv === "warm"); document.body.classList.toggle("hot", lv === "hot"); document.body.classList.toggle("shut", !data.live);
    document.body.style.setProperty("--b", Math.max(0.5, Math.min(2.2, 1.7 / Math.max(r || 1, 0.6))) + "s");
    $("num").textContent = r == null ? "—" : r.toFixed(1) + "×";
    $("fill").style.height = (r == null ? 0 : Math.round(Math.min(1, r / 3) * 100)) + "%";
    $("barLab").textContent = useF ? "now " + F.t : L ? "bar " + L.t : "5 min"; $("barVal").textContent = L ? L.ratio.toFixed(1) + "× · " + fmtVol(L.vol) : "—";
    $("state").textContent = (st === "open" ? "open" : st === "pre-market" ? "pre-market" : st === "after-hours" ? "after hours" : "closed") + " · " + String(data.nyClock || "").slice(0, 5);
    const flow = data.flow || {};
    $("buy").textContent = flow.buyPct != null ? flow.buyPct + "%" : "—"; $("sell").textContent = flow.sellPct != null ? flow.sellPct + "%" : "—"; $("flowAt").textContent = flow.asOf || (flow.buyPct == null ? "closed" : "");
    const sz = data.size || {}, nowS = sz.now || sz.last || null;
    if (nowS && nowS.x != null) LAST_SIZE = { x: nowS.x, dir: nowS.dir, t: nowS.t, block: sz.last && sz.last.block || nowS.block || null, day: data.nyDate };
    const side = (d) => d === "up" ? '<small class="up">▲ up</small>' : d === "down" ? '<small class="dn">▼ down</small>' : "";
    const S = LAST_SIZE;
    $("tsize").innerHTML = S ? S.x.toFixed(2) + "×" + side(S.dir) : "—"; $("sizeAt").textContent = S ? (S.t || "") + (nowS ? "" : " · last") : (data.live ? "" : "closed · none in the feed");
    const blk = (sz.last && sz.last.block) || (nowS && nowS.block) || (S && S.block) || null;
    $("block").innerHTML = blk ? `${blk.sym} ${blk.x != null ? blk.x.toFixed(2) + "×" : ""}` + side(blk.dir) : "—"; $("blockAt").textContent = blk && blk.t ? blk.t : "";
    $("dayX").innerHTML = (data.dayRatio != null ? data.dayRatio.toFixed(2) + "×" : "—") + (data.peak ? `<small>${data.peak.t} ${xx(data.peak.ratio)}</small>` : "");
    const Lg = lights((data.signals && data.signals.market) || []);
    const badge = (id, l) => { const e = $(id); e.className = "badge " + (l.s === "off" ? "" : l.s); e.querySelector("span").textContent = l.label; e.title = l.why; };
    badge("bVol", Lg.vol); badge("bDir", Lg.dir); badge("bVwap", Lg.vwap); badge("bHour", Lg.hour);
    draw();
  }
  /* the 5-minute candle-close countdown (New York clock), flashing at each close (W4) */
  const NY = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  let lastBoundary = -1;
  function countdown() {
    const p = Object.fromEntries(NY.formatToParts(new Date()).map((x) => [x.type, x.value]));
    const secs = (Number(p.hour) * 60 + Number(p.minute)) * 60 + Number(p.second), left = 300 - (secs % 300), boundary = Math.floor(secs / 300);
    $("mmss").textContent = String(Math.floor(left / 60)) + ":" + String(left % 60).padStart(2, "0");
    if (lastBoundary >= 0 && boundary !== lastBoundary) { const c = $("count"); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); c.dataset.closedAt = p.hour + ":" + p.minute; }
    lastBoundary = boundary;
  }
  countdown(); setInterval(countdown, 1000);
  function msg(t) { $("msg").textContent = t || ""; }
  async function load() {
    clearTimeout(timer); lastLoadAt = Date.now(); let wait = RETRY_MS;
    try {
      const r = await fetch(FEED, { cache: "no-store" }); const j = await r.json();
      if (j.error) msg("the feed did not answer: " + j.error); else { data = j; msg(""); render(); wait = j.marketState === "open" || j.marketState === "pre-market" || j.marketState === "after-hours" ? OPEN_MS : CLOSED_MS; }
    } catch (e) { msg("could not reach volume-pulse — retrying"); }
    timer = setTimeout(load, wait);
  }
  const fit = () => { document.body.classList.toggle("narrow", document.documentElement.clientWidth < 300); draw(); };
  new ResizeObserver(fit).observe(document.documentElement);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoadAt > OPEN_MS) load(); });
  load();
})();
</script>
</body>
