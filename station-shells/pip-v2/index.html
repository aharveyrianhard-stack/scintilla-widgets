<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SCINTILLA · float</title>
<!-- Y8 (20 Oct) — THE FLOATING PLAYER'S PAGE, v2. The video pane opens a Document Picture-in-Picture window and
     puts THIS page in it (pip-v1, S5, stays as it was for a deck that still opens that one). Why a page at all: a
     YouTube embed placed straight into the blank PiP document has no page address to send, and YouTube refuses it
     ("Error 153 - video player configuration error", S5, measured headless 1 Oct); from here the embed has a real
     Station address, as the pane's own player does.
     What v2 adds: it SAYS the second it is at. The pane reads window.SC_FLOAT.at() (same origin) once a second and
     as the window closes, so the way back resumes the pane's own player where the float left off; SC_FLOAT.ended()
     lets the pane's queue carry on in the window. The player is YouTube's official IFrame player API - the one the
     pane itself loads; if that script cannot load, v1's plain embed plays instead (from the second, silent about it).
     27 Oct, Alan: "it should just play from where I was ... Just go." This window is new to the browser, which holds
     its sound until a click lands in it, so the player waited for ▶. Now, when the sound is held, the picture plays at
     once without it (a silent start is always allowed) and the pane keeps the sound; one click anywhere here brings the
     sound into this window (that click is the gesture the browser asks for) and the pane hands over. SC_FLOAT.muted(),
     .sound(), .follow(second, playing) and .align(second) are how the pane and this page keep to one second.
     Params: ?v=VIDEOID (required) · ?start=SECONDS · ?title=TEXT. Reads nothing, writes nothing. -->
<style>
html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
iframe, #p{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
.msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#868AAA;
  font:600 11px "SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; }
/* over the player only while the sound is held: the first click here is the one the browser asks for */
#tap{ position:absolute; inset:0; z-index:2; cursor:pointer; display:flex; align-items:flex-end; justify-content:center; }
#tap[hidden]{ display:none; }
#tap span{ margin:0 0 8px; padding:3px 8px; border-radius:3px; background:rgba(0,0,0,.62); color:#868AAA;
  font:600 10px "SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; letter-spacing:.06em; }
</style>
</head>
<body>
<div id="p"></div>
<div id="tap" hidden><span>sound is in the Station · click here for it</span></div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var id = qs.get("v") || "", start = Math.max(0, Math.floor(Number(qs.get("start")) || 0));
  if (qs.get("title")) document.title = qs.get("title").slice(0, 120);
  var state = { at: start, state: -1, ended: false, error: 0, api: "loading", blocked: false, played: false, muted: false };
  var player = null, tap = document.getElementById("tap");
  window.SC_FLOAT = {
    id: id,
    /* the second the float is at - once it has played. Until then, the second it was asked to start from: a player
       that is cued but held reports the keyframe before that second (seconds earlier, measured 20 Oct), and handing
       that back would walk the video backwards on every float. */
    at: function () {
      try { var t = Number(state.played && player && player.getCurrentTime && player.getCurrentTime()); if (t > 0) state.at = t; } catch (_) {}
      return state.at;
    },
    ended: function () { return state.ended; },
    /* the browser held the autoplay: the window waits for a click on ▶ (the pane says so) */
    blocked: function () { return state.blocked; },
    /* the picture plays here without its sound (the browser held it): the pane keeps the sound */
    muted: function () { return state.muted; },
    /* this window plays its own sound - a click here, or a browser that let it start. The plain embed cannot say, so
       it counts as having it (the pane then stops, as before) */
    sound: function () { return state.api === "plain" || (state.played && !state.muted && state.state === 1); },
    /* while the sound is the pane's: keep to the pane's second and its play/pause. More than 0.6 s apart is a jump,
       0.2 s ahead of it - the seek's own pause brings the picture back onto the sound (measured 27 Oct: the window
       started 0.9 s behind and stayed there under a 1.2 s rule) */
    follow: function (t, playing) {
      if (!player || !state.muted) return false;
      try {
        if (playing === false) { if (state.state === 1) player.pauseVideo(); return true; }
        if (state.state === 2 || state.state === 5 || state.state === -1) player.playVideo();
        var now = Number(player.getCurrentTime()) || 0, want = Number(t);
        if (state.played && state.state === 1 && want > 0 && Math.abs(now - want) > 0.6) player.seekTo(want + 0.2, true);
      } catch (_) {}
      return true;
    },
    /* the moment the sound moves here: to the second the pane reached, so nothing is heard twice */
    align: function (t) {
      try {
        var now = Number(player && player.getCurrentTime()) || 0, want = Number(t);
        if (player && want > 0 && Math.abs(now - want) > 0.6) player.seekTo(want, true);
      } catch (_) {}
    },
    state: function () { return { at: state.at, state: state.state, ended: state.ended, error: state.error, api: state.api, blocked: state.blocked, muted: state.muted }; }
  };
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) {
    var m = document.createElement("div"); m.className = "msg"; m.textContent = "no video named";
    document.body.appendChild(m); return;
  }
  function plain() {
    if (player || state.api === "plain") return;
    state.api = "plain";
    var f = document.createElement("iframe");
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(id) +
      "?playsinline=1&rel=0&modestbranding=1&autoplay=1&start=" + start +
      "&origin=" + encodeURIComponent(location.origin);
    document.body.appendChild(f);
  }
  /* the browser held the sound: play the picture now, without it, from the same second - never a wait for ▶ */
  function quiet() {
    if (!player || state.muted || state.api !== "official" || state.ended) return;
    state.muted = true;
    try { player.mute(); player.playVideo(); } catch (_) {}
    if (tap) tap.hidden = false;
  }
  if (tap) tap.addEventListener("pointerdown", function () {
    tap.hidden = true; state.muted = false;
    try { player.unMute(); player.playVideo(); } catch (_) {}
  });
  window.onYouTubeIframeAPIReady = function () {
    if (state.api === "plain") return;
    state.api = "official";
    player = new YT.Player("p", {
      width: "100%", height: "100%", videoId: id,
      playerVars: { autoplay: 1, start: start, playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
      events: {
        onReady: function (e) {
          try { e.target.playVideo(); } catch (_) {}
          /* not playing 2.5 s after ready and not loading: held without a word - the same silent start */
          setTimeout(function () { if (!state.played && state.state !== 3) quiet(); }, 2500);
        },
        onStateChange: function (e) { state.state = Number(e.data); if (state.state === 0) state.ended = true; if (state.state === 1) { state.blocked = false; state.played = true; } },
        onAutoplayBlocked: function () { state.blocked = true; quiet(); },
        onError: function (e) { state.error = Number(e.data) || -1; }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api"; s.async = true;
  s.onerror = plain;
  document.head.appendChild(s);
  setTimeout(function () { if (!player) plain(); }, 15000);
})();
</script>
</body>
</html>
