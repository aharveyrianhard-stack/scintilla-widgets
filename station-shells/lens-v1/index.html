<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · context lenses</title>
<!-- W1 (22 Oct 2026). Alan: "I kind of like the context lens ones better … put another set of context lenses somewhere
     that I can select the tickers for those … could we make the set of context lenses be the radar watch list? Maybe
     radar and macro." And of the old tape marks: "very small. I can barely see them."
     THIS SHELL is the lens set of the WIDGETS wall: a chip row - RADAR (station_lists · radar, the Hub's list), MACRO
     (MACRO · DAY's six: VIX DXUSD US10Y GCUSD CLUSD BTCUSD), MINE (his own picks, added and removed here, remembered on
     this machine) - and under it one context lens per name: the ticker, the price, the day's percent, and the OVAL of the
     zoomed-out series (chart-v1's lens drawing, S8's shape, the 1d:60 lens the intraday ranges carry: sixty daily candles),
     drawn big enough to read from the chair. Colours are the Station's: the head and the line in the day's colour, up
     green, down red - never grey. A tap on a lens opens that name in the wall's chart 1 (the deck decides which slot).
     Reads: SC_PROVIDER.marketQuotes every 15 s (the read the charts' badges ride) and marketCandles (1d × 60 every ten
     minutes in the column; 5m × 120 every minute on the tape). The lists: one Supabase GET for RADAR (the same door the deck
     reads through); MACRO is a constant; MINE is localStorage. Nothing here writes anywhere.
     W1C (22 Oct, Alan): "Where you have the ticker tape is where I want a tape of context lenses … a little smaller …
     make it 5 minute charts, the context lenses." ?mode=tape: the chips in a rail at the left, the lenses in ONE ROW that
     runs like the Station's other tapes (one length wider than the window: the track is doubled and moves at 45 px a
     second, the pointer holds it still; shorter: it stands); each lens a fixed 290 px wide; the bars are the last 120
     completed 5-minute bars (ten hours of extended trading - today's session, with yesterday's close behind it early in
     the day), read every minute. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --hair:#2A2A3C; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --mute:#6E6E80; --dim:#55556A;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --warm:#fab219; --hot:#ec835a; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:11px var(--mono); overflow:hidden; }
/* W12 (23 Oct, Alan): "it does not have either I pick radar, either I pick macro … radar and macro are non-negotiable" - both sets are always on
   screen; MINE is a third chip he opens, never the default. "That I can change the time frame of the bars on" - the TF chips (1m 5m 15m 30m 1h 1D,
   remembered, 5m the default). "we should flash things when they are high … unusual day percentages, when [RVol] is high" - one bright pulse
   when it starts, a steady glow while it holds, in words: "2.3× its usual day". */
.chip.fixed{ cursor:default; color:var(--crk); border-color:var(--crk); opacity:.9; }
.chip[data-set="macro"].fixed{ color:var(--warm); border-color:var(--warm); }
#tf{ display:flex; gap:2px; margin-left:6px; } #tf .chip{ padding:2px 6px; font-size:8.5px; letter-spacing:.08em; }
.sethead{ grid-column:1 / -1; padding:7px 12px 3px; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--crk); background:var(--bg); display:flex; gap:8px; align-items:baseline; }
.sethead[data-set="macro"]{ color:var(--warm); } .sethead small{ color:var(--dim); letter-spacing:.06em; }
.setgrp{ display:contents; }   /* the set's lenses follow its head in the grid */
.lens .un{ position:absolute; right:9px; bottom:6px; font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--crk); background:rgba(10,10,15,.85); padding:1px 4px; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; }
.lens .un:empty{ display:none; }
.lens.glow{ box-shadow:inset 0 0 0 1px var(--crk), 0 0 12px rgba(0,212,255,.45); z-index:1; }
.lens.pulse{ animation:scint 1.1s ease-out 1; }
@keyframes scint{ 0%{ box-shadow:inset 0 0 0 2px #fff, 0 0 34px rgba(0,212,255,1); background:#15223a; } 100%{ box-shadow:inset 0 0 0 1px var(--crk), 0 0 12px rgba(0,212,255,.45); } }
.lens.glow .rv.hot i{ box-shadow:0 0 8px var(--hot); }
@media (prefers-reduced-motion: reduce){ .lens.pulse{ animation:none; } }
body{ display:flex; flex-direction:column; }
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:3px 6px; background:var(--panel2); border-bottom:1px solid var(--line); min-height:22px; }
#bar .k{ color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; margin-right:4px; }
.chip{ font:9px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); background:transparent; border:1px solid var(--line); padding:2px 8px; cursor:pointer; border-radius:0; }
.chip:hover{ color:var(--ink); border-color:var(--hair); } .chip.on{ color:var(--crk); border-color:var(--crk); }
.chip small{ color:var(--dim); margin-left:5px; letter-spacing:.04em; }
#add{ display:none; margin-left:4px; width:84px; background:var(--bg); border:1px solid var(--line); color:var(--ink); font:10px var(--mono); padding:2px 6px; outline:none; border-radius:0; text-transform:uppercase; }
#add:focus{ border-color:var(--crk); } body[data-list="mine"] #add{ display:block; }
#note{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
#set{ flex:1 1 0; min-height:0; overflow-y:auto; display:grid; gap:1px; background:var(--line); align-content:start;
  grid-template-columns:repeat(auto-fill, minmax(min(var(--lens-min, 290px), 100%), 1fr)); }
.lens{ position:relative; background:var(--bg); display:flex; flex-direction:column; min-width:0; cursor:pointer; height:var(--lens-h, 150px); }
/* W12: the grid (the phone) shows the tape's cells - the head, the RVol tube, the bars - in a scrolling grid with a set head per set */
body:not(.tape) .lens .rv{ display:flex; align-items:center; gap:6px; margin:4px 12px 0; }
body:not(.tape) .lens .rv i{ display:block; flex:1 1 0; height:7px; border-radius:3px; background:#1d1d1b; border:1px solid #33332f; position:relative; overflow:hidden; }
body:not(.tape) .lens .rv i::before{ content:""; position:absolute; inset:0; z-index:1; opacity:.7; background:linear-gradient(#8c8b83,#8c8b83) 33% 0 / 1px 100% no-repeat, linear-gradient(#8c8b83,#8c8b83) 66% 0 / 1px 100% no-repeat; }
body:not(.tape) .lens .rv i::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--rv, 0%); background:linear-gradient(90deg, #3987e5, #fab219 55%, #ec835a); transition:width .8s; }
body:not(.tape) .lens .rv em{ font-style:normal; font-size:10px; color:var(--ink3); font-variant-numeric:tabular-nums; min-width:28px; text-align:right; } body:not(.tape) .lens .rv.hot em{ color:#ec835a; }
body:not(.tape) .lens .nm{ display:block; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:0 12px; line-height:1.1; } body:not(.tape) .lens .nm:empty{ display:none; }
body:not(.tape) .lens canvas{ margin:3px 12px 8px; width:calc(100% - 24px); }
body:not(.tape) .lens .num{ position:absolute; left:0; right:0; top:50px; bottom:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums; }
body:not(.tape) .lens .num b{ font-size:22px; color:var(--ink); } body:not(.tape) .lens .num small{ color:var(--mute); font-size:8px; letter-spacing:.12em; text-transform:uppercase; }
body.touch .chip{ font-size:11px; padding:7px 12px; } body.touch #tf .chip{ padding:7px 9px; font-size:10.5px; } body.touch #bar{ gap:6px; padding:6px 8px; flex-wrap:wrap; } body.touch #add{ font-size:12px; padding:6px 8px; width:110px; }
body.touch .lens .tk, body.touch .lens .px{ font-size:16px; } body.touch .lens .pc{ font-size:13px; }
.lens:hover{ background:#0D0D15; }
.lens .head{ flex:none; display:flex; align-items:baseline; gap:10px; padding:8px 12px 0; white-space:nowrap; }
.lens .tk{ font-size:15px; letter-spacing:.1em; color:var(--ink); }
.lens .px{ font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums; }
.lens .pc{ font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums; margin-left:auto; }
.lens .pc.up, .lens .tk.up{ color:var(--bull); } .lens .pc.dn, .lens .tk.dn{ color:var(--bear); }
.lens .px.flash{ animation:scin .6s ease-out; }
@keyframes scin{ 0%{ color:var(--crk); text-shadow:0 0 8px rgba(0,212,255,.9); } 100%{ color:var(--ink2); text-shadow:none; } }
.lens canvas{ flex:1 1 0; min-height:0; width:100%; display:block; }
.lens .why{ position:absolute; left:12px; bottom:8px; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }
.lens .why:empty{ display:none; }
.lens .rm{ display:none; position:absolute; right:6px; top:6px; width:18px; height:18px; border:1px solid var(--line); background:var(--bg); color:var(--ink3); font:10px var(--mono); cursor:pointer; padding:0; border-radius:0; }
body[data-list="mine"] .lens .rm{ display:block; } .lens .rm:hover{ color:var(--bear); border-color:var(--bear); } .lens .rm[hidden]{ display:none; }   /* W12: only a MINE lens has the × */
.msg{ grid-column:1 / -1; padding:18px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em; text-transform:uppercase; text-align:center; background:var(--bg); }
/* ---- W1C: the tape ---- */
body.tape{ flex-direction:row; }
body.tape #bar{ flex:none; width:96px; flex-direction:column; align-items:stretch; gap:3px; padding:5px 6px; border-bottom:0; border-right:1px solid var(--line); }
body.tape #bar .k{ margin:0 0 2px; } body.tape #chips{ display:flex; flex-direction:column; gap:3px; } body.tape .chip{ text-align:left; padding:2px 6px; }
body.tape #add{ width:100%; margin:2px 0 0; } body.tape #note{ margin:auto 0 0; white-space:normal; font-size:7px; line-height:1.3; }
body.tape #set{ flex:1 1 0; min-width:0; display:block; overflow:hidden; position:relative; background:var(--bg); }
body.tape .track{ position:absolute; left:0; top:0; height:100%; display:flex; gap:1px; background:var(--line); white-space:nowrap; }
body.tape .track.run{ will-change:transform; animation:lens-tape-move linear infinite; }
body.tape #set:hover .track.run{ animation-play-state:paused; }
@keyframes lens-tape-move{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ body.tape .track.run{ animation:none; } body.tape #set{ overflow-x:auto; scrollbar-width:none; } }
/* W4 (22 Oct, Alan): "Keep it tight, make them smaller, and make them more on screen and faster … I don't see the need of the circle" -
   150 px cells, the head one small line, the tight mini-chart under it (the latest 5-minute bars as a line in the day's colour) */
/* W7 (22 Oct, Alan): "give me a little bit more size in the ticker and the data. Push the lines a little bit further down" - 170 px cells, 12 px
   ticker and price, the RVol battery beside them, the chart under; the tape in ROWS (the deck says how many fit the band), each row its own track */
body.tape #set{ display:flex; flex-direction:column; gap:1px; }
body.tape .trackwin{ position:relative; flex:1 1 0; min-height:0; overflow:hidden; }
body.tape .track{ height:100%; gap:6px; background:var(--bg); }   /* W10: a clear gap between neighbours */
body.tape .lens{ flex:none; width:var(--lens-w, 170px); height:100%; background:var(--panel2); }
body.tape .lens .head{ padding:5px 9px 0; gap:6px; flex-wrap:wrap; row-gap:1px; } body.tape .lens .tk, body.tape .lens .px{ font-size:12px; } body.tape .lens .pc{ font-size:11px; }
/* W10 (Alan: "put it as in the thermometer bar … sideways … on top of the line"): the RVol is the volume panel's tube laid flat, just above the
   chart - the dark tube, its 1x and 2x ticks, the meter's gradient fill to the multiple (3x the end), the multiple beside it */
body.tape .lens .rv{ display:flex; align-items:center; gap:5px; margin:3px 9px 0; }
body.tape .lens .rv i{ display:block; flex:1 1 0; height:6px; border-radius:3px; background:#1d1d1b; border:1px solid #33332f; position:relative; overflow:hidden; }
body.tape .lens .rv i::before{ content:""; position:absolute; inset:0; z-index:1; opacity:.7; background:linear-gradient(#8c8b83,#8c8b83) 33% 0 / 1px 100% no-repeat, linear-gradient(#8c8b83,#8c8b83) 66% 0 / 1px 100% no-repeat; }
body.tape .lens .rv i::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--rv, 0%); background:linear-gradient(90deg, #3987e5, #fab219 55%, #ec835a); transition:width .8s; }
body.tape .lens .rv em{ font-style:normal; font-size:9.5px; color:var(--ink3); font-variant-numeric:tabular-nums; min-width:26px; text-align:right; } body.tape .lens .rv.hot em{ color:#ec835a; }
body.tape .lens .nm{ padding:0 9px; }
/* W15c: the lens wall's wide cells - the ticker and the price 18 px, the percent 16, the multiple 13, the name 10 */
body.tape.bigcells .lens .head{ padding:8px 12px 0; gap:9px; } body.tape.bigcells .lens .tk, body.tape.bigcells .lens .px{ font-size:18px; }
body.tape.bigcells .lens .pc{ font-size:16px; } body.tape.bigcells .lens .rv{ margin:5px 12px 0; } body.tape.bigcells .lens .rv i{ height:8px; }
body.tape.bigcells .lens .rv em{ font-size:13px; min-width:34px; } body.tape.bigcells .lens .nm{ padding:0 12px; font-size:10px; }
/* W15c (Alan: "flashing … if their volume is kind of rising"): RISING - the multiple at 1.2x or more and up 0.1x or more since the last
   minute's read: a green arrow by the multiple and one pulse of the tube (the 2x glow of the one rule is unchanged) */
.lens .rv.rising em::after{ content:" \25B2"; color:var(--bull); }
.lens .rv.rising.pulse i{ animation:rvpulse 1.6s ease-out 1; }
@keyframes rvpulse{ 0%{ box-shadow:0 0 0 0 rgba(0,255,163,.0); } 25%{ box-shadow:0 0 10px 2px rgba(0,255,163,.55); } 100%{ box-shadow:0 0 0 0 rgba(0,255,163,0); } }
/* W10 (Alan: "bring the bars and the chart a little bit tighter into the center"): the chart inset from the cell's sides and foot */
body.tape .lens canvas{ margin:2px 10px 7px; width:calc(100% - 20px); }
body.tape .lens .num{ position:absolute; left:0; right:0; top:46px; bottom:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; }
body.tape .lens .num b{ font-size:20px; color:var(--ink); } body.tape .lens .num small{ color:var(--mute); font-size:8px; letter-spacing:.12em; text-transform:uppercase; }
body.tape #style{ display:flex; gap:2px; margin-top:4px; } body.tape #style .chip{ flex:1; text-align:center; padding:2px 4px; font-size:8px; }
body.tape #tf{ display:flex; flex-wrap:wrap; gap:2px; margin:4px 0 0; } body.tape #tf .chip{ flex:1 1 26%; text-align:center; padding:2px 2px; font-size:7.5px; letter-spacing:.04em; }
/* W12: which set a row carries, at the row's left edge */
body.tape .trackwin::before{ content:attr(data-set); position:absolute; left:0; top:0; z-index:2; font-size:7px; letter-spacing:.14em; text-transform:uppercase; color:var(--crk); background:rgba(10,10,15,.88); padding:1px 5px 1px 4px; pointer-events:none; }
body.tape .trackwin[data-set="macro"]::before{ color:var(--warm); } body.tape .trackwin[data-set="mine"]::before{ color:var(--ink2); } body.tape .trackwin[data-set=""]::before{ display:none; }
body.tape .lens .un{ right:6px; bottom:4px; font-size:7px; }
/* W12B: the phone's lens block is the tape (RADAR and MACRO as two running rows, the wall's look) with the chips on top, touch-sized cells */
body.tape.touch{ flex-direction:column; }
body.tape.touch #bar{ width:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 8px; border-right:0; border-bottom:1px solid var(--line); }
body.tape.touch #chips{ flex-direction:row; gap:6px; } body.tape.touch #bar .k{ font-size:9px; margin:0; }
body.tape.touch #tf{ flex-wrap:nowrap; flex:1 1 100%; margin:0; } body.tape.touch #tf .chip{ flex:1 1 0; font-size:10.5px; padding:7px 4px; letter-spacing:.06em; }
body.tape.touch #style{ margin:0; } body.tape.touch #style .chip{ font-size:9px; padding:7px 8px; } body.tape.touch #add{ width:110px; margin:0; font-size:12px; padding:6px 8px; }
body.tape.touch #note{ display:none; } body.tape.touch:not([data-list="mine"]) #add{ display:none; }   /* the add box only when MINE is open */
body.tape.touch .lens{ width:var(--lens-w, 200px); } body.tape.touch .lens .tk, body.tape.touch .lens .px{ font-size:15px; } body.tape.touch .lens .pc{ font-size:13px; }
body.tape.touch .lens .rv em{ font-size:11px; } body.tape.touch .lens .nm{ font-size:8.5px; } body.tape.touch .lens .un{ font-size:8px; }
/* W12C (Alan on the live phone: "All on one screen. Context lenses take one row"): ONE slim bar - the set chips and the TF chips in one row (the
   counts, the LENSES word, BARS/LINE and the add box drop on the phone); the lenses one running row, RADAR then MACRO, each set's first cell
   marked with its name at the cell's foot (never over the ticker or the price); the row label at the edge is gone there */
body.tape.touch .trackwin::before{ display:none; }
body.tape.touch #bar{ flex-wrap:nowrap; gap:4px; padding:4px 6px; overflow-x:auto; scrollbar-width:none; min-height:0; } body.tape.touch #bar::-webkit-scrollbar{ display:none; }
body.tape.touch #bar .k{ display:none; } body.tape.touch #style{ display:none !important; } body.tape.touch #add{ display:none !important; }
body.tape.touch #chips{ gap:3px; flex:none; } body.tape.touch #chips .chip{ padding:5px 7px; font-size:10px; } body.tape.touch #chips .chip small{ display:none; }
body.tape.touch #tf{ flex:1 1 auto; margin-left:4px; gap:3px; } body.tape.touch #tf .chip{ flex:1 1 0; padding:5px 3px; font-size:9.5px; letter-spacing:.02em; min-width:0; }
body.tape.touch .lens{ width:var(--lens-w, 180px); }
body.tape.touch .lens.setfirst{ border-left:2px solid var(--crk); } body.tape.touch .lens.setfirst[data-set="macro"]{ border-left-color:var(--warm); }
body.tape.touch .lens.setfirst::after{ content:attr(data-set); position:absolute; left:6px; bottom:4px; font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--crk); background:rgba(10,10,15,.88); padding:1px 4px; pointer-events:none; z-index:1; }
body.tape.touch .lens.setfirst[data-set="macro"]::after{ color:var(--warm); }
body.tape.touch .lens .why{ left:auto; right:9px; bottom:14px; }
body.tape .lens .nm{ display:block; color:var(--mute); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; padding:0 6px; line-height:1.1; }
body.tape .lens .nm:empty{ display:none; }
body.tape #add{ display:block; width:100%; margin:4px 0 0; font-size:9px; padding:3px 5px; }
body.tape #add::placeholder{ color:var(--dim); }
body.tape #bar .k{ font-size:7px; }
/* W15b (26 Oct, Alan: "where do I change the time frame? … I don't see an option"): the side column names it and the chips are a size up */
.tfk{ display:none; } body.tape .tfk{ display:block; margin:7px 0 0; }
body.tape #tf .chip{ font-size:9.5px; padding:3px 2px; }
body.tape .msg{ padding:12px; }
</style>
</head>
<body>
<div id="bar"><span class="k">lenses</span><span id="chips" role="group" aria-label="Lens list"></span><input id="add" placeholder="+ ticker · Enter" title="type a ticker and press Enter: it joins MINE (the database list, both Macs)" aria-label="Add a ticker to MINE" maxlength="12"><span class="k tfk">timeframe</span><span id="tf" role="group" aria-label="Bars timeframe"></span><span id="style" role="group" aria-label="Lens style" hidden><button type="button" class="chip" data-style="bars" title="5-minute candles">bars</button><button type="button" class="chip" data-style="line" title="a line of the closes">line</button></span><span id="note"></span></div>
<div id="set" role="list" aria-label="Context lenses"><div class="msg">loading…</div></div>
<script src="/_provider/provider.js"></script>
<script type="module">
import { ovalGeometry, insideOval, INK } from "/_indicators/station-lens.mjs";
import { drawCandles, PALETTE, DIALS } from "/_indicators/lens-bars.mjs";
const el = (id) => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const CLEAN = (t) => String(t || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 12);
/* the lists, the keys, the clocks */
const LIST_KEY = "station.lenses.list", MINE_KEY = "station.lenses.mine";
const LISTS = ["radar", "macro", "mine"];
/* W12: RADAR and MACRO always; MINE a third set he opens (remembered), never the default. The bars' timeframe, remembered, 5m the default. */
const MINE_ON_KEY = "station.lenses.mineOn", TF_KEY = "station.lenses.tf";
const TFS = Object.freeze(["1m", "5m", "15m", "30m", "1h", "1D"]);
const TF_API = Object.freeze({ "1m": "1m", "5m": "5m", "15m": "15m", "30m": "30m", "1h": "1h", "1D": "1d" });
export function tfOf(stored, urlValue) { const u = String(urlValue || "").replace(/^1d$/, "1D"), st = String(stored || "").replace(/^1d$/, "1D"); return TFS.includes(u) ? u : TFS.includes(st) ? st : "5m"; }
export function mineOnOf(stored, urlList) { return urlList === "mine" || stored === "1"; }
/* the unusual: a day move at least twice the name's usual day (the Hub's own usual day, ticker_heartbeat_daily.usual_day_60 - the spread of
   the name's daily % moves over 60 sessions, the number the live charts flash on (W13); coordinator 23 Oct: one rule on every surface), or RVol
   at 2× and over */
export function unusualOf(pct, usual, rvol) {
  const out = [];
  if (pct != null && usual > 0 && Math.abs(pct) >= 2 * usual) out.push((Math.abs(pct) / usual).toFixed(1) + "× its usual day");
  if (rvol != null && rvol >= 2) out.push("rvol " + rvol.toFixed(1) + "×");

      } catch (e) { S.bars.set(t, { absence: String((e && e.message) || "not served").slice(0, 40).toLowerCase(), at: Date.now() }); }

  } finally { S.busyB = false; }
}
let timer = 0, lastCloseRead = 0;
/* W4: the 5-minute close just passed, and the reads due after it (+4 s, then +15 and +30 s while the new bar is not in) */
export function closeDue(nowMs, lastReadMs) {

}
const barsStale = (boundary) => names().some((t) => { const e = S.bars.get(t); return !e || !e.bars || !e.bars.length || e.bars[e.bars.length - 1].t < boundary - 5 * 60000; });
async function tick(now) {
  if (document.hidden && !now) return;
  if (Date.now() - radarAt > LIST_MS) { await readRadar(); paintChips(); paintSet(); }
  if (MINE_ON && Date.now() - mineAt > LIST_MS) { await readMine(); paintChips(); paintSet(); }
  if (now || Date.now() - S.quotesAt > QUOTE_MS) readQuotes();
  if (now || Date.now() - S.rvolAt > RVOL_MS) { readRvol(); readBreadth(); }
  if (now || Date.now() - S.usualAt > USUAL_MS) readUsual();
  if (TAPE) {
    const due = closeDue(Date.now(), lastCloseRead);
    if (due && (due.at === "close" || barsStale(due.boundary))) { lastCloseRead = Date.now(); readBars(true); return; }
  }
  readBars(false);
}
/* for the harness and the strip: what the tape holds */
/* W7: the deck says how many rows its band holds */
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "SCINTILLA_LENS_ROWS") { const r = Math.max(1, Math.min(6, +e.data.rows || 1)); if (r !== ROWS) { ROWS = r; paintSet(true); } return; }
  if (e.data.type === "SCINTILLA_RVOL_WANT") { WANTED = Array.from(new Set((e.data.names || []).map(CLEAN).filter(Boolean))).slice(0, 200); S.rvolAt = 0; readRvol(); readUsual(); }
  if (e.data.type === "SCINTILLA_LENS_TF" && TFS.includes(e.data.tf)) setTf(e.data.tf);
});
window.__lens = { style: () => STYLE, rows: () => ROWS, rvol: () => Object.fromEntries(S.rvol), breadth: () => S.breadth, newest: () => Object.fromEntries([...S.bars].map(([t, e]) => [t, e.bars && e.bars.length ? e.bars[e.bars.length - 1].t : null])), quotes: () => Object.fromEntries([...S.quotes].map(([t, q]) => [t, q.price])), at: () => ({ bars: S.barsAt, quotes: S.quotesAt, lastCloseRead }), list: () => LIST, names, tf: TF_API[TF], bars: LENS_BARS };
/* the lenses re-fit to their box (the deck resizes the pane) */
let raf = 0; const nudge = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; drawAll(); if (TAPE) runTape(); }); };
if (window.ResizeObserver) new ResizeObserver(nudge).observe(document.documentElement);
addEventListener("resize", nudge);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(true); });
paintChips(); paintSet();
(async () => { await Promise.all([readRadar(), readMine()]); paintChips(); paintSet(); tick(true); timer = setInterval(tick, 2000); })();
</script>
