<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · context lenses</title>
<!-- W1 (22 Oct 2026). Alan: "I kind of like the context lens ones better … put another set of context lenses somewhere
     that I can select the tickers for those … could we make the set of context lenses be the radar watch list? Maybe
     radar and macro." And of the old tape marks: "very small. I can barely see them."
     THIS SHELL is the lens set of the WIDGETS wall: a chip row - RADAR (station_lists · radar, the Hub's list), MACRO
     (MACRO · DAY's six: VIX DXUSD US10Y GCUSD CLUSD BTCUSD), MINE (his own picks, added and removed here, remembered on
     this machine) - and under it one context lens per name: the ticker, the price, the day's percent, and the OVAL of the
     zoomed-out series (chart-v1's lens drawing, S8's shape, the 1d:60 lens the intraday ranges carry: sixty daily candles),
     drawn big enough to read from the chair. Colours are the Station's: the head and the line in the day's colour, up
     green, down red - never grey. A tap on a lens opens that name in the wall's chart 1 (the deck decides which slot).
     Reads: SC_PROVIDER.marketQuotes every 15 s (the read the charts' badges ride) and marketCandles (1d × 60 every ten
     minutes in the column; 5m × 120 every minute on the tape). The lists: one Supabase GET for RADAR (the same door the deck
     reads through); MACRO is a constant; MINE is localStorage. Nothing here writes anywhere.
     W1C (22 Oct, Alan): "Where you have the ticker tape is where I want a tape of context lenses … a little smaller …
     make it 5 minute charts, the context lenses." ?mode=tape: the chips in a rail at the left, the lenses in ONE ROW that
     runs like the Station's other tapes (one length wider than the window: the track is doubled and moves at 45 px a
     second, the pointer holds it still; shorter: it stands); each lens a fixed 290 px wide; the bars are the last 120
     completed 5-minute bars (ten hours of extended trading - today's session, with yesterday's close behind it early in
     the day), read every minute. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --hair:#2A2A3C; --ink:#F2F2F8; --ink2:#C8C8D8; --ink3:#9A9AB6; --mute:#6E6E80; --dim:#55556A;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; }
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:3px 6px; background:var(--panel2); border-bottom:1px solid var(--line); min-height:22px; }
#bar .k{ color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; margin-right:4px; }
.chip{ font:9px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); background:transparent; border:1px solid var(--line); padding:2px 8px; cursor:pointer; border-radius:0; }
.chip:hover{ color:var(--ink); border-color:var(--hair); } .chip.on{ color:var(--crk); border-color:var(--crk); }
.chip small{ color:var(--dim); margin-left:5px; letter-spacing:.04em; }
#add{ display:none; margin-left:4px; width:84px; background:var(--bg); border:1px solid var(--line); color:var(--ink); font:10px var(--mono); padding:2px 6px; outline:none; border-radius:0; text-transform:uppercase; }
#add:focus{ border-color:var(--crk); } body[data-list="mine"] #add{ display:block; }
#note{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
#set{ flex:1 1 0; min-height:0; overflow-y:auto; display:grid; gap:1px; background:var(--line); align-content:start;
  grid-template-columns:repeat(auto-fill, minmax(min(var(--lens-min, 290px), 100%), 1fr)); }
.lens{ position:relative; background:var(--bg); display:flex; flex-direction:column; min-width:0; cursor:pointer; height:var(--lens-h, 176px); }
.lens:hover{ background:#0D0D15; }
.lens .head{ flex:none; display:flex; align-items:baseline; gap:10px; padding:8px 12px 0; white-space:nowrap; }
.lens .tk{ font-size:15px; letter-spacing:.1em; color:var(--ink); }
.lens .px{ font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums; }
.lens .pc{ font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums; margin-left:auto; }
.lens .pc.up, .lens .tk.up{ color:var(--bull); } .lens .pc.dn, .lens .tk.dn{ color:var(--bear); }
.lens .px.flash{ animation:scin .6s ease-out; }
@keyframes scin{ 0%{ color:var(--crk); text-shadow:0 0 8px rgba(0,212,255,.9); } 100%{ color:var(--ink2); text-shadow:none; } }
.lens canvas{ flex:1 1 0; min-height:0; width:100%; display:block; }
.lens .why{ position:absolute; left:12px; bottom:8px; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }
.lens .why:empty{ display:none; }
.lens .rm{ display:none; position:absolute; right:6px; top:6px; width:18px; height:18px; border:1px solid var(--line); background:var(--bg); color:var(--ink3); font:10px var(--mono); cursor:pointer; padding:0; border-radius:0; }
body[data-list="mine"] .lens .rm{ display:block; } .lens .rm:hover{ color:var(--bear); border-color:var(--bear); }
.msg{ grid-column:1 / -1; padding:18px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em; text-transform:uppercase; text-align:center; background:var(--bg); }
/* ---- W1C: the tape ---- */
body.tape{ flex-direction:row; }
body.tape #bar{ flex:none; width:96px; flex-direction:column; align-items:stretch; gap:3px; padding:5px 6px; border-bottom:0; border-right:1px solid var(--line); }
body.tape #bar .k{ margin:0 0 2px; } body.tape #chips{ display:flex; flex-direction:column; gap:3px; } body.tape .chip{ text-align:left; padding:2px 6px; }
body.tape #add{ width:100%; margin:2px 0 0; } body.tape #note{ margin:auto 0 0; white-space:normal; font-size:7px; line-height:1.3; }
body.tape #set{ flex:1 1 0; min-width:0; display:block; overflow:hidden; position:relative; background:var(--bg); }
body.tape .track{ position:absolute; left:0; top:0; height:100%; display:flex; gap:1px; background:var(--line); white-space:nowrap; }
body.tape .track.run{ will-change:transform; animation:lens-tape-move linear infinite; }
body.tape #set:hover .track.run{ animation-play-state:paused; }
@keyframes lens-tape-move{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ body.tape .track.run{ animation:none; } body.tape #set{ overflow-x:auto; scrollbar-width:none; } }
/* W4 (22 Oct, Alan): "Keep it tight, make them smaller, and make them more on screen and faster … I don't see the need of the circle" -
   150 px cells, the head one small line, the tight mini-chart under it (the latest 5-minute bars as a line in the day's colour) */
body.tape .lens{ flex:none; width:var(--lens-w, 150px); height:100%; }
body.tape .lens .head{ padding:3px 6px 0; gap:5px; } body.tape .lens .tk, body.tape .lens .px{ font-size:10px; } body.tape .lens .pc{ font-size:9.5px; }
body.tape .lens .nm{ display:block; color:var(--mute); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; padding:0 6px; line-height:1.1; }
body.tape .lens .nm:empty{ display:none; }
body.tape #add{ display:block; width:100%; margin:4px 0 0; font-size:9px; padding:3px 5px; }
body.tape #add::placeholder{ color:var(--dim); }
body.tape #bar .k{ font-size:7px; }
body.tape .msg{ padding:12px; }
</style>
</head>
<body>
<div id="bar"><span class="k">lenses</span><span id="chips" role="group" aria-label="Lens list"></span><input id="add" placeholder="+ ticker · Enter" title="type a ticker and press Enter: it joins MINE (the database list, both Macs)" aria-label="Add a ticker to MINE" maxlength="12"><span id="note"></span></div>
<div id="set" role="list" aria-label="Context lenses"><div class="msg">loading…</div></div>
<script src="/_provider/provider.js"></script>
<script type="module">
import { ovalGeometry, insideOval, INK } from "/_indicators/station-lens.mjs";
import { drawCandles, PALETTE, DIALS } from "/_indicators/lens-bars.mjs";
const el = (id) => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const CLEAN = (t) => String(t || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 12);
/* the lists, the keys, the clocks */
const LIST_KEY = "station.lenses.list", MINE_KEY = "station.lenses.mine";
const LISTS = ["radar", "macro", "mine"];
/* W4 (22 Oct, Alan: "I need NDX futures … S&P futures, NASDAQ futures … oil. Oil is extremely important"): MACRO is what trades overnight -
   the index futures and oil first, then gold, bitcoin, the dollar, the 10-year, VIX; all answered by the chart API (FMP) on 5-minute bars after
   the close (measured 22 Oct 19:00 ET). YMUSD RTYUSD BZUSD KOSPI are not tracked by the API and are left out. Plain names on the lens. */
const MACRO = Object.freeze(["ESUSD", "NQUSD", "CLUSD", "GCUSD", "BTCUSD", "DXUSD", "US10Y", "VIX"]);
const NAMES = Object.freeze({ ESUSD: "S&P FUT", NQUSD: "NASDAQ FUT", CLUSD: "OIL", GCUSD: "GOLD", BTCUSD: "BITCOIN", DXUSD: "DOLLAR", US10Y: "10-YEAR", VIX: "VIX" });
const SB = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
const TAPE = QS.get("mode") === "tape";   /* W1C: the lens tape */
if (TAPE) document.body.classList.add("tape");
/* the column's lens is the zoomed-out view the intraday ranges carry (LENS_BY_RANGE "1d:60"); the tape's is the last 120
   completed 5-minute bars (extended hours, ten hours), Alan's "make it 5 minute charts" */
/* W4: the tape shows the LATEST 30 completed 5-minute bars (two and a half hours) as a tight line, the live price as its last point; the
   bars are read 4 s after every 5-minute close (again at +15 and +30 s if the new bar is not in yet) and every minute besides; the quote
   every 10 s. The column keeps its sixty daily candles. */
const LENS_TF = TAPE ? "5m" : "1d", LENS_BARS = TAPE ? 30 : 60;
const QUOTE_MS = TAPE ? 10000 : 15000, BARS_MS = TAPE ? 60000 : 600000, LIST_MS = 300000, MAX_LENSES = 24;
const CLOSE_READ_DELAY_MS = 4000, CLOSE_RETRY_MS = [15000, 30000];
const TAPE_SPEED_PX_S = TAPE ? 90 : 45;   /* W4: twice the deck's tapes' pace on the lens tape */
const remembered = (k) => { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } };
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
/* pure: which list, and the names of MINE */
/* W4: the tape opens on MINE (his own list, in the database, the same on both Macs); the column still opens on RADAR */
export function listChoice(stored, urlValue, tape) { if (LISTS.includes(urlValue)) return urlValue; if (LISTS.includes(stored)) return stored; return tape ? "mine" : "radar"; }
export function mineOf(stored) { try { const a = JSON.parse(stored || "[]"); return Array.isArray(a) ? Array.from(new Set(a.map(CLEAN).filter(Boolean))).slice(0, MAX_LENSES) : []; } catch (_) { return []; } }
export function mineAdd(list, t) { const c = CLEAN(t); if (!c || list.includes(c)) return list.slice(); return list.concat([c]).slice(0, MAX_LENSES); }
export function mineRemove(list, t) { const c = CLEAN(t); return list.filter((x) => x !== c); }
/* the names of a station_lists read, in position order, deduped */
export function listNames(rows) { const seen = new Set(), out = []; for (const row of (rows || []).slice().sort((a, b) => (Number(a && a.position) || 0) - (Number(b && b.position) || 0))) { const t = CLEAN(row && row.ticker); if (t && !seen.has(t)) { seen.add(t); out.push(t); } } return out.slice(0, MAX_LENSES); }
let LIST = listChoice(remembered(LIST_KEY), QS.get("list"), TAPE);
let MINE = mineOf(remembered(MINE_KEY)), mineAt = 0;   /* W4: a copy of the database list, read every five minutes; written through the same door */
let RADAR = [], radarAt = 0;
const S = { quotes: new Map(), bars: new Map(), quotesAt: 0, barsAt: 0, busyQ: false, busyB: false };
function names() { return (LIST === "macro" ? MACRO : LIST === "mine" ? MINE : RADAR).slice(0, MAX_LENSES); }
const PG = { apikey: ANON, Authorization: "Bearer " + ANON };
async function pgRead(path) { const r = await fetch(SB + "/rest/v1/" + path, { headers: PG }); if (!r.ok) throw new Error("pg " + r.status); return r.json(); }
async function readRadar() {
  try { RADAR = listNames(await pgRead("station_lists?select=position,ticker&list=eq.radar&order=position.asc")); radarAt = Date.now(); }
  catch (e) { el("note").textContent = "radar list not read"; }
}
/* W4: MINE lives in public.station_lists as list "mine" (the coordinator seeded NBIS CRWV NVDA BE MU SNDK, positions 1-6); the add box upserts
   the next position through the deck's door (POST, Prefer: resolution=merge-duplicates), × deletes the row; the local copy is the fallback */
async function readMine() {
  try { const rows = await pgRead("station_lists?select=position,ticker&list=eq.mine&order=position.asc"); MINE = listNames(rows); MINE_ROWS = rows; mineAt = Date.now(); remember(MINE_KEY, JSON.stringify(MINE)); }
  catch (e) { el("note").textContent = "mine list not read"; }
}
let MINE_ROWS = [];
async function mineWrite(t) {
  const c = CLEAN(t); if (!c || MINE.includes(c)) return false;
  const last = MINE_ROWS.reduce((m, r) => Math.max(m, Number(r && r.position) || 0), 0);
  const r = await fetch(SB + "/rest/v1/station_lists?on_conflict=list,position", { method: "POST", headers: Object.assign({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }, PG),
    body: JSON.stringify([{ list: "mine", position: last + 1, ticker: c, updated_at: new Date().toISOString() }]) });
  if (!r.ok) throw new Error("pg write " + r.status);
  return true;
}
async function mineDelete(t) {
  const c = CLEAN(t); if (!c) return;
  const r = await fetch(SB + "/rest/v1/station_lists?list=eq.mine&ticker=eq." + encodeURIComponent(c), { method: "DELETE", headers: PG });
  if (!r.ok) throw new Error("pg delete " + r.status);
}
/* ---- the chips ---- */
function paintChips() {
  const box = el("chips"); box.innerHTML = "";
  const count = { radar: RADAR.length, macro: MACRO.length, mine: MINE.length };
  for (const l of LISTS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (l === LIST ? " on" : "");
    b.innerHTML = l + "<small>" + count[l] + "</small>"; b.setAttribute("aria-pressed", l === LIST ? "true" : "false");
    b.title = l === "radar" ? "the Hub's RADAR list" : l === "macro" ? "what trades overnight: S&P and Nasdaq futures, oil, gold, bitcoin, the dollar, the 10-year, VIX" : "your own list (station_lists · mine, the same on both Macs) - type a ticker in the box, Enter adds it; × removes it";
    b.addEventListener("click", () => setList(l)); box.appendChild(b);
  }
  document.body.dataset.list = LIST;
}
function setList(l) { if (!LISTS.includes(l) || l === LIST) return; LIST = l; remember(LIST_KEY, l); paintChips(); paintSet(); tick(true); }
el("add").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const raw = el("add").value, next = mineAdd(MINE, raw); if (next.length === MINE.length) { el("add").value = ""; return; }
  el("add").value = "";
  /* W4: written to the database (both Macs see it); the local copy follows at once, the next read confirms */
  const prev = MINE; MINE = next; remember(MINE_KEY, JSON.stringify(MINE));
  if (LIST !== "mine") { LIST = "mine"; remember(LIST_KEY, LIST); }
  paintChips(); paintSet(); tick(true);
  try { await mineWrite(raw); await readMine(); paintChips(); paintSet(); } catch (err) { el("note").textContent = "not saved: " + String(err && err.message || err).slice(0, 40); MINE = prev; remember(MINE_KEY, JSON.stringify(MINE)); paintChips(); paintSet(); }
});
/* ---- the set ---- */
const price = (p) => p == null ? "—" : p >= 1000 ? Math.round(p).toLocaleString("en-US") : p >= 100 ? p.toFixed(2) : p.toFixed(2);
const pct = (c) => c == null ? "" : (c >= 0 ? "+" : "") + c.toFixed(2) + "%";
function paintSet() {
  const box = el("set"); const list = names(); box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<div class="msg">' + (LIST === "mine" ? "no picks yet · type a ticker above and press Enter" : LIST === "radar" && !radarAt ? "reading the radar list…" : "nothing on this list") + "</div>"; return; }
  let host = box;
  if (TAPE) { host = document.createElement("div"); host.className = "track"; box.appendChild(host); }
  for (const t of list) {
    const d = document.createElement("div"); d.className = "lens"; d.dataset.t = t; d.setAttribute("role", "listitem");
    d.innerHTML = '<div class="head"><span class="tk"></span><span class="px">—</span><span class="pc"></span></div>' + (TAPE ? '<span class="nm"></span>' : "") + '<canvas></canvas><span class="why"></span><button type="button" class="rm" title="remove from MINE">×</button>';
    d.querySelector(".tk").textContent = t;
    if (TAPE && NAMES[t]) d.querySelector(".nm").textContent = NAMES[t];
    d.addEventListener("click", (e) => { if (e.target.closest(".rm")) return; try { parent.postMessage({ type: "SCINTILLA_LENS_OPEN", ticker: t }, location.origin); } catch (_) {} });
    d.querySelector(".rm").addEventListener("click", async () => { MINE = mineRemove(MINE, t); remember(MINE_KEY, JSON.stringify(MINE)); paintChips(); paintSet();
      try { await mineDelete(t); await readMine(); paintChips(); paintSet(); } catch (err) { el("note").textContent = "not removed: " + String(err && err.message || err).slice(0, 40); } });
    host.appendChild(d);
  }
  paintCells(true); drawAll();
  if (TAPE) runTape();
}
/* W1C: one length of lenses wider than the window → the track is doubled and runs at 45 px a second, whatever its length;
   a list that fits stands still (the deck's runTape rule) */
function runTape() {
  const box = el("set"), track = box.querySelector(".track"); if (!track) return;
  for (const copy of track.querySelectorAll('.lens[aria-hidden="true"]')) copy.remove();
  track.classList.remove("run"); track.style.animationDuration = "";
  const one = track.scrollWidth;
  if (!one || one <= box.clientWidth) return;
  for (const d of Array.from(track.children)) { const c = d.cloneNode(true); c.setAttribute("aria-hidden", "true"); c.tabIndex = -1; track.appendChild(c); }
  track.style.animationDuration = (one / TAPE_SPEED_PX_S).toFixed(2) + "s";
  track.classList.add("run");
  drawAll();
}
function paintCells(first) {
  for (const d of el("set").querySelectorAll(".lens")) {
    const q = S.quotes.get(d.dataset.t); if (!q) continue;
    const px = d.querySelector(".px"), pc = d.querySelector(".pc"), tk = d.querySelector(".tk");
    const text = price(q.price);
    if (px.textContent !== text) { const ticked = px.textContent !== "—" && !first; px.textContent = text; if (ticked) { px.classList.remove("flash"); void px.offsetWidth; px.classList.add("flash"); } }
    const side = q.pct == null ? "" : q.pct >= 0 ? " up" : " dn";
    pc.textContent = pct(q.pct); pc.className = "pc" + side; tk.className = "tk" + side;
  }
}
/* the day's colour for the oval: the quote's sign; without a quote, the last candle against the one before */
function dayOf(t, bars) { const q = S.quotes.get(t); if (q && q.pct != null) return q.pct >= 0 ? "up" : "down"; if (bars.length >= 2) return bars[bars.length - 1].c >= bars[bars.length - 2].c ? "up" : "down"; return null; }
/* the oval: S8's geometry for the lens' own canvas - the long axis is the canvas' width less a margin, the short axis
   what the candles need; the candles are clipped to the ellipse, its edge a faint line (station-lens.mjs, the oval branch) */
export function drawOval(ctx, W, H, bars, day) {
  ctx.clearRect(0, 0, W, H);
  if (!bars.length) return null;
  const long = Math.max(60, W - 28);
  const geo = ovalGeometry(bars, { long, maxPlotH: Math.max(28, H - 24) });
  if (!geo) return null;
  const cx = W / 2, cy = H / 2;
  const ox = cx - geo.centre.x, oy = cy - geo.centre.y;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, geo.a, geo.b, geo.theta, 0, Math.PI * 2);
  ctx.globalAlpha = DIALS.opacity; ctx.fillStyle = INK.paper; ctx.fill(); ctx.globalAlpha = 1; ctx.clip();
  ctx.translate(ox, oy);
  drawCandles(ctx, bars, geo.candles, { colour: "bar", day, pal: PALETTE });
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(1, geo.a - 0.5), Math.max(1, geo.b - 0.5), geo.theta, 0, Math.PI * 2);
  ctx.strokeStyle = day === "up" ? PALETTE.bull : day === "down" ? PALETTE.bear : INK.frame; ctx.lineWidth = 1; ctx.globalAlpha = 0.75; ctx.stroke();
  ctx.restore();
  return geo;
}
/* W4, the tape: a tight line of the latest closed 5-minute bars in the day's colour, a faint fill under it, the live price as the last
   point (a ring), the last close marked; no frame, no oval. Pure drawing on a (W × H) canvas. */
export function drawTight(ctx, W, H, bars, day, livePrice) {
  ctx.clearRect(0, 0, W, H);
  const closes = bars.map((b) => b.c); if (livePrice > 0) closes.push(livePrice);
  if (closes.length < 2) return null;
  const lo = Math.min(...closes), hi = Math.max(...closes), pad = 4, padR = 10;
  const X = (i) => pad + (i / (closes.length - 1)) * (W - pad - padR), Y = (v) => hi === lo ? H / 2 : pad + (1 - (v - lo) / (hi - lo)) * (H - 2 * pad);
  const col = day === "down" ? PALETTE.bear : day === "up" ? PALETTE.bull : PALETTE.ink;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(X(0), H); for (let i = 0; i < closes.length; i++) ctx.lineTo(X(i), Y(closes[i])); ctx.lineTo(X(closes.length - 1), H); ctx.closePath();
  ctx.globalAlpha = 0.10; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); for (let i = 0; i < closes.length; i++) i ? ctx.lineTo(X(i), Y(closes[i])) : ctx.moveTo(X(i), Y(closes[i]));
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.lineJoin = "round"; ctx.stroke();
  const n = closes.length - 1;
  if (livePrice > 0) { ctx.beginPath(); ctx.arc(X(n), Y(closes[n]), 2.6, 0, Math.PI * 2); ctx.fillStyle = "#0A0A0F"; ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(X(n), Y(closes[n]), 2, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();

function drawOne(d) {

  const entry = S.bars.get(t);
  const W = Math.max(1, cv.clientWidth), H = Math.max(1, cv.clientHeight), dpr = Math.min(3, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!entry) { ctx.clearRect(0, 0, W, H); why.textContent = "reading daily bars…"; return; }
  if (entry.absence) { ctx.clearRect(0, 0, W, H); why.textContent = entry.absence; return; }
  const bars = entry.bars; const day = dayOf(t, bars);
  if (TAPE) {
    const q = S.quotes.get(t), geo = drawTight(ctx, W, H, bars, day, q && q.price > 0 ? q.price : 0);
    why.textContent = geo ? "" : "no 5-minute bars";
    cv.setAttribute("aria-label", t + ": the last " + bars.length + " five-minute closes as a line" + (day ? ", the day " + day : "") + (q ? ", the live price last" : ""));
    d.dataset.day = day || ""; d.dataset.bars = String(bars.length); d.dataset.last = bars.length ? String(bars[bars.length - 1].t) : "";

  }
  const geo = drawOval(ctx, W, H, bars, day);
  why.textContent = geo ? "" : "no daily bars";
  cv.setAttribute("aria-label", t + ": " + bars.length + " daily candles in an oval" + (day ? ", the day " + day : ""));

function drawAll() { for (const d of el("set").querySelectorAll(".lens")) drawOne(d); }
/* ---- the reads ---- */
async function readQuotes() {
  const P = window.SC_PROVIDER; const list = names(); if (!P || !list.length || S.busyQ || document.hidden) return;
  S.busyQ = true;
  try {
    const rows = await P.marketQuotes(list, {});
    for (const row of rows || []) { const t = CLEAN(row && row.ticker); if (!t || row.price == null) continue; const p = +row.price, prev = row.prev_close == null ? null : +row.prev_close; S.quotes.set(t, { price: p, pct: prev ? (p - prev) / prev * 100 : (row.chg_pct == null ? null : +row.chg_pct) }); }
    S.quotesAt = Date.now(); paintCells(false); drawAll();
  } catch (_) {} finally { S.busyQ = false; }
}
/* the provider hands rows as { timestamp (seconds), open, high, low, close, volume } (providerCandleRows); a raw payload's
   series ({ t (ms), o, h, l, c, v }) is read too */
const norm = (b) => {
  const raw = b.t != null ? b.t : b.timestamp != null ? b.timestamp : (b.time || b.date);
  const t = typeof raw === "number" ? (raw > 1e12 ? raw : raw * 1000) : Date.parse(raw);
  const n = (a, c) => +(a != null ? a : c);
  return { t, o: n(b.o, b.open), h: n(b.h, b.high), l: n(b.l, b.low), c: n(b.c, b.close), v: n(b.v, b.volume) || 0, session: 0 };
};
async function readBars(force) {
  const P = window.SC_PROVIDER; const list = names(); if (!P || !list.length || S.busyB || document.hidden) return;
  S.busyB = true;
  try {
    const want = list.filter((t) => force || !S.bars.has(t) || Date.now() - S.bars.get(t).at > BARS_MS);
    await Promise.all(want.map(async (t) => {
      try {
        /* W4: on the tape the read skips the provider client's shared store (forming:true, max-age 15), so a bar just closed is seen at once */
        const payload = await P.marketCandles(t, LENS_TF, TAPE ? { limit: LENS_BARS, forming: true } : { limit: LENS_BARS });
        const rows = (Array.isArray(payload) ? payload : (payload && payload.series) || []).map(norm).filter((b) => Number.isFinite(b.t) && b.o > 0 && b.c > 0).slice(-LENS_BARS);
        /* the candles are one run (the oval's long axis is the series start to end); a 5-minute series keeps no session air */
        S.bars.set(t, rows.length ? { bars: rows, at: Date.now() } : { absence: "no daily bars", at: Date.now() });
      } catch (e) { S.bars.set(t, { absence: String((e && e.message) || "not served").slice(0, 40).toLowerCase(), at: Date.now() }); }
      const d = el("set").querySelector('.lens[data-t="' + t + '"]'); if (d) drawOne(d);
    }));

  } finally { S.busyB = false; }
}
let timer = 0, lastCloseRead = 0;
/* W4: the 5-minute close just passed, and the reads due after it (+4 s, then +15 and +30 s while the new bar is not in) */
export function closeDue(nowMs, lastReadMs) {
  const m = 5 * 60000, boundary = Math.floor(nowMs / m) * m, since = nowMs - boundary;
  if (lastReadMs >= boundary + CLOSE_READ_DELAY_MS - 1000 && since > CLOSE_RETRY_MS[CLOSE_RETRY_MS.length - 1] + 5000) return null;
  if (since >= CLOSE_READ_DELAY_MS && lastReadMs < boundary + CLOSE_READ_DELAY_MS - 1000) return { boundary, at: "close" };
  for (const r of CLOSE_RETRY_MS) if (since >= r && lastReadMs < boundary + r - 1000) return { boundary, at: "retry" };

}
const barsStale = (boundary) => names().some((t) => { const e = S.bars.get(t); return !e || !e.bars || !e.bars.length || e.bars[e.bars.length - 1].t < boundary - 5 * 60000; });
async function tick(now) {
  if (document.hidden && !now) return;
  if (LIST === "radar" && Date.now() - radarAt > LIST_MS) { await readRadar(); paintChips(); paintSet(); }
  if (LIST === "mine" && Date.now() - mineAt > LIST_MS) { await readMine(); paintChips(); paintSet(); }
  if (now || Date.now() - S.quotesAt > QUOTE_MS) readQuotes();
  if (TAPE) {
    const due = closeDue(Date.now(), lastCloseRead);
    if (due && (due.at === "close" || barsStale(due.boundary))) { lastCloseRead = Date.now(); readBars(true); return; }
  }

}
/* for the harness and the strip: what the tape holds */
window.__lens = { newest: () => Object.fromEntries([...S.bars].map(([t, e]) => [t, e.bars && e.bars.length ? e.bars[e.bars.length - 1].t : null])), quotes: () => Object.fromEntries([...S.quotes].map(([t, q]) => [t, q.price])), at: () => ({ bars: S.barsAt, quotes: S.quotesAt, lastCloseRead }), list: () => LIST, names, tf: LENS_TF, bars: LENS_BARS };
/* the lenses re-fit to their box (the deck resizes the pane) */
let raf = 0; const nudge = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; drawAll(); if (TAPE) runTape(); }); };
if (window.ResizeObserver) new ResizeObserver(nudge).observe(document.documentElement);
addEventListener("resize", nudge);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(true); });
paintChips(); paintSet();
(async () => { await Promise.all([readRadar(), readMine()]); paintChips(); paintSet(); tick(true); timer = setInterval(tick, TAPE ? 2000 : 5000); })();
</script>
