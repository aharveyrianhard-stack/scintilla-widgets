<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>SCINTILLA · video pane</title>
<!-- ============================================================================
     SCINTILLA · /pane-video — BUILT FOR THE PANE, not a page squeezed into one.

     Why this exists. /feed-a and /feed-b are full pages. Dropped into a deck
     slot they spend their height on chrome — header, chip row, tools row, a
     hint paragraph, a footer — and the videos end up below the fold. Alan
     opened the deck and saw "Nothing is playing and nothing was chosen for
     you" with no video to click. The data was fine (2,980 videos, every one
     with a thumbnail). The layout was the bug.

     So this is a different thing, sized for a box:
       · THUMBNAILS FIRST. A grid that counts its own columns from its own
         width — 1 column in a phone slot, 5 across an Apple TV third. The
         first thing in the pane is always a picture of a video.
       · ONE thin bar of chrome. Nothing else competes for height.
       · CLICK ONE AND IT PLAYS IN PLACE. The grid gives way to the player
         inside the same box. Back is one tap and you are on the grid again.
       · IT STILL NEVER PICKS FOR YOU. Opens on the grid. ?v= is the only
         preselect, because that is you asking by id.

     PICTURE-IN-PICTURE. The pane keeps the chosen video in its own URL
     (?v=), so whatever hosts it can lift the exact same view — same video —
     into a floating Document Picture-in-Picture window. The deck's PiP
     button does that. Where the browser supports Document PiP and we are
     top-level, the button here does it directly.

     Params: ?feed=personal|scintilla|soundscapes|golf|ai_research|fitness|market
             · ?mode=grid|videos|shorts (GRID · VIDEOS · SHORTS tabs; ?list=shorts still works)
             · ?list=default|subscribed|watch · ?v=VIDEOID
             · ?autoplay=1 · ?limit=60 (10-200) · ?t=MU · ?cols=N (force)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-PANEVIDEO-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --vol:#FF8A00; --gold:#FFD24A;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-btn-size:8px; --ipad-btn-pad-y:3px; --ipad-btn-pad-x:7px;
  --ipad-title-size:9.5px; --ipad-caption-size:9px;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; display:flex; flex-direction:column;
  overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }

/* ---- ONE thin bar. This is the entire chrome budget. ---- */
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px;
  padding-top:calc(4px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  background:var(--panel2); overflow:hidden; }
#bar::-webkit-scrollbar{ display:none; }
.k{ flex:none; color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; }
.btn{ flex:none; font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink3); cursor:pointer;
  text-decoration:none; white-space:nowrap; }
button.btn{ appearance:none; border-radius:0; font-family:var(--mono); line-height:normal; }
.btn:hover{ color:var(--ink); border-color:var(--hair); }
.btn.on{ color:var(--crk); border-color:var(--crk); }
.btn.out{ color:var(--vol); border-color:rgba(255,138,0,.35); }
.btn:disabled{ color:var(--mute); border-color:var(--line); cursor:default; opacity:.48; }
#chips{ flex:1 1 0; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
#chips::-webkit-scrollbar{ display:none; }
/* GRID · VIDEOS · SHORTS sit first in the chip row; a hairline separates them from the list chips.
   Same .btn as every other control — no new colour, the active tab uses the existing "on" state. */
#chips .sep{ flex:none; width:1px; height:11px; background:var(--line); margin:0 3px; align-self:center; }
/* S11b (3 Oct): THE CONTROL ROW FITS THE COLUMN. At 24% the pane is 403 / 461 / 614 px wide, and the
   profile select was as wide as its LONGEST option ("… · waiting for …", 187 px), which pushed the last chip
   off the right edge. fitBar() sizes the select to the profile it shows; if the chips still do not fit they
   go compact (tighter padding and tracking - the same 8 px type, the same colours); and only if even that
   does not fit does the row scroll, with a fade at the edge that says there is more. One line, always. */
#feedProfile{ max-width:132px; text-overflow:ellipsis; }
body.bar-tight #chips{ gap:2px; }
body.bar-tight #chips .btn{ padding-left:3px; padding-right:3px; letter-spacing:.04em; }
body.bar-tight #chips .sep{ margin:0 2px; }
body.bar-scroll #chips{ -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent);
  mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent); }
/* S12 (5 Oct 2026): CRITICAL CONTROLS ON THE BAR, THE REST ONE TAP AWAY. Alan: "we need to work on the controls
   for the youtube — the switches to channels, the refreshing … it's bunched up … HAVE THE MAIN CRITICAL ONES AND
   EXPAND OR SCROLL." The bar now holds what he reaches for: the channel switch (PERSONAL ▾), REFRESH (↻), one
   chip that NAMES the filters in force (e.g. VIDEOS · SUBSCRIBED ▾) and ⛶. Tapping the chip opens the filter row
   — GRID · VIDEOS · SHORTS | the lists — under the bar, over the thumbnails (never over the player: the chip and
   the row are grid-only, the player keeps its transport). Choosing a filter applies it and folds the row away.
   A swipeable row was the alternative; it hides the active filter off-screen at 403 px, so the named chip won.
   S13 (same day, after Alan saw it): the bar was re-ordered by use and put in icons — the channel and these
   filters now sit behind one ⋯; see the S13 block at the end of this stylesheet. */
#bRefresh.busy{ color:var(--crk); border-color:var(--crk); }
#filters #chips{ flex-wrap:wrap; overflow:visible; row-gap:4px; }
#q{ display:none; flex:1 1 90px; min-width:70px; background:var(--bg); border:1px solid var(--line);
  color:var(--ink); font-family:var(--mono); font-size:11px; padding:3px 6px; outline:none;
  border-radius:0; -webkit-appearance:none; }
body.searching #q{ display:block; }
#q:focus{ border-color:var(--crk); }
#bFull{ margin-left:0; }
/* S5 (1 Oct): the float button, on the bar while a video plays, and the line that says which path it took.
   Y8 (20 Oct): only where this browser can float it (Document Picture-in-Picture); anywhere else, no button at all */
#bPipBar{ display:none; }
body.playing.can-float #bPipBar{ display:inline-flex; }
body:not(.can-float) #bPip{ display:none !important; }
#pipNote{ display:none; color:var(--ink3); font-size:11px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
#pipNote:not(:empty){ display:inline; }
/* Y8: while the video floats, the pane says where it is - and BRING IT BACK is one tap (or P, or closing the window) */
#floatNote{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:12px; background:var(--bg); color:var(--ink3); font-size:11px; letter-spacing:.04em; text-align:center; }
#floatNote[hidden]{ display:none; }
#floatNote .line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
#floatNote .t{ max-width:92%; color:var(--dim); font-size:9.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#bBringBack{ color:var(--crk); border-color:var(--hair); }
#floatHold{ color:var(--vol); font-size:9.5px; }
#floatHold[hidden]{ display:none; }
/* S13: the profile select lives behind the ⋯, so the label on the bar is what names the channel. */
/* An awaiting channel explains itself in sentence case; the shouting caps are for one-line states. */
.msg.note{ text-transform:none; letter-spacing:.04em; font-size:9.5px; line-height:1.6; color:var(--ink3);
  max-width:560px; margin:0 auto; }
.msg.note b{ color:var(--ink2); font-weight:600; letter-spacing:.08em; }
/* The one step, as a button in the pane's own palette: no new colour, no white. */
.msg.note a.step{ display:inline-block; margin-top:8px; padding:3px 8px; color:var(--crk); border:1px solid var(--hair);
  text-decoration:none; letter-spacing:.1em; text-transform:uppercase; font-size:8px; }
.msg.note a.step:hover{ border-color:var(--crk); }

/* ---- THE GRID. Thumbnails, counted from our own width. ---- */
#grid{ flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; display:grid; gap:1px; align-content:start;
  grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); background:var(--line); }
.card{ background:var(--bg); cursor:pointer; display:flex; flex-direction:column; min-width:0; }
.card:hover{ background:var(--panel2); }
.card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
.thumb{ position:relative; width:100%; aspect-ratio:16/9; background:#12121c; overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
/* 26 Oct (coordinator): bigger and cyan, gold once saved. Alan: "these stars are like tiny ... Bigger and cyan, and if I click it,
   it turns like gold". One filled star in both states; the colour is the state (the label still says which). */
.star{ position:absolute; top:0; right:0; width:48px; height:48px; padding:0; z-index:2;
  box-sizing:border-box; border:0; border-radius:0; background:transparent;
  color:var(--crk); cursor:pointer;
  -webkit-text-stroke:.8px #000; text-shadow:0 1px 3px #000,0 0 8px #000,0 0 2px #000; }
.star > span{ position:absolute; top:3px; right:4px; font:32px/1 var(--mono); }
.star:hover{ color:var(--ink); }
.star.on{ color:var(--gold); }
.star.unk{ opacity:.65; }
#wlFlash{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:60; pointer-events:none;
  font:600 11px/1.5 var(--mono); letter-spacing:.05em; color:#ffd24a;
  background:rgba(10,12,16,.92); border:1px solid #2a2f3a; border-radius:6px; padding:6px 12px;
  opacity:0; transition:opacity .18s; max-width:88%; text-align:center; }
#wlFlash.show{ opacity:1; }
.dur{ position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.82); color:#fff;
  font-size:8px; padding:1px 4px; letter-spacing:.02em; }
/* A stream on air says LIVE; one still to come says when it starts, on the
   desk's own clock. Same corner, same size — only the wording changes. */
.dur.live{ letter-spacing:.08em; }  /* the dot and the spacing carry it — no new colour is introduced */
.dur.live::before{ content:"\25CF"; font-size:7px; margin-right:3px; vertical-align:1px; }
.dur.soon{ color:var(--ink3); letter-spacing:.04em; }
.dur.soon.due{ color:#fff; }  /* W9: its time has come - as bright as LIVE, without the dot until YouTube says so */
.tk{ position:absolute; left:3px; top:3px; background:rgba(0,212,255,.9); color:#04040a;
  font-size:8px; padding:1px 4px; letter-spacing:.04em; font-weight:600; }
.cap{ padding:4px 5px 6px; }
.cap .t{ color:var(--ink2); font-size:9.5px; line-height:1.3; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
/* ---- THE CHANNEL LINE — legible, on purpose. ----
   It used to be painted in --mute (#3A3A52). Against the card's own
   background (#0A0A0F) that is a MEASURED contrast ratio of 1.79:1 — under a
   quarter of the 4.5:1 that small text needs to be read, and Alan's report
   was exactly that: "I can barely see them... the name of the channel, I can
   barely see it too."

   --mute is a HAIRLINE colour. It is right for a divider and wrong for a word.
   The line is now painted in real reading inks, and the hierarchy is kept by
   the GAP between them rather than by pushing the bottom one into the dark:

     title    --ink2  #C6C8DE  11.96:1   loudest
     channel  --ink3  #9A9AB6   7.22:1   read at a glance
     age      --dim   #868AAA   5.86:1   reports, never competes

   Both new values clear WCAG AA (4.5:1) on the card background AND on the
   lighter hover background (6.95:1 / 5.64:1). Neither is white or near-white:
   #9A9AB6 and #868AAA are mid greys inside the existing monochrome ramp, and
   the near-white inks are deliberately NOT used here.
   9px with a half-step of weight, because at this size a monospace face loses
   its strokes before it loses its colour. */
.cap .s{ color:var(--ink3); font-size:9px; font-weight:500; margin-top:3px; overflow:hidden;
  white-space:nowrap; display:flex; align-items:baseline; gap:6px; }
.cap .s .ch{ min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--ink3); }
/* HOW LONG AGO IT WAS POSTED — the empty space at the right of the channel
   line, which is where it was asked for. One step quieter than the channel
   name: it reports, it never competes with the title. Tabular figures so the
   label does not twitch in width as the number ticks over. */
.cap .s .age{ flex:0 0 auto; margin-left:auto; color:var(--dim);
  font-variant-numeric:tabular-nums; }
/* very small slots: drop the caption, the picture is the interface */
body.tiny .cap .s{ display:none; }
body.tiny .cap{ padding:3px 4px 4px; }
body.tiny .cap .t{ -webkit-line-clamp:2; font-size:9px; }
html[data-view="desk"] .btn{ font-size:9px; padding:4px 8px; }
html[data-view="desk"] .cap .t{ font-size:11px; }
html[data-view="desk"] .cap .s{ font-size:10px; }
html[data-view="ipad"] .btn{ font-size:var(--ipad-btn-size); padding:var(--ipad-btn-pad-y) var(--ipad-btn-pad-x); }
html[data-view="ipad"] .cap .t{ font-size:var(--ipad-title-size); }
html[data-view="ipad"] .cap .s{ font-size:var(--ipad-caption-size); }
html[data-view="compact"] .btn{ font-size:7px; padding:2px 5px; }
html[data-view="compact"] .cap .t{ font-size:8.5px; }

/* ---- THE PLAYER. Same box, no navigation away. ---- */
#stage{ display:none; flex:1 1 0; min-height:0; flex-direction:column; }
body.playing #stage{ display:flex; }
body.playing #grid{ display:none; }
/* ---- W1 (22 Oct 2026): THE GRID BESIDE THE PLAYER. Alan: "I can see the rest of the grid while I'm watching another
   video." With ?beside=1 (the WIDGETS wall's pane; the deck can also say so by message) a playing video takes about
   two thirds of the pane and the thumbnails stay in a scrolling column on its right: a tap on another thumbnail
   switches the video in place, BACK (or Esc) gives the whole pane back to the grid. Nothing else moves: the bar, the
   float (Y8), the sound rule (Y10) and the theatre are as they were. The column counts its own width (relayout). */
/* W1B (22 Oct, Alan: "don't shrink my YouTube size, please … shift it to the side, keep the grid to the side of it"): the column has
   a FIXED width (--beside-col, the deck's number: 300 px on a wide wall, 220 on a narrow one) and the player takes the rest, so the
   deck can size the pane as the picture it wants plus the column - the picture is never the smaller share of anything. */
body.beside.playing{ display:grid; grid-template-columns:minmax(0,1fr) var(--beside-col, 300px); grid-template-rows:auto minmax(0,1fr); }
body.beside.playing > #bar{ grid-column:1 / -1; grid-row:1; }
body.beside.playing > #stage{ grid-column:1; grid-row:2; display:flex; min-width:0; }
body.beside.playing > #grid{ grid-column:2; grid-row:2; display:grid; border-left:1px solid var(--line); }
body.beside.playing > :not(#bar):not(#grid):not(#stage){ grid-column:1 / -1; }
body.beside.playing #grid .card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
/* ---- W10 (23 Oct 2026): THE GRID IS A PERMANENT FEED. Alan: "I need the grid to have a permanent spot. No shifting … let's put it to the left in
   the line of the Twitter and then the YouTube goes more to the middle. But fixed, okay? Not open and close." With ?fixed=1 (the WIDGETS wall) the
   grid is a column on the LEFT at the width the deck gives it (--beside-col, X's column), always on screen and scrolling; the player is the rest,
   always there - an empty stage with one line until a video is tapped; a tap plays in place; BACK stops the video and nothing moves. The grid's
   refresh repaints #grid only; the player lives in #stage and is never touched by it. */
body.fixed{ display:grid; grid-template-columns:var(--beside-col, 300px) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
body.fixed > #bar{ grid-column:1 / -1; grid-row:1; }
body.fixed > #grid{ grid-column:1; grid-row:2; display:grid; border-right:1px solid var(--line); }
body.fixed > #stage{ grid-column:2; grid-row:2; display:flex; min-width:0; }
body.fixed > :not(#bar):not(#grid):not(#stage){ grid-column:1 / -1; }
body.fixed #grid .card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
#idleNote{ display:none; position:absolute; inset:0; align-items:center; justify-content:center; color:var(--mute); font-size:9px; letter-spacing:.16em; text-transform:uppercase; pointer-events:none; }
body.fixed:not(.playing) #idleNote{ display:flex; }
body.fixed:not(.playing) #video iframe{ visibility:hidden; }
/* W12 (23 Oct): the PHONE - ?stack=1: one column; the bar, then the player at 16:9 across the width (its place fixed, playing or not), then the
   feed under it, scrolling. A feed refresh repaints #grid only, as on the wall; nothing moves when a video starts. */
body.stack{ display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); }
body.stack > #bar{ grid-row:1; }
body.stack > #stage{ grid-row:2; display:flex; min-width:0; aspect-ratio:16 / 9; }
body.stack > #grid{ grid-row:3; display:grid; overflow-y:auto; border-top:1px solid var(--line); }
body.stack > :not(#bar):not(#grid):not(#stage){ grid-column:1; }
body.stack #grid .card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
body.stack:not(.playing) #idleNote{ display:flex; font-size:11px; }
body.stack:not(.playing) #video iframe{ visibility:hidden; }
body.stack .card{ min-height:44px; }
#video{ flex:1 1 0; min-height:0; position:relative; background:#000; }
#video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
#transport{ display:none; flex:1 1 0; min-width:0; align-items:center; justify-content:flex-end; gap:4px;
  overscroll-behavior:contain; touch-action:manipulation; }
body.playing #transport{ display:flex; }
#nowq{ flex:none; color:var(--mute); font-size:7.5px; letter-spacing:.08em; white-space:nowrap; }
.transport{ width:48px; padding-left:0; padding-right:0; text-align:center; }
#bMenu{ width:32px; padding-left:0; padding-right:0; text-align:center; }
#bContinue{ display:none; color:var(--vol); border-color:rgba(255,138,0,.55); }
body[data-autoplay-blocked="true"] #bContinue{ display:inline-block; }
/* Y9 (21 Oct 2026): the browser can start an embed with its sound off; said on the bar, and one tap turns it on */
#bSound{ display:none; color:var(--vol); border-color:rgba(255,138,0,.55); }
body.playing[data-muted="true"] #bSound{ display:inline-block; }
#more{ position:fixed; z-index:5; right:6px; top:calc(32px + env(safe-area-inset-top)); width:min(300px,calc(100% - 12px));
  padding:5px; border:1px solid var(--hair); background:rgba(10,10,15,.98); box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:flex; flex-direction:column; gap:4px; }
#more[hidden]{ display:none; }
#more .btn{ width:100%; text-align:left; overflow:hidden; text-overflow:ellipsis; }
#more a.btn{ display:block; }
body.playing #chips{ display:none; }
@media (max-width:480px){
  body.playing .k{ display:none; }
}
@media (max-width:340px){
  #transport{ gap:2px; }
  .transport{ width:38px; }
  #bar{ gap:2px; } #bar #bNext, #bar #bPrev, #bar #bBack, #bar #bWatchBar, #bar #bRefresh, #bar #bPipBar, #bar #bMenu{ width:22px; }
  #bContinue{ max-width:92px; padding-left:4px; padding-right:4px; overflow:hidden; text-overflow:ellipsis; }
}
.msg{ grid-column:1/-1; padding:16px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; text-align:center; background:var(--bg); }
/* S13 (5 Oct 2026, ~12:30 ET): THE BAR, RE-ORDERED BY USE, IN ICONS. Alan, after seeing S12 live: "I don't change
   the channel much on YouTube, so that one can be in an expanded little thing. The NEXT button I do use, and I
   need to be able to get back to the GRID easily. I don't have ADD TO WATCH LIST easily, except on the grid …
   Make these buttons icons instead of words as much as we can, to save space."
   On the bar, always, in this order: NEXT · GRID · + WATCH LATER · REFRESH — then, only while a video plays,
   PREVIOUS and the place in the queue — and at the right ⛶ and one ⋯. Behind the ⋯: the channel switch
   (PERSONAL / SCINTILLA), the filters (S12's chip and its row moved in here) and the player's other actions.
   Every icon carries a one-line tooltip; words stay only where an icon would be a guess (TAP TO CONTINUE, the
   channel's name, the filter names, the items inside the ⋯). */
#bNext, #bPrev, #bBack, #bWatchBar, #bRefresh, #bPipBar, #bMenu{ width:26px; height:20px; padding:3px 0;
  align-items:center; justify-content:center; }
#bNext, #bPrev, #bBack, #bWatchBar, #bRefresh, #bMenu{ display:inline-flex; }
#bar .btn svg{ width:12px; height:12px; display:block; fill:none; stroke:currentColor; stroke-width:1.65;
  stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
#bar .btn svg .f{ fill:currentColor; stroke:none; }
#bar #transport{ flex:0 1 auto; justify-content:flex-start; }
#barGap{ flex:1 1 0; min-width:0; }
#bBack.on, #bMenu.on{ color:var(--crk); border-color:var(--crk); }
/* + WATCH LATER: a clock with a plus; once saved, the clock with a tick, in the star's own colour */
#bar #bWatchBar .saved{ display:none; }
#bWatchBar.on{ color:var(--vol); border-color:rgba(255,138,0,.55); }
#bar #bWatchBar.on .saved{ display:block; } #bar #bWatchBar.on .add{ display:none; }
#bWatchBar.none, #bWatchBar.unk{ opacity:.6; }
/* the thumbnail the + will add: the one under the pointer, outlined so the target is never a guess */
.card.sel{ outline:1px solid rgba(255,138,0,.7); outline-offset:-1px; }
/* the ⋯ panel: the channel, the filters, then (while a video plays) the player's other actions */
#more .sec{ display:flex; align-items:center; gap:6px; }
#more .sec > .lab{ flex:none; width:54px; color:var(--dim); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }

const CHANNEL_FEED_SUBSCRIBE_READY = false;

let PLAYER_TOKEN = 0, PLAYER_ACCEPTED_TOKEN = 0, PLAYER_FALLBACK = 0, PLAYER_POSITION_POLL = 0;
let YT_PLAYER = null, YT_PLAYER_READY = false, YT_PLAYER_CREATE = null, YT_PLAYER_REQUEST = null;
let PLAYER_ENDED_TOKEN = 0, PLAYER_ERROR_TOKEN = 0, PLAYER_AUTOPLAY_BLOCKED = false;
/* The database is the sole saved resume authority.  This Map is page memory
   only; closing or switching devices cannot create a second private history. */
const VIDEO_POSITION_SAVE_MS = 10000;
const VIDEO_POSITION_NEAR_END_SECONDS = 12;
const VIDEO_POSITION_INITIAL_WAIT_MS = 1500;
let PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
/* Y8: the floating window while the video is in it - { win, frame, id, at, ended, poll } - see PICTURE-IN-PICTURE */
let FLOAT = null;
const FLOAT_KEY = "station.float";   /* sessionStorage: the width last given to the window, for this session */
let VIDEO_POSITION_REQUEST = null, VIDEO_POSITIONS_READY = false;
const VIDEO_POSITIONS = new Map();

function resumePositionFor(videoId, positions = VIDEO_POSITIONS) {
  const time = Number(positions.get(videoId)?.time) || 0;
  return time > 5 ? Math.floor(time) : 0;
}
function mergeSharedVideoPositionRows(rows, positions = VIDEO_POSITIONS) {
  if (!Array.isArray(rows)) return;
  positions.clear();
  rows.forEach((row) => {
    const videoId = String(row?.video_id || ""), time = Number(row?.t) || 0;
    if (!videoId) return;
    if (time > 5) positions.set(videoId, { time:Math.floor(time), updated:String(row?.updated || "") });
  });
}
function syncSharedVideoPositions(force = false) {
  if (VIDEO_POSITION_REQUEST && !force) return VIDEO_POSITION_REQUEST;
  VIDEO_POSITION_REQUEST = pg("yt_positions?select=video_id,t,updated&order=updated.desc")
    .then((rows) => { mergeSharedVideoPositionRows(rows); VIDEO_POSITIONS_READY = true; return rows; })
    .catch(() => { VIDEO_POSITION_REQUEST = null; return []; });
  return VIDEO_POSITION_REQUEST;
}
function pushSharedVideoPosition(videoId, time) {
  if (!videoId) return;
  const t = Math.max(0, Math.floor(Number(time) || 0));
  try {
    fetch(SB + "/rest/v1/yt_positions", {
      method:"POST",
      headers:{ apikey:ANON, Authorization:"Bearer " + ANON, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body:JSON.stringify({ video_id:videoId, t, updated:new Date().toISOString() })
    }).catch(() => {});
  } catch (_) {}
}
function writeVideoPosition(videoId, time, duration, positions = VIDEO_POSITIONS) {
  if (!videoId) return;
  const t = Number(time) || 0, d = Number(duration) || 0;
  const complete = t <= 5 || (d && t >= d - VIDEO_POSITION_NEAR_END_SECONDS);
  if (complete) positions.delete(videoId);
  else positions.set(videoId, { time:Math.floor(t), updated:new Date().toISOString() });
  pushSharedVideoPosition(videoId, complete ? 0 : t);
}
function clearVideoPosition(videoId, positions = VIDEO_POSITIONS) {
  writeVideoPosition(videoId, 0, 0, positions);
}
async function resumePositionBeforePlay(videoId) {
  if (!VIDEO_POSITION_REQUEST) syncSharedVideoPositions();
  if (!VIDEO_POSITIONS_READY) {
    await Promise.race([
      VIDEO_POSITION_REQUEST,
      new Promise((resolve) => setTimeout(resolve, VIDEO_POSITION_INITIAL_WAIT_MS))
    ]);
  }
  return resumePositionFor(videoId);
}
function saveActiveVideoPosition(force = false) {
  if (!CUR || !PLAYER_POSITION.time) return;
  const now = Date.now();
  if (!force && now - PLAYER_POSITION.savedAt < VIDEO_POSITION_SAVE_MS) return;
  PLAYER_POSITION.savedAt = now;
  writeVideoPosition(CUR.video_id, PLAYER_POSITION.time, PLAYER_POSITION.duration);
}
function clearPlayerPositionPoll() {
  if (PLAYER_POSITION_POLL) clearTimeout(PLAYER_POSITION_POLL);
  PLAYER_POSITION_POLL = 0;
}
function captureActiveVideoPosition(player = YT_PLAYER) {
  /* Y8: while the video floats, where it is is the window's second - this pane's player sits paused */
  if (FLOAT && CUR && FLOAT.id === CUR.video_id) { PLAYER_POSITION.time = floatSecond() || PLAYER_POSITION.time; return; }
  if (!player || !YT_PLAYER_READY || !CUR) return;
  try {
    PLAYER_POSITION.time = Number(player.getCurrentTime()) || PLAYER_POSITION.time;
    PLAYER_POSITION.duration = Number(player.getDuration()) || PLAYER_POSITION.duration;
  } catch (_) {}
}
function startPlayerPositionPoll(token) {
  clearPlayerPositionPoll();
  const tick = () => {
    if (token !== PLAYER_TOKEN || !CUR || !YT_PLAYER_READY) return;
    captureActiveVideoPosition();
    saveActiveVideoPosition(false);
    rememberSound();
    PLAYER_POSITION_POLL = setTimeout(tick, 5000);
  };
  tick();
}

async function ytAct(action, payload) {
  const r = await fetch(SB + "/functions/v1/yt-act", {
    method: "POST",
    headers: { apikey: PUBLIC, "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, payload || {})),
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ("yt-act " + r.status));
  return d;
}

async function syncWatch(force) {
  if (WATCH_READY && !force) return WATCH;
  const rows = await pg("yt_watch_later?select=video_id,updated_at");
  const saved = (Array.isArray(rows) ? rows : []).filter((row) => row && row.video_id);
  WATCH = new Set(saved.map((row) => row.video_id));
  WATCH_AT = new Map(saved.map((row) => [row.video_id, Date.parse(row.updated_at || "") || 0]));
  WATCH_READY = true;
  WATCH_ERROR = "";
  return WATCH;
}

function wlFlash(t, ms) { const f = el("wlFlash"); if (!f) return; f.textContent = t; f.classList.add("show"); clearTimeout(wlFlash._t); wlFlash._t = setTimeout(() => f.classList.remove("show"), ms || 2600); }

async function toggleWatch(v) {
  if (!v || !v.video_id) return;
  if (!WATCH_READY) {
    /* Unknown is not permission: a toggle against an unlanded saved set could star an
       already-saved video. Retry the read; only a KNOWN state toggles. */
    try { await syncWatch(true); wlFlash("saved list recovered — ★ shows the true state now · click again to change it"); }
    catch (e) { WATCH_ERROR = e.message || "the saved-list read failed"; wlFlash("★ unavailable — the saved-list read failed · nothing was changed"); }
    paint(); refreshWatchButton(v);
    return;
  }
  const was = WATCH.has(v.video_id), will = !was;
  if (will) WATCH.add(v.video_id); else WATCH.delete(v.video_id);
  paint(); refreshWatchButton(v);
  try { await ytAct(will ? "star" : "unstar", { videoId:v.video_id, account:YOUTUBE_ACCOUNT }); }
  catch (e) {
    /* The optimistic flip must not outlive a lost write — and the reason is said. */
    if (was) WATCH.add(v.video_id); else WATCH.delete(v.video_id);
    paint(); refreshWatchButton(v);
    wlFlash((will ? "★ not saved" : "★ not removed") + " — the shared watch-later write failed · try again");
  }
}

/* ── PROFILE COVERAGE (honest, never inferred) ───────────────────────────────────────────────
   Counts what the returned rows actually carry. Unscoped rows are reported separately and are
   never folded into the profile's own count. Returns null when there is nothing to describe. */
function feedProfileCoverage(rows, account) {
  if (!Array.isArray(rows) || !rows.length) return null;
  let scoped = 0, unscoped = 0, shared = 0;
  for (const row of rows) {
    const accounts = Array.isArray(row?.subscription_accounts) ? row.subscription_accounts : [];
    if (!accounts.length) { unscoped++; continue; }
    if (account && accounts.includes(account)) { scoped++; if (accounts.length > 1) shared++; }
  }
  return { total: rows.length, scoped, unscoped, shared, account: account || null };
}
function feedCoverageText(coverage) {
  if (!coverage) return "";
  if (!coverage.account) return coverage.total + " results";
  const parts = [coverage.scoped + " of " + coverage.total + " carry this account"];
  if (coverage.shared) parts.push(coverage.shared + " shared with another account");
  if (coverage.unscoped) parts.push(coverage.unscoped + " carry no account");
  return parts.join(" \u00b7 ");
}
/* PRESENCE PER CHANNEL (23 Sep 2026). A channel used to count as ready only if its videos appeared in the
   feed being WATCHED, so from SOUNDSCAPES the GOLF and AI RESEARCH entries read "not connected yet" while
   they held 214 and 445 videos (Alan: "the channel dropdown doesn't work"). Each channel is now asked
   about once, on its own: one id, limit 1, when the pane loads. */
const FEED_PRESENCE = new Map();
async function readFeedPresence() {
  const accounts = FEED_PROFILES.map((profile) => profile.account).filter(Boolean);
  await Promise.all(accounts.map(async (account) => {
    try {
      const any = await pg("youtube_feed?select=video_id&subscription_accounts=cs." +
        encodeURIComponent("{" + account + "}") + "&limit=1", 1);
      FEED_PRESENCE.set(account, Array.isArray(any) && any.length > 0);
    } catch (_) {}
  }));
}
function profileIsAvailable(profileKey, rows) {
  /* A declared profile becomes selectable when the data proves its account exists. */
  const profile = FEED_PROFILES.find((entry) => entry.key === profileKey);
  if (!profile) return false;
  if (!profile.account) return true;
  if (profile.key === "personal" || profile.key === "scintilla") return true;
  if (typeof FEED_PRESENCE !== "undefined" && FEED_PRESENCE.has(profile.account)) return FEED_PRESENCE.get(profile.account);
  return (Array.isArray(rows) ? rows : []).some((row) =>
    Array.isArray(row?.subscription_accounts) && row.subscription_accounts.includes(profile.account));
}

/* ── THE PROFILE SELECTOR ────────────────────────────────────────────────────────────────────
   The registry is only useful if the owner can actually switch. This fills the control from the
   registry, marks a profile that the data cannot support as disabled WITH ITS REASON, and
   switching reloads this pane on the chosen feed - the pane owns its own identity, so the Station
   shell and the other pane are untouched. */
function paintFeedProfileSelector(rows) {
  const pick = el("feedProfile");
  if (!pick) return;
  const options = FEED_PROFILES.filter((profile) => profile.key !== "market");
  pick.innerHTML = options.map((profile) => {
    const ready = profileIsAvailable(profile.key, rows);
    /* A channel with no rows yet is still a real choice: picking it opens on the sentence that says
       what it is waiting for, with the one step beside it. A greyed "(awaiting)" read as a broken
       list (Alan, 23 Sep: "the drop-downs are empty, seems funky"). SCINTILLA keeps its rows, so it is
       never marked here even while its sign-in is off; the connect page shows that state. */
    const label = ready ? profile.label : profile.label + " \u00b7 " + (profile.waiting || "waiting");
    return '<option value="' + profile.key + '"' + (profile.key === FEED ? " selected" : "") +
      ' title="' + esc(profile.note || profile.label) + '">' + esc(label) + "</option>";
  }).join("");
  pick.style.display = "";
  document.body.classList.add("has-profile-select");
  fitBar();
  pick.onchange = () => {
    const next = pick.value;
    if (!next || next === FEED) return;
    if (EMBEDDED) {
      /* The deck swaps panes; this pane stays what it is. */
      try { parent.postMessage({ sc: "video-feed", account: next }, location.origin); } catch (_) {}
      pick.value = FEED;
      return;
    }
    const url = new URL(location.href);
    url.searchParams.set("feed", next);
    location.replace(url.href);
  };
}
function channelSubscribed(v, account = SUBSCRIPTION_ACCOUNT) {
  const accountMatch = Array.isArray(v?.subscription_accounts) && v.subscription_accounts.includes(account);
  return accountMatch || LOCAL_SUBSCRIBED_CHANNELS.has(account + ":" + String(v?.channel_id || ""));
}

async function subscribeToChannel(v) {
  const channelId = String(v?.channel_id || "");
  if (CHANNEL_FEED && !CHANNEL_FEED_SUBSCRIBE_READY) return;
  if (!channelId || channelSubscribed(v) || SUBSCRIBE_PENDING.has(channelId)) return;
  SUBSCRIBE_PENDING.add(channelId); refreshSubscribeButton();
  try {
    const d = await ytAct("sub", { channelId, channelTitle: v.channel || "", account:SUBSCRIPTION_ACCOUNT });
    if (!d.ok) throw new Error("YouTube subscribe failed");
    LOCAL_SUBSCRIBED_CHANNELS.add(SUBSCRIPTION_ACCOUNT + ":" + channelId);
  } catch (e) { wlFlash("subscribe failed — the shared write did not land · try again"); } finally {
    SUBSCRIBE_PENDING.delete(channelId); refreshSubscribeButton();
  }
}

function refreshSubscribeButton(v = CUR) {
  const b = el("bSubscribe");
  const channelId = String(v?.channel_id || "");
  const eligible = !!channelId;
  b.style.display = eligible ? "" : "none";
  if (!eligible) return;
  const done = channelSubscribed(v), pending = SUBSCRIBE_PENDING.has(channelId);
  if (CHANNEL_FEED && !CHANNEL_FEED_SUBSCRIBE_READY && !done) {
    b.disabled = true; b.classList.remove("on");
    b.textContent = "subscribe — after the collector update";
    b.title = "subscribing to the " + SUBSCRIPTION_ACCOUNT + " feed needs the updated collectors; until they are deployed this would land on the personal YouTube account";
    b.setAttribute("aria-label", b.title);
    return;
  }
  b.disabled = false;
  b.textContent = done ? "subscribed" : pending ? "adding…" : "subscribe";
  b.classList.toggle("on", done);
  b.title = done ? "already subscribed to " + (v.channel || "this channel") : "subscribe to " + (v.channel || "this channel");
  b.setAttribute("aria-label", b.title);
}

/* ---- columns counted from OUR width, not the window ---- */
function fitProfileSelect() {
  const pick = el("feedProfile");
  if (!pick || pick.style.display === "none") return;
  const opt = pick.options[pick.selectedIndex];
  if (!opt) return;
  const cs = getComputedStyle(pick), probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-family:" + cs.fontFamily +
    ";font-size:" + cs.fontSize + ";font-weight:" + cs.fontWeight + ";letter-spacing:" + cs.letterSpacing + ";text-transform:" + cs.textTransform;
  probe.textContent = opt.textContent;
  document.body.appendChild(probe);
  const text = probe.getBoundingClientRect().width;
  probe.remove();
  /* the text, the select's own padding and border, and room for its arrow */
  pick.style.width = Math.ceil(text + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 2 + 20) + "px";
}
function fitBar() {
  const body = document.body, chips = el("chips");
  body.classList.remove("bar-tight", "bar-scroll");
  fitProfileSelect();
  if (!chips || !chips.offsetWidth) return;
  const over = () => chips.scrollWidth > chips.clientWidth + 1;
  if (over()) body.classList.add("bar-tight");
  if (over()) body.classList.add("bar-scroll");
}

function syncUrl() {

/* 26 Oct: keepId is the video playing - un-starring it in WATCH LATER takes it off the list, but the queue still knows where
   it was, so the next saved video plays when it ends */
function queueRows(rows, list, watch, keepId) {
  return list === "watch" ? rows.filter((v) => watch.has(v.video_id) || (!!keepId && v.video_id === keepId)) : rows.slice();
}
/* 26 Oct: Watch Later in the order it was saved, the newest star first - the order the list shows and the queue plays */
function watchOrder(rows, at) {
  const when = at || new Map();
  return (Array.isArray(rows) ? rows : []).slice().sort((a, b) => (when.get(b.video_id) || 0) - (when.get(a.video_id) || 0));
}
const UNAVAILABLE_VIDEO_IDS = new Set();
function queuedVideo(rows, currentId, direction, skipped = new Set()) {
  const at = rows.findIndex((v) => v.video_id === currentId);
  if (at < 0) return null;
  const step = direction < 0 ? -1 : 1;
  for (let i = at + step; i >= 0 && i < rows.length; i += step) {
    if (!skipped.has(rows[i].video_id) && !UNAVAILABLE_VIDEO_IDS.has(rows[i].video_id)) return rows[i];
  }
  return null;
}
function nextQueuedVideo(rows, currentId, skipped = new Set()) {
  return queuedVideo(rows, currentId, 1, skipped);
}
function previousQueuedVideo(rows, currentId, skipped = new Set()) {
  return queuedVideo(rows, currentId, -1, skipped);
}
function visibleQueue() {
  /* 26 Oct: WATCH LATER is the whole saved list - shorts too, whatever the grid · videos · shorts tab says */
  if (LIST === "watch") return queueRows(ROWS, LIST, WATCH, CUR && CUR.video_id);
  return queueRows(ROWS, LIST, WATCH).filter((v) => inMode(v));
}
/* S13: NEXT pressed on the grid. After a trip back to the grid it carries on from the video that was playing;
   with nothing watched yet it starts at the first video of the list as filtered. */
function gridNextVideo(rows = visibleQueue()) {
  const after = LAST_PLAYED ? nextQueuedVideo(rows, LAST_PLAYED) : null;
  return after || rows.find((v) => !UNAVAILABLE_VIDEO_IDS.has(v.video_id)) || null;
}
function refreshTransport() {
  const rows = visibleQueue(), currentId = CUR?.video_id || "";

  el("bNext").disabled = !CUR || !nextQueuedVideo(rows, currentId);

  el("bBack").classList.toggle("on", !CUR);

  el("nowq").textContent = at >= 0 ? (at + 1) + " / " + rows.length : "";
  setTransportNotice(at >= 0 ? "video " + (at + 1) + " of " + rows.length : "video queue");
}

function ytApiReady() {
  return !!(window.YT && window.YT.Player);
}
function waitForYouTubePlayerApi() {
  if (ytApiReady()) return Promise.resolve(window.YT);
  return new Promise((resolve, reject) => {
    let script = document.getElementById("scintillaYouTubeIframeApi");
    if (!script) {
      script = document.createElement("script");
      script.id = "scintillaYouTubeIframeApi";
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      document.head.appendChild(script);
    }
    let settled = false;
    const finish = (error) => {
      if (settled) return;
      settled = true; clearInterval(poll); clearTimeout(deadline);
      if (error) reject(error); else resolve(window.YT);
    };
    const poll = setInterval(() => { if (ytApiReady()) finish(); }, 100);
    const deadline = setTimeout(() => finish(new Error("YouTube player API unavailable")), 15000);
    script.addEventListener("error", () => finish(new Error("YouTube player API failed to load")), { once:true });
  });
}
function ensureYouTubePlayerHost() {
  if (el("ytPlayer")) return;
  const host = document.createElement("div"); host.id = "ytPlayer";
  el("video").appendChild(host);
}
function playerEventVideoId(event) {

}
function playerEventMatchesRequest(event, request = YT_PLAYER_REQUEST) {
  if (!request || request.token !== PLAYER_TOKEN) return false;
  const deliveredId = playerEventVideoId(event);
  return !deliveredId || deliveredId === request.video.video_id;
}
function isUnavailablePlayerError(code) {
  return [2, 5, 100, 101, 150, 153].includes(Number(code));
}
function setAutoplayBlockedState(blocked, request = YT_PLAYER_REQUEST) {
  PLAYER_AUTOPLAY_BLOCKED = !!blocked;
  document.body.dataset.autoplayBlocked = blocked ? "true" : "false";

/* ---- HOW LONG AGO IT WAS POSTED ----
   The thumbnail corner already carries the video's LENGTH (13:33). Length is
   not age, and the two must never be read as one number, so the age lives on
   the channel line instead, right-aligned into the space that was empty.

   published_at — the video's own publish instant, handed over by the feed as
   an ISO timestamp — is the ONLY thing allowed to produce an age here. The
   database does hold a collection time (the sweep stamp on youtube_videos, the
   pass that first saw the row) and it is deliberately not a fallback: a video
   we caught a day late would otherwise announce itself as minutes old. A row
   with no usable publish time gets no age at all rather than a wrong one.

   Every step floors rather than rounds, so the label is the age the video has
   certainly reached, never one it has not. */
const VIDEO_AGE_NONE = "";
const VIDEO_PUBLISHED_SHAPE = /^\d{4}-\d{2}-\d{2}[T ]/;
function videoPublishedMs(value) {
  /* published_at is a timestamptz, so the feed always hands it over as
     YYYY-MM-DD... Anything else is refused rather than guessed at: Date.parse
     is generous enough to read the string "0" as the year 2000, and a guess
     that lands is worse than no age at all. */
  if (typeof value !== "string" || !VIDEO_PUBLISHED_SHAPE.test(value)) return null;
  const t = Date.parse(value);
  return isFinite(t) && t > 0 ? t : null;
}
function videoAgeLabel(value, nowMs) {
  const t = videoPublishedMs(value);
  if (t == null) return VIDEO_AGE_NONE;
  const now = isFinite(nowMs) ? nowMs : Date.now();
  const s = (now - t) / 1000;
  /* A publish time in the future is a clock difference or a scheduled
     premiere, not an age. A minute of skew reads as new; past that, refuse. */
  if (s < -60) return VIDEO_AGE_NONE;
  if (s < 120) return "just now";
  const m = s / 60;   if (m < 60) return Math.floor(m) + "m ago";
  const h = m / 60;   if (h < 24) return Math.floor(h) + "h ago";
  const d = h / 24;   if (d < 2) return "yesterday";
  if (d < 7) return Math.floor(d) + "d ago";
  const w = d / 7;    if (w < 9) return Math.floor(w) + "w ago";
  const mo = d / 30.44; if (mo < 12) return Math.floor(mo) + "mo ago";
  return Math.floor(d / 365.25) + "y ago";
}
/* A stream's age is counted from when it went on air, never from the date it
   carried while it was still only scheduled. A row from before the feed knew
   about stream times still has published_at and reads exactly as it did. */
function videoWhen(v) { return (v && (v.feed_at || v.published_at)) || ""; }
function videoAgeHTML(v) {
  /* W9: a stream still to come has no age yet - its corner says when it goes on air */
  if (v && v.live_state === "upcoming") return "";
  const when = videoWhen(v);
  const label = videoAgeLabel(when);
  if (!label) return "";
  return '<span class="age" data-published="' + esc(String(when)) + '">' + esc(label) + "</span>";
}
/* The corner of the thumbnail: LIVE while a stream is on air, the start time
   while one is still to come, the video's length otherwise. Times are New York,
   the clock the rest of the Station runs on, and a start on another day carries
   that day with it. */
const START_TIME_NY = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
const START_DAY_NY  = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });

function startLabel(value, nowMs) {
  const t = videoPublishedMs(value);
  if (t == null) return "";
  const at = new Date(t);
  const now = new Date(isFinite(nowMs) ? nowMs : Date.now());
  const time = START_TIME_NY.format(at).replace(/\s?([AP])M/, (m, half) => half.toLowerCase() + "m");
  return NY_DAY.format(at) === NY_DAY.format(now) ? time : START_DAY_NY.format(at) + " " + time;
}
/* W9: "LIVE at 9:00am" until it starts (another day carries its day: "LIVE Oct 24 9:00am"); an hour past its start
   with YouTube still not calling it live, it no longer claims to be coming and says "set for 9:00am" */
function videoBadgeHTML(v, nowMs) {
  if (v && v.live_state === "live") return '<span class="dur live">LIVE</span>';
  if (v && v.live_state === "upcoming") {
    const label = startLabel(v.starts_at, nowMs);
    if (!label) return "";
    const place = streamPlace(v, nowMs);
    const words = place === "past" ? "set for " + label : (/^[A-Z][a-z]{2} /.test(label) ? "LIVE " : "LIVE at ") + label;
    return '<span class="dur soon' + (place === "due" ? " due" : "") + '">' + esc(words) + "</span>";
  }
  return v && v.duration ? '<span class="dur">' + esc(v.duration) + "</span>" : "";
}
/* The Station stays open for hours, so a label written this morning must not
   still claim "2h ago" tonight. The ages are re-read in place on the pass the
   feed already runs and whenever the tab comes back to the front: no timer per
   tile, no extra request, no repaint of the grid. */
function paintAges() {
  const now = Date.now();
  for (const n of document.querySelectorAll("#grid .age")) {
    const label = videoAgeLabel(n.dataset.published, now);
    if (n.textContent !== label) n.textContent = label;
  }
}

function appendCards(rows) {

/* One delegated listener on the grid instead of two per tile: appended pages

function wireGrid() {
  el("grid").addEventListener("click", (event) => {
    const star = event.target.closest(".star");
    if (star) { event.stopPropagation(); toggleWatch(BYID[star.dataset.star]); return; }
    const card = event.target.closest(".card");

  });

    const grid = el("grid");

  }, { passive:true });

     The refresh is not skipped and not forgotten — it is held, and runs the moment the

  for (const ev of ["pointerenter", "pointermove", "pointerdown"])
    el("grid").addEventListener(ev, () => { POINTER_IN_LIST = true; }, { passive:true });

/* The whole decision in one place, so it can be tested without a browser. */

  if (state.pointerInList) return { load:false, hold:true, why:"Alan's pointer is in the list" };

/* ---- WHEN A STREAM ACTUALLY HAPPENED ----
   YouTube dates a live stream from when it was SCHEDULED, so a stream that ran
   this morning arrives carrying yesterday's date and sinks below a day of
   ordinary uploads — measured 23 Sep, 242 newer rows sat above one that had
   gone on air four hours earlier, and the first page is 200. feed_at is the
   feed's answer to "when did this happen": the actual start when there is one,
   the scheduled start for something still to come, the publish time otherwise.
   The grid is ordered by it. */
const FEED_SELECT = "video_id,title,channel,channel_id,tickers,duration,is_short,thumb_url,published_at,subscription_accounts";
const FEED_SELECT_LIVE = FEED_SELECT + ",feed_at,live_state,starts_at";
let FEED_LIVE_OK = true;
function feedQuery(offset) {
  let q = "youtube_feed?select=" + (FEED_LIVE_OK ? FEED_SELECT_LIVE : FEED_SELECT) +
          "&order=" + (FEED_LIVE_OK ? "feed_at" : "published_at") + ".desc&limit=" + LIMIT +
          (offset ? "&offset=" + offset : "");
  const chosen = LISTS.find((l) => l.id === LIST);
  if (LIST === "watch") {
    /* 26 Oct: the whole saved list in one read (up to 200), no mode or ticker filter; watchOrder puts it in saved order */
    return "youtube_feed?select=" + (FEED_LIVE_OK ? FEED_SELECT_LIVE : FEED_SELECT) + "&limit=200" +
      "&video_id=in.(" + Array.from(WATCH).slice(0, 200).map(encodeURIComponent).join(",") + ")";
  } else q += chosen.q;
  q += modeClause(MODE);
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  return q;
}
/* The stream times arrive with a database change of their own. Before that
   change lands the columns do not exist and the read comes back 400, so the
   first refusal drops this session back to the publish time — one failed read,
   never an empty grid, and no second failure after it. */
async function readFeed(offset) {
  try { return await pg(feedQuery(offset)); }
  catch (e) {
    if (!FEED_LIVE_OK) throw e;
    FEED_LIVE_OK = false;
    return pg(feedQuery(offset));
  }
}
/* ---- ON AIR FIRST (Y2, 5 Oct 2026) ----
   Alan: "Wolf Trading is live right now on X Spaces and on YouTube — I don't see it on our YouTube feed."
   The grid is ordered by when a thing happened, so a stream that went on air two hours ago sits under two hours
   of uploads, and one that started before the first page's oldest row is not on the page at all. A stream that
   is on air NOW is asked for by itself (same filters) and put ahead of everything else, newest start first.
   Three bounds keep that honest:
     · only channels this feed CARRIES are put first — a "LIVE" stream a ticker search happened to find (the
       fake "LIVE: … price prediction" streams are exactly that) keeps its ordinary place;
     · a stream on air for more than ON_AIR_PIN_HOURS is a round-the-clock channel, not news — it keeps its

const ON_AIR_PIN_HOURS = 12;

function onAirQuery() {

function onAirNow(video, nowMs) {

    seen.add(video.video_id); pinned.push(video);

  if (!pinned.length) return list;

/* ---- A SCHEDULED STREAM IS ON THE FEED AT ITS TIME (W9, 22 Oct 2026) ----

   do a pull … I already see live videos on there for tomorrow, and then tomorrow I'm going to have to go and find
   them in the bottom."
   Measured 23 Oct 00:00 ET: tomorrow's seven SCINTILLA streams were tiles 1-7, the 4:20pm one first and the 8:15am
   one seventh, and the two created more than three days ahead were no longer being re-read by the sweep, so they
   would never have said LIVE and would have sunk under the day's uploads. Under ON AIR FIRST the page reads:
     · DUE - its start time has come (2 minutes before it, until an hour after) and YouTube does not call it live
       yet: the streamer is late or the pull has not caught it. It is at the top all the same, earliest first;
     · LATER TODAY - the rest of today's (New York) streams, soonest first, each saying "LIVE at 4:20pm";

const DUE_BEFORE_MS = 2 * 60000;

  const now = isFinite(nowMs) ? nowMs : Date.now();

/* The SCINTILLA grid keeps the rows the SCINTILLA account carries and drops

   database asks the same question (the list's cs.{scintilla} clause); this
   guard re-checks every row that lands, so a row served without the account
   never reaches the Station. It runs over EVERY page, which is why a page
   that arrives full can still add only a few tiles — and why "is there more
   behind this?" is answered by the raw page size, never by how many tiles

function filterFeedRows(rows) {
  const accountsFor = (video) => Array.isArray(video?.subscription_accounts)
    ? video.subscription_accounts.map((account) => String(account).toLowerCase()) : [];

}
/* Reaching the bottom of the grid asks for the page behind it. Watch Later is
   a fixed set of ids, so it has no page behind it and says so. */
async function loadMore() {
  if (PAGE_BUSY || !PAGE_MORE || LIST === "watch" || ROWS.length >= MAX_ROWS) return;
  PAGE_BUSY = true;
  try {
    const rows = await readFeed(PAGE_AT);
    const raw = Array.isArray(rows) ? rows : [];
    PAGE_AT += raw.length;
    PAGE_MORE = raw.length >= LIMIT && PAGE_AT < MAX_ROWS;
    const known = new Set(ROWS.map((v) => v.video_id));
    const added = filterFeedRows(raw).filter((v) => !known.has(v.video_id) && !notOnTheFeedYet(v));
    if (added.length) {
      ROWS = ROWS.concat(added);
      for (const v of added) BYID[v.video_id] = v;
      appendCards(added); refreshTransport();
    }
    /* A page that filtered down to nothing must not look like the end of the
       feed: keep pulling until something lands or the feed genuinely runs out. */
    if (!added.length && PAGE_MORE) { PAGE_BUSY = false; return loadMore(); }
    fillViewport();
  } catch (e) { /* a failed page is not the end of the feed; the next scroll retries */ }
  finally { PAGE_BUSY = false; }
}
/* A first page that does not even fill the pane would leave nothing to scroll,
   so the "reaching the bottom" trigger could never fire. Pull until the grid
   overflows its own box at least once. */
function fillViewport() {
  const grid = el("grid");
  if (PAGE_MORE && !PAGE_BUSY && grid.scrollHeight <= grid.clientHeight + 40) loadMore();
}

async function load(forceWatch, quiet) {
  if (!quiet && !ROWS.length) el("grid").innerHTML = '<div class="msg">loading…</div>';
  if (LIST === "watch") {
    try { await syncWatch(!!forceWatch); }
    catch (e) {
      WATCH_READY = false; WATCH_ERROR = e.message || "Watch Later unavailable";
    }
  }
  PAGE_AT = 0; PAGE_MORE = LIST !== "watch";
  if (LIST === "watch") {
    if (WATCH_ERROR) {
      if (quiet && ROWS.length) return;
      ROWS = []; BYID = {};
      el("grid").innerHTML = '<div class="msg">the watch-later read failed — the saved list is unavailable, not empty · retrying at the next refresh</div>';
      relayout(); return;
    }
    if (!WATCH.size) { ROWS = []; BYID = {}; paint(); relayout(); return; }
  }
  let rows;
  try { rows = await readFeed(0); }
  catch (e) {
    if (!quiet || !ROWS.length) el("grid").innerHTML = '<div class="msg">feed unavailable</div>';
    return;
  }
  /* 26 Oct: WATCH LATER in saved order, newest star first (the read itself has no order) - what the list shows and the queue plays */
  const raw = LIST === "watch" ? watchOrder(rows, WATCH_AT) : Array.isArray(rows) ? rows : [];
  PAGE_AT = raw.length;
  PAGE_MORE = LIST !== "watch" && raw.length >= LIMIT && PAGE_AT < MAX_ROWS;
  ACCOUNT_EMPTY = false;
  if (!raw.length && FEED_PROFILE.account && LIST !== "watch") {
    try {
      const any = await pg("youtube_feed?select=video_id&subscription_accounts=cs." +
        encodeURIComponent("{" + FEED_PROFILE.account + "}") + "&limit=1", 1);
      ACCOUNT_EMPTY = Array.isArray(any) && !any.length;
    } catch (_) {}
  }
  if (!FEED_PRESENCE.size) await readFeedPresence();
  paintFeedProfileSelector(raw);
  const kept = filterFeedRows(raw);
  const nextRows = liveFirst(LIST === "watch" ? kept : scheduledInPlace(kept), await readOnAir());
  WATCH_MISSING = LIST === "watch" ? Math.max(0, Math.min(WATCH.size, 200) - kept.length) : 0;
  const signature = (items) => items.map((v) => [v.video_id, v.title, v.channel, v.published_at,
    v.feed_at || "", v.live_state || "", v.duration || "",
    Array.isArray(v.subscription_accounts) ? v.subscription_accounts.join("+") : "", streamPlace(v) || ""].join("|")).join("\n");
  const changed = signature(nextRows) !== signature(ROWS.slice(0, nextRows.length));
  ROWS = nextRows;
  BYID = {}; for (const v of ROWS) BYID[v.video_id] = v;
  if (changed || !quiet) { paint(); relayout(); refreshTransport(); }
  fillViewport();
  /* the ONLY preselect: you asked for a video by id */
  if (START && BYID[START]) play(BYID[START], AUTO);
}

function togglePaneFull() {
  parent.postMessage({ type: "SCINTILLA_DECK_TOGGLE_FULL" }, location.origin);
  setMenuOpen(false);
}
el("bFull").addEventListener("click", togglePaneFull);
el("bMenuFull").addEventListener("click", togglePaneFull);
el("bWatch").addEventListener("click", () => { toggleWatch(CUR); setMenuOpen(false); });
el("bSubscribe").addEventListener("click", () => { subscribeToChannel(CUR); setMenuOpen(false); });
el("bYt").addEventListener("click", () => setMenuOpen(false));
el("bCover").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_MEDIA_COVER_X" }, location.origin);
  setMenuOpen(false);
});
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    relayout(); postChrome(); return;
  }
  if (event.data?.type === "SCINTILLA_DECK_FULL_STATE") {
    const stage = +event.data.stage || 0, theatre = !!event.data.theatre && stage > 0;
    DECK_STAGE = stage;
    /* the floor plan's one step (S11b): the video over the charts; BACK, or Esc, puts it home */
    el("bFull").textContent = theatre ? "↙ back" : stage === 2 ? "↙ youtube" : stage === 1 ? "↙ normal" : "⛶";
    el("bFull").title = theatre ? "back to the column (Esc)" : stage === 2 ? "return to YouTube region" : stage === 1 ? "return to normal media layout" : "expand over the charts";
    el("bMenuFull").textContent = theatre ? "back to the column" : stage === 2 ? "return to youtube region" : stage === 1 ? "return to normal layout" : "expand pane";
    fitBar();
    el("bCover").style.display = event.data.canCoverX ? "" : "none";
  }
});
async function start() {
  paintChips(); paintFeedProfileSelector([]); wireGrid(); paintFloat(); paintBeside(); relayout(); postChrome(); load();
  syncSharedVideoPositions();
  /* Prime one official player object behind the hidden stage.  Selecting or
     advancing a video then loads into this same object rather than replacing
     the iframe, retaining the browser's playback grant across the queue. */
  ensureOfficialYouTubePlayer().catch(() => {});
  /* Start the shared local saved-set read alongside the ordinary feed.  This
     never contacts YouTube, and means opening Watch Later normally has its
     IDs ready instead of placing that database read on the click path. */
  syncWatch().then(() => { refreshWatchButton(); if (ROWS.length) paint(); }).catch(() => {
    /* A failed read is never data: name it, and let the button and card stars paint
       UNKNOWN rather than "unsaved". The 120s pass and any star click retry the read. */
    WATCH_READY = false; WATCH_ERROR = WATCH_ERROR || "the saved-list read failed";
    refreshWatchButton(); if (ROWS.length) paint();
  });
  /* Keep the stored feed current without touching the YouTube API on every
     pass. */
  setInterval(() => {
    /* The ages are refreshed on every pass, whether or not the feed moved and
       whether or not a video is playing — an unchanged list still gets older. */
    paintAges();
    /* Once Alan has paged down into the history, the two-minute pass must NOT
       reload page one: that would throw away everything he scrolled to and
       drop him back at the top. A paged grid gets fresh ages and nothing else;
       the next list or feed change reloads it properly. */
    const plan = videoRefreshPlan({ visible: document.visibilityState === "visible", playing: !!CUR,
      pagedPast: PAGE_AT > LIMIT, pointerInList: POINTER_IN_LIST });
    if (plan.hold) REFRESH_HELD = true;
    if (plan.load) load(false, true);
  }, 120000);
}
start();

var STATION_ACTIVITY_PANE = "video";
/* ---- M51: TELL THE DECK WHEN ALAN IS USING THIS PANE --------------------------------------------
   The deck watches for a newer version of itself and reloads when the Station looks idle, but it
   can only hear pointer, wheel, key and scroll events in its OWN document: everything that happens
   inside this frame is invisible to it. That is why a feed being scrolled was reloaded under his
   hand (24 Sep). One message, on the same postMessage path the X pane uses for "live", at most once
   a second, carrying nothing but the fact that this pane is in use. */
(function reportStationActivity() {
  if (window.parent === window) return;
  var last = 0;
  var send = function () {
    var now = Date.now();
    if (now - last < 1000) return;
    last = now;
    try { window.parent.postMessage({ sc: "station-activity", pane: STATION_ACTIVITY_PANE, at: now }, location.origin); } catch (e) {}
  };
  var events = ["pointermove", "pointerdown", "wheel", "touchstart", "touchmove", "keydown", "scroll"];
  for (var i = 0; i < events.length; i++)
    window.addEventListener(events[i], send, { passive: true, capture: true });
})();
/* 26 Oct: SCINTILLA and PERSONAL as two buttons on the bar (see the style note). On the wall and the iPad the deck owns which feed is on
   (the pane asks it, as the ⋯ channel list does); on the phone page, which has no deck, the pane reloads itself on the other feed. */
function switchFeed(next) {
  if (!next || next === FEED) return;
  if (EMBEDDED && QS.get("view") !== "phone") { try { parent.postMessage({ sc: "video-feed", account: next }, location.origin); } catch (_) {} return; }
  const url = new URL(location.href); url.searchParams.set("feed", next); location.replace(url.href);
}
/* 26 Oct: the third tab, WATCH LATER - the saved list in this pane (no deck message, no reload). A feed tab leaves it: this
   feed's own list at once, the other feed through switchFeed (its pane reads the remembered "0" and opens on its list). */
function paintFeedSwitch() {
  const box = el("feedSwitch"); if (!box) return;
  for (const b of box.querySelectorAll("button")) {
    const on = b.dataset.list === "watch" ? LIST === "watch" : FEED === b.dataset.feed && LIST !== "watch";
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
  }
}
function showWatchLater(on) {
  if (!LISTS.some((l) => l.id === "watch")) return;
  rememberWatchTab(on);
  const next = on ? "watch" : "default";
  if (LIST === next) { paintFeedSwitch(); return; }
  LIST = next; paintChips(); load(on);
}
(function feedSwitch() {
  const kk = el("kk"); if (!kk) return;
  const box = document.createElement("span"); box.id = "feedSwitch"; box.setAttribute("role", "group"); box.setAttribute("aria-label", "YouTube feed");
  for (const [key, label] of [["scintilla", "SCINTILLA"], ["personal", "PERSONAL"]]) {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = label; b.dataset.feed = key;
    b.title = FEED === key ? label + " is the feed here" : "switch to " + label;
    b.addEventListener("click", () => { if (key === FEED) showWatchLater(false); else { rememberWatchTab(false); switchFeed(key); } });
    box.appendChild(b);
  }
  if (LISTS.some((l) => l.id === "watch")) {
    const w = document.createElement("button"); w.type = "button"; w.className = "btn wl"; w.dataset.list = "watch";
    w.innerHTML = '<span class="wl-long">WATCH LATER</span><span class="wl-short">LATER</span>';
    w.title = "WATCH LATER — every video you starred, newest first; play one and the list plays through";
    w.addEventListener("click", () => showWatchLater(true));
    box.appendChild(w);
  }
  kk.after(box);
  paintFeedSwitch();
  if (FEED === "scintilla" || FEED === "personal") kk.style.display = "none";
})();
/* the other feed's pane follows the tab (the same browser storage, a storage event in every other window of this site) */
window.addEventListener("storage", (event) => {
  if (event.key !== WATCH_TAB_KEY || !LISTS.some((l) => l.id === "watch")) return;
  const on = event.newValue === "1";
  if (on === (LIST === "watch")) return;
  LIST = on ? "watch" : "default"; paintChips(); load(on);
});
</script>
