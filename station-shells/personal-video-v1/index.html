<title>SCINTILLA · video pane</title>
<!-- ============================================================================
     SCINTILLA · /pane-video — BUILT FOR THE PANE, not a page squeezed into one.

     Why this exists. /feed-a and /feed-b are full pages. Dropped into a deck
     slot they spend their height on chrome — header, chip row, tools row, a
     hint paragraph, a footer — and the videos end up below the fold. Alan
     opened the deck and saw "Nothing is playing and nothing was chosen for
     you" with no video to click. The data was fine (2,980 videos, every one
     with a thumbnail). The layout was the bug.

     So this is a different thing, sized for a box:
       · THUMBNAILS FIRST. A grid that counts its own columns from its own
         width — 1 column in a phone slot, 5 across an Apple TV third. The
         first thing in the pane is always a picture of a video.
       · ONE thin bar of chrome. Nothing else competes for height.
       · CLICK ONE AND IT PLAYS IN PLACE. The grid gives way to the player
         inside the same box. Back is one tap and you are on the grid again.
       · IT STILL NEVER PICKS FOR YOU. Opens on the grid. ?v= is the only
         preselect, because that is you asking by id.

     PICTURE-IN-PICTURE. The pane keeps the chosen video in its own URL
     (?v=), so whatever hosts it can lift the exact same view — same video —
     into a floating Document Picture-in-Picture window. The deck's PiP
     button does that. Where the browser supports Document PiP and we are
     top-level, the button here does it directly.

     Params: ?feed=personal|scintilla|market · ?list=default|all|shorts|watch · ?v=VIDEOID
             · ?autoplay=1 · ?limit=60 (10-200) · ?t=MU · ?cols=N (force)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-PANEVIDEO-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-btn-size:8px; --ipad-btn-pad-y:3px; --ipad-btn-pad-x:7px;
  --ipad-title-size:9.5px; --ipad-caption-size:8px;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; display:flex; flex-direction:column;
  overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }

/* ---- ONE thin bar. This is the entire chrome budget. ---- */
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px;
  padding-top:calc(4px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  background:var(--panel2); overflow:hidden; }
#bar::-webkit-scrollbar{ display:none; }
.k{ flex:none; color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; }
.btn{ flex:none; font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink3); cursor:pointer;
  text-decoration:none; white-space:nowrap; }
button.btn{ appearance:none; border-radius:0; font-family:var(--mono); line-height:normal; }
.btn:hover{ color:var(--ink); border-color:var(--hair); }
.btn.on{ color:var(--crk); border-color:var(--crk); }
.btn.out{ color:var(--vol); border-color:rgba(255,138,0,.35); }
.btn:disabled{ color:var(--mute); border-color:var(--line); cursor:default; opacity:.48; }
#chips{ flex:1 1 0; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
#chips::-webkit-scrollbar{ display:none; }
#q{ display:none; flex:1 1 90px; min-width:70px; background:var(--bg); border:1px solid var(--line);
  color:var(--ink); font-family:var(--mono); font-size:11px; padding:3px 6px; outline:none;
  border-radius:0; -webkit-appearance:none; }
body.searching #q{ display:block; }
#q:focus{ border-color:var(--crk); }
#bFull{ margin-left:0; }

/* ---- THE GRID. Thumbnails, counted from our own width. ---- */
#grid{ flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; display:grid; gap:1px; align-content:start;
  grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); background:var(--line); }
.card{ background:var(--bg); cursor:pointer; display:flex; flex-direction:column; min-width:0; }
.card:hover{ background:var(--panel2); }
.card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
.thumb{ position:relative; width:100%; aspect-ratio:16/9; background:#12121c; overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.star{ position:absolute; top:0; right:0; width:34px; height:34px; padding:0; z-index:2;
  box-sizing:border-box; border:0; border-radius:0; background:transparent;
  color:var(--ink); cursor:pointer;
  -webkit-text-stroke:.35px #000; text-shadow:0 1px 3px #000,0 0 8px #000,0 0 2px #000; }
.star > span{ position:absolute; top:1px; right:1px; font:19px/1 var(--mono); }
.star:hover{ color:var(--ink); }
.star.on{ color:var(--vol); }
.star.unk{ opacity:.65; }
#wlFlash{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:60; pointer-events:none;
  font:600 11px/1.5 var(--mono); letter-spacing:.05em; color:#ffd24a;
  background:rgba(10,12,16,.92); border:1px solid #2a2f3a; border-radius:6px; padding:6px 12px;
  opacity:0; transition:opacity .18s; max-width:88%; text-align:center; }
#wlFlash.show{ opacity:1; }
.dur{ position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.82); color:#fff;
  font-size:8px; padding:1px 4px; letter-spacing:.02em; }
.tk{ position:absolute; left:3px; top:3px; background:rgba(0,212,255,.9); color:#04040a;
  font-size:8px; padding:1px 4px; letter-spacing:.04em; font-weight:600; }
.cap{ padding:4px 5px 6px; }
.cap .t{ color:var(--ink2); font-size:9.5px; line-height:1.3; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.cap .s{ color:var(--mute); font-size:8px; margin-top:2px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; display:block; }
/* very small slots: drop the caption, the picture is the interface */
body.tiny .cap .s{ display:none; }
body.tiny .cap{ padding:3px 4px 4px; }
body.tiny .cap .t{ -webkit-line-clamp:2; font-size:9px; }
html[data-view="desk"] .btn{ font-size:9px; padding:4px 8px; }
html[data-view="desk"] .cap .t{ font-size:11px; }
html[data-view="desk"] .cap .s{ font-size:8.5px; }
html[data-view="ipad"] .btn{ font-size:var(--ipad-btn-size); padding:var(--ipad-btn-pad-y) var(--ipad-btn-pad-x); }
html[data-view="ipad"] .cap .t{ font-size:var(--ipad-title-size); }
html[data-view="ipad"] .cap .s{ font-size:var(--ipad-caption-size); }
html[data-view="compact"] .btn{ font-size:7px; padding:2px 5px; }
html[data-view="compact"] .cap .t{ font-size:8.5px; }

/* ---- THE PLAYER. Same box, no navigation away. ---- */
#stage{ display:none; flex:1 1 0; min-height:0; flex-direction:column; }
body.playing #stage{ display:flex; }
body.playing #grid{ display:none; }
#video{ flex:1 1 0; min-height:0; position:relative; background:#000; }
#video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
#transport{ display:none; flex:1 1 0; min-width:0; align-items:center; justify-content:flex-end; gap:4px;
  overscroll-behavior:contain; touch-action:manipulation; }
body.playing #transport{ display:flex; }
#nowq{ flex:none; color:var(--mute); font-size:7.5px; letter-spacing:.08em; white-space:nowrap; }
.transport{ width:48px; padding-left:0; padding-right:0; text-align:center; }
#bMenu{ width:32px; padding-left:0; padding-right:0; text-align:center; }
#bContinue{ display:none; color:var(--vol); border-color:rgba(255,138,0,.55); }
body[data-autoplay-blocked="true"] #bContinue{ display:inline-block; }
#more{ position:fixed; z-index:5; right:6px; top:calc(32px + env(safe-area-inset-top)); width:min(190px,calc(100% - 12px));
  padding:5px; border:1px solid var(--hair); background:rgba(10,10,15,.98); box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:flex; flex-direction:column; gap:4px; }
#more[hidden]{ display:none; }
#more .btn{ width:100%; text-align:left; overflow:hidden; text-overflow:ellipsis; }
#more a.btn{ display:block; }
body.playing #chips{ display:none; }
@media (max-width:480px){
  body.playing .k{ display:none; }
}
@media (max-width:340px){
  #transport{ gap:2px; }
  .transport{ width:38px; }
  #bMenu{ width:28px; }
  #bContinue{ max-width:92px; padding-left:4px; padding-right:4px; overflow:hidden; text-overflow:ellipsis; }
}
.msg{ grid-column:1/-1; padding:16px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; text-align:center; background:var(--bg); }
</style>

<script>

const PUBLIC = "sb_publishable_AutibLpFtTns-WHAg67Pvw_I0HmjqE9";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries; let lastErr;
  for (let i = 0; i < tries; i++) {

let ROWS = [], BYID = {}, CUR = null, WATCH = new Set(), WATCH_READY = false, WATCH_ERROR = "";
const LOCAL_SUBSCRIBED_CHANNELS = new Set(), SUBSCRIBE_PENDING = new Set();
const SUBSCRIPTION_ACCOUNT = FEED === "scintilla" ? "scintilla" : "personal";

/* The database is the sole saved resume authority.  This Map is page memory
   only; closing or switching devices cannot create a second private history. */
const VIDEO_POSITION_SAVE_MS = 10000;
const VIDEO_POSITION_NEAR_END_SECONDS = 12;
const VIDEO_POSITION_INITIAL_WAIT_MS = 1500;

function resumePositionFor(videoId, positions = VIDEO_POSITIONS) {
  const time = Number(positions.get(videoId)?.time) || 0;
  return time > 5 ? Math.floor(time) : 0;
}
function mergeSharedVideoPositionRows(rows, positions = VIDEO_POSITIONS) {
  if (!Array.isArray(rows)) return;
  positions.clear();
  rows.forEach((row) => {
    const videoId = String(row?.video_id || ""), time = Number(row?.t) || 0;
    if (!videoId) return;
    if (time > 5) positions.set(videoId, { time:Math.floor(time), updated:String(row?.updated || "") });
  });
}
function syncSharedVideoPositions(force = false) {
  if (VIDEO_POSITION_REQUEST && !force) return VIDEO_POSITION_REQUEST;
  VIDEO_POSITION_REQUEST = pg("yt_positions?select=video_id,t,updated&order=updated.desc")
    .then((rows) => { mergeSharedVideoPositionRows(rows); VIDEO_POSITIONS_READY = true; return rows; })
    .catch(() => { VIDEO_POSITION_REQUEST = null; return []; });
  return VIDEO_POSITION_REQUEST;
}
function pushSharedVideoPosition(videoId, time) {
  if (!videoId) return;
  const t = Math.max(0, Math.floor(Number(time) || 0));
  try {
    fetch(SB + "/rest/v1/yt_positions", {
      method:"POST",
      headers:{ apikey:ANON, Authorization:"Bearer " + ANON, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body:JSON.stringify({ video_id:videoId, t, updated:new Date().toISOString() })

function writeVideoPosition(videoId, time, duration, positions = VIDEO_POSITIONS) {
  if (!videoId) return;
  const t = Number(time) || 0, d = Number(duration) || 0;
  const complete = t <= 5 || (d && t >= d - VIDEO_POSITION_NEAR_END_SECONDS);
  if (complete) positions.delete(videoId);
  else positions.set(videoId, { time:Math.floor(t), updated:new Date().toISOString() });
  pushSharedVideoPosition(videoId, complete ? 0 : t);

  writeVideoPosition(videoId, 0, 0, positions);
}

      VIDEO_POSITION_REQUEST,

function saveActiveVideoPosition(force = false) {

  const b = el("bWatch");
  b.disabled = !v;
  if (!WATCH_READY) {
    /* Saved-or-not is unknown until the shared saved-set read lands; the button may not
       claim "save to watch later" — that is the unsaved claim — while nothing is known. */
    b.textContent = WATCH_ERROR ? "watch later — state unknown" : "watch later…";
    b.classList.remove("on");
    b.title = WATCH_ERROR
      ? "the shared saved-list read failed — saved-or-not is unknown, not “unsaved” · a click retries the read"
      : "the saved-list read has not landed yet";
    b.setAttribute("aria-label", b.textContent);
    return;
  }
  const saved = !!v && WATCH.has(v.video_id);
  b.textContent = saved ? "remove from watch later" : "save to watch later";
  b.classList.toggle("on", saved);
  b.title = "";
  b.setAttribute("aria-label", b.textContent);
}

function channelSubscribed(v, account = SUBSCRIPTION_ACCOUNT) {
  const accountMatch = Array.isArray(v?.subscription_accounts) && v.subscription_accounts.includes(account);
  return accountMatch || LOCAL_SUBSCRIBED_CHANNELS.has(account + ":" + String(v?.channel_id || ""));
}

async function subscribeToChannel(v) {
  const channelId = String(v?.channel_id || "");
  if (!channelId || channelSubscribed(v) || SUBSCRIBE_PENDING.has(channelId)) return;
  SUBSCRIBE_PENDING.add(channelId); refreshSubscribeButton();
  try {
    const d = await ytAct("sub", { channelId, channelTitle: v.channel || "", account:SUBSCRIPTION_ACCOUNT });
    if (!d.ok) throw new Error("YouTube subscribe failed");
    LOCAL_SUBSCRIBED_CHANNELS.add(SUBSCRIPTION_ACCOUNT + ":" + channelId);
  } catch (e) { wlFlash("subscribe failed — the shared write did not land · try again"); } finally {
    SUBSCRIBE_PENDING.delete(channelId); refreshSubscribeButton();
  }
}

function refreshSubscribeButton(v = CUR) {
  const b = el("bSubscribe");
  const channelId = String(v?.channel_id || "");
  const eligible = !!channelId;
  b.style.display = eligible ? "" : "none";
  if (!eligible) return;
  const done = channelSubscribed(v), pending = SUBSCRIBE_PENDING.has(channelId);
  b.textContent = done ? "subscribed" : pending ? "adding…" : "subscribe";
  b.classList.toggle("on", done);
  b.title = done ? "already subscribed to " + (v.channel || "this channel") : "subscribe to " + (v.channel || "this channel");
  b.setAttribute("aria-label", b.title);
}

/* ---- columns counted from OUR width, not the window ---- */
function relayout() {
  const w = document.documentElement.clientWidth;
  let cols = FORCE || (w < 210 ? 1 : w < 340 ? 2 : w < 520 ? 3 : w < 760 ? 4 : w < 1100 ? 5 : 6);
  document.body.classList.toggle("tiny", w < 340);
  el("grid").style.setProperty("--cols", cols);
}
let raf = 0;
const nudge = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; applyIpadPaneScale(); relayout(); }); };
if (window.ResizeObserver) new ResizeObserver(nudge).observe(document.documentElement);
addEventListener("resize", nudge); addEventListener("orientationchange", nudge);

/* ---- play IN PLACE ---- */
function syncUrl() {
  const p = new URLSearchParams(location.search);
  if (CUR) p.set("v", CUR.video_id); else p.delete("v");
  p.set("feed", FEED); p.set("list", LIST);
  history.replaceState(null, "", "?" + p.toString());
}
function queueRows(rows, list, watch) {
  return list === "watch" ? rows.filter((v) => watch.has(v.video_id)) : rows.slice();
}
const UNAVAILABLE_VIDEO_IDS = new Set();
function queuedVideo(rows, currentId, direction, skipped = new Set()) {
  const at = rows.findIndex((v) => v.video_id === currentId);
  if (at < 0) return null;
  const step = direction < 0 ? -1 : 1;
  for (let i = at + step; i >= 0 && i < rows.length; i += step) {
    if (!skipped.has(rows[i].video_id) && !UNAVAILABLE_VIDEO_IDS.has(rows[i].video_id)) return rows[i];
  }
  return null;
}
function nextQueuedVideo(rows, currentId, skipped = new Set()) {
  return queuedVideo(rows, currentId, 1, skipped);
}
function previousQueuedVideo(rows, currentId, skipped = new Set()) {
  return queuedVideo(rows, currentId, -1, skipped);
}
function visibleQueue() {
  return queueRows(ROWS, LIST, WATCH);
}
function refreshTransport() {
  const rows = visibleQueue(), currentId = CUR?.video_id || "";
  const at = rows.findIndex((v) => v.video_id === currentId);
  el("bPrev").disabled = !CUR || !previousQueuedVideo(rows, currentId);
  el("bNext").disabled = !CUR || !nextQueuedVideo(rows, currentId);
  el("nowq").textContent = at >= 0 ? (at + 1) + " / " + rows.length : "";
  setTransportNotice(at >= 0 ? "video " + (at + 1) + " of " + rows.length : "video queue");
}
function setTransportNotice(message) {
  const queue = el("nowq");
  queue.title = message || "";
  queue.setAttribute("aria-label", message || "video queue");
}
function refreshPlayerControls(v = CUR) {
  if (!v) return;
  refreshTransport(); refreshWatchButton(v);
}
function ytApiReady() {
  return !!(window.YT && window.YT.Player);
}
function waitForYouTubePlayerApi() {
  if (ytApiReady()) return Promise.resolve(window.YT);
  return new Promise((resolve, reject) => {
    let script = document.getElementById("scintillaYouTubeIframeApi");
    if (!script) {
      script = document.createElement("script");
      script.id = "scintillaYouTubeIframeApi";
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      document.head.appendChild(script);
    }
    let settled = false;
    const finish = (error) => {
      if (settled) return;
      settled = true; clearInterval(poll); clearTimeout(deadline);
      if (error) reject(error); else resolve(window.YT);
    };
    const poll = setInterval(() => { if (ytApiReady()) finish(); }, 100);
    const deadline = setTimeout(() => finish(new Error("YouTube player API unavailable")), 15000);
    script.addEventListener("error", () => finish(new Error("YouTube player API failed to load")), { once:true });
  });
}
function ensureYouTubePlayerHost() {
  if (el("ytPlayer")) return;
  const host = document.createElement("div"); host.id = "ytPlayer";
  el("video").appendChild(host);
}
function playerEventVideoId(event) {
  try { return String(event?.target?.getVideoData?.()?.video_id || ""); } catch (_) { return ""; }
}
function playerEventMatchesRequest(event, request = YT_PLAYER_REQUEST) {
  if (!request || request.token !== PLAYER_TOKEN) return false;
  const deliveredId = playerEventVideoId(event);
  return !deliveredId || deliveredId === request.video.video_id;
}
function isUnavailablePlayerError(code) {
  return [2, 5, 100, 101, 150, 153].includes(Number(code));
}
function setAutoplayBlockedState(blocked, request = YT_PLAYER_REQUEST) {
  PLAYER_AUTOPLAY_BLOCKED = !!blocked;
  document.body.dataset.autoplayBlocked = blocked ? "true" : "false";
  if (blocked) console.warn("Station YouTube autoplay blocked", request?.video?.video_id || "");
}
function clearPlayerFallback() {
  if (PLAYER_FALLBACK) clearTimeout(PLAYER_FALLBACK);
  PLAYER_FALLBACK = 0;
}
function handlePlayerStateChange(event) {
  const request = YT_PLAYER_REQUEST;
  if (!playerEventMatchesRequest(event, request)) return;
  PLAYER_ACCEPTED_TOKEN = request.token; clearPlayerFallback();
  captureActiveVideoPosition(event.target);
  if (Number(event.data) === 1) setAutoplayBlockedState(false, request);
  if (Number(event.data) !== 0 || PLAYER_ENDED_TOKEN === request.token) return;
  PLAYER_ENDED_TOKEN = request.token;
  clearPlayerPositionPoll();
  clearVideoPosition(request.video.video_id);
  PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
  advanceQueue();
}
function handlePlayerError(event) {
  const request = YT_PLAYER_REQUEST;
  if (!playerEventMatchesRequest(event, request) || !isUnavailablePlayerError(event.data) ||
      PLAYER_ERROR_TOKEN === request.token) return;
  PLAYER_ERROR_TOKEN = request.token; clearPlayerFallback();
  UNAVAILABLE_VIDEO_IDS.add(request.video.video_id);
  const nextSkipped = new Set(request.skipped); nextSkipped.add(request.video.video_id);
  setTransportNotice("skipping unavailable video");
  setTimeout(() => {
    if (request.token === PLAYER_TOKEN) stepQueue(request.direction, nextSkipped, request.originVideo);
  }, 900);
}
function handleAutoplayBlocked(event) {
  const request = YT_PLAYER_REQUEST;
  if (request?.auto && playerEventMatchesRequest(event, request)) {
    clearPlayerFallback(); setAutoplayBlockedState(true, request);
  }
}
function ensureOfficialYouTubePlayer() {
  if (YT_PLAYER && YT_PLAYER_READY) return Promise.resolve(YT_PLAYER);
  if (YT_PLAYER_CREATE) return YT_PLAYER_CREATE;
  ensureYouTubePlayerHost();
  YT_PLAYER_CREATE = waitForYouTubePlayerApi().then(() => new Promise((resolve) => {
    YT_PLAYER = new YT.Player("ytPlayer", {
      width:"100%", height:"100%",
      playerVars:{ autoplay:0, rel:0, playsinline:1, modestbranding:1, origin:location.origin },
      events:{
        onReady:(event) => {
          YT_PLAYER_READY = true;
          try {
            const frame = event.target.getIframe();
            frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
          } catch (_) {}
          resolve(event.target);
        },
        onStateChange:handlePlayerStateChange,
        onError:handlePlayerError,
        onAutoplayBlocked:handleAutoplayBlocked
      }
    });
  })).catch((error) => {
    YT_PLAYER_CREATE = null; YT_PLAYER = null; YT_PLAYER_READY = false;
    throw error;
  });
  return YT_PLAYER_CREATE;
}
function applyPlayerRequest(player, request) {
  if (!player || !playerEventMatchesRequest(null, request)) return;
  const video = { videoId:request.video.video_id, startSeconds:request.resumeAt || 0 };
  try {
    const frame = player.getIframe();
    frame.title = request.video.title || request.video.video_id;
  } catch (_) {}
  PLAYER_ACCEPTED_TOKEN = 0; PLAYER_ENDED_TOKEN = 0; PLAYER_ERROR_TOKEN = 0;
  setAutoplayBlockedState(false, request);
  if (request.auto) player.loadVideoById(video); else player.cueVideoById(video);
  startPlayerPositionPoll(request.token);
}
function restoreQueueOrigin(originVideo, direction) {
  if (!originVideo) return;
  const message = direction < 0 ? "no previous playable video" : "end of playable queue";
  play(originVideo, false).then(() => {
    if (CUR?.video_id === originVideo.video_id) setTransportNotice(message);
  });
}
function stepQueue(direction = 1, skipped = new Set(), originVideo = CUR) {
  if (!originVideo) return false;
  const next = queuedVideo(visibleQueue(), originVideo.video_id, direction, skipped);
  if (!next) {
    if (CUR?.video_id !== originVideo.video_id) restoreQueueOrigin(originVideo, direction);
    else { refreshTransport(); setTransportNotice(direction < 0 ? "start of queue" : "end of queue"); }
    return false;
  }
  play(next, true, true, skipped, direction, originVideo); return true;
}
function advanceQueue(skipped = new Set()) {
  return stepQueue(1, skipped, CUR);
}
function armPlayerFallback(token, skipped) {
  clearPlayerFallback();
  PLAYER_FALLBACK = setTimeout(() => {
    if (token !== PLAYER_TOKEN || PLAYER_ACCEPTED_TOKEN === token || !CUR) return;
    const request = YT_PLAYER_REQUEST;
    UNAVAILABLE_VIDEO_IDS.add(CUR.video_id);
    const nextSkipped = new Set(skipped); nextSkipped.add(CUR.video_id);
    setTransportNotice("skipping unavailable video");
    stepQueue(request?.direction || 1, nextSkipped, request?.originVideo || CUR);
  }, 10000);
}
async function play(v, auto, queued = false, skipped = new Set(), direction = 1, originVideo = null,
                    userGesture = false) {
  if (!v) return;
  captureActiveVideoPosition();
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback();
  const token = ++PLAYER_TOKEN;
  /* A card click must reach the already-primed official player during the
     same user gesture.  Use the shared resume value already in page memory;
     never put a fresh network wait between that click and loadVideoById.
     Background/URL/queue playback may still take the bounded shared read. */
  const resumeAt = userGesture ? resumePositionFor(v.video_id) : await resumePositionBeforePlay(v.video_id);
  if (token !== PLAYER_TOKEN) return;
  CUR = v;
  PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
  YT_PLAYER_REQUEST = { token, video:v, auto:!!auto, queued:!!queued, skipped:new Set(skipped),
    direction:direction < 0 ? -1 : 1, originVideo:originVideo || v, resumeAt };
  document.body.classList.add("playing");
  refreshPlayerControls(v);
  el("bBack").style.display = "";
  el("bYt").style.display = ""; el("bYt").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.video_id);
  el("bYt").textContent = IOS ? "open in youtube app ↗" : "open in youtube ↗";
  el("bPip").style.display = canPip() ? "" : "none";
  refreshSubscribeButton(v);
  syncUrl();
  if (queued) armPlayerFallback(token, skipped);
  if (YT_PLAYER && YT_PLAYER_READY) {
    applyPlayerRequest(YT_PLAYER, YT_PLAYER_REQUEST); return YT_PLAYER;
  }
  try {
    const player = await ensureOfficialYouTubePlayer();
    if (token === PLAYER_TOKEN) applyPlayerRequest(player, YT_PLAYER_REQUEST);
    return player;
  } catch (error) {
    if (token === PLAYER_TOKEN) console.error("Station YouTube player unavailable", error);
    return null;
  }
}
function playFromUserGesture(v) {
  return play(v, true, false, new Set(), 1, null, true);
}
function back() {
  captureActiveVideoPosition();
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback(); ++PLAYER_TOKEN; YT_PLAYER_REQUEST = null; PLAYER_ACCEPTED_TOKEN = 0;
  try { if (YT_PLAYER_READY) YT_PLAYER.stopVideo(); } catch (_) {}
  CUR = null;
  document.body.classList.remove("playing");
  el("bBack").style.display = "none";
  setMenuOpen(false); setAutoplayBlockedState(false); refreshWatchButton(); refreshTransport();
  syncUrl(); paint();
}
el("bBack").addEventListener("click", back);
el("bPrev").addEventListener("click", () => stepQueue(-1));
el("bNext").addEventListener("click", () => stepQueue(1));
el("bContinue").addEventListener("click", () => {
  try { if (YT_PLAYER_READY) YT_PLAYER.playVideo(); } catch (_) {}
});
function setMenuOpen(open) {
  const menu = el("more"), button = el("bMenu");
  menu.hidden = !open; button.setAttribute("aria-expanded", open ? "true" : "false");
}
el("bMenu").addEventListener("click", () => setMenuOpen(el("more").hidden));
document.addEventListener("pointerdown", (event) => {
  if (!el("more").hidden && !el("more").contains(event.target) && !el("bMenu").contains(event.target)) setMenuOpen(false);
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") setMenuOpen(false); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { captureActiveVideoPosition(); saveActiveVideoPosition(true); }
});
window.addEventListener("pagehide", () => { captureActiveVideoPosition(); saveActiveVideoPosition(true); });

/* ---- PICTURE-IN-PICTURE ----
   Document PiP hosts real DOM, so it can carry the YouTube player into a
   floating always-on-top window. It needs a top-level context, so inside a
   deck pane this button hides and the DECK's pip button does the same job
   from the top level using this pane's own ?v= URL. */
function canPip() {
  try { return !!window.documentPictureInPicture && window.top === window.self; } catch (e) { return false; }
}
el("bPip").addEventListener("click", async () => {
  if (!CUR || !canPip()) return;
  try {
    const w = await documentPictureInPicture.requestWindow({ width: 480, height: 300 });
    const d = w.document;
    d.body.style.cssText = "margin:0;background:#000;height:100%";
    d.documentElement.style.height = "100%";
    const f = d.createElement("iframe");
    f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(CUR.video_id) +
            "?playsinline=1&rel=0&modestbranding=1&autoplay=1";
    d.body.appendChild(f);
  } catch (e) { /* user dismissed, or the browser said no */ }
  setMenuOpen(false);
});

/* ---- render ---- */
/* The card star may only claim saved-or-not from a LANDED read. Before the shared
   saved-set read lands — or after it fails — the state is unknown, and unknown is a
   said state, never painted as "unsaved". */
function starHTML(v) {
  if (FEED !== "scintilla") return "";
  if (!WATCH_READY) {
    const why = WATCH_ERROR ? "the saved-list read failed" : "the saved-list read has not landed yet";
    return '<button class="star unk" data-star="' + esc(v.video_id) + '" aria-label="watch-later state unknown" title="watch-later state unknown — ' + why + ' · a click retries the read"><span aria-hidden="true">?</span></button>';
  }
  const saved = WATCH.has(v.video_id);
  return '<button class="star' + (saved ? " on" : "") + '" data-star="' + esc(v.video_id) +
    '" aria-label="' + (saved ? "remove from" : "save to") + ' SCINTILLA Watch Later" title="' +
    (saved ? "remove from" : "save to") + ' SCINTILLA · Watch Later"><span aria-hidden="true">' +
    (saved ? "★" : "☆") + '</span></button>';
}

function paint() {
  const q = "";
  let rows = LIST === "watch" ? ROWS.filter((v) => WATCH.has(v.video_id)) : ROWS;
  rows = q ? rows.filter((v) => ((v.title || "") + " " + (v.channel || "") + " " + (v.tickers || "")).toLowerCase().indexOf(q) >= 0) : rows;
  if (!rows.length) { el("grid").innerHTML = '<div class="msg">' + (q ? "nothing matches" : "no videos in this list") + "</div>"; return; }
  el("grid").innerHTML = rows.map((v) =>
    '<div class="card' + (CUR && CUR.video_id === v.video_id ? " on" : "") + '" data-v="' + esc(v.video_id) + '">' +
      '<div class="thumb"><img loading="lazy" decoding="async" src="' +
        esc(v.thumb_url || ("https://i.ytimg.com/vi/" + v.video_id + "/mqdefault.jpg")) + '" alt="">' +
        starHTML(v) +
        (v.tickers ? '<span class="tk">' + esc(String(v.tickers).split(",")[0]) + "</span>" : "") +
        (v.duration ? '<span class="dur">' + esc(v.duration) + "</span>" : "") +
      "</div>" +
      '<div class="cap"><div class="t">' + esc(v.title) + "</div>" +
      '<div class="s">' + esc(v.channel || "") + "</div></div>" +
    "</div>").join("");
  for (const n of el("grid").querySelectorAll(".card"))
    n.addEventListener("click", () => playFromUserGesture(BYID[n.dataset.v]));
  for (const n of el("grid").querySelectorAll(".star"))
    n.addEventListener("click", (e) => { e.stopPropagation(); toggleWatch(BYID[n.dataset.star]); });
}

function paintChips() {
  const box = el("chips"); box.innerHTML = "";
  for (const l of LISTS) {
    const b = document.createElement("span");
    b.className = "btn" + (l.id === LIST ? " on" : "");
    b.textContent = l.n;
    b.addEventListener("click", () => { LIST = l.id; paintChips(); load(LIST === "watch"); });
    box.appendChild(b);
  }
}

async function load(forceWatch, quiet) {
  if (!quiet && !ROWS.length) el("grid").innerHTML = '<div class="msg">loading…</div>';
  if (LIST === "watch") {
    try { await syncWatch(!!forceWatch); }
    catch (e) {
      WATCH_READY = false; WATCH_ERROR = e.message || "Watch Later unavailable";
    }
  }
  let q = "youtube_feed?select=video_id,title,channel,channel_id,tickers,duration,is_short,thumb_url,published_at,subscription_accounts" +
          "&order=published_at.desc&limit=" + LIMIT;
  const chosen = LISTS.find((l) => l.id === LIST);
  if (LIST === "watch") {
    if (WATCH_ERROR) {
      if (quiet && ROWS.length) return;
      ROWS = []; BYID = {};
      el("grid").innerHTML = '<div class="msg">the watch-later read failed — the saved list is unavailable, not empty · retrying at the next refresh</div>';
      relayout(); return;
    }
    if (!WATCH.size) { ROWS = []; BYID = {}; paint(); relayout(); return; }
    q += "&video_id=in.(" + Array.from(WATCH).slice(0, 200).map(encodeURIComponent).join(",") + ")";
  } else q += chosen.q;
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  let rows;
  try { rows = await pg(q); }
  catch (e) {
    if (!quiet || !ROWS.length) el("grid").innerHTML = '<div class="msg">feed unavailable</div>';
    return;
  }
  const accountsFor = (video) => Array.isArray(video?.subscription_accounts)
    ? video.subscription_accounts.map((account) => String(account).toLowerCase()) : [];
  const nextRows = (Array.isArray(rows) ? rows : []).filter((video) => {
    if (FEED !== "scintilla" || LIST === "watch") return true;
    const accounts = accountsFor(video);
    return !accounts.length || accounts.includes("scintilla");
  });
  const signature = (items) => items.map((v) => [v.video_id, v.title, v.channel, v.published_at,
    Array.isArray(v.subscription_accounts) ? v.subscription_accounts.join("+") : ""].join("|")).join("\n");
  const changed = signature(nextRows) !== signature(ROWS);
  ROWS = nextRows;
  BYID = {}; for (const v of ROWS) BYID[v.video_id] = v;
  if (changed || !quiet) { paint(); relayout(); refreshTransport(); }
  /* the ONLY preselect: you asked for a video by id */
  if (START && BYID[START]) play(BYID[START], AUTO);
}

function togglePaneFull() {
  parent.postMessage({ type: "SCINTILLA_DECK_TOGGLE_FULL" }, location.origin);
  setMenuOpen(false);
}
el("bFull").addEventListener("click", togglePaneFull);
el("bMenuFull").addEventListener("click", togglePaneFull);
el("bWatch").addEventListener("click", () => { toggleWatch(CUR); setMenuOpen(false); });
el("bSubscribe").addEventListener("click", () => { subscribeToChannel(CUR); setMenuOpen(false); });
el("bYt").addEventListener("click", () => setMenuOpen(false));
el("bCover").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_MEDIA_COVER_X" }, location.origin);
  setMenuOpen(false);
});
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    relayout(); return;
  }
  if (event.data?.type === "SCINTILLA_DECK_FULL_STATE") {
    const stage = +event.data.stage || 0;
    el("bFull").textContent = stage === 2 ? "↙ youtube" : stage === 1 ? "↙ normal" : "⛶";
    el("bFull").title = stage === 2 ? "return to YouTube region" : stage === 1 ? "return to normal media layout" : "expand across YouTube region";
    el("bMenuFull").textContent = stage === 2 ? "return to youtube region" : stage === 1 ? "return to normal layout" : "expand pane";
    el("bCover").style.display = event.data.canCoverX ? "" : "none";
  }
});
async function start() {
  paintChips(); relayout(); load();
  syncSharedVideoPositions();
  /* Prime one official player object behind the hidden stage.  Selecting or
     advancing a video then loads into this same object rather than replacing
     the iframe, retaining the browser's playback grant across the queue. */
  ensureOfficialYouTubePlayer().catch(() => {});
  /* Start the shared local saved-set read alongside the ordinary feed.  This
     never contacts YouTube, and means opening Watch Later normally has its
     IDs ready instead of placing that database read on the click path. */
  syncWatch().then(() => { refreshWatchButton(); if (ROWS.length) paint(); }).catch(() => {
    /* A failed read is never data: name it, and let the button and card stars paint
       UNKNOWN rather than "unsaved". The 120s pass and any star click retry the read. */
    WATCH_READY = false; WATCH_ERROR = WATCH_ERROR || "the saved-list read failed";
    refreshWatchButton(); if (ROWS.length) paint();
  });
  /* Keep the stored feed current without touching the YouTube API on every
     pass. */
  setInterval(() => {
    if (document.visibilityState === "visible" && !CUR) load(false, true);
  }, 120000);
}
start();
