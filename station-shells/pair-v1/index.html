<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station · live pair</title>
<!-- W6 (22 Oct 2026). Alan, ~19:10 ET: "if it would be like a risk, if the chart works or doesn't work, then what I need is the chart,
     like a separate kind of like layout kind of thing … Maybe if you establish the rotation that I have on TradingView, could be good …
     maybe a two chart version like that I just track, and that's like even more live than TradingView and how what I use to like
     confirm kind of things."
     THIS PAGE is that confirm screen: two live-v1 charts side by side (5-minute, the whole tape), rotating the way his TradingView
     rotation does - chart A on his FLASH WATCH lane 0 (indexes + macro; SPY / QQQ become ESUSD / NQUSD, the chart API's futures,
     outside 09:30-18:00 New York on weekdays - his rule), chart B on lane 1 (the radar: station_lists · radar, the list his Hub keeps),
     20 s a name. Standalone, its own URL; nothing on the WIDGETS wall changes.
     A name his TradingView lists that the chart API does not track at 5 minutes is skipped, never shown as an error, and named in the
     small print. The pointer on a chart holds that chart's rotation; each chart has its lane, the name now and next, PAUSE / PLAY,
     NEXT, and a box to show any symbol (which pauses that chart until PLAY).
     ?session=day|night pins the session (for a proof); otherwise the New York clock decides. Reads: the provider client's ownership
     proof (shared with the two charts), one Supabase GET of the radar list; it writes nothing. -->
<style>
:root{ --bg:#0A0A0F; --panel2:#0F0F17; --line:#1A1A2A; --line2:#252538; --ink2:#C8C8D8; --ink3:#9A9AB6; --dim:#868AAA; --mute:#6E6E80;
  --crk:#00D4FF; --bull:#00FFA3; --late:#c8953a; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink3); font:11px var(--mono); overflow:hidden; }
body{ display:flex; flex-direction:column; }
#pair{ flex:1 1 0; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px 4px 0; }
.side{ display:flex; flex-direction:column; min-width:0; min-height:0; border:1px solid var(--line); }
.side.held{ border-color:rgba(0,212,255,.45); }
.bar{ flex:none; height:24px; display:flex; align-items:center; gap:8px; padding:0 8px; background:var(--panel2); border-bottom:1px solid var(--line);
  white-space:nowrap; overflow:hidden; font-size:10px; letter-spacing:.06em; }
.bar .lane{ color:var(--crk); text-transform:uppercase; letter-spacing:.12em; font-size:9.5px; }
.bar .now{ color:var(--ink2); font-weight:600; letter-spacing:.1em; }
.bar .next{ color:var(--mute); }
.bar .hold{ color:var(--late); }
.bar button{ font:10px var(--mono); color:var(--ink3); background:transparent; border:1px solid var(--line2); padding:0 7px; height:18px; cursor:pointer; }
.bar button:hover{ color:var(--ink2); border-color:var(--dim); }
.bar input{ margin-left:auto; width:84px; height:18px; background:transparent; color:var(--ink2); border:1px solid var(--line2); padding:0 6px;
  font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; outline:none; }
.bar input:focus{ border-color:var(--crk); color:var(--crk); }
.chart{ flex:1 1 0; min-height:0; width:100%; border:0; display:block; background:var(--bg); }
#fine{ flex:none; padding:3px 10px 4px; color:var(--mute); font-size:9px; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#fine b{ color:var(--dim); font-weight:600; }
</style>
</head>
<body>
<main id="pair">
  <section class="side" id="sideA">
    <div class="bar"><span class="lane"></span><span class="now"></span><span class="next"></span><span class="hold"></span>
      <button type="button" class="pp" title="Pause / play this chart's rotation">⏸</button><button type="button" class="nx" title="The next name now">⏭</button>
      <input class="box" spellcheck="false" placeholder="SYMBOL" aria-label="Show a symbol on this chart"></div>
    <iframe class="chart" title="Chart A"></iframe>
  </section>
  <section class="side" id="sideB">
    <div class="bar"><span class="lane"></span><span class="now"></span><span class="next"></span><span class="hold"></span>
      <button type="button" class="pp" title="Pause / play this chart's rotation">⏸</button><button type="button" class="nx" title="The next name now">⏭</button>
      <input class="box" spellcheck="false" placeholder="SYMBOL" aria-label="Show a symbol on this chart"></div>
    <iframe class="chart" title="Chart B"></iframe>
  </section>
</main>
<footer id="fine"></footer>
<script src="/_provider/provider.js"></script>
<script>
"use strict";
try { scBindProviderClient(); } catch (_) {}
const QS = new URLSearchParams(location.search);
const CLEAN = (t) => String(t || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 12);

/* ---- his lanes (read off his rotation scripts, /Users/alanharvey/Claude/CLAUDE SET UP/daily-report/tv, read-only) ---------------------
   claude_rotation.js, FLASH WATCH: lane 0 "WATCH left cycle (macro + indexes)" and lane 1 "Hub Radar (priority)", 20 s each.
   "SPY*" / "QQQ*" = SPY / QQQ during 09:30-18:00 New York on weekdays, the index futures otherwise (his resolve()). */
const LANE_A = Object.freeze({ name:"lane 0 · indexes + macro", list:Object.freeze(["SPY*", "QQQ*", "TVC:USOIL", "TVC:US10Y", "BATS:NVDA", "TVC:VIX",
  "BATS:MU", "SPY*", "QQQ*", "USI:PCC", "USI:ADD", "BATS:SMH", "BATS:NBIS", "TVC:US03MY"]) });
/* lane 1's own list, used only when the radar cannot be read (said so in the small print) */
const LANE_B_TV = Object.freeze(["BATS:MU", "BATS:NBIS", "BATS:GOOGL", "BATS:AMZN", "BATS:IREN", "BATS:AVGO", "BATS:BE", "BATS:VST", "BATS:NVDA",
  "CRYPTO:BTCUSD", "BATS:CRDO", "BATS:CBRS", "BATS:WMT", "BATS:WDC", "BATS:SNDK", "BATS:ORCL", "BATS:NFLX", "BATS:CAT", "NASDAQ:AAOI", "BATS:TSM",
  "BATS:APLD", "BATS:SHOP", "NASDAQ:QCOM"]);
const DWELL_MS = 20000;

/* ---- New York time, and his session rule ---------------------------------------------------------------------------------------- */
const ET_FMT = new Intl.DateTimeFormat("en-US", { timeZone:"America/New_York", weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23" });
function etNow(ms) { const p = {}; for (const x of ET_FMT.formatToParts(new Date(ms))) p[x.type] = x.value; return { dow:p.weekday, min:(+p.hour % 24) * 60 + +p.minute }; }
/* his FLASH WATCH rule (resolve()): the cash names on weekdays 09:30-18:00 New York, the futures otherwise. ?session= pins it. Pure. */
function cashSession(ms, pinned) {
  if (pinned === "day") return true;
  if (pinned === "night") return false;
  const e = etNow(ms);
  return e.dow !== "Sat" && e.dow !== "Sun" && e.min >= 570 && e.min < 1080;
}
/* his TradingView name -> the chart API's: the exchange prefix dropped; his futures and oil named as ours. Pure. */
const OURS = Object.freeze({ "ES1!":"ESUSD", "NQ1!":"NQUSD", "USOIL":"CLUSD", "CL1!":"CLUSD", "GOLD":"GCUSD", "SILVER":"SIUSD", "GC1!":"GCUSD", "SI1!":"SIUSD" });
function ourSymbol(tv, cash) {
  const raw = String(tv || "").trim().toUpperCase();
  if (raw.endsWith("*")) { const b = raw.slice(0, -1); return cash ? b : b === "SPY" ? "ESUSD" : b === "QQQ" ? "NQUSD" : b; }
  const bare = raw.includes(":") ? raw.slice(raw.lastIndexOf(":") + 1) : raw;
  return OURS[bare] || bare;
}
/* Whether the chart API draws a name at 5 minutes: the provider's own equity universe or its macro names; the put/call series are
   daily (asked for 5 minutes, the API answers with daily bars). Pure. */
function tracked(sym, owned, isMacro, isPutCall) {
  if (isPutCall(sym)) return { ok:false, why:"daily only" };
  if (owned[sym] || isMacro(sym)) return { ok:true, why:"" };
  return { ok:false, why:"not tracked" };
}
/* A lane's names for this session: each of his names as ours, the ones the API cannot draw set aside with the reason. Pure. */
function laneFor(list, cash, owned, isMacro, isPutCall) {
  const show = [], skipped = [], mapped = [];
  for (const tv of list) {
    const sym = ourSymbol(tv, cash), t = tracked(sym, owned, isMacro, isPutCall);
    if (!t.ok) { if (!skipped.some((s) => s.tv === tv)) skipped.push({ tv, sym, why:t.why }); continue; }
    const bare = tv.replace(/\*$/, "").split(":").pop();
    if (bare !== sym && !mapped.some((m) => m.tv === tv)) mapped.push({ tv, sym });
    show.push(sym);
  }
  return { show, skipped, mapped };
}

/* ---- the two charts ------------------------------------------------------------------------------------------------------------- */
const PINNED = ["day", "night"].includes(QS.get("session")) ? QS.get("session") : null;
const SIDES = [
  { key:"A", n:1, el:document.getElementById("sideA"), laneName:LANE_A.name, tv:LANE_A.list },
  { key:"B", n:2, el:document.getElementById("sideB"), laneName:"lane 1 · radar", tv:LANE_B_TV }
];
for (const s of SIDES) Object.assign(s, { frame:s.el.querySelector("iframe"), show:[], skipped:[], mapped:[], idx:0, next:0, playing:true, manual:null,
  hover:false, activityAt:0, nowSym:null });
let OWNED = null, RADAR_NOTE = "", CASH = null;
const isMacro = (s) => !!(window.SC_PROVIDER && SC_PROVIDER.isMacroSymbol(s));
const isPutCall = (s) => !!(window.SC_PROVIDER && (SC_PROVIDER.isPutCallSymbol(s) || (SC_PROVIDER.isScintillaPutCallSymbol && SC_PROVIDER.isScintillaPutCallSymbol(s))));
function relane() {
  CASH = cashSession(Date.now(), PINNED);
  for (const s of SIDES) {
    const r = laneFor(s.tv, CASH, OWNED || {}, isMacro, isPutCall);
    s.show = r.show; s.skipped = r.skipped; s.mapped = r.mapped;
    if (s.idx >= s.show.length) s.idx = 0;
  }
  paintFine();
}
function frameSrc(s, sym) { return "/station-shells/live-v1/?t=" + encodeURIComponent(sym) + "&tf=5&n=" + s.n + "&bare=1"; }
function show(s, sym) {
  if (!sym) return;
  s.nowSym = sym;
  if (!s.frame.getAttribute("src")) { s.frame.setAttribute("src", frameSrc(s, sym)); }
  else { try { s.frame.contentWindow.postMessage({ sc:"chart", ticker:sym }, location.origin); } catch (_) { s.frame.setAttribute("src", frameSrc(s, sym)); } }
  paintBar(s);
}
function step(s) {
  if (!s.show.length) return;
  s.idx = (s.idx + 1) % s.show.length;
  show(s, s.show[s.idx]);
  s.next = Date.now() + DWELL_MS;
}
/* the pointer on a chart holds it: over the frame (the parent sees the frame's enter / leave), or the chart saying it is in use */
const held = (s) => s.hover || Date.now() - s.activityAt < 4000;
function tick() {
  const cash = cashSession(Date.now(), PINNED);
  if (cash !== CASH && OWNED) {
    /* the session turned (09:30 or 18:00): the lane's names change - SPY / QQQ <-> ESUSD / NQUSD - in place */
    const was = SIDES.map((s) => s.show[s.idx]);
    relane();
    SIDES.forEach((s, i) => { if (!s.manual && s.show[s.idx] !== was[i]) show(s, s.show[s.idx]); });
  }
  const now = Date.now();
  for (const s of SIDES) {
    s.el.classList.toggle("held", held(s));
    if (!s.playing || s.manual || !s.show.length) { paintBar(s); continue; }
    if (held(s)) { s.next += 500; paintBar(s); continue; }
    if (now >= s.next) step(s);
    paintBar(s);
  }
}
function paintBar(s) {
  const bar = s.el.querySelector(".bar");
  bar.querySelector(".lane").textContent = s.laneName;
  bar.querySelector(".now").textContent = s.nowSym || "";
  const nextSym = s.show.length ? s.show[(s.idx + 1) % s.show.length] : "";
  const secs = Math.max(0, Math.ceil((s.next - Date.now()) / 1000));
  bar.querySelector(".next").textContent = s.manual ? "manual · ▶ resumes the lane" : !s.playing ? "paused · next " + nextSym
    : nextSym ? "next " + nextSym + " in " + secs + " s" : "";
  bar.querySelector(".hold").textContent = s.playing && !s.manual && held(s) ? "held" : "";
  bar.querySelector(".pp").textContent = s.playing && !s.manual ? "⏸" : "▶";
}
function paintFine() {
  const skipped = [], mapped = [];
  for (const s of SIDES) {
    for (const k of s.skipped) if (!skipped.some((x) => x.tv === k.tv)) skipped.push(k);
    for (const m of s.mapped) if (!mapped.some((x) => x.tv === m.tv)) mapped.push(m);
  }
  const fine = document.getElementById("fine");
  fine.innerHTML = "<b>his TradingView rotation, on the house live chart</b> · A: FLASH WATCH lane 0 · B: lane 1 = " +
    (RADAR_NOTE || "station_lists · radar") + " · 20 s a name · the pointer on a chart holds it · " +
    (CASH ? "day: SPY / QQQ" : "night: SPY / QQQ shown as ESUSD / NQUSD (09:30-18:00 New York = SPY / QQQ)") +
    (mapped.length ? " · shown as ours: " + mapped.map((m) => m.tv + " → " + m.sym).join(", ") : "") +
    (skipped.length ? " · <b>skipped</b> (the chart API does not draw them at 5 minutes): " + skipped.map((k) => k.tv + (k.why === "daily only" ? " (daily only)" : "")).join(", ") : "");
  fine.dataset.skipped = JSON.stringify(skipped);
}

/* ---- the controls ------------------------------------------------------------------------------------------------------------------ */
for (const s of SIDES) {
  s.el.querySelector(".pp").addEventListener("click", () => {
    if (s.manual) { s.manual = null; s.playing = true; show(s, s.show[s.idx]); s.next = Date.now() + DWELL_MS; }
    else { s.playing = !s.playing; if (s.playing) s.next = Date.now() + 3000; }
    paintBar(s);
  });
  s.el.querySelector(".nx").addEventListener("click", () => { s.manual = null; s.playing = true; step(s); });
  const box = s.el.querySelector(".box");
  box.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const sym = CLEAN(box.value); box.value = ""; box.blur();
    if (!sym) return;
    /* any symbol, tracked or not: live-v1 says in words when the API does not track it; the lane waits until PLAY */
    s.manual = sym; show(s, sym);
  });
  s.frame.addEventListener("mouseenter", () => { s.hover = true; });
  s.frame.addEventListener("mouseleave", () => { s.hover = false; });
}
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  const s = SIDES.find((x) => x.frame.contentWindow === e.source);
  if (!s) return;
  if (e.data.sc === "station-activity") { s.activityAt = Date.now(); return; }
  if (e.data.type === "SCINTILLA_LIVE_STATE" && e.data.ticker) { s.nowSym = e.data.ticker; paintBar(s); }
});

/* ---- start: the ownership proof (shared with both charts), the radar, then the lanes --------------------------------------------- */
async function start() {
  try { OWNED = (await SC_PROVIDER.verifyOwnership()) || {}; }
  catch (_) { OWNED = {}; }
  try {
    const SB = "https://wadinxqplrggagkvrdag.supabase.co";
    const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
    const r = await fetch(SB + "/rest/v1/station_lists?select=position,ticker&list=eq.radar&order=position.asc", { headers:{ apikey:ANON, Authorization:"Bearer " + ANON } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json(), names = [];
    for (const row of rows) { const t = CLEAN(row && row.ticker); if (t && !names.includes(t)) names.push(t); }
    if (!names.length) throw new Error("empty");
    SIDES[1].tv = names; RADAR_NOTE = "station_lists · radar (" + names.length + " names)";
  } catch (error) { RADAR_NOTE = "his TradingView lane 1 list (the radar was not read: " + String(error && error.message || error).slice(0, 40) + ")"; }
  relane();
  SIDES.forEach((s, i) => { show(s, s.show[0]); s.next = Date.now() + DWELL_MS + i * 10000; });
  setInterval(tick, 500);
}
/* A proof can read what the page holds; nothing here changes it. */
window.SC_PAIR = Object.freeze({ state:() => ({ cash:CASH, pinned:PINNED, radar:RADAR_NOTE, sides:SIDES.map((s) => ({ key:s.key, lane:s.laneName, now:s.nowSym,
  next:s.show.length ? s.show[(s.idx + 1) % s.show.length] : null, inMs:s.next - Date.now(), playing:s.playing, manual:s.manual, held:held(s),
  show:s.show.slice(), skipped:s.skipped.slice(), mapped:s.mapped.slice() })) }) });
start();
</script>
</body>
</html>
