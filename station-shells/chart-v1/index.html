    const pts = host._series || [];
    if (pts.length < 2) return;
    const baseSpan = trackpadGesture.view.end - trackpadGesture.view.start;
    const factor = Math.max(.25, Math.min(4, Number(scale) || 1));
    applyLatestSpan(Math.max(8, Math.min(pts.length - 1, baseSpan / factor)));
  };
  host._applyTrackpadInput = (data) => {
    if (data?.phase === "wheel") return applyChartWheel(data);
    applyTrackpadGesture(data?.phase, data?.scale);
  };
  const captureChartWheel = (event) => { if (host.isConnected) applyChartWheel(event); };
  document.addEventListener("wheel", captureChartWheel, { capture:true, passive:false });
  for (const phase of ["gesturestart", "gesturechange", "gestureend"]) {
    document.addEventListener(phase, (event) => {
      if (!host.isConnected) return;
      event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation?.();
      if (hasActiveTouch()) return;
      applyTrackpadGesture(phase, event.scale);
    }, { capture:true, passive:false });
  }
  cv.addEventListener("dblclick", (e) => { e.preventDefault(); hideScrub(); resetChartView(host); });
}

function scChartWire(slot) {
  if (!slot) return;
  const host = slot.querySelector(".sc-nchart");
  if (!host || host._wired) return;
  host._wired = true;
  for (const old of CHART_HOSTS)
    if (!old.isConnected) { if (old._ro) old._ro.disconnect(); CHART_HOSTS.delete(old); }
  CHART_HOSTS.add(host);
  const area = host.querySelector(".sc-nchart__area");
  if (window.ResizeObserver && area) {
    host._ro = new ResizeObserver(() => { applyIpadPaneScale(); scChartDraw(host); });
    host._ro.observe(area);
  }
  scChartScrub(host);
  paintLiveStatus(host, liveQuote[host.dataset.t]);
  scChartLoad(host);
}

window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_CHART_TRACKPAD") {
    for (const host of CHART_HOSTS) if (host.isConnected) host._applyTrackpadInput?.(event.data);
    return;
  }
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    for (const host of CHART_HOSTS) if (host.isConnected) scChartDraw(host);
    return;
  }
  if (event.data?.type !== "SCINTILLA_CHART_VIEW") return;
  for (const host of CHART_HOSTS) if (host.isConnected) applySharedChartView(host, event.data);
});

function setChartTicker(t) {
  t = String(t || "").toUpperCase().trim();
  if (!t) return;
  S.chartT = t;
  lsSet("scw_chartT", t);
  const host = document.querySelector("#chartSlot .sc-nchart");
  if (!host) return;
  host.dataset.t = t;
  host._series = null;
  host._view = null;
  const sym = TV_MAP[t] || t;
  const pop = host.querySelector(".sc-tv__pop");
  if (pop) pop.dataset.sym = sym;
  const tin = el("tkin"); if (tin && tin.value.toUpperCase().trim() !== t) tin.value = t;
  if (DECK_QUOTE_MODE) requestDeckQuote(t); else pullPrevClose(t);
  scChartLoad(host);
}

/* R22 FIX 8 — live tick → cheap last-point update (ported verbatim) */
function scChartLive(t, price, updatedTs, previousClose) {
  if (previousClose != null && isFinite(+previousClose)) prevClose[t] = +previousClose;
  /* Carried as given. Null means the provider did not say when it saw this price. */
  liveQuote[t] = { price:+price, updated_ts:updatedTs == null || updatedTs === "" ? null : updatedTs };
  for (const host of CHART_HOSTS) {
    if (!host.isConnected || host.dataset.t !== t) continue;
    paintLiveStatus(host, liveQuote[t]);
    const s = host._series;
    if (!s || !s.length) continue;
    const atRight = !host._view || host._view.end >= s.length - 1;
    const span = host._view ? host._view.end - host._view.start : 0;
    /* chApplyLivePoint returns a COPY - it must, so that nothing a live quote does can reach a
       cached completed bar. The return value was being discarded here, so after the change to
       copying, no realtime tick reached the drawn series at all: futures and crypto panes
       stopped moving after their first load. */
    const next = chApplyLivePoint(t, s, liveQuote[t], host._range || S.chartRange);
    host._series = next;
    if (atRight && host._view)
      host._view = { start:Math.max(0, next.length - 1 - span), end:next.length - 1 };
    scChartDraw(host);
  }
}

/* Stable Station overlay: daily performance is measured from the regular
   previous close, never from the visible chart window. */
/* The ONE baseline both the badge text and the pane color are allowed to claim the day
   from: the provider's previous close for the pane's CURRENT ticker, read live rather than
   copied, so a pane whose ticker changed cannot keep the old symbol's baseline. Null means
   unknown — never a substitute, never zero. */
function chDayRef(host) {
  const v = prevClose[host && host.dataset ? host.dataset.t : null];
  return v != null && Number.isFinite(+v) && +v !== 0 ? +v : null;
}

function chDayChange(price, previousClose) {
  if (!Number.isFinite(+price) || !Number.isFinite(+previousClose) || +previousClose === 0)
    return { text:"—", tone:"flat" };
  const pct = ((+price - +previousClose) / +previousClose) * 100;
  if (Math.abs(pct) < .005) return { text:"0.00%", tone:"flat" };
  return { text:pct > 0 ? pct.toFixed(2) + "%" : "(" + Math.abs(pct).toFixed(2) + "%)",
    tone:pct > 0 ? "up" : "down" };
}

function paintLiveStatus(host, quote) {
  const badge = host?.querySelector(".sc-nchart__live");
  if (!badge) return;
  const hasQuote = quotePrice(quote) != null;
  const observedAt = quoteInstant(quote);
  const at = observedAt == null ? null : new Date(observedAt);
  const age = observedAt == null ? null : Date.now() - observedAt;
  /* Freshness is a claim about time. With no observation time there is no claim to make, so
     the badge is not fresh - and it is not stale either; it simply says the time is unknown. */
  const fresh = age != null && age < 90000;
  badge.dataset.fresh = hasQuote && fresh ? "1" : "0";
  badge.dataset.untimed = hasQuote && observedAt == null ? "1" : "0";
  const dayRef = prevClose[host.dataset.t];
  const day = hasQuote ? chDayChange(quotePrice(quote), dayRef) : { text:"", tone:"flat" };
  badge.dataset.change = day.tone;
  let ticker = badge.querySelector(".sc-nchart__live-ticker");
  let change = badge.querySelector(".sc-nchart__live-change");
  let previous = badge.querySelector(".sc-nchart__live-prev");
  let historyWindow = badge.querySelector(".sc-nchart__live-window");
  if (!ticker || !change || !previous || !historyWindow) {
    badge.replaceChildren();
    ticker = document.createElement("button");
    ticker.type = "button";
    ticker.className = "sc-nchart__live-ticker";
    ticker.title = "Edit ticker";
    ticker.addEventListener("click", () => {
      try { parent.postMessage({ sc:"chart-focus-ticker" }, location.origin); } catch (_) {}
    });
    change = document.createElement("span");
    change.className = "sc-nchart__live-change";
    previous = document.createElement("span");
    previous.className = "sc-nchart__live-prev";
    historyWindow = document.createElement("span");
    historyWindow.className = "sc-nchart__live-window";
    badge.append(ticker, change, previous, historyWindow);
  }
  ticker.textContent = host.dataset.t;
  change.textContent = day.text;
  previous.textContent = dayRef != null && Number.isFinite(+dayRef) && +dayRef !== 0
    ? "Prev " + chPx(+dayRef, host.dataset.t) : "";
  paintChartHistoryWindow(host);
  badge.title = !hasQuote
    ? "live quote loading · ticker remains editable"
    : at == null
      ? "observation time unknown · the provider supplied no observation time for this quote"
      : (futureSet.has(host.dataset.t) ? "delayed futures quote · " : "provider quote · ") + at.toISOString();
  reportChartDataState(host, { quote:hasQuote ? "ready" : "loading" });
  if (!hasQuote) return;
  try {
    /* updatedTs travels as null when it is unknown. The deck's header already refuses to fold
       an unstamped row into an age; handing it a clock reading here would defeat that. */
    parent.postMessage({ sc:"chart-status", ticker:host.dataset.t,
      updatedTs:at == null ? null : at.toISOString(),
      fresh, delayed:futureSet.has(host.dataset.t), source:"provider" }, location.origin);
  } catch (_) {}
}

/* Previous regular-session close is the day reference for every timeframe.
   The visible window controls geometry only; it must not change red/green. */
async function pullPrevClose(t) {
  if (DECK_QUOTE_MODE) { requestDeckQuote(t); return; }
  try {
    const rows = await pg("live_quotes?ticker=eq." + encodeURIComponent(t) + "&select=ticker,prev_close,price,updated_ts", 1);
    if (Array.isArray(rows) && rows[0]) {
      if (rows[0].prev_close != null) prevClose[t] = +rows[0].prev_close;
      if (rows[0].price != null) scChartLive(t, +rows[0].price, rows[0].updated_ts);
    } else {
      /* The read returned without this row. Settled ONLY if something named it - a PostgREST
         result cannot say "this symbol does not exist", it just omits it. An unnamed omission
         stays in the retrying lane. */
      const named = chartNamedAbsenceFor(t);
      for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
        reportChartDataState(host, named ? { quote:"absent", quoteAbsence:named } : { quote:"delayed" });
    }
  } catch (err) {
    if (isNamedAbsence(err)) {
      const named = err.scAbsence;
      for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
        reportChartDataState(host, { quote:"absent", quoteAbsence:named });
      return;
    }
    for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
      reportChartDataState(host, { quote:"delayed" });
  }
}

/* realtime — live_quotes ticks patch the active chart (hub channel, verbatim shape) */
if (sb && !DECK_QUOTE_MODE) {
  sb.channel("lq").on("postgres_changes", { event: "*", schema: "public", table: "live_quotes" }, (p) => {
    /* SAME REALTIME BYPASS AS deck/index.html. Supabase Realtime does not go through fetch, so the
       provider shim never saw this and a legacy price could patch a provider-owned chart. Refused
       for provider-owned equities; non-equities keep their existing owner. */
    const shim = window.SC_PROVIDER_SHIM || (window.parent && window.parent.SC_PROVIDER_SHIM);
    const sym = String((p.new && p.new.ticker) || "").toUpperCase();
    if (shim && shim.isProviderOwned && shim.isProviderOwned(sym)) { shim.realtime_equity_refused++; return; }
    /* UNKNOWN OWNERSHIP IS NOT PERMISSION - see the same guard in deck/index.html. */
    if (shim && shim.ownershipKnown && !shim.ownershipKnown()) { shim.realtime_unknown_ownership_refused++; return; }
    if (shim) shim.realtime_nonequity_passthrough++;
    if (p.new && p.new.ticker && p.new.price != null) scChartLive(String(p.new.ticker).toUpperCase(), +p.new.price, p.new.updated_ts);
  }).subscribe((status) => {
    /* The chart is a mounted shell — the deck paints the note; the state stays queryable
       here under the same name, with the channel's own lifecycle as the lane's truth. */
    if (window.SC_REALTIME) window.SC_REALTIME.channel = String(status || "").toUpperCase();
  });
}

function requestDeckQuote(ticker) {
  try { parent.postMessage({ sc:"chart-quote-ready", ticker:String(ticker || "").toUpperCase().trim() }, location.origin); } catch (_) {}
}
function applyDeckQuote(ticker, quote, state, absence) {
  const clean = String(ticker || "").toUpperCase().trim();
  const hosts = Array.from(CHART_HOSTS).filter((host) => host.isConnected && host.dataset.t === clean);
  if (quotePrice(quote) == null) {
    /* "absent" reaches here only when the deck's read SUCCEEDED and carried no row for this
       symbol. That is the stream's answer and is reported under its name, never as a delay. */
    const quoteState = state === "absent" ? "absent" : state === "delayed" ? "delayed" : "loading";
    for (const host of hosts) {
      paintLiveStatus(host, null);
      reportChartDataState(host, { quote:quoteState,
        quoteAbsence:quoteState === "absent" ? (absence || CHART_ABSENCE_NOT_OBSERVED) : null });
    }
    return;
  }
  scChartLive(clean, +quote.price, quote.updated_ts, quote.prev_close);
}

/* delegated actions (hub data-act names) */
document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]");
  if (!n) return;
  const act = n.dataset.act;
  if (act === "chartrange") {
    S.chartRange = n.dataset.r;
    document.querySelectorAll(".sc-crange").forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._series = null; scChartLoad(host); }
  }
  else if (act === "tvmodal") openTvModal(n.dataset.sym);
  else if (act === "tvmodalclose") closeTvModal();
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTvModal();
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "tkin") {
    setChartTicker(document.activeElement.value);
    document.activeElement.blur();
  }
});

/* TICKER FIELD — click in, the old symbol is already selected, so typing
   replaces it. It never jumbles with what was there. iOS Safari clears the
   selection on the touch that follows focus, so we re-select on the next
   frame and again on the click that lands. */
function selAll(n) { try { n.select(); n.setSelectionRange(0, n.value.length); } catch (err) {} }
document.addEventListener("focusin", (e) => {
  const n = e.target;
  if (n && n.id === "tkin") { selAll(n); requestAnimationFrame(() => selAll(n)); }
});
document.addEventListener("click", (e) => {
  const n = e.target;
  if (n && n.id === "tkin" && n.selectionStart === n.selectionEnd) selAll(n);
});

/* the deck (parent frame) drives the timeframe for BOTH charts through one bar */
addEventListener("message", (e) => {
  const d = e.data;
  if (!d) return;
  if (d.sc === "deck-quote") { applyDeckQuote(d.ticker, d.quote, d.state, d.absence); return; }
  if (d.sc === "chart-load-grant") {
    const grant = chartLoadPermits.get(d.token);
    if (grant) { chartLoadPermits.delete(d.token); grant(); }
    return;
  }
  if (d.sc === "chart-transition") {
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._transitionGeneration = Math.max(host._transitionGeneration || 0, Number(d.generation) || 0); clearChartRetry(host); }
    return;
  }
  if (d.sc !== "chart") return;
  if (d.range && CHART_RANGES.includes(d.range)) {
    S.chartRange = d.range;
    document.querySelectorAll(".sc-crange").forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._series = null; scChartLoad(host); }
  }
  if (d.ticker) setChartTicker(d.ticker);
});

/* boot */
el("chartSlot").innerHTML = scChartHTML(S.chartT);
const initialChartHost = document.querySelector("#chartSlot .sc-nchart");
if (initialChartHost) initialChartHost._transitionGeneration = CHART_TRANSITION_GENERATION;
scChartWire(el("chartSlot"));
if (DECK_QUOTE_MODE) requestDeckQuote(S.chartT);
else pullPrevClose(S.chartT);
/* A ten-second read-only heartbeat makes live status dependable even if the
   browser's realtime socket sleeps. The full history remains a 60-second pull. */
if (!DECK_QUOTE_MODE) setInterval(() => pullPrevClose(S.chartT), 10000);
/* refresh cadence — re-pull the active series every 60 s */
setInterval(() => { const host = document.querySelector("#chartSlot .sc-nchart"); if (host) scChartLoad(host); }, 60000);
</script>
</body>
