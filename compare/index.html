<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · cohort compare</title>
<!-- ============================================================================
     SCINTILLA COMPONENT · COHORT COMPARE — vertical cohort-composite.
     Second component extraction (Alan: geiger bars first). Every primary
     cohort as one vertical bar from the zero line — the hub's MACD-histogram
     idiom lifted verbatim (rect from center, green #00FFA3 / red #FF2D55 by
     sign, leader wears the glow) — bar height = the cohort composite
     (?stat=median default, robust · ?stat=mean flips; the other stat rides as
     a notch on each bar), thin min→max whisker behind each bar. Fixed honest
     scale ±1, values always printed.
     DATA — DB reads only, never FMP, never recomputed:
       ticker_cohorts is_primary=true × composite_staged tf='D' (THE one
       Geiger) · scintilla-live.
     Params: ?stat=median|mean · ?sort=value|name · ?bg=0 · ?labels=0 ·
       ?refresh=60 (15-600)
     Composability: bar click → /cohort?c=NAME (the horizontal distribution).
     LOOK rides the Visuals sprint — plumbing + verbatim idiom only.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55;
  --gs-mom:#A24BFF; --gs-ink2:#A6AAC4;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.03em;
  display:flex; flex-direction:column; overflow:hidden; padding:10px 14px; }
body.nobg{ background:transparent; }
#hd{ display:flex; align-items:baseline; gap:10px; flex:none; margin-bottom:4px; }
#hd .k{ color:var(--crk); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; }
#hd .m{ color:var(--dim); font-size:9px; }
#hd .fresh{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.12em; text-transform:uppercase; }
.badge{ font-size:8px; letter-spacing:.14em; color:var(--bear); border:1px dashed rgba(255,45,85,.5); padding:1px 6px; text-transform:uppercase; }
#field{ flex:1; display:flex; align-items:stretch; gap:6px; min-height:0; padding:14px 2px 2px; }
.col{ flex:1; display:flex; flex-direction:column; min-width:0; cursor:pointer; }
.col:hover .nm{ color:var(--crk); }
.vals{ flex:none; height:14px; text-align:center; font-size:10px; font-weight:700; font-variant-numeric:tabular-nums; }
.plot{ flex:1; position:relative; min-height:0; }
.plot .zero{ position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.12); }
.plot .whisk{ position:absolute; left:50%; width:1px; transform:translateX(-50%); background:var(--gs-mom); opacity:.3; }
.plot .bar{ position:absolute; left:50%; width:58%; max-width:34px; transform:translateX(-50%); border-radius:2px; opacity:.85; }
.plot .bar.lead{ opacity:1; }
.plot .tick{ position:absolute; left:50%; width:70%; max-width:42px; height:2px; transform:translateX(-50%); background:var(--ink); opacity:.55; }
.nm{ flex:none; padding-top:5px; text-align:center; color:var(--gs-ink2); font-size:8px; letter-spacing:.08em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cnt{ text-align:center; color:var(--mute); font-size:7.5px; }
.up{ color:var(--bull); } .dn{ color:var(--bear); } .neu{ color:var(--gs-ink2); }
#ft{ flex:none; margin-top:5px; color:var(--mute); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; text-align:center; }
.empty{ margin:auto; color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="hd">
  <span class="k">COHORT COMPARE</span>
  <span class="m" id="meta">—</span>
  <span class="fresh" id="fresh"></span>
</div>
<div id="field"><div class="empty">loading cohorts…</div></div>
<div id="ft">composite_staged tf=D · the one geiger, never recomputed · ticker_cohorts is_primary · scale ±1 · bar = <span id="ftstat">median</span>, notch = <span id="ftalt">mean</span> · whisker = min→max · click a bar → its cohort geiger</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const STAT    = QS.get("stat") === "mean" ? "mean" : "med";
const ALT     = STAT === "med" ? "mean" : "med";
const SORT    = QS.get("sort") === "name" ? "name" : "value";
const REFRESH = Math.max(15, Math.min(600, +(QS.get("refresh") || 60))) * 1000;
if (QS.get("bg") === "0") document.body.classList.add("nobg");
const LABELS  = QS.get("labels") !== "0";
if (!LABELS) el("ft").style.display = "none";
el("ftstat").textContent = STAT === "med" ? "median" : "mean";
el("ftalt").textContent  = STAT === "med" ? "mean" : "median";

/* ---- fixed honest scale ±1 (hub-verbatim clamp idiom) ---- */
const SCALE = 1;
const frac = (v) => Math.max(-0.98, Math.min(0.98, v / SCALE));      /* signed fraction of half-height */
const tone = (v) => (v > 0 ? "up" : v < 0 ? "dn" : "neu");
const col  = (v) => (v >= 0 ? "var(--bull)" : "var(--bear)");
const fmt  = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
function median(arr) {
  const a = arr.slice().sort((x, y) => x - y), n = a.length;
  return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
}

let COHORTS = [], MAXTS = null;

async function pull() {
  const [tc, cs] = await Promise.all([
    pg("ticker_cohorts?is_primary=eq.true&select=ticker,cohort"),
    pg("composite_staged?tf=eq.D&select=ticker,composite,updated_ts"),
  ]);
  const comp = {}; let maxts = null;
  for (const r of (cs || [])) {
    const v = num(r.composite);
    if (v != null && isFinite(v)) comp[r.ticker] = v;
    if (r.updated_ts && (!maxts || r.updated_ts > maxts)) maxts = r.updated_ts;
  }
  const by = {};
  for (const r of (tc || [])) {
    const v = comp[r.ticker];
    if (v == null) continue;
    (by[r.cohort] = by[r.cohort] || []).push(v);
  }
  MAXTS = maxts;
  COHORTS = Object.keys(by).map((name) => {
    const c = by[name];
    return { name, n: c.length,
      min: Math.min.apply(null, c), max: Math.max.apply(null, c),
      mean: c.reduce((a, b) => a + b, 0) / c.length, med: median(c) };
  }).filter((c) => c.n);
  COHORTS.sort(SORT === "name" ? (a, b) => a.name.localeCompare(b.name) : (a, b) => b[STAT] - a[STAT]);
}

function freshHTML() {
  if (!MAXTS) return "";
  const min = Math.round((Date.now() - new Date(MAXTS).getTime()) / 60000);
  return min > 30 ? 'geiger <span class="badge">STALE ' + min + 'm</span>' : "geiger " + min + "m ago";
}

/* y-geometry: top of a positive bar sits at 50%·(1−frac) of plot height */
const yPct = (v) => 50 - frac(v) * 50;

function render() {
  if (!COHORTS.length) { el("field").innerHTML = '<div class="empty">no cohort data</div>'; el("meta").textContent = "—"; return; }
  const leadName = COHORTS.slice().sort((a, b) => Math.abs(b[STAT]) - Math.abs(a[STAT]))[0].name;
  el("meta").textContent = COHORTS.length + " primary cohorts · bar = " + (STAT === "med" ? "median" : "mean") + " composite";
  el("fresh").innerHTML = freshHTML();
  el("field").innerHTML = COHORTS.map((c) => {
    const v = c[STAT], a = c[ALT], up = v >= 0;
    const yv = yPct(v), y0 = 50;
    const top = up ? yv : y0, hgt = Math.max(0.8, Math.abs(yv - y0));
    const wTop = Math.min(yPct(c.max), yPct(c.min)), wHgt = Math.abs(yPct(c.max) - yPct(c.min));
    const lead = c.name === leadName;
    return '<div class="col" data-c="' + esc(c.name) + '" title="' + esc(c.name) + " · median " + fmt(c.med) + " · mean " + fmt(c.mean) + " · min " + fmt(c.min) + " · max " + fmt(c.max) + '">' +
      '<div class="vals ' + tone(v) + '">' + (LABELS ? fmt(v) : "") + "</div>" +
      '<div class="plot">' +
        '<span class="zero"></span>' +
        '<span class="whisk" style="top:' + wTop + "%;height:" + Math.max(0.8, wHgt) + '%"></span>' +
        '<span class="bar' + (lead ? " lead" : "") + '" style="top:' + top + "%;height:" + hgt + "%;background:" + col(v) + (lead ? ";box-shadow:0 0 9px " + col(v) : "") + '"></span>' +
        '<span class="tick" style="top:' + yPct(a) + '%" title="' + (STAT === "med" ? "mean " + fmt(c.mean) : "median " + fmt(c.med)) + '"></span>' +
      "</div>" +
      (LABELS ? '<div class="nm">' + esc(c.name) + '</div><div class="cnt">' + c.n + "</div>" : "") +
    "</div>";
  }).join("");
  for (const node of document.querySelectorAll(".col"))
    node.addEventListener("click", () => { location.href = "/cohort?c=" + encodeURIComponent(node.dataset.c); });
}

(async function init() {
  try { await pull(); render(); }
  catch (e) { el("field").innerHTML = '<div class="empty">cohort data unavailable</div>'; }
  setInterval(async () => { try { await pull(); render(); } catch (e) {} }, REFRESH);
})();
</script>
</body>
</html>
