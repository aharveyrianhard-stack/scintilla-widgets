<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · cohort strip</title>
<!-- ============================================================================
     SCINTILLA COMPONENT · COHORT SELECTOR STRIP — how Alan moves around.
     FAV · ALL · every primary cohort as one row of breadth-tinted chips
     (member count on each; tint = green vs red composite breadth — the same
     one Geiger, never recomputed). Chips NAVIGATE:
       cohort chip → /cohort?c=NAME (default) · ?target=compare → /compare ·
       ?target=heat → /heat?group=cohort&color=geiger
       FAV → /geiger (rotates hub_favorites) · ALL → /compare
     ?top=1 makes every chip drive the WHOLE window (scene-level navigation —
     drop the strip into any scene and it steers the scene). ?on=NAME lights
     the active chip. ?bg=0 transparent · ?labels=0 counts off · ?refresh=60.
     DATA — DB reads only, never FMP: ticker_cohorts is_primary ×
     composite_staged tf=D + hub_favorites count · scintilla-live.
     Receipt: HSC-COHORTSTRIP-LIVE-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.03em;
  display:flex; align-items:center; overflow:hidden; }
body.nobg{ background:transparent; }
#strip{ flex:1; display:flex; align-items:center; gap:7px; padding:7px 12px;
  overflow-x:auto; scrollbar-width:none; }
#strip::-webkit-scrollbar{ display:none; }
.k{ color:var(--crk); font-size:8px; letter-spacing:.22em; flex:none; text-transform:uppercase; }
.chip{ flex:none; display:flex; align-items:baseline; gap:6px; padding:5px 11px;
  border:1px solid var(--line); background:var(--panel2); text-decoration:none; color:var(--ink2);
  text-transform:uppercase; letter-spacing:.1em; font-size:10px; transition:border-color .12s; }
.chip:hover{ border-color:var(--crk); color:var(--ink); }
.chip.on{ border-color:var(--crk); color:var(--crk); }
.chip .n{ font-size:8.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.chip.up{ border-color:rgba(0,255,163,.4); }
.chip.up.hot{ border-color:rgba(0,255,163,.75); box-shadow:0 0 8px rgba(0,255,163,.25); }
.chip.dn{ border-color:rgba(255,45,85,.4); }
.chip.dn.hot{ border-color:rgba(255,45,85,.75); box-shadow:0 0 8px rgba(255,45,85,.25); }
.chip.sys{ border-color:var(--hair); color:var(--crk); }
.empty{ color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:0 12px; }
</style>
</head>
<body>
<div id="strip"><span class="empty">loading cohorts…</span></div>
<script src="/_provider/provider.js"></script>
<script>
/* PROVIDER AUTHORITY SHIM — installed before this page issues any query. pg() is a hoisted
   top-level declaration, so it is already bound here. The shim answers live_quotes,
   composite_staged and ohlcv_history from the accepted provider APIs and passes
   non-equities through to their existing owner. */
try { scInstallProviderShim(); } catch (_) {}

"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);
const TARGET  = ["cohort","compare","heat"].indexOf(QS.get("target")) >= 0 ? QS.get("target") : "cohort";
const TOP     = QS.get("top") === "1";
const ON      = (QS.get("on") || "").toUpperCase();
const LABELS  = QS.get("labels") !== "0";
const REFRESH = Math.max(15, Math.min(600, +(QS.get("refresh") || 60))) * 1000;
if (QS.get("bg") === "0") document.body.classList.add("nobg");

function median(arr){ const a = arr.slice().sort((x,y)=>x-y), n = a.length;
  return n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2; }
const disp = (name) => name.replace(/_/g, " ");
function href(kind, name) {
  if (kind === "fav") return "/geiger";
  if (kind === "all") return "/compare";
  if (TARGET === "compare") return "/compare";
  if (TARGET === "heat") return "/heat?group=cohort&color=geiger";
  return "/cohort?c=" + encodeURIComponent(name);
}

async function tick() {
  const [tc, cs, fav] = await Promise.all([
    pg("ticker_cohorts?is_primary=eq.true&select=ticker,cohort"),
    pg("composite_staged?tf=eq.D&select=ticker,composite"),
    pg("hub_favorites?select=ticker").catch(() => null),
  ]);
  const comp = {};
  for (const r of (cs || [])) { const v = num(r.composite); if (v != null && isFinite(v)) comp[r.ticker] = v; }
  const by = {};
  for (const r of (tc || [])) { const v = comp[r.ticker]; if (v == null) continue; (by[r.cohort] = by[r.cohort] || []).push(v); }
  const cohorts = Object.keys(by).map((name) => {
    const c = by[name], g = c.filter((v) => v > 0).length, r = c.filter((v) => v < 0).length;
    return { name, n: c.length, g, r, med: median(c) };
  }).filter((c) => c.n).sort((a, b) => b.med - a.med);
  if (!cohorts.length) { document.getElementById("strip").innerHTML = '<span class="empty">no cohort data</span>'; return; }

  const tgt = TOP ? ' target="_top"' : "";
  const chips = [];
  chips.push('<span class="k">COHORTS</span>');
  chips.push('<a class="chip sys' + (ON === "FAV" ? " on" : "") + '" href="' + href("fav") + '"' + tgt + '>FAV' +
    (LABELS && Array.isArray(fav) ? ' <span class="n">' + fav.length + "</span>" : "") + "</a>");
  chips.push('<a class="chip sys' + (ON === "ALL" ? " on" : "") + '" href="' + href("all") + '"' + tgt + '>ALL' +
    (LABELS ? ' <span class="n">' + Object.keys(comp).length + "</span>" : "") + "</a>");
  for (const c of cohorts) {
    const net = c.g - c.r, dirCls = net > 0 ? "up" : net < 0 ? "dn" : "";
    const hot = c.n >= 3 && Math.abs(net) / c.n >= 0.5 ? " hot" : "";
    chips.push('<a class="chip ' + dirCls + hot + (ON === c.name.toUpperCase() ? " on" : "") + '" href="' + href("c", c.name) + '"' + tgt +
      ' title="' + esc(c.name) + " · " + c.g + "↑ " + c.r + '↓ · median ' + (c.med >= 0 ? "+" : "−") + Math.abs(c.med).toFixed(2) + '">' +
      esc(disp(c.name)) + (LABELS ? ' <span class="n">' + c.n + "</span>" : "") + "</a>");
  }
  document.getElementById("strip").innerHTML = chips.join("");
}
tick().catch(() => { document.getElementById("strip").innerHTML = '<span class="empty">cohort data unavailable</span>'; });
setInterval(() => tick().catch(() => {}), REFRESH);
</script>
</body>
</html>
