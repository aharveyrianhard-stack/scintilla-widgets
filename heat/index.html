<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · heat</title>
<!-- ============================================================================
     SCINTILLA WIDGET · HEAT — sector/cohort heat map (Alan: "known weak spot,
     build a real one"). The whole universe as a color field, grouped and ranked:
       · group=sector (default): sectors ORDERED BY the published rotation
         ranking (sector_rankings — refreshed hourly by Command's pg_cron; rank +
         score shown on each group header, method never re-derived here);
         ETFs/unsectored close the board.
       · group=cohort: primary cohorts from ticker_cohorts (is_primary).
       · color=chg (default): day chg_pct from live_quotes (served, ±3% scale)
       · color=geiger: composite_staged tf=D composite (THE one Geiger, ±1)
     Tiles sort winners-first inside each group; every group header carries its
     own breadth. Freshness is stamped from live_quotes.updated_ts and wears a
     red STALE badge when the tape is old — never hidden. Click a tile → /chart
     for that ticker in the same frame. DB reads ONLY via pg() — never FMP.
     Params: ?group=sector|cohort · ?color=chg|geiger · ?refresh=60 (15-600s)
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.03em;
  display:flex; flex-direction:column; overflow:hidden; }
/* header bar */
#bar{ flex:none; display:flex; align-items:center; gap:8px; padding:7px 12px 6px;
  border-bottom:.8px solid var(--hair); background:var(--panel2); flex-wrap:wrap; }
#bar .t{ color:var(--crk); font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
#bar a.c{ text-decoration:none; color:var(--dim); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
  border:.6px solid var(--line2); border-radius:3px; padding:3px 8px; }
#bar a.c:hover{ color:var(--ink2); }
#bar a.c.on{ color:var(--crk); border-color:rgba(0,212,255,.45); box-shadow:inset 0 -2px 0 var(--crk); }
#bar .gap{ width:8px; }
#stamp{ margin-left:auto; color:var(--dim); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; }
#stamp .stale{ color:var(--bear); border:1px dashed rgba(255,45,85,.5); padding:1px 6px; margin-left:6px; }
/* board */
#board{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 12px 16px; scrollbar-width:thin; }
.grp{ margin-bottom:12px; }
.gh{ display:flex; align-items:baseline; gap:9px; padding:4px 2px 6px; }
.gh .gn{ color:var(--ink2); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; }
.gh .gr{ color:var(--crk); font-size:8.5px; letter-spacing:.08em; }
.gh .gb{ color:var(--dim); font-size:8.5px; }
.gh .gb .up{ color:var(--bull); } .gh .gb .dn{ color:var(--bear); }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:3px; }
.tile{ position:relative; border:.5px solid rgba(255,255,255,.05); padding:7px 8px 6px; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; min-height:44px; }
.tile:hover{ border-color:var(--crk); }
.tile .tk{ font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--ink); }
.tile .v{ font-size:9.5px; font-variant-numeric:tabular-nums; }
.tile .v2{ font-size:8px; color:rgba(255,255,255,.42); font-variant-numeric:tabular-nums; }
.msg{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--dim);
  font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
@media (max-width:700px){ .tiles{ grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); } }
</style>
</head>
<body>
<div id="bar">
  <span class="t">HEAT</span>
  <a class="c" id="cSector" href="?group=sector">sector</a>
  <a class="c" id="cCohort" href="?group=cohort">cohort</a>
  <span class="gap"></span>
  <a class="c" id="cChg" href="?color=chg">chg %</a>
  <a class="c" id="cGeiger" href="?color=geiger">geiger</a>
  <span id="stamp"></span>
</div>
<div id="board"><div class="msg">loading heat…</div></div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const GROUP = (QS.get("group") || "sector").toLowerCase() === "cohort" ? "cohort" : "sector";
const COLOR = (QS.get("color") || "chg").toLowerCase() === "geiger" ? "geiger" : "chg";
const REFRESH = Math.max(15, Math.min(600, +(QS.get("refresh") || 60))) * 1000;
/* keep toggles round-trip the OTHER param */
el("cSector").href = "?group=sector&color=" + COLOR; el("cCohort").href = "?group=cohort&color=" + COLOR;
el("cChg").href = "?group=" + GROUP + "&color=chg"; el("cGeiger").href = "?group=" + GROUP + "&color=geiger";
el("c" + (GROUP === "sector" ? "Sector" : "Cohort")).classList.add("on");
el("c" + (COLOR === "chg" ? "Chg" : "Geiger")).classList.add("on");

/* ---- diverging color scale: bear → dark neutral → bull (canon hues) ---- */
const NEUT = [20, 20, 29], BULLC = [0, 255, 163], BEARC = [255, 45, 85];
function heatColor(v, scale) {
  if (v == null || !isFinite(v)) return "rgba(255,255,255,.03)";
  let f = Math.max(-1, Math.min(1, v / scale));
  const c = f >= 0 ? BULLC : BEARC;
  f = Math.abs(f);
  const a = 0.06 + 0.5 * f;   // deeper color = bigger move
  const mix = (i) => Math.round(NEUT[i] + (c[i] - NEUT[i]) * (0.25 + 0.75 * f));
  return "rgba(" + mix(0) + "," + mix(1) + "," + mix(2) + "," + a.toFixed(3) + ")";
}
function valColor(v, scale) {
  if (v == null || !isFinite(v)) return "var(--dim)";
  return v >= 0 ? "var(--bull)" : "var(--bear)";
}

/* ---- data pull (all reads catch-wrapped; one dead table degrades, never blanks) ---- */
async function pull() {
  const [prof, quotes, comp, coh, ranks] = await Promise.all([
    pg("company_profile?select=ticker,sector,market_cap,is_etf").catch(() => []),
    pg("live_quotes?select=ticker,price,chg_pct,updated_ts").catch(() => []),
    pg("composite_staged?tf=eq.D&select=ticker,composite").catch(() => []),
    GROUP === "cohort" ? pg("ticker_cohorts?select=ticker,cohort,is_primary").catch(() => []) : [],
    GROUP === "sector" ? pg("sector_rankings?select=sector_name,rank,score&order=rank.asc").catch(() => []) : [],
  ]);
  const P = {}; for (const r of (prof || [])) P[r.ticker] = r;
  const Q = {}; for (const r of (quotes || [])) Q[r.ticker] = r;
  const C = {}; for (const r of (comp || [])) if (!(r.ticker in C)) C[r.ticker] = num(r.composite);
  return { P, Q, C, coh: coh || [], ranks: ranks || [] };
}

/* ---- grouping ---- */
function buildGroups(d) {
  const universe = Object.keys(d.Q).filter((t) => d.Q[t] && d.Q[t].price != null);
  const rows = universe.map((t) => ({
    t,
    chg: num(d.Q[t].chg_pct),
    comp: (t in d.C) ? d.C[t] : null,
    sector: (d.P[t] && d.P[t].sector) || null,
    etf: !!(d.P[t] && d.P[t].is_etf),
  }));
  const groups = new Map();
  if (GROUP === "cohort") {
    const primary = {};
    for (const r of d.coh) if (r.is_primary !== false && !(r.ticker in primary)) primary[r.ticker] = r.cohort;
    for (const r of rows) {
      const g = primary[r.t] || "UNASSIGNED";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(r);
    }
    return [...groups.entries()].sort((a, b) => b[1].length - a[1].length).map(([name, list]) => ({ name, list, meta: null }));
  }
  /* sector mode — order groups by the PUBLISHED rotation ranking */
  for (const r of rows) {
    const g = r.etf || !r.sector ? "ETF / MACRO" : r.sector;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(r);
  }
  const rankOf = {}; const metaOf = {};
  for (const rr of d.ranks) {
    const key = String(rr.sector_name || "").toLowerCase();
    if (!(key in rankOf)) { rankOf[key] = num(rr.rank); metaOf[key] = rr; }
  }
  return [...groups.entries()].sort((a, b) => {
    if (a[0] === "ETF / MACRO") return 1;
    if (b[0] === "ETF / MACRO") return -1;
    const ra = rankOf[a[0].toLowerCase()], rb = rankOf[b[0].toLowerCase()];
    if (ra != null && rb != null) return ra - rb;
    if (ra != null) return -1;
    if (rb != null) return 1;
    return b[1].length - a[1].length;
  }).map(([name, list]) => ({ name, list, meta: metaOf[name.toLowerCase()] || null }));
}

/* ---- render ---- */
const fmtPct = (c) => (c >= 0 ? "+" : "") + (+c).toFixed(2) + "%";
const fmtComp = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
function render(d) {
  const scale = COLOR === "chg" ? 3 : 1;
  const val = (r) => COLOR === "chg" ? r.chg : r.comp;
  const groups = buildGroups(d);
  if (!groups.length) { el("board").innerHTML = '<div class="msg">heat data unavailable — live_quotes/company_profile empty</div>'; return; }
  let h = "";
  for (const g of groups) {
    const list = g.list.slice().sort((a, b) => (val(b) == null ? -9e9 : val(b)) - (val(a) == null ? -9e9 : val(a)));
    const up = list.filter((r) => (val(r) || 0) > 0).length, dn = list.filter((r) => (val(r) || 0) < 0).length;
    const rankChip = g.meta ? '<span class="gr">#' + esc(g.meta.rank) + ' · score ' + (num(g.meta.score) != null ? num(g.meta.score).toFixed(2) : "—") + '</span>' : "";
    h += '<div class="grp"><div class="gh">' +
      '<span class="gn">' + esc(g.name) + '</span>' + rankChip +
      '<span class="gb"><span class="up">' + up + '↑</span> <span class="dn">' + dn + '↓</span> · ' + list.length + '</span>' +
    '</div><div class="tiles">' +
      list.map((r) => {
        const v = val(r);
        const second = COLOR === "chg"
          ? (r.comp != null ? "g " + fmtComp(r.comp) : "")
          : (r.chg != null ? fmtPct(r.chg) : "");
        return '<div class="tile" data-t="' + esc(r.t) + '" style="background:' + heatColor(v, scale) + '" title="' + esc(r.t) + (r.sector ? " · " + esc(r.sector) : "") + '">' +
          '<span class="tk">' + esc(r.t) + '</span>' +
          '<span class="v" style="color:' + valColor(v, scale) + '">' + (v == null ? "—" : (COLOR === "chg" ? fmtPct(v) : fmtComp(v))) + '</span>' +
          (second ? '<span class="v2">' + second + '</span>' : "") +
        '</div>';
      }).join("") +
    '</div></div>';
  }
  el("board").innerHTML = h;
  /* freshness stamp from live_quotes.updated_ts — honest, badged when old */
  let newest = null;
  for (const t in d.Q) { const u = d.Q[t].updated_ts ? Date.parse(d.Q[t].updated_ts) : null; if (u && (!newest || u > newest)) newest = u; }
  if (newest) {
    const age = Math.round((Date.now() - newest) / 60000);
    const et = new Date(newest).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour12: false });
    el("stamp").innerHTML = "quotes " + et + " ET" + (age > 20 ? '<span class="stale">STALE ' + (age >= 120 ? Math.round(age/60) + "h" : age + "m") + '</span>' : "");
  } else el("stamp").textContent = "no quote stamp";
}

/* tile click → chart, same frame (scene pane becomes the chart) */
document.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (t && t.dataset.t) location.href = "/chart?t=" + encodeURIComponent(t.dataset.t) + "&range=1D";
});

async function tick() {
  const d = await pull();
  render(d);
}
tick().catch(() => { el("board").innerHTML = '<div class="msg">heat data unavailable</div>'; });
setInterval(() => tick().catch(() => {}), REFRESH);
</script>
</body>
</html>
