<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · pulse</title>
<!-- ============================================================================
     SCINTILLA WIDGET · PULSE — market state at-a-glance strip (queue Q2).
     One row, composable into any scene: cohort Geiger posture (green vs red
     count over explicit provider Geiger, no recomputation), macro direction
     via the explicit mixed-market quote contract, and VIX posture from the
     retained non-equity quote lane + VIX/VIX3M term ratio from vix_term —
     the term row wears an honest STALE badge when old; board P-14 tracks the
     frozen feed, this page never hides it). No equity table alias is used.
     Params: ?sections=geiger,macro,vix (default all) · ?refresh=30 (10-300s)
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.03em;
  display:flex; align-items:center; overflow:hidden; }
#strip{ flex:1 1 auto; display:flex; align-items:stretch; border:.8px solid var(--hair);
  background:var(--panel2); min-height:34px; overflow-x:auto; scrollbar-width:none; }
#strip::-webkit-scrollbar{ display:none; }
.sec{ display:flex; align-items:center; gap:9px; padding:7px 14px; border-right:1px solid var(--line);
  white-space:nowrap; flex:1 1 auto; justify-content:center; }
.sec:last-child{ border-right:0; }
.k{ color:var(--crk); font-size:8.5px; letter-spacing:.22em; }
.v{ color:var(--ink2); font-variant-numeric:tabular-nums; }
.up{ color:var(--bull); } .dn{ color:var(--bear); } .neu{ color:var(--dim); }
.big{ font-size:12px; font-weight:600; }
.dot{ opacity:.3; padding:0 2px; color:var(--dim); }
.badge{ font-size:8px; letter-spacing:.14em; color:var(--vol); border:1px dashed rgba(255,138,0,.5);
  padding:1px 6px; text-transform:uppercase; }
.badge.stale{ color:var(--bear); border-color:rgba(255,45,85,.5); }
.empty{ color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
.dead{ color:var(--vol); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="strip"><div class="sec"><span class="empty">loading pulse…</span></div></div>
<script src="/_provider/provider.js"></script>
<script>
/* EXPLICIT PROVIDER CLIENT — bind the page's narrow Supabase reader once.
   Market surfaces below call SC_PROVIDER by product result; pg remains non-market only. */
try { scBindProviderClient(); } catch (_) {}

"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const SECTIONS = String(QS.get("sections") || "geiger,macro,vix").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
const REFRESH = Math.max(10, Math.min(300, +(QS.get("refresh") || 30))) * 1000;
const MACRO_SET = ["SPY","QQQ","IWM","SMH","GLD","TLT","NVDA","COIN"];   // hub constant, verbatim
const fmtPct = (c) => (c >= 0 ? "+" : "") + (+c).toFixed(2) + "%";

/* ---- section builders ----
   A failed read is kept as READ_FAILED and worded as a failure (.dead, source named,
   retrying), never with the same words as an empty table (.empty). The old catch(() => null)
   made a failed Geiger read and an empty accepted result look identical. */
const READ_FAILED = { failed: true };
function secGeiger(comp) {
  if (comp === READ_FAILED) return '<div class="sec"><span class="k">GEIGER</span><span class="dead">provider /geiger did not answer — unavailable, not empty · retrying</span></div>';
  if (!Array.isArray(comp) || !comp.length) return '<div class="sec"><span class="k">GEIGER</span><span class="empty">no provider Geiger rows</span></div>';
  let g = 0, r = 0, sum = 0, n = 0;
  for (const row of comp) { const v = num(row.composite); if (v == null || !isFinite(v)) continue; n++; sum += v; if (v > 0) g++; else if (v < 0) r++; }
  const net = g - r, avg = n ? sum / n : null;
  const tone = net > 0 ? "up" : net < 0 ? "dn" : "neu";
  return '<div class="sec"><span class="k">GEIGER</span>' +
    '<span class="v big up">' + g + '↑</span><span class="v big dn">' + r + '↓</span>' +
    '<span class="dot">·</span><span class="v ' + tone + '">net ' + (net >= 0 ? "+" : "") + net + '</span>' +
    (avg != null ? '<span class="dot">·</span><span class="v ' + (avg >= 0 ? "up" : "dn") + '">avg ' + (avg >= 0 ? "+" : "−") + Math.abs(avg).toFixed(2) + '</span>' : "") +
    '</div>';
}
function secMacro(quotes) {
  if (quotes === READ_FAILED) return '<div class="sec"><span class="k">MACRO</span><span class="dead">retained non-equity quote lane did not answer — unavailable, not empty · retrying</span></div>';
  const m = {};
  for (const q of (quotes || [])) m[q.ticker] = q;
  const rows = MACRO_SET.map((t) => m[t]).filter(Boolean).filter((q) => num(q.chg_pct) != null);
  if (!rows.length) return '<div class="sec"><span class="k">MACRO</span><span class="empty">no retained macro quote rows</span></div>';
  const up = rows.filter((q) => num(q.chg_pct) >= 0).length;
  const tone = up > rows.length / 2 ? "up" : up < rows.length / 2 ? "dn" : "neu";
  const spy = m["SPY"], qqq = m["QQQ"];
  return '<div class="sec"><span class="k">MACRO</span>' +
    '<span class="v big ' + tone + '">' + up + "/" + rows.length + '↑</span>' +
    (spy && num(spy.chg_pct) != null ? '<span class="dot">·</span><span class="v">SPY <span class="' + (num(spy.chg_pct) >= 0 ? "up" : "dn") + '">' + fmtPct(num(spy.chg_pct)) + '</span></span>' : "") +
    (qqq && num(qqq.chg_pct) != null ? '<span class="dot">·</span><span class="v">QQQ <span class="' + (num(qqq.chg_pct) >= 0 ? "up" : "dn") + '">' + fmtPct(num(qqq.chg_pct)) + '</span></span>' : "") +
    '</div>';
}
function secVix(vq, term) {
  if (vq === READ_FAILED && term === READ_FAILED)
    return '<div class="sec"><span class="k">VIX</span><span class="dead">retained non-equity quotes and vix_term did not answer — unavailable, not empty · retrying</span></div>';
  const parts = [];
  if (vq === READ_FAILED) parts.push('<span class="dead">retained non-equity quotes did not answer · retrying</span>');
  else if (vq && num(vq.price) != null) {
    const c = num(vq.chg_pct);
    /* VIX up = risk-off: tone the CHANGE inverted (rising vol = bear-red) */
    parts.push('<span class="v big">' + num(vq.price).toFixed(1) + '</span>' +
      (c != null ? '<span class="v ' + (c > 0 ? "dn" : "up") + '">' + fmtPct(c) + '</span>' : ""));
  }
  if (term === READ_FAILED) parts.push((parts.length ? '<span class="dot">·</span>' : '') +
    '<span class="dead">vix_term did not answer · retrying</span>');
  else if (term && num(term.ratio) != null) {
    const ratio = num(term.ratio);
    const posture = ratio < 1 ? "CONTANGO" : "BACKWARDATION";
    const tone = ratio < 1 ? "up" : "dn";
    let staleBadge = "";
    if (term.date) {
      const days = Math.round((Date.now() - new Date(term.date + "T00:00:00Z").getTime()) / 86400000);
      if (days > 2) staleBadge = '<span class="badge stale">STALE ' + days + 'd</span>';
    }
    parts.push('<span class="dot">·</span><span class="v">/3M ' + ratio.toFixed(2) + '</span>' +
      '<span class="v ' + tone + '">' + posture + '</span>' + staleBadge);
  }
  if (!parts.length) return '<div class="sec"><span class="k">VIX</span><span class="empty">no vix source</span></div>';
  return '<div class="sec"><span class="k">VIX</span>' + parts.join("") + '</div>';
}

/* ---- pull + render — a dead read is KEPT as READ_FAILED, so one dead table never blanks
   the strip AND never wears an empty table's words; the healthy sections render beside it ---- */
async function tick() {
  const wantG = SECTIONS.includes("geiger"), wantM = SECTIONS.includes("macro"), wantV = SECTIONS.includes("vix");
  const [comp, quotes, term] = await Promise.all([
    wantG ? SC_PROVIDER.equityGeiger().catch(() => READ_FAILED) : null,
    (wantM || wantV) ? SC_NON_EQUITY.quotes(MACRO_SET.concat(["VIX"])).catch(() => READ_FAILED) : null,
    wantV ? pg("vix_term?select=date,vix,vix3m,ratio&order=date.desc&limit=1").catch(() => READ_FAILED) : null,
  ]);
  const vq = quotes === READ_FAILED ? READ_FAILED
    : (Array.isArray(quotes) ? quotes.find((q) => q.ticker === "VIX") : null);
  const vterm = term === READ_FAILED ? READ_FAILED : ((Array.isArray(term) && term[0]) || null);
  const html = [
    wantG ? secGeiger(comp) : "",
    wantM ? secMacro(quotes) : "",
    wantV ? secVix(vq, vterm) : "",
  ].join("");
  el("strip").innerHTML = html || '<div class="sec"><span class="empty">no sections selected</span></div>';
}
tick().catch(() => { el("strip").innerHTML = '<div class="sec"><span class="empty">pulse data unavailable</span></div>'; });
setInterval(() => tick().catch(() => {}), REFRESH);
</script>
</body>
</html>
