<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>SCINTILLA · Station viewer</title>
<style>
:root{--bg:#0a0a0f;--panel:#0f0f1a;--line:#25253a;--ink:#f2f2f8;--muted:#9a9ab6;--cyan:#00d4ff;--red:#ff2d55;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}body{display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px}.card{width:min(440px,100%);padding:24px;border:1px solid var(--line);background:var(--panel);text-align:center}.mark{color:var(--cyan);font-size:10px;letter-spacing:.18em}.title{margin:9px 0 7px;font-size:16px}.copy,.state{color:var(--muted);font-size:12px;line-height:1.6}.row{display:flex;gap:8px;justify-content:center;margin-top:16px}input,button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}input{width:124px;text-align:center;letter-spacing:.2em}button{color:var(--cyan);border-color:var(--cyan)}#stage{display:none;position:fixed;inset:0;background:#000}video,canvas{width:100%;height:100%;object-fit:contain}.bad{color:var(--red)}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="mark">SCINTILLA · TRUSTED IPAD DISPLAY</div>
  <div class="title">Connect this iPad</div>
  <div class="copy">Open the link from your iMac Station once. This display reconnects after Safari wakes and never receives your X login.</div>
  <div class="row"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="connect">connect</button></div>
  <div class="state" id="state" aria-live="polite"></div>
</main>
<main id="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></main>
<script>
"use strict";
const SB="https://wadinxqplrggagkvrdag.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
const token=new URLSearchParams(location.hash.slice(1)).get("pair")||"";
const sharedCode=new URLSearchParams(location.hash.slice(1)).get("code")||"";
const state=document.getElementById("state"), video=document.getElementById("video"), canvas=document.getElementById("canvas");
let socket, peer, crop, offerRetry, reconnectTimer, pairRoom, activeCode="", connecting=false, hiddenAt=0;
function report(status){if(parent!==window)parent.postMessage({type:"SCINTILLA_IPAD_VIEWER_STATUS",status},location.origin)}
function say(text,bad=false){state.textContent=text;state.classList.toggle("bad",bad);if(bad)report("RECONNECTING")}
function waitIce(pc){if(pc.iceGatheringState==="complete")return Promise.resolve();return new Promise(resolve=>pc.addEventListener("icegatheringstatechange",function done(){if(pc.iceGatheringState!=="complete")return;pc.removeEventListener("icegatheringstatechange",done);resolve()}));}
function channel(){
  const topic="realtime:station-ipad:"+token;let ref=0;
  socket=new WebSocket(SB.replace("https:","wss:")+"/realtime/v1/websocket?apikey="+encodeURIComponent(ANON)+"&vsn=1.0.0");
  const send=(event,payload)=>socket.send(JSON.stringify({topic,event,payload,ref:String(++ref),join_ref:"1"}));
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error("The pairing room did not open.")),9000);
    socket.addEventListener("open",()=>send("phx_join",{config:{broadcast:{self:false,ack:true},presence:{key:""},private:false},access_token:ANON}));
    socket.addEventListener("message",async e=>{const m=JSON.parse(e.data);if(m.event==="phx_reply"&&m.ref==="1"){if(m.payload?.status!=="ok")return reject(new Error("The pairing room was refused."));clearTimeout(timer);resolve({send:(event,payload)=>send("broadcast",{type:"broadcast",event,payload})});return}if(m.event!=="broadcast")return;const p=m.payload||{};if(p.event==="answer"&&peer&&p.payload?.answer){await peer.setRemoteDescription(p.payload.answer);clearInterval(offerRetry);say("Live from your iMac");report("IMAC LIVE");}if(p.event==="expired")say("This pairing expired. Start a new one on the iMac.",true);if(p.event==="crop"){crop=p.payload;draw();}});
    socket.addEventListener("error",()=>reject(new Error("The pairing room could not connect.")));
  });
}
function draw(){if(!crop||video.readyState<2||!video.videoWidth)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const c=canvas.getContext("2d");const v=crop.viewport||{width:video.videoWidth,height:video.videoHeight},r=crop.rect||{left:0,top:0,width:v.width,height:v.height};const sx=r.left*video.videoWidth/v.width,sy=(r.top+(crop.fractionalScrollOffset||0))*video.videoHeight/v.height,sw=r.width*video.videoWidth/v.width,sh=r.height*video.videoHeight/v.height;c.fillStyle="#000";c.fillRect(0,0,canvas.width,canvas.height);const scale=Math.min(canvas.width/sw,canvas.height/sh),dw=sw*scale,dh=sh*scale;c.drawImage(video,sx,sy,sw,sh,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh);requestAnimationFrame(draw)}
function closeConnection(){clearInterval(offerRetry);clearTimeout(reconnectTimer);offerRetry=null;reconnectTimer=null;try{socket?.close();peer?.close()}catch(_){}socket=null;peer=null}
function scheduleReconnect(){if(document.visibilityState==="hidden")return;clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>connectToImax(true),700)}
async function connectToImax(force=false){
  const code=(sharedCode||document.getElementById("code").value).replace(/\D/g,"");if(!/^[0-9]{6}$/.test(code))return say("Enter the six-digit code from the iMac.",true);if(!/^[A-Za-z0-9_-]{32,}$/.test(token))return say("This pairing link is invalid.",true);activeCode=code;
  if(connecting)return;if(!force&&peer?.connectionState==="connected"){video.play().then(draw).catch(()=>{});return}connecting=true;clearInterval(offerRetry);try{try{socket?.close();peer?.close()}catch(_){}socket=null;peer=null;say("Opening secure pairing…");pairRoom=await channel();const activePeer=peer=new RTCPeerConnection({iceServers:[]});activePeer.addTransceiver("video",{direction:"recvonly"});activePeer.addEventListener("connectionstatechange",()=>{if(activePeer!==peer)return;if(["failed","disconnected","closed"].includes(activePeer.connectionState)){say("Reconnecting to your iMac…");scheduleReconnect()}});activePeer.addEventListener("track",e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);document.getElementById("card").style.display="none";document.getElementById("stage").style.display="block";video.play().then(draw).catch(()=>{})});await activePeer.setLocalDescription(await activePeer.createOffer());await waitIce(activePeer);const sendOffer=()=>{if(peer===activePeer&&!activePeer.remoteDescription)pairRoom.send("offer",{code,offer:activePeer.localDescription.toJSON(),at:Date.now()})};sendOffer();offerRetry=setInterval(sendOffer,2000);say("Waiting for the iMac…");setTimeout(()=>{if(peer===activePeer&&!activePeer.remoteDescription){clearInterval(offerRetry);say("Pairing timed out. Start a new one on the iMac.",true)}},30*60*1000)}catch(e){say(e.message||"Pairing failed.",true);scheduleReconnect()}finally{connecting=false}}
document.getElementById("connect").onclick=()=>connectToImax(true);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}video.play().then(draw).catch(()=>{});if(hiddenAt&&Date.now()-hiddenAt>1000){say("Reconnecting to your iMac…");scheduleReconnect()}});
addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.type!=="SCINTILLA_IPAD_CONTROL")return;const action=event.data.action,value=event.data.value;if(pairRoom&&activeCode&&["view","rewind","refresh"].includes(action))pairRoom.send("control",{code:activeCode,action,value})});
addEventListener("pagehide",closeConnection);
if(/^[0-9]{6}$/.test(sharedCode)){document.getElementById("code").value=sharedCode;setTimeout(()=>connectToImax(),0)}
</script>
</body>
</html>
