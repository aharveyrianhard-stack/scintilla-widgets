<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · scenes</title>
<!-- ============================================================================
     SCINTILLA WIDGET · SCENES — stage-2 rotating multi-scene layout engine
     (HUB/SURFACE COMMAND). Composes the standalone windowable routes (/chart,
     /geiger, /ticker, /youtube, /wall) into NAMED SCENES — each scene is a set
     of panes with PERCENT rects (x/y/w/h of viewport), so the 1920x1080 wall
     and the 1168x755 laptop are SEPARATE PROFILES of the same scene (Alan's
     percentage rule, mirroring the Hammerspoon layer). Layouts are DATA:
     public.scene_layouts in scintilla-live (anon PostgREST, estate pattern),
     with a baked fallback copy so the wall never dies on a DB blip.
     Modes:
       /scenes                        → scene picker (what Hammerspoon points at)
       /scenes?scene=command-deck     → render one named scene
       /scenes?rotate=all&dwell=120   → cycle scenes (or rotate=a,b,c)
     Params: ?profile=wall|laptop (else auto: viewport ≥1600px → wall) ·
             ?dwell=120 (scene-level, 15–3600s)
     Controls (rotate mode): hover holds · ←/→ step · space pauses.
     Data: scene_layouts via pg() — DB reads ONLY, never FMP from pages.
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:12px; letter-spacing:.02em; overflow:hidden; }
.stage{ position:absolute; inset:0; opacity:0; transition:opacity .2s linear; pointer-events:none; }
.stage.front{ opacity:1; pointer-events:auto; }
.stage iframe{ position:absolute; border:0; background:var(--bg); }
/* picker */
#picker{ position:absolute; inset:0; overflow-y:auto; padding:34px 30px; }
#picker h1{ font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--crk); font-weight:400; margin:0 0 6px; }
#picker .sub{ color:var(--dim); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:26px; }
#picker a.s{ display:block; text-decoration:none; color:inherit; border:.8px solid var(--hair); background:var(--panel2);
  padding:14px 16px; margin-bottom:12px; max-width:720px; transition:border-color .15s; }
#picker a.s:hover{ border-color:var(--crk); }
#picker .n{ color:var(--crk); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
#picker .r{ color:var(--ink2); font-size:11px; margin:5px 0 4px; }
#picker .p{ color:var(--dim); font-size:9.5px; letter-spacing:.04em; line-height:1.6; }
#picker .src{ color:var(--mute); font-size:9px; letter-spacing:.06em; margin-top:5px; }
/* HUD */
#hud{ position:fixed; right:10px; bottom:8px; z-index:10; display:none; align-items:center; gap:10px;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  background:rgba(10,10,15,.82); border:.8px solid var(--hair); padding:5px 10px; }
body.on #hud{ display:flex; }
#hud b{ color:var(--crk); font-weight:400; }
#hud .tk{ color:var(--ink2); letter-spacing:.08em; }
#hud .st{ color:var(--mute); }
#hud .bar{ position:relative; width:64px; height:3px; background:var(--line2); overflow:hidden; display:none; }
body.rot #hud .bar{ display:block; }
#hud .bar i{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--crk); }
#hud button{ background:none; border:.6px solid var(--line2); color:var(--ink2); font-family:var(--mono);
  font-size:9px; padding:2px 7px; cursor:pointer; letter-spacing:.08em; display:none; }
body.rot #hud button{ display:inline-block; }
#hud button:hover{ color:var(--crk); border-color:rgba(0,212,255,.45); }
.msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="stage" id="s0"></div>
<div class="stage" id="s1"></div>
<div id="picker" hidden><div class="msg">loading scenes…</div></div>
<div id="hud">
  <b>SCENE</b>
  <span class="tk" id="hName">—</span>
  <span class="st" id="hProf"></span>
  <span class="st" id="hIx"></span>
  <span class="bar"><i id="hBar"></i></span>
  <button data-act="prev" title="previous (←)">◀</button>
  <button data-act="pause" id="hPause" title="pause/resume (space)">❚❚</button>
  <button data-act="next" title="next (→)">▶</button>
</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const el = (id) => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---- baked fallback (mirror of the seeded scene_layouts rows) — the wall never
       dies on a DB blip; the DB copy wins whenever it reads. ---- */
const SCENES_FALLBACK = {
  "market-2-charts": {
    wall:   [{src:"/chart?t=SPY&range=1D",x:0,y:0,w:50,h:92},{src:"/chart?t=MU&range=15m",x:50,y:0,w:50,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/chart?t=SPY&range=1D",x:0,y:0,w:100,h:46},{src:"/chart?t=MU&range=15m",x:0,y:46,w:100,h:46},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "IT-deck named layout — two charts side by side + tape strip."
  },
  "command-deck": {
    wall:   [{src:"/chart?t=MU&range=1D",x:0,y:0,w:62,h:92},{src:"/geiger?auto=1&dwell=15",x:62,y:0,w:38,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/chart?t=MU&range=1D",x:0,y:0,w:100,h:50},{src:"/geiger?auto=1&dwell=15",x:0,y:50,w:100,h:42},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "Chart 62 / rotating geiger 38 / tape strip — the hub dashboard shape as scene modules."
  },
  "wall-rotation": {
    wall:   [{src:"/wall?dwell=20&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/wall?dwell=20&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "The auto-rotating chart wall as a scene: /wall full-bleed over favorites + tape strip."
  }
};

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const SCENE_P  = (QS.get("scene") || "").trim();
const ROTATE_P = (QS.get("rotate") || "").trim();
const DWELL    = Math.max(15, Math.min(3600, +(QS.get("dwell") || 120))) * 1000;   // scene-level dwell
const PROF_P   = (QS.get("profile") || "").trim().toLowerCase();
const profileNow = () => PROF_P === "wall" || PROF_P === "laptop" ? PROF_P
  : (window.innerWidth >= 1600 ? "wall" : "laptop");   // wall 1920x1080-class vs laptop 1168x755-class

/* ---- state ---- */
let SCENES = {};            // name → { wall:[panes], laptop:[panes], note }
let ORDER = [];             // rotation order (scene names)
let IX = 0, FRONT = 0, PAUSED = false, HOVERING = false;
let cycleT0 = 0, rafId = null, swapTimer = null, loadTimer = null, pendingSwap = false;
let CUR_PROFILE = null;
const ROT = !!ROTATE_P;
const SWAP_MAX_WAIT = 8000;
const stage = (k) => el("s" + k);

async function loadScenes() {
  try {
    const rows = await pg("scene_layouts?active=eq.true&select=scene,profile,panes,note&order=scene.asc,profile.asc");
    if (Array.isArray(rows) && rows.length) {
      const m = {};
      for (const r of rows) {
        if (!m[r.scene]) m[r.scene] = { note: r.note || "" };
        m[r.scene][r.profile] = Array.isArray(r.panes) ? r.panes : [];
        if (r.note) m[r.scene].note = r.note;
      }
      SCENES = m;
      return "db";
    }
  } catch (_) {}
  SCENES = SCENES_FALLBACK;
  return "fallback";
}
const paneSet = (name, prof) => {
  const s = SCENES[name]; if (!s) return null;
  return s[prof] || s.wall || s.laptop || null;   // profile falls back to whatever exists
};

/* ---- render a scene into a stage (double-buffered at scene level) ---- */
function buildStage(node, panes) {
  node.innerHTML = "";
  const frames = [];
  for (const p of panes) {
    const f = document.createElement("iframe");
    f.src = p.src;
    f.style.left = (+p.x || 0) + "%";
    f.style.top = (+p.y || 0) + "%";
    f.style.width = (+p.w || 0) + "%";
    f.style.height = (+p.h || 0) + "%";
    if (p.z != null) f.style.zIndex = String(p.z);
    f.title = p.src;
    node.appendChild(f);
    frames.push(f);
  }
  return frames;
}
function showScene(nextIx, immediate) {
  if (pendingSwap) return;
  pendingSwap = true;
  const name = ORDER[nextIx];
  const prof = profileNow();
  const panes = paneSet(name, prof);
  const back = 1 - FRONT, bs = stage(back);
  if (!panes || !panes.length) { pendingSwap = false; return; }
  const frames = buildStage(bs, panes);
  let loaded = 0; const need = frames.length;
  const flip = () => {
    if (!pendingSwap) return;
    if (!immediate && ROT && (HOVERING || PAUSED)) { setTimeout(flip, 500); return; }
    pendingSwap = false;
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    bs.classList.add("front");
    const fs = stage(FRONT);
    fs.classList.remove("front");
    setTimeout(() => { if (!fs.classList.contains("front")) fs.innerHTML = ""; }, 400);   // free old panes after fade
    FRONT = back;
    IX = nextIx;
    CUR_PROFILE = prof;
    cycleT0 = Date.now();
    hud();
    if (ROT) schedule();
  };
  const armed = () => {
    const remaining = (immediate || !ROT) ? 120 : Math.max(350, (cycleT0 + DWELL) - Date.now());
    setTimeout(flip, remaining);
  };
  frames.forEach((f) => f.addEventListener("load", () => { loaded++; if (loaded >= need) armed(); }));
  loadTimer = setTimeout(flip, ROT ? Math.max(SWAP_MAX_WAIT, (cycleT0 + DWELL) - Date.now() + 1500) : SWAP_MAX_WAIT);
}
function schedule() {
  if (swapTimer) clearTimeout(swapTimer);
  if (PAUSED || !ROT) return;
  const wait = Math.max(400, DWELL - 4000);   // preload the next scene ~4s before the dwell ends
  swapTimer = setTimeout(() => {
    if (PAUSED || HOVERING) { schedule0(1500); return; }
    showScene((IX + 1) % ORDER.length, false);
  }, wait);
}
function schedule0(ms) { if (swapTimer) clearTimeout(swapTimer); swapTimer = setTimeout(() => {
  if (PAUSED || HOVERING) { schedule0(1500); return; }
  showScene((IX + 1) % ORDER.length, false);
}, ms); }
function step(d) {
  if (pendingSwap) return;
  const n = ((IX + d) % ORDER.length + ORDER.length) % ORDER.length;
  showScene(n, true);
}
function setPaused(p) { PAUSED = p; hud(); if (!PAUSED) { cycleT0 = Date.now(); schedule(); } }

function hud() {
  el("hName").textContent = ORDER[IX] || "—";
  el("hProf").textContent = (CUR_PROFILE || profileNow()) + " · %";
  el("hIx").textContent = ROT ? (IX + 1) + "/" + ORDER.length + " · " + Math.round(DWELL/1000) + "s" : "";
  el("hPause").textContent = PAUSED ? "▶" : "❚❚";
}
function tickBar() {
  if (rafId) cancelAnimationFrame(rafId);
  const stepFn = () => {
    const stalled = PAUSED || HOVERING || !ROT;
    const f = stalled ? 0 : Math.min(1, (Date.now() - cycleT0) / DWELL);
    el("hBar").style.width = (f * 100) + "%";
    rafId = requestAnimationFrame(stepFn);
  };
  rafId = requestAnimationFrame(stepFn);
}

/* hover holds scene rotation (tape convention) · ←/→ step · space pauses */
document.addEventListener("pointerover", () => { HOVERING = true; hud(); });
document.addEventListener("pointerleave", () => { HOVERING = false; cycleT0 = Date.now(); hud(); });
document.addEventListener("keydown", (e) => {
  if (!ROT) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === " ") { e.preventDefault(); setPaused(!PAUSED); }
});
el("hud").addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]"); if (!n) return;
  const a = n.dataset.act;
  if (a === "next") step(1);
  else if (a === "prev") step(-1);
  else if (a === "pause") setPaused(!PAUSED);
});
/* crossing the wall/laptop width threshold re-renders the current scene in the right profile */
let rsz = null;
window.addEventListener("resize", () => {
  if (!document.body.classList.contains("on")) return;
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (CUR_PROFILE && profileNow() !== CUR_PROFILE && !pendingSwap) showScene(IX, true); }, 300);
});

/* ---- picker (no params): the directory Hammerspoon points at ---- */
function renderPicker(sourceTag) {
  const pk = el("picker");
  pk.hidden = false;
  const names = Object.keys(SCENES);
  let h = '<h1>Scintilla · Scenes</h1>' +
    '<div class="sub">named multi-widget layouts · percent rects · wall / laptop profiles · source: ' + esc(sourceTag) + ' (scene_layouts · scintilla-live)</div>';
  for (const n of names) {
    const s = SCENES[n];
    const profs = ["wall", "laptop"].filter((p) => s[p] && s[p].length);
    const panes = (s[profs[0]] || []);
    h += '<a class="s" href="/scenes?scene=' + encodeURIComponent(n) + '">' +
      '<div class="n">' + esc(n) + '</div>' +
      '<div class="r">/scenes?scene=' + esc(n) + ' · profiles: ' + profs.join(" + ") + ' · ' + panes.length + ' panes</div>' +
      '<div class="p">' + esc(s.note || "") + '</div>' +
      '<div class="src">' + panes.map((p) => esc(p.src)).join("  ·  ") + '</div>' +
    '</a>';
  }
  h += '<a class="s" href="/scenes?rotate=all&dwell=120">' +
    '<div class="n">Rotate All · auto</div>' +
    '<div class="r">/scenes?rotate=all&dwell=120</div>' +
    '<div class="p">cycles every named scene — the rotating scene wall. hover holds · ←/→ step · space pauses · ?rotate=a,b,c for a subset · ?profile=wall|laptop to force a profile</div></a>';
  pk.innerHTML = h;
}

/* ---- boot ---- */
async function boot() {
  const sourceTag = await loadScenes();
  const names = Object.keys(SCENES);
  if (!names.length) { el("picker").hidden = false; el("picker").innerHTML = '<div class="msg">no scenes in scene_layouts</div>'; return; }
  if (!SCENE_P && !ROTATE_P) { renderPicker(sourceTag); return; }
  ORDER = ROT
    ? (ROTATE_P === "all" ? names : ROTATE_P.split(",").map((s) => s.trim()).filter((n) => SCENES[n]))
    : [SCENE_P].filter((n) => SCENES[n]);
  if (!ORDER.length) { el("picker").hidden = false; el("picker").innerHTML = '<div class="msg">unknown scene — see /scenes for the list</div>'; return; }
  document.body.classList.add("on");
  if (ROT) document.body.classList.toggle("rot", ORDER.length > 1);
  IX = 0;
  cycleT0 = Date.now();
  showScene(0, true);
  hud(); tickBar();
}
boot();
</script>
</body>
</html>
