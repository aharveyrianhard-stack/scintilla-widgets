<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · scenes</title>
<!-- ============================================================================
     SCINTILLA WIDGET · SCENES — stage-2 rotating multi-scene layout engine
     (HUB/SURFACE COMMAND). Composes the standalone windowable routes (/chart,
     /geiger, /ticker, /youtube, /wall) into NAMED SCENES — each scene is a set
     of panes with PERCENT rects (x/y/w/h of viewport), so the 1920x1080 wall
     and the 1168x755 laptop are SEPARATE PROFILES of the same scene (Alan's
     percentage rule, mirroring the Hammerspoon layer). Layouts are DATA:
     public.scene_layouts in scintilla-live (anon PostgREST, estate pattern),
     with a baked fallback copy so the wall never dies on a DB blip.
     Modes:
       /scenes                        → scene picker (what Hammerspoon points at)
       /scenes?scene=command-deck     → render one named scene
       /scenes?rotate=all&dwell=120   → cycle scenes (or rotate=a,b,c · &start=name)
     Params: ?profile=wall|laptop|narrow (else auto: ≥1600 wall · ≥900 laptop ·
             else narrow/touch) · ?dwell=120 (scene-level, 15–3600s)
     Controls (rotate mode): hover holds · ←/→ step · space pauses.
     Data: scene_layouts via pg() — DB reads ONLY, never FMP from pages.
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:12px; letter-spacing:.02em; overflow:hidden; }
.stage{ position:absolute; inset:0; opacity:0; transition:opacity .2s linear; pointer-events:none; }
.stage.front{ opacity:1; pointer-events:auto; }
.stage iframe{ position:absolute; border:0; background:var(--bg); }
/* picker — the control surface: big cards, live thumbnails, channel-picker feel */
#picker{ position:absolute; inset:0; overflow-y:auto; padding:26px 28px 40px; }
#picker .top{ display:flex; align-items:baseline; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
#picker h1{ font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--crk); font-weight:400; margin:0; }
#picker .sub{ color:var(--dim); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; }
#picker .rotall{ margin-left:auto; text-decoration:none; color:var(--crk); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; border:.8px solid rgba(0,212,255,.45); padding:8px 16px;
  background:linear-gradient(180deg,rgba(0,212,255,.10),rgba(0,212,255,.02)); }
#picker .rotall:hover{ background:rgba(0,212,255,.16); border-color:var(--crk); }
#picker .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; }
.sc-card{ border:.8px solid var(--hair); background:var(--panel2); transition:border-color .15s; display:flex; flex-direction:column; }
.sc-card:hover{ border-color:var(--crk); }
.sc-card .prev{ position:relative; aspect-ratio:16/9; overflow:hidden; background:#07070c; cursor:pointer;
  border-bottom:.8px solid var(--line); }
.sc-card .prev iframe{ position:absolute; left:0; top:0; width:1920px; height:1080px; border:0;
  transform-origin:0 0; pointer-events:none; background:var(--bg); }
.sc-card .prev .lbl{ position:absolute; left:0; top:0; right:0; bottom:0; display:flex; align-items:center;
  justify-content:center; color:var(--mute); font-size:9px; letter-spacing:.18em; text-transform:uppercase; }
.sc-card .prev svg.schem{ position:absolute; inset:0; width:100%; height:100%; }
.sc-card .prev .live{ position:absolute; left:5px; top:5px; z-index:2; font-size:8px; letter-spacing:.1em;
  color:var(--dim); background:rgba(4,4,10,.75); border:.6px solid var(--line2); padding:2px 6px; pointer-events:none; }
.sc-card .prev .live b{ font-weight:400; }
.sc-card .row a.chip{ padding:2px 7px; font-size:8.5px; border:1px dashed var(--line2); color:var(--dim); }
.sc-card .prev:hover::after{ content:"OPEN ⛶"; position:absolute; right:8px; bottom:6px; color:var(--crk);
  font-size:9px; letter-spacing:.16em; background:rgba(4,4,10,.8); border:.6px solid var(--hair); padding:3px 8px; }
.sc-card .body{ padding:11px 13px 12px; }
.sc-card .n{ color:var(--crk); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
.sc-card .p{ color:var(--dim); font-size:9.5px; letter-spacing:.04em; line-height:1.6; margin-top:5px; }
.sc-card .src{ color:var(--mute); font-size:8.5px; letter-spacing:.05em; margin-top:5px; }
.sc-card .row{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.sc-card .row .chip{ color:var(--dim); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  border:1px dashed var(--line2); padding:2px 7px; }
.sc-card .row a{ text-decoration:none; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 11px; border:.6px solid var(--line2); color:var(--ink2); }
.sc-card .row a:hover{ color:var(--crk); border-color:rgba(0,212,255,.45); }
.sc-card .row a.go{ color:var(--crk); border-color:rgba(0,212,255,.45); margin-left:auto; }
/* HUD */
#hud{ position:fixed; right:10px; bottom:8px; z-index:10; display:none; align-items:center; gap:10px;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  background:rgba(10,10,15,.82); border:.8px solid var(--hair); padding:5px 10px; }
body.on #hud{ display:flex; }
#hud b{ color:var(--crk); font-weight:400; }
#hud .tk{ color:var(--ink2); letter-spacing:.08em; }
#hud .st{ color:var(--mute); }
#hud .bar{ position:relative; width:64px; height:3px; background:var(--line2); overflow:hidden; display:none; }
body.rot #hud .bar{ display:block; }
#hud .bar i{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--crk); }
#hud button{ background:none; border:.6px solid var(--line2); color:var(--ink2); font-family:var(--mono);
  font-size:9px; padding:2px 7px; cursor:pointer; letter-spacing:.08em; display:none; }
body.rot #hud button{ display:inline-block; }
#hud button:hover{ color:var(--crk); border-color:rgba(0,212,255,.45); }
.msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="stage" id="s0"></div>
<div class="stage" id="s1"></div>
<div id="picker" hidden><div class="msg">loading scenes…</div></div>
<div id="hud">
  <b>SCENE</b>
  <span class="tk" id="hName">—</span>
  <span class="st" id="hProf"></span>
  <span class="st" id="hIx"></span>
  <span class="bar"><i id="hBar"></i></span>
  <button data-act="prev" title="previous (←)">◀</button>
  <button data-act="pause" id="hPause" title="pause/resume (space)">❚❚</button>
  <button data-act="next" title="next (→)">▶</button>
</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const el = (id) => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---- baked fallback (mirror of the seeded scene_layouts rows) — the wall never
       dies on a DB blip; the DB copy wins whenever it reads. ---- */
const SCENES_FALLBACK = {
  "market-2-charts": {
    wall:   [{src:"/chart?t=SPY&range=1D",x:0,y:0,w:50,h:92},{src:"/chart?t=MU&range=15m",x:50,y:0,w:50,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/chart?t=SPY&range=1D",x:0,y:0,w:100,h:46},{src:"/chart?t=MU&range=15m",x:0,y:46,w:100,h:46},{src:"/ticker",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/chart?t=SPY&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "IT-deck named layout — two charts side by side + tape strip."
  },
  "command-deck": {
    wall:   [{src:"/pulse",x:0,y:0,w:100,h:6},{src:"/chart?t=MU&range=1D",x:0,y:6,w:62,h:86},{src:"/geiger?auto=1&dwell=15",x:62,y:6,w:38,h:86},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/pulse",x:0,y:0,w:100,h:7},{src:"/chart?t=MU&range=1D",x:0,y:7,w:100,h:45},{src:"/geiger?auto=1&dwell=15",x:0,y:52,w:100,h:40},{src:"/ticker",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/pulse",x:0,y:0,w:100,h:7},{src:"/chart?t=MU&range=1D",x:0,y:7,w:100,h:45},{src:"/geiger?auto=1&dwell=15",x:0,y:52,w:100,h:40},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "Pulse strip · chart 62 / rotating geiger 38 · tape — the hub dashboard shape with market-state at a glance."
  },
  "wall-rotation": {
    wall:   [{src:"/wall?dwell=20&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/wall?dwell=20&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/wall?dwell=20&range=1D",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "The auto-rotating chart wall as a scene: /wall full-bleed over favorites + tape strip."
  },
  "geiger-board": {
    wall:   [{src:"/geiger?t=MU",x:0,y:0,w:50,h:46},{src:"/geiger?t=NBIS",x:50,y:0,w:50,h:46},{src:"/geiger?t=SNDK",x:0,y:46,w:50,h:46},{src:"/geiger?auto=1&dwell=12",x:50,y:46,w:50,h:46},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/geiger?auto=1&dwell=12",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/geiger?auto=1&dwell=12",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "Full geiger board — 2×2: three pinned FAV geigers + one auto-rotator, tape strip."
  },
  "research": {
    wall:   [{src:"/chart?t=MU&range=1D",x:0,y:0,w:55,h:92},{src:"/youtube",x:55,y:0,w:45,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/chart?t=MU&range=1D",x:0,y:0,w:100,h:46},{src:"/youtube",x:0,y:46,w:100,h:46},{src:"/ticker",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/youtube",x:0,y:0,w:100,h:92},{src:"/ticker",x:0,y:92,w:100,h:8}],
    note: "Research: chart 55 + youtube feed 45 + tape — watch and chart at once."
  },
  "overview": {
    wall:   [{src:"/ticker?bands=macro",x:0,y:0,w:100,h:8},{src:"/chart?t=SPY&range=1D",x:0,y:8,w:33.34,h:84},{src:"/chart?t=QQQ&range=1D",x:33.34,y:8,w:33.33,h:84},{src:"/chart?t=SMH&range=1D",x:66.67,y:8,w:33.33,h:84},{src:"/ticker?bands=all",x:0,y:92,w:100,h:8}],
    laptop: [{src:"/ticker?bands=macro",x:0,y:0,w:100,h:8},{src:"/chart?t=SPY&range=1D",x:0,y:8,w:100,h:42},{src:"/chart?t=QQQ&range=1D",x:0,y:50,w:100,h:42},{src:"/ticker?bands=all",x:0,y:92,w:100,h:8}],
    narrow: [{src:"/ticker?bands=macro",x:0,y:0,w:100,h:8},{src:"/chart?t=SPY&range=1D",x:0,y:8,w:100,h:84},{src:"/ticker?bands=all",x:0,y:92,w:100,h:8}],
    note: "Macro overview, tape-heavy: MACRO band top + SPY/QQQ/SMH dailies + ALL-movers band bottom."
  }
};

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const SCENE_P  = (QS.get("scene") || "").trim();
const ROTATE_P = (QS.get("rotate") || "").trim();
const DWELL    = Math.max(15, Math.min(3600, +(QS.get("dwell") || 120))) * 1000;   // scene-level dwell
const PROF_P   = (QS.get("profile") || "").trim().toLowerCase();
const PROFILES = ["wall", "laptop", "narrow"];
const profileNow = () => PROFILES.includes(PROF_P) ? PROF_P
  : (window.innerWidth >= 1600 ? "wall" : window.innerWidth >= 900 ? "laptop" : "narrow");
  /* wall 1920x1080-class · laptop 1168x755-class · narrow = iPad portrait / phone (touch) */

/* ---- state ---- */
let SCENES = {};            // name → { wall:[panes], laptop:[panes], note }
let ORDER = [];             // rotation order (scene names)
let IX = 0, FRONT = 0, PAUSED = false, HOVERING = false;
let cycleT0 = 0, rafId = null, swapTimer = null, loadTimer = null, pendingSwap = false;
let CUR_PROFILE = null;
const ROT = !!ROTATE_P;
const SWAP_MAX_WAIT = 8000;
const stage = (k) => el("s" + k);

async function loadScenes() {
  try {
    const rows = await pg("scene_layouts?active=eq.true&select=scene,profile,panes,note&order=scene.asc,profile.asc");
    if (Array.isArray(rows) && rows.length) {
      const m = {};
      for (const r of rows) {
        if (!m[r.scene]) m[r.scene] = { note: r.note || "" };
        m[r.scene][r.profile] = Array.isArray(r.panes) ? r.panes : [];
        if (r.note) m[r.scene].note = r.note;
      }
      SCENES = m;
      return "db";
    }
  } catch (_) {}
  SCENES = SCENES_FALLBACK;
  return "fallback";
}
const PROF_CHAIN = { wall: ["wall","laptop","narrow"], laptop: ["laptop","wall","narrow"], narrow: ["narrow","laptop","wall"] };
const paneSet = (name, prof) => {
  const s = SCENES[name]; if (!s) return null;
  for (const p of (PROF_CHAIN[prof] || PROFILES)) if (s[p] && s[p].length) return s[p];
  return null;   // profile falls back down the chain to whatever exists
};

/* ---- render a scene into a stage (double-buffered at scene level) ---- */
function buildStage(node, panes) {
  node.innerHTML = "";
  const frames = [];
  for (const p of panes) {
    const f = document.createElement("iframe");
    f.src = p.src;
    f.style.left = (+p.x || 0) + "%";
    f.style.top = (+p.y || 0) + "%";
    f.style.width = (+p.w || 0) + "%";
    f.style.height = (+p.h || 0) + "%";
    if (p.z != null) f.style.zIndex = String(p.z);
    f.title = p.src;
    node.appendChild(f);
    frames.push(f);
  }
  return frames;
}
function showScene(nextIx, immediate) {
  if (pendingSwap) return;
  pendingSwap = true;
  const name = ORDER[nextIx];
  const prof = profileNow();
  const panes = paneSet(name, prof);
  const back = 1 - FRONT, bs = stage(back);
  if (!panes || !panes.length) { pendingSwap = false; return; }
  const frames = buildStage(bs, panes);
  let loaded = 0; const need = frames.length;
  const flip = () => {
    if (!pendingSwap) return;
    if (!immediate && ROT && (HOVERING || PAUSED)) { setTimeout(flip, 500); return; }
    pendingSwap = false;
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    bs.classList.add("front");
    const fs = stage(FRONT);
    fs.classList.remove("front");
    setTimeout(() => { if (!fs.classList.contains("front")) fs.innerHTML = ""; }, 400);   // free old panes after fade
    FRONT = back;
    IX = nextIx;
    CUR_PROFILE = prof;
    cycleT0 = Date.now();
    hud();
    if (ROT) schedule();
  };
  const armed = () => {
    const remaining = (immediate || !ROT) ? 120 : Math.max(350, (cycleT0 + DWELL) - Date.now());
    setTimeout(flip, remaining);
  };
  frames.forEach((f) => f.addEventListener("load", () => { loaded++; if (loaded >= need) armed(); }));
  loadTimer = setTimeout(flip, ROT ? Math.max(SWAP_MAX_WAIT, (cycleT0 + DWELL) - Date.now() + 1500) : SWAP_MAX_WAIT);
}
function schedule() {
  if (swapTimer) clearTimeout(swapTimer);
  if (PAUSED || !ROT) return;
  const wait = Math.max(400, DWELL - 4000);   // preload the next scene ~4s before the dwell ends
  swapTimer = setTimeout(() => {
    if (PAUSED || HOVERING) { schedule0(1500); return; }
    showScene((IX + 1) % ORDER.length, false);
  }, wait);
}
function schedule0(ms) { if (swapTimer) clearTimeout(swapTimer); swapTimer = setTimeout(() => {
  if (PAUSED || HOVERING) { schedule0(1500); return; }
  showScene((IX + 1) % ORDER.length, false);
}, ms); }
function step(d) {
  if (pendingSwap) return;
  const n = ((IX + d) % ORDER.length + ORDER.length) % ORDER.length;
  showScene(n, true);
}
function setPaused(p) { PAUSED = p; hud(); if (!PAUSED) { cycleT0 = Date.now(); schedule(); } }

function hud() {
  el("hName").textContent = ORDER[IX] || "—";
  el("hProf").textContent = (CUR_PROFILE || profileNow()) + " · %";
  el("hIx").textContent = ROT ? (IX + 1) + "/" + ORDER.length + " · " + Math.round(DWELL/1000) + "s" : "";
  el("hPause").textContent = PAUSED ? "▶" : "❚❚";
}
function tickBar() {
  if (rafId) cancelAnimationFrame(rafId);
  const stepFn = () => {
    const stalled = PAUSED || HOVERING || !ROT;
    const f = stalled ? 0 : Math.min(1, (Date.now() - cycleT0) / DWELL);
    el("hBar").style.width = (f * 100) + "%";
    rafId = requestAnimationFrame(stepFn);
  };
  rafId = requestAnimationFrame(stepFn);
}

/* hover holds scene rotation (tape convention) · ←/→ step · space pauses */
document.addEventListener("pointerover", () => { HOVERING = true; hud(); });
document.addEventListener("pointerleave", () => { HOVERING = false; cycleT0 = Date.now(); hud(); });
document.addEventListener("keydown", (e) => {
  if (!ROT) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === " ") { e.preventDefault(); setPaused(!PAUSED); }
});
el("hud").addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]"); if (!n) return;
  const a = n.dataset.act;
  if (a === "next") step(1);
  else if (a === "prev") step(-1);
  else if (a === "pause") setPaused(!PAUSED);
});
/* crossing the wall/laptop width threshold re-renders the current scene in the right profile */
let rsz = null;
window.addEventListener("resize", () => {
  if (!document.body.classList.contains("on")) return;
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (CUR_PROFILE && profileNow() !== CUR_PROFILE && !pendingSwap) showScene(IX, true); }, 300);
});

/* ---- picker (no params): the CONTROL SURFACE — instant SCHEMATIC thumbnails
       (percent-true wireframes of each scene) that upgrade to LIVE iframe
       previews on hover (fine pointers only — touch gets schematics + tap-to-open,
       no heavy nested frames on pads). One shared live pull tints every card
       with current geiger breadth. Q1: live-ish, never a static icon. ---- */
const FINE = !!(window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches);
const MOD_COLOR = { chart:"#2D9CFF", geiger:"#A24BFF", ticker:"#00D4FF", youtube:"#FF3DBE", wall:"#00FFA3", pulse:"#FF8A00", scenes:"#C8FF00" };
const modOf = (src) => { const m = String(src || "").replace(/^\//, "").split(/[\/?]/)[0]; return m || "pane"; };
function schematicSVG(panes) {
  let inner = "";
  for (const p of (panes || [])) {
    const x = (+p.x || 0) * 1.6, y = (+p.y || 0) * 0.9, w = (+p.w || 0) * 1.6, h = (+p.h || 0) * 0.9;
    const mod = modOf(p.src), c = MOD_COLOR[mod] || "#868AAA";
    inner += '<rect x="' + (x + 0.6) + '" y="' + (y + 0.6) + '" width="' + Math.max(0, w - 1.2) + '" height="' + Math.max(0, h - 1.2) +
      '" fill="' + c + '" fill-opacity="0.13" stroke="' + c + '" stroke-opacity="0.5" stroke-width="0.5"/>';
    if (h >= 10 && w >= 24) inner += '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 2) + '" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="5.5" letter-spacing="1" fill="#868AAA">' + mod.toUpperCase() + '</text>';
  }
  return '<svg class="schem" viewBox="0 0 160 90" preserveAspectRatio="none">' + inner + '</svg>';
}
function previewScale() {
  const card = document.querySelector(".sc-card .prev");
  return card ? card.clientWidth / 1920 : 0.2;
}
function scalePreviews() {
  const sc = previewScale();
  document.querySelectorAll(".sc-card .prev iframe").forEach((f) => { f.style.transform = "scale(" + sc + ")"; });
}
async function liveTint() {
  try {
    const rows = await pg("composite_staged?tf=eq.D&select=composite", 1);
    let g = 0, r = 0;
    for (const row of (rows || [])) { const v = +row.composite; if (v > 0) g++; else if (v < 0) r++; }
    const net = g - r, tone = net > 0 ? "#00FFA3" : net < 0 ? "#FF2D55" : "#868AAA";
    document.querySelectorAll(".sc-card .prev .live").forEach((n) => {
      n.innerHTML = '<b style="color:' + tone + '">●</b> ' + g + '↑ ' + r + '↓';
    });
  } catch (_) {}
}
function renderPicker(sourceTag) {
  const pk = el("picker");
  pk.hidden = false;
  const names = Object.keys(SCENES);
  let h = '<div class="top"><h1>Scintilla · Scenes</h1>' +
    '<span class="sub">pick a channel · live-tinted schematics, hover for full live preview · wall/laptop/narrow deep links · source: ' + esc(sourceTag) + '</span>' +
    '<a class="rotall" href="/scenes?rotate=all&dwell=120">▶ ROTATE ALL · 120s</a></div>' +
    '<div class="grid">';
  for (const n of names) {
    const s = SCENES[n];
    const profs = PROFILES.filter((p) => s[p] && s[p].length);
    const panes = paneSet(n, "wall") || [];
    h += '<div class="sc-card">' +
      '<div class="prev" data-scene="' + esc(n) + '" title="open ' + esc(n) + ' full-bleed">' +
        schematicSVG(panes) +
        '<span class="live"><b style="color:#868AAA">●</b> —</span>' +
      '</div>' +
      '<div class="body">' +
        '<div class="n">' + esc(n) + '</div>' +
        '<div class="p">' + esc(s.note || "") + '</div>' +
        '<div class="src">' + panes.map((p) => esc(p.src)).join("  ·  ") + '</div>' +
        '<div class="row">' +
          profs.map((p) => '<a class="chip" href="/scenes?scene=' + encodeURIComponent(n) + '&profile=' + p + '" title="deep link · ' + p + ' profile">' + p + '</a>').join("") +
          '<a href="/scenes?rotate=all&start=' + encodeURIComponent(n) + '&dwell=120" title="start the full rotation at this scene">▶ rotate</a>' +
          '<a class="go" href="/scenes?scene=' + encodeURIComponent(n) + '">open ⛶</a>' +
        '</div>' +
      '</div></div>';
  }
  h += '</div>';
  pk.innerHTML = h;
  /* click preview → full-bleed */
  pk.querySelectorAll(".prev").forEach((node) => {
    node.addEventListener("click", () => { location.href = "/scenes?scene=" + encodeURIComponent(node.dataset.scene); });
  });
  /* hover-upgrade: mount the full live scaled preview over the schematic (fine pointers only) */
  if (FINE) pk.querySelectorAll(".prev").forEach((node) => {
    node.addEventListener("pointerenter", () => {
      if (node.querySelector("iframe")) return;
      const f = document.createElement("iframe");
      f.src = "/scenes?scene=" + encodeURIComponent(node.dataset.scene) + "&profile=wall";
      f.title = node.dataset.scene + " live preview";
      f.style.transform = "scale(" + previewScale() + ")";
      node.appendChild(f);
    });
    node.addEventListener("pointerleave", () => {
      node.querySelectorAll("iframe").forEach((f) => f.remove());
    });
  });
  liveTint();
  if (!window.__tint) window.__tint = setInterval(liveTint, 60000);
  window.addEventListener("resize", () => { clearTimeout(window.__psc); window.__psc = setTimeout(scalePreviews, 200); });
}

/* ---- boot ---- */
async function boot() {
  const sourceTag = await loadScenes();
  const names = Object.keys(SCENES);
  if (!names.length) { el("picker").hidden = false; el("picker").innerHTML = '<div class="msg">no scenes in scene_layouts</div>'; return; }
  if (!SCENE_P && !ROTATE_P) { renderPicker(sourceTag); return; }
  ORDER = ROT
    ? (ROTATE_P === "all" ? names : ROTATE_P.split(",").map((s) => s.trim()).filter((n) => SCENES[n]))
    : [SCENE_P].filter((n) => SCENES[n]);
  /* ?start=name — begin the rotation at a chosen scene (picker "▶ rotate" buttons) */
  const startAt = (QS.get("start") || "").trim();
  if (ROT && startAt && ORDER.includes(startAt)) ORDER = ORDER.slice(ORDER.indexOf(startAt)).concat(ORDER.slice(0, ORDER.indexOf(startAt)));
  if (!ORDER.length) { el("picker").hidden = false; el("picker").innerHTML = '<div class="msg">unknown scene — see /scenes for the list</div>'; return; }
  document.body.classList.add("on");
  if (ROT) document.body.classList.toggle("rot", ORDER.length > 1);
  IX = 0;
  cycleT0 = Date.now();
  showScene(0, true);
  hud(); tickBar();
}
boot();
</script>
