<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Home / X</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#15202b;color:#e7e9ea;font:15px -apple-system,system-ui,sans-serif}
  main{display:flex;justify-content:center}
  [data-testid="primaryColumn"]{width:var(--xff-capture-column-width,600px);border-left:1px solid #2f3336;border-right:1px solid #2f3336}
  [role="tablist"]{position:sticky;top:0;height:53px;display:flex;align-items:center;gap:24px;padding:0 16px;
    background:rgba(21,32,43,.92);backdrop-filter:blur(8px);border-bottom:1px solid #2f3336;font-weight:700}
  [data-testid="tweet"]{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
  [data-testid="Tweet-User-Avatar"]{flex:none;width:40px;height:40px;border-radius:50%;background:#1d9bf0}
  .body{flex:1 1 auto;min-width:0}
  [data-testid="User-Name"]{font-weight:700}
  [data-testid="User-Name"] span{color:#71767b;font-weight:400}
  [data-testid="tweetText"]{margin:4px 0 8px;line-height:1.4}
  [role="group"]{display:flex;gap:42px;color:#71767b;font-size:13px}
</style></head><body>
<main role="main"><div data-testid="primaryColumn">
  <div role="tablist"><span>For you</span><span>Following</span></div>
  <div id="feed"></div>
</div></main>
<script>
/* A deterministic stand-in for the logged-in timeline: the same landmarks the
   bridge measures (primaryColumn, the tab strip, tweets with text and names),
   a real scrollable document, and no network. */
const feed = document.getElementById("feed");
const words = ["NVDA prints a new high","the tape is thin into the close","AAPL holds VWAP","rates bid, dollar soft",
  "breadth is better than the index","semis leading again","crude fades the spike","flows into value"];
for (let i = 0; i < 400; i++) {
  const row = document.createElement("article");
  row.setAttribute("data-testid", "tweet");
  row.innerHTML = '<div data-testid="Tweet-User-Avatar"></div><div class="body">' +
    '<div data-testid="User-Name">Desk ' + (i % 17) + ' <span>@desk' + (i % 17) + ' · ' + (i % 59) + 'm</span></div>' +
    '<div data-testid="tweetText">' + words[i % words.length] + ' — post ' + i + ' ' +
    "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor.".slice(0, 30 + (i % 46)) + '</div>' +
    '<div role="group"><span data-testid="reply">12</span><span data-testid="retweet">34</span>' +
    '<span data-testid="like">567</span></div></div>';
  feed.appendChild(row);
}
</script></body></html>
