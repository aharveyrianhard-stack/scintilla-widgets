<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Home / X</title>
<!-- X1 (12 Oct 2026): a STAND-IN for Alan's signed-in x.com tab on the iMac, for the headless pictures. x.com refuses an
     automated browser, so this page plays it: the dark ("Lights out") theme he uses, the narrow icon rail X shows at a
     1062 px window (88 px) and the timeline column 27 px to its right - so the column starts at 115, as the iMac's health
     rows say - at the width the bridge asks for (the bridge sets --xff-capture-column-width); posts with the avatar rail
     (16 + 40 + 9 = 65 px before the text, so the text starts at 180), the name · handle · time row with the ··· menu at the
     right, text that wraps, a chart or a link card now and then, and the action row. The DOM hooks are the ones the bridge
     reads (data-testid primaryColumn / tweet / tweetText / User-Name / Tweet-User-Avatar / caret, role=tablist, role=group).
     Like x.com, the page keeps re-rendering small things (the ages on the posts, once a second), which is what lets the
     bridge's own observers notice the column it laid out; a page that never changes can leave the bridge's cached crop on
     the column's old width (ST3 saw this on its static stand-in, 2 runs in 12). Fictional accounts; no real post; no network. -->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:#e7e9ea;font:15px/20px -apple-system,"Helvetica Neue",Arial,sans-serif}
  .wrap{display:flex;align-items:flex-start}
  header.nav{flex:none;width:88px;position:sticky;top:0;height:100vh;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
  header.nav i{display:block;width:26px;height:26px;border:2px solid #e7e9ea;border-radius:7px;margin:12px}
  header.nav i.x{border-radius:50%;border-color:#fff}
  header.nav .post{width:52px;height:52px;border-radius:50%;background:#1d9bf0;margin-top:12px}
  main{flex:none;margin-left:26px;width:var(--xff-capture-column-width,600px);min-height:100vh;border-left:1px solid #2f3336;border-right:1px solid #2f3336}
  [data-testid="primaryColumn"]{width:100%}
  .hdr{position:sticky;top:0;z-index:3;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);border-bottom:1px solid #2f3336}
  [role="tablist"]{display:flex;height:53px}
  [role="tab"]{flex:1;display:flex;align-items:center;justify-content:center;color:#71767b;font-weight:500;position:relative;font-size:15px}
  [role="tab"].on{color:#e7e9ea;font-weight:700}
  [role="tab"].on::after{content:"";position:absolute;bottom:0;width:56px;height:4px;background:#1d9bf0;border-radius:2px}
  article[data-testid="tweet"]{display:flex;gap:9px;padding:12px 16px;border-bottom:1px solid #2f3336}
  [data-testid="Tweet-User-Avatar"]{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a3f48,#6b7280)}
  .a1{background:linear-gradient(135deg,#1d9bf0,#0b4a73)!important}.a2{background:linear-gradient(135deg,#f4a261,#7a3e12)!important}
  .a3{background:linear-gradient(135deg,#2a9d8f,#124b44)!important}.a4{background:linear-gradient(135deg,#e76f51,#6e2a1b)!important}
  .body{flex:1 1 0;min-width:0}
  [data-testid="User-Name"]{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
  [data-testid="User-Name"] b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
  [data-testid="User-Name"] .h{color:#71767b;overflow:hidden;text-overflow:ellipsis}
  [data-testid="caret"]{margin-left:auto;flex:none;width:34px;height:34px;margin-right:-8px;margin-top:-7px;display:flex;align-items:center;justify-content:center;color:#71767b;font-size:18px;letter-spacing:1px}
  [data-testid="tweetText"]{margin-top:2px;white-space:pre-wrap;word-wrap:break-word}
  [data-testid="tweetText"] a{color:#1d9bf0;text-decoration:none}
  .media{margin-top:12px;border:1px solid #2f3336;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#0d1117;position:relative}
  .media svg{position:absolute;inset:0;width:100%;height:100%}
  .media .cap{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:13px}
  .card{margin-top:12px;border:1px solid #2f3336;border-radius:16px;overflow:hidden}
  .card .img{height:140px;background:linear-gradient(135deg,#1b1f27,#2c3340)}
  .card .t{padding:12px;color:#71767b;font-size:15px}.card .t b{color:#e7e9ea;display:block;font-weight:400}
  [role="group"]{display:flex;justify-content:space-between;margin-top:12px;color:#71767b;font-size:13px;max-width:425px}
  [role="group"] span{display:inline-flex;align-items:center;gap:6px}[role="group"] i{width:18px;height:18px;border:1.6px solid #71767b;border-radius:4px;display:inline-block}
  aside{flex:none;width:350px;margin-left:40px;padding-top:8px;position:sticky;top:0;height:100vh}
  .search{height:44px;border-radius:9999px;background:#202327;color:#71767b;display:flex;align-items:center;padding:0 16px;margin-bottom:16px}
  .box{border:1px solid #2f3336;border-radius:16px;padding:12px 16px;margin-bottom:16px}
  .box h3{margin:0 0 12px;font-size:20px}.box .row{padding:8px 0}.box .row small{color:#71767b;display:block;font-size:13px}
</style></head><body>
<div class="wrap">
<header class="nav"><i class="x"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><div class="post"></div></header>
<main role="main"><div data-testid="primaryColumn">
  <div class="hdr"><div role="tablist"><div role="tab">For you</div><div role="tab">Following</div><div role="tab" class="on">Trading list</div></div></div>
  <div id="feed"></div>
</div></main>
<aside>
  <div class="search">Search</div>
  <div class="box"><h3>What's happening</h3><div class="row">Micron earnings<small>Trending in Business · 41K posts</small></div><div class="row">ISM services<small>Economy · 12K posts</small></div><div class="row">Fed minutes<small>Trending · 88K posts</small></div></div>
  <div class="box"><h3>Who to follow</h3><div class="row">Desk Notes<small>@desknotes</small></div><div class="row">Flow Desk<small>@flowdesk</small></div></div>
</aside>
</div>
<script>
/* A deterministic stand-in for the logged-in timeline: enough posts to scroll for minutes at 24 px/s. */
const who = [["Desk Notes","desknotes",""],["Macro Tape","macrotape","a1"],["Earnings Catcher","earningscatcher","a2"],["Flow Desk","flowdesk","a3"],
  ["Volatility Notes","volnotes","a4"],["Breadth Watch","breadthwatch","a1"],["Rates Corner","ratescorner","a2"],["Semis Daily","semisdaily","a3"]];
const texts = [
  "Semis holding the 20-day on the open. Watching the 3H range: a close above Friday's high and the setup is live. $SMH $NVDA $MU",
  "10-year back under 4.1% after the print. Dollar soft, gold bid, small caps catching a bid into the close. Breadth 71% up on the day.",
  "$MU prints after the close. Street at 2.91. Options pricing a 9% move; the last four prints moved 7, 11, 4 and 13. Memory pricing commentary is the tell, not the number.",
  "Largest single block of the morning: 1.2M $AVGO at 318.40, printed on the tape at 10:02. Buyer. Second block in two sessions.",
  "VIX 14.8 and the term structure is flat out to December. The market is not paying for the election month. Either that is right or it is the trade.",
  "Reminder for the room: 8:30 claims, 10:00 ISM services, 2:00 the minutes. Fade the first move on the minutes, every time.",
  "Oil down 2% on the inventory build. Energy the only red sector. $XLE $CLUSD",
  "Advance-decline line made a new high with the index today. That is not what tops look like.",
  "Two-year yield 3.62. The front end is pricing 50 bp by March. If the Fed only gives 25 the long end is the trade.",
  "$NBIS up 9% on volume 3x the average. The AI infrastructure names are not done. Watching the 3D close.",
  "$WMT back above the 50-day. Boring is working again.",
  "Put/call 0.62 at the open. That is complacent. Not a sell signal on its own, but a reason to size down into the close.",
  "$VST range-bound for three weeks under 160. A break on volume and it runs; below 148 and the base failed.",
  "The dollar index just lost the 100 handle. Gold at a new high, miners lagging. $GCUSD",
  "ISM services 54.1, prices paid 61. Stagflation whisper in the bond pit this morning.",
  "$SPY 3H: higher low held at 668. The dip buyers are still in charge until they are not.",
];
const feed = document.getElementById("feed");
for (let i = 0; i < 600; i++) {
  const [name, handle, av] = who[i % who.length];
  const mins = 2 + (i * 7) % 58, age = i < 20 ? mins + "m" : (1 + (i % 23)) + "h";
  const row = document.createElement("article"); row.setAttribute("data-testid", "tweet");
  let extra = "";
  if (i % 4 === 1) extra = '<div class="media"><svg viewBox="0 0 560 315" preserveAspectRatio="none"><rect width="560" height="315" fill="#0d1117"/><polyline fill="none" stroke="#00ffa3" stroke-width="2" points="0,240 40,230 80,245 120,210 160,215 200,190 240,200 280,170 320,160 360,175 400,140 440,130 480,120 520,95 560,80"/><line x1="0" y1="200" x2="560" y2="200" stroke="#2f3336" stroke-dasharray="4 4"/></svg><div class="cap">' + ["IWM","SPY","QQQ","SMH"][i % 4] + ' · 3H</div></div>';
  else if (i % 7 === 3) extra = '<div class="card"><div class="img"></div><div class="t"><b>Micron Q4 preview — what the memory cycle says</b>example-research.test</div></div>';
  row.innerHTML = '<div data-testid="Tweet-User-Avatar" class="' + av + '"></div><div class="body">' +
    '<div data-testid="User-Name"><b>' + name + '</b><span class="h">@' + handle + ' · ' + age + '</span><div data-testid="caret">···</div></div>' +
    '<div data-testid="tweetText">' + texts[i % texts.length] + '</div>' + extra +
    '<a href="/' + handle + '/status/' + (1000 + i) + '" hidden>link</a>' +
    '<div role="group"><span data-testid="reply"><i></i>' + (3 + i % 47) + '</span><span data-testid="retweet"><i></i>' + (10 + i % 130) + '</span><span data-testid="like"><i></i>' + (100 + (i * 37) % 900) + '</span><span><i></i>' + (9 + i % 110) + 'K</span><span style="margin-left:auto"><i></i></span></div></div>';
  feed.appendChild(row);
}
/* x.com re-renders the relative ages as time passes; so does this page, once a second, on the posts near the top */
let ticks = 0;
setInterval(() => {
  ticks += 1;
  const ages = feed.querySelectorAll('[data-testid="User-Name"] .h');
  for (let i = 0; i < Math.min(ages.length, 40); i++) {
    const base = 2 + (i * 7) % 58, handle = ages[i].textContent.split(" · ")[0];
    ages[i].textContent = handle + " · " + (base + Math.floor(ticks / 60)) + (i < 20 ? "m" : "h");
  }
}, 1000);
</script></body></html>
