<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Station">
<meta name="theme-color" content="#0A0A0F">
<link rel="apple-touch-icon" href="/phone/icon.png">
<title>Station · which device</title>
<!-- 26 Oct 2026 (coordinator). Alan: "for me to be able to get to the pages for each device we were supposed to put on the station that you click
     on Scintilla Hub, you clicked for the station and it says what device". The Hub's STATION tab opens this page: one tap to the version for
     the device in hand - the wall (TV and computer), the iPad (no X), the iPhone (one screen), and the floating volume meter (iPhone and iPad).
     The device in hand is lit. Nothing is read or written. -->
<style>
:root{ --bg:#0A0A0F; --tile:#10121a; --line:#1f2433; --ink:#E7ECF5; --ink2:#8c8b83; --cyan:#00E5FF; }
html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px -apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
body{ display:flex; flex-direction:column; align-items:center; box-sizing:border-box; padding:calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
h1{ margin:0 0 6px; font-size:13px; letter-spacing:.24em; color:var(--cyan); font-weight:700; }
p{ margin:0 0 22px; color:var(--ink2); font-size:15px; }
nav{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:560px; }
a.tile{ display:flex; flex-direction:column; justify-content:flex-end; gap:4px; min-height:86px; padding:14px; border-radius:14px; background:var(--tile);
  border:1px solid var(--line); color:var(--ink); text-decoration:none; }
a.tile b{ font-size:17px; letter-spacing:.08em; font-weight:800; }
a.tile small{ color:var(--ink2); font-size:12px; }
a.tile.this{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 0 24px rgba(0,229,255,.18); }
a.tile.this::before{ content:"THIS DEVICE"; color:var(--cyan); font-size:11px; font-weight:700; letter-spacing:.18em; margin-bottom:auto; }
@media (max-width:520px){ a.tile{ min-height:70px; padding:12px; } a.tile b{ font-size:15px; } }
</style>
</head>
<body>
<h1>SCINTILLA · STATION</h1>
<p>Which device?</p>
<nav>
  <a class="tile" data-dev="wall" href="/?widgets=1"><b>TV &amp; COMPUTER</b><small>the wall</small></a>
  <a class="tile" data-dev="ipad" href="/ipad/"><b>iPAD</b><small>the wall without X</small></a>
  <a class="tile" data-dev="phone" href="/phone/"><b>iPHONE</b><small>one screen</small></a>
  <a class="tile" data-dev="pip" href="/pip/"><b>FLOATING VOLUME</b><small>iPhone · iPad, over every app</small></a>
</nav>
<script>
(function () {
  "use strict";
  /* the device in hand: an iPhone says so; an iPad says iPad, or Macintosh with a touch screen (iPadOS asks for desktop pages) */
  var ua = navigator.userAgent || "", touch = (navigator.maxTouchPoints || 0) > 1;
  var dev = /iPhone|iPod|Android.+Mobile/.test(ua) ? "phone" : (/iPad/.test(ua) || (/Macintosh/.test(ua) && touch)) ? "ipad" : "wall";
  var t = document.querySelector('a.tile[data-dev="' + dev + '"]'); if (t) t.classList.add("this");
})();
</script>
</body>
</html>
