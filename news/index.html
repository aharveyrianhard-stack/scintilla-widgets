<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · news</title>
<!-- ============================================================================
     SCINTILLA COMPONENT · NEWS — the cockpit NEWS tab, standalone.
     Newest-first feed straight off the news table (222k rows, live writer:
     ticker · title · site · snippet · feed · cohort · published_ts epoch).
     Filters mirror how the cockpit slices it: ?t=MU (ticker) · ?cohort=AI_HW ·
     ?feed= · ?limit=60 (10-200) · ?compact=1 (headline density, no snippets) ·
     ?bg=0 · ?refresh=120 (30-600s). When pinned to a ticker, the header wears
     the news_sentiment chip (score · article count) — served, not computed.
     Honest freshness stamp on the newest print; STALE badge past 3h.
     DATA — DB reads only, never FMP: news + news_sentiment · scintilla-live.
     Titles link out to the source article (new tab). Ticker chips → /chart.
     Receipt: HSC-NEWS-LIVE-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.02em;
  display:flex; flex-direction:column; overflow:hidden; }
body.nobg{ background:transparent; }
#hd{ flex:none; display:flex; align-items:baseline; gap:10px; padding:9px 14px 7px; border-bottom:1px solid var(--line); }
#hd .k{ color:var(--crk); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; }
#hd .f{ color:var(--ink2); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
#hd .sent{ font-size:9px; padding:1px 7px; border:1px solid var(--line); letter-spacing:.08em; }
#hd .sent.up{ color:var(--bull); border-color:rgba(0,255,163,.45); }
#hd .sent.dn{ color:var(--bear); border-color:rgba(255,45,85,.45); }
#hd .fresh{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.12em; text-transform:uppercase; }
.badge{ color:var(--bear); border:1px dashed rgba(255,45,85,.5); padding:1px 6px; font-size:8px; letter-spacing:.14em; }
#list{ flex:1; overflow-y:auto; scrollbar-width:thin; }
.row{ display:block; padding:9px 14px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; }
.row:hover{ background:var(--panel2); }
.l1{ display:flex; align-items:baseline; gap:9px; }
.ago{ flex:none; color:var(--mute); font-size:9px; font-variant-numeric:tabular-nums; width:44px; }
/* An undated item is visibly not a number, so it cannot be misread as an age. */
.ago[data-undated]{ font-variant-numeric:normal; letter-spacing:.04em; opacity:.72; }
.tk{ flex:none; color:var(--crk); font-size:9.5px; letter-spacing:.1em; }
.tt{ color:var(--ink); font-size:11.5px; line-height:1.45; }
.l2{ display:flex; gap:9px; margin:3px 0 0 53px; }
.site{ flex:none; color:var(--dim); font-size:9px; letter-spacing:.06em; }
.coh{ flex:none; color:var(--ink3); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; }
.sn{ color:var(--ink3); font-size:10px; line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
body.compact .sn{ display:none; }
body.compact .row{ padding:6px 14px; }
.empty{ margin:auto; color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
#ft{ flex:none; padding:6px 14px; color:var(--mute); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; border-top:1px solid var(--line); }
</style>
</head>
<body>
<div id="hd">
  <span class="k">NEWS</span>
  <span class="f" id="filt">all</span>
  <span id="sentwrap"></span>
  <span class="fresh" id="fresh"></span>
</div>
<div id="list"><div class="empty">loading news…</div></div>
<div id="ft">news table (live writer) · db reads only — never fmp from pages · titles link to source · sentiment served from news_sentiment, never computed here · dated items first; an item with no recorded publish time says so rather than being dated</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---- params ---- */
const QS = new URLSearchParams(location.search);
const T      = (QS.get("t") || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
const COHORT = (QS.get("cohort") || "").toUpperCase().replace(/[^A-Z0-9_ ]/g, "");
const FEED   = (QS.get("feed") || "").replace(/[^A-Za-z0-9_\-]/g, "");
const LIMIT  = Math.max(10, Math.min(200, +(QS.get("limit") || 60)));
const REFRESH = Math.max(30, Math.min(600, +(QS.get("refresh") || 120))) * 1000;
if (QS.get("bg") === "0") document.body.classList.add("nobg");
if (QS.get("compact") === "1") document.body.classList.add("compact");

el("filt").textContent = T ? "$" + T : COHORT ? COHORT.replace(/_/g, " ") : FEED ? "feed: " + FEED : "all";

/* ---- TIMESTAMPS, HONESTLY ----------------------------------------------------------------
   Every current item on this page read as roughly 20,684 days old. That number is not a
   parsing curiosity; it is Date.now() expressed in days. The rows were arriving with a NULL
   published_ts, `num(null)` returns null, and `null * 1000` is 0 in JavaScript — so the age
   being displayed was the age of the Unix epoch, with no step in between that could notice.

   Two things went wrong and both are fixed:

     1. NULLS CAME FIRST. PostgREST inherits Postgres ordering, and DESC means NULLS FIRST.
        Of the 312,664 rows in `news`, 1,246 have no published_ts — and every one of the 60
        rows on the default page was one of them. `.nullslast` puts the dated wire first,
        which is what "latest news" has always meant.

     2. A MISSING VALUE WAS ARITHMETIC, NOT AN ABSENCE. `newsInstant` decides once whether an
        instant is known, and an unknown one is never turned into a number. It is labelled as
        unknown and shown as such. Nothing is guessed, and no row is hidden for lacking a date.

   The column is bigint epoch SECONDS today (min 988700400, max 1787123463, at most 10
   digits). The parser accepts milliseconds and ISO strings as well, so a writer changing
   units cannot silently move every headline by a factor of a thousand. */

/* 1e12 seconds is the year 33658 and 1e12 milliseconds is 2001-09-09; the column's own floor
   is 2001-05. No real value is ambiguous across that line. */
const NEWS_MS_THRESHOLD = 1e12;
const NEWS_NUMERIC = /^\s*-?\d+(?:\.\d+)?\s*$/;
function newsInstant(value) {
  if (value == null || value === "") return { known:false, ms:null, reason:"MISSING" };
  if (typeof value === "boolean") return { known:false, ms:null, reason:"INVALID" };
  if (typeof value === "number" || NEWS_NUMERIC.test(String(value))) {
    const n = Number(value);
    if (!isFinite(n) || n <= 0) return { known:false, ms:null, reason:"INVALID" };
    const unit = n >= NEWS_MS_THRESHOLD ? "ms" : "s";
    const ms = unit === "ms" ? n : n * 1000;
    if (!isFinite(new Date(ms).getTime())) return { known:false, ms:null, reason:"INVALID" };
    return { known:true, ms, unit };
  }
  const parsed = Date.parse(String(value));
  if (!Number.isFinite(parsed)) return { known:false, ms:null, reason:"INVALID" };
  return { known:true, ms:parsed, unit:"iso" };
}
const NEWS_UNKNOWN_AGE = "no date";
const ago = (ms) => {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 129600) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
};
/* The single place a row's time becomes text. An unknown instant never reaches `ago`. */
function newsAgeLabel(value) {
  const instant = newsInstant(value);
  return instant.known ? ago(instant.ms) : NEWS_UNKNOWN_AGE;
}
/* The header states the freshest item that HAS a time. A page of undated rows says so
   rather than reporting the epoch as the newest thing on the wire. */
function newestKnownInstant(rows) {
  let newest = null;
  let undated = 0;
  for (const row of rows || []) {
    const instant = newsInstant(row && row.published_ts);
    if (!instant.known) { undated += 1; continue; }
    if (newest == null || instant.ms > newest) newest = instant.ms;
  }
  return { ms:newest, undated, total:(rows || []).length };
}

async function tick() {
  let q = "news?select=ticker,url,published_ts,title,site,snippet,feed,cohort&order=published_ts.desc.nullslast&limit=" + LIMIT;
  if (T) q += "&ticker=eq." + encodeURIComponent(T);
  if (COHORT) q += "&cohort=eq." + encodeURIComponent(COHORT);
  if (FEED) q += "&feed=eq." + encodeURIComponent(FEED);
  const [rows, sent] = await Promise.all([
    pg(q),
    T ? pg("news_sentiment?ticker=eq." + encodeURIComponent(T) + "&select=score,n_articles&limit=1").catch(() => null) : null,
  ]);
  if (!Array.isArray(rows) || !rows.length) {
    el("list").innerHTML = '<div class="empty">no news rows for this filter</div>';
    el("fresh").textContent = ""; el("sentwrap").innerHTML = ""; return;
  }
  const freshness = newestKnownInstant(rows);
  const undatedNote = freshness.undated ? ' · ' + freshness.undated + " undated" : "";
  if (freshness.ms == null) {
    el("fresh").innerHTML = '<span class="badge">NO DATED ITEMS</span>' + esc(undatedNote);
  } else {
    const mins = Math.round((Date.now() - freshness.ms) / 60000);
    el("fresh").innerHTML = (mins > 180
      ? 'newest <span class="badge">STALE ' + Math.round(mins / 60) + 'h</span>'
      : "newest " + ago(freshness.ms) + " ago") + esc(undatedNote);
  }
  if (sent && Array.isArray(sent) && sent[0] && num(sent[0].score) != null) {
    const sc = num(sent[0].score);
    el("sentwrap").innerHTML = '<span class="sent ' + (sc >= 0 ? "up" : "dn") + '">sent ' + (sc >= 0 ? "+" : "−") + Math.abs(sc).toFixed(2) +
      " · " + (sent[0].n_articles || 0) + " art</span>";
  } else el("sentwrap").innerHTML = "";
  el("list").innerHTML = rows.map((r) => {
    const instant = newsInstant(r.published_ts);
    return '<a class="row" href="' + esc(r.url || "#") + '" target="_blank" rel="noopener"' +
      (instant.known ? ' title="' + esc(new Date(instant.ms).toLocaleString()) + '"' : ' title="published time not recorded"') + '>' +
      '<div class="l1"><span class="ago"' + (instant.known ? "" : ' data-undated="1"') + '>' +
        (instant.known ? ago(instant.ms) : NEWS_UNKNOWN_AGE) + '</span>' +
      (r.ticker ? '<span class="tk">$' + esc(r.ticker) + "</span>" : "") +
      '<span class="tt">' + esc(r.title) + "</span></div>" +
      '<div class="l2"><span class="site">' + esc(r.site || r.feed || "") + "</span>" +
      (r.cohort ? '<span class="coh">' + esc(String(r.cohort).replace(/_/g, " ")) + "</span>" : "") +
      (r.snippet ? '<span class="sn">' + esc(r.snippet) + "</span>" : "") + "</div></a>";
  }).join("");
}
tick().catch(() => { el("list").innerHTML = '<div class="empty">news unavailable</div>'; });
setInterval(() => tick().catch(() => {}), REFRESH);
</script>
</body>
</html>
