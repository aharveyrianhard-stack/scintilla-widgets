<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STATION IPAD">
<link rel="icon" href="/station-ipad/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/station-ipad/icon.png">
<title>SCINTILLA · Station iPad</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#0A0A0F}iframe{display:block;width:100%;height:100%;border:0;background:#0A0A0F}.notice{position:fixed;inset:0;display:none;place-items:center;padding:28px;background:#0A0A0F;color:#9A9AB6;font:13px/1.6 "SF Mono",ui-monospace,monospace;text-align:center}.notice.on{display:grid}.notice b{color:#00D4FF}
</style>
</head>
<body>
<iframe id="deck" title="SCINTILLA Station iPad"></iframe>
<section id="notice" class="notice"><div><b>STATION IPAD NEEDS ITS TRUSTED LINK</b><br>Open the Companion link from your iMac once.</div></section>
<script>
"use strict";
const key="scintilla.station.ipad-companion-link.v1",deck=document.getElementById("deck"),notice=document.getElementById("notice");
const validHash=h=>{const p=new URLSearchParams((h||"").replace(/^#/,""));return /^[A-Za-z0-9_-]{32,}$/.test(p.get("pair")||"")&&/^[0-9]{6}$/.test(p.get("code")||"")};
function pairedDeckUrl(hash){const p=new URLSearchParams((hash||"").replace(/^#/,""));return "/deck/?ipadPair="+encodeURIComponent(p.get("pair")||"")+"&ipadCode="+encodeURIComponent(p.get("code")||"")+"&view=ipad"}
let pairHash=validHash(location.hash)?location.hash:"";if(pairHash)try{localStorage.setItem(key,pairHash)}catch(_){};if(!pairHash)try{pairHash=localStorage.getItem(key)||""}catch(_){};
if(validHash(pairHash)){deck.src=pairedDeckUrl(pairHash)}else notice.classList.add("on");
</script>
</body>
</html>
