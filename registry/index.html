<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SCINTILLA</title>
<!-- ============================================================================
     SCINTILLA · /registry — THE FRONT DOOR. One URL, pinned on every device.
     Alan: "everything is built and everything is scattered... every review is
     an expedition." This page ends that. Open it, everything is one tap away.
       · grouped by WHAT IT IS FOR, not by who built it
       · every entry says in a few words what it actually IS
       · DEAD OR BROKEN ROUTES ARE MARKED ON THE PAGE — a live checker pings
         every route and paints its dot. Nothing is silently listed.
       · iPhone first: big tap targets, one column, no horizontal scroll
       · fast: the status sweep is cached in sessionStorage for 10 minutes, so
         the twentieth open of the day paints instantly
       · LOSE NOTHING: every route Alan listed is here, plus the ones he did
         not list that exist (/ticker /geiger /youtube /components /handoff
         /tvwall /wall /scenes /health) and the Live Desk endpoints.
     Receipt: HSC-HOME-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538;
  --hair:rgba(0,212,255,.30);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:13px; letter-spacing:.01em;
  padding:0 0 40px; overflow-x:hidden; }
header{ position:sticky; top:0; z-index:10; background:rgba(10,10,15,.94);
  backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px; }
h1{ font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--crk);
  font-weight:400; margin:0 0 2px; }
.sub{ color:var(--dim); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; }
#q{ width:100%; margin-top:8px; background:var(--panel2); border:1px solid var(--line2);
  color:var(--ink); font-family:var(--mono); font-size:15px; padding:9px 11px; border-radius:0;
  -webkit-appearance:none; }
#q:focus{ outline:none; border-color:var(--crk); }
#sum{ display:flex; gap:10px; margin-top:7px; color:var(--mute); font-size:9px;
  letter-spacing:.1em; text-transform:uppercase; flex-wrap:wrap; align-items:center; }
#sum b{ font-weight:400; }
#sum .ok{ color:var(--bull); } #sum .bad{ color:var(--bear); } #sum .unk{ color:var(--vol); }
.recheck{ margin-left:auto; border:1px solid var(--line2); padding:2px 8px; cursor:pointer; color:var(--dim); }
section{ padding:0 12px; }
h2{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--crk);
  font-weight:400; margin:26px 0 3px; }
h2 .h{ color:var(--mute); letter-spacing:.06em; text-transform:none; font-size:9.5px; display:block; margin-top:3px; }
.row{ display:flex; align-items:flex-start; gap:11px; padding:13px 12px; margin-top:8px;
  border:1px solid var(--line); background:var(--panel2); text-decoration:none; color:inherit; }
.row:active{ border-color:var(--crk); background:#12121d; }
.dot{ flex:none; width:8px; height:8px; border-radius:50%; margin-top:5px; background:var(--mute); }
.dot.ok{ background:var(--bull); box-shadow:0 0 7px rgba(0,255,163,.55); }
.dot.bad{ background:var(--bear); box-shadow:0 0 7px rgba(255,45,85,.55); }
.dot.unk{ background:var(--vol); }
.dot.chk{ background:var(--line2); animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }
.m{ flex:1; min-width:0; }
.nm{ color:var(--ink); font-size:14px; letter-spacing:.02em; }
.nm .rt{ color:var(--crk); font-size:11px; margin-left:7px; }
.ds{ color:var(--ink3); font-size:11.5px; line-height:1.5; margin-top:3px; }
.flag{ color:var(--bear); font-size:10px; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; display:none; }
.row.isbad .flag{ display:block; }
.row.isbad .nm{ color:var(--ink3); text-decoration:line-through; }
.chev{ flex:none; color:var(--mute); font-size:15px; margin-top:2px; }
.hide{ display:none !important; }
footer{ padding:26px 14px 0; color:var(--mute); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; line-height:1.9; }
footer a{ color:var(--dim); }
@media (min-width: 900px){
  body{ font-size:13px; }
  section{ max-width:1180px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  header{ padding-left:24px; padding-right:24px; }
  #q{ max-width:520px; }
}
</style>
</head>
<body>
<header>
  <h1>Scintilla</h1>
  <div class="sub">the front door · everything one tap away</div>
  <input id="q" type="search" placeholder="filter — type heat, news, chart…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="sum"><span id="counts">checking routes…</span><span class="recheck" id="recheck">re-check</span></div>
</header>
<div id="body"></div>
<footer>
  status is checked live on this page — a red dot means that route did not answer, and it is never hidden<br>
  db reads only · geiger never recomputed · cockpit untouched · tradingview layouts never touched<br>
  <span id="stamp"></span>
</footer>
<script>
"use strict";
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ============================ THE MAP ============================
   Grouped by what it is FOR. Every route Alan listed, plus the ones
   that exist and he did not list. Nothing is dropped, ever. */
const GROUPS = [
  { t: "Start here", h: "the three named scenes",
    items: [
      { r: "/deck",      n: "The Desk",        d: "the working scene — two charts exactly half and half over your two feeds and X. One timeframe bar drives both." },
      { r: "/tv",        n: "The Wall",        d: "the Apple TV scene — your hand-arranged wall, held as data so it survives a restart." },
      { r: "/reflow?view=treemap", n: "The Scan", d: "the whole board as a treemap, re-ranked and re-coloured in motion. The five-minute look." },
    ] },
  { t: "Show me the market", h: "what is moving, right now",
    items: [
      { r: "/reflow",    n: "Reflow",          d: "the geiger in motion — cells travel and recolour as you change the ranking. Matrix or treemap." },
      { r: "/ranks",     n: "Ranks",           d: "one universe ranked six ways side by side. Tap a name to trace it across every ranking." },
      { r: "/heat",      n: "Heat Map",        d: "the whole universe as a colour field, grouped by sector rotation rank." },
      { r: "/pulse",     n: "Pulse",           d: "market state in one strip — breadth, macro direction, VIX posture." },
      { r: "/chart",     n: "Chart",           d: "single chart off our own price history. ?t=MU ?range=1D" },
      { r: "/ticker",    n: "Ticker Tape",     d: "the macro and all-names marquee bands." },
    ] },
  { t: "Show me the cohorts", h: "how the axis you actually navigate is behaving",
    items: [
      { r: "/cohorts",   n: "Cohort Strip",    d: "FAV · ALL · every cohort as chips, tinted by breadth. The navigation row." },
      { r: "/cohort",    n: "Cohort Geiger",   d: "one cohort's spread — min to max, every member a dot, mean and median marked." },
      { r: "/compare",   n: "Cohort Compare",  d: "every cohort as a vertical bar off the zero line. Leaders first." },
      { r: "/geigerwall",n: "Geiger Wall",     d: "every ranking and every cohort at once. Tap-to-load on phone." },
      { r: "/geiger",    n: "Geiger Summary",  d: "the full six-tile read for one ticker." },
    ] },
  { t: "Show me what's happening", h: "words, dates and warnings",
    items: [
      { r: "/news",      n: "News",            d: "newest first off the live news table. Filter by ticker or cohort." },
      { r: "/alerts",    n: "Alerts",          d: "feed health (live) and ticker alerts (that writer has been quiet since June — shown, not hidden)." },
      { r: "/events",    n: "Events",          d: "earnings both directions — what is coming, what just printed and by how much." },
      { r: "/econ",      n: "Economic",        d: "headline topline tiles over the economic calendar run." },
    ] },
  { t: "Watch", h: "video, on their own clean surfaces",
    items: [
      { r: "/feed-a",    n: "Feed A · market",  d: "the Scintilla market video feed. Opens as a list — it never picks a video for you." },
      { r: "/feed-b",    n: "Feed B · personal",d: "your subscriptions. Same treatment, separate route, same lists." },
      { r: "/youtube",   n: "YouTube grid",     d: "the full grid with filters, docked player and cross-device resume." },
    ] },
  { t: "Show me the machine", h: "is the thing actually running",
    items: [
      { r: "/status",    n: "Status · the org",  d: "which session delivered what, and what is waiting on you. Rendered live by the orgstatus function." },
      { r: "/health",    n: "Health · the data", d: "the other half — how fresh every feeder is and how many rows are in each table, read live." },
      { r: "/analytics", n: "Analytics",        d: "the market-regime read — cohorts, favourites, fundamentals, ratios, sector rotation, DCF and comps." },
      { r: "/scenes",    n: "Scene engine",     d: "named layouts stored as data. Built for the wall — open one scene, leave rotation off on a phone." },
      { r: "/wall",      n: "Chart Wall",       d: "auto-rotating single chart through a ticker list." },
      { r: "/handoff",   n: "Hammerspoon handoff", d: "the window-placement mapping for the physical wall." },
    ] },
  { t: "Show me the work", h: "what is being built, and why",
    items: [
      { r: "/visuals",   n: "Visuals",          d: "the visuals lane front door — every piece made there, described in plain language." },
      { r: "/components",n: "Components",       d: "the extraction proposal — the Numeral, the geiger bars, the board table." },
      { r: "/tvwall",    n: "TV wall plan",     d: "what embeds vs what has to be a real window, and the permanence plan." },
      { r: "/registry",  n: "This page",        d: "the front door. Pin it." },
    ] },
  { t: "Show me the visuals", h: "the motion lane — every surface, and the gallery for marking them",
    items: [
      { r: "/visuals/gallery",  n: "The Gallery",      d: "every visual, one per screen, rendered live. One tap marks it Like or Don't like and moves on. Marks are saved." },
      { r: "/visuals/menu",     n: "Finishes Menu",    d: "nine finishes across five surfaces, 45 live squares. Tap squares to pick them and it writes the order." },
      { r: "/visuals/images",   n: "Image Menu",       d: "one prompt through five image models side by side, each scored for geometry, plus the answer on layering." },
      { r: "/visuals/theme",    n: "URTH Theme",       d: "the whole theme carried to the detail level — colours, type roles, and the finish on mark, photo, chart and interface." },
      { r: "/visuals/bench",    n: "Portability Bench",d: "one treatment on four kinds of surface at the same measured level, with the legibility ceilings enforced." },
      { r: "/visuals/template", n: "The Port",         d: "how to move a finish onto a surface it was not designed for. Six steps, the contract, a checklist." },
      { r: "/visuals/archive",  n: "Visuals Archive",  d: "the older catalogue — every piece with a live thumbnail and the table of what mixes with what." },
      { r: "/visuals/ladder",   n: "The Average Ladder", d: "price against the fan of moving averages, eight ways — the rubber bands, the heartbeat tones, stack heat with the oversold mark, the 50/200 cloud, the ladder, the pipe, the fall, the braid. Replay runs the tape through every view." },
      { r: "/visuals/ladder/mini", n: "The Minis",       d: "the bands and the ladder at every size — icon, table cell, bubble, widget — live modules built for the hub. Add ?view=widget to embed one full-bleed." },
      { r: "/visuals/geiger-motion", n: "Geiger Motion Bench", d: "the same re-sort five different ways on your thirteen names — settle-then-reflow, trails, collapse-and-rebuild — with the every-column-as-±1 rule to try." },
      { r: "/visuals/open?p=charts.html", n: "Visuals reader", d: "opens any piece by name on a readable path. Sample: ?p=charts.html" },
    ] },
];

/* Live Desk endpoints — different host, so they are checked but never marked
   dead on a CORS failure. Honesty over false red dots. */
const LIVEDESK = {
  t: "Live Desk endpoints", h: "the data functions behind the charts (Supabase)",
  base: "https://wadinxqplrggagkvrdag.supabase.co/functions/v1/",
  items: [
    { r: "chartread?ticker=MU&tf=180", n: "chartread",   d: "chart series read. Sample: ?ticker=MU&tf=180" },
    { r: "pivotunion",                 n: "pivotunion",  d: "the union of pivot sets." },
    { r: "pivotatlas",                 n: "pivotatlas",  d: "the pivot atlas." },
    { r: "pivotpine",                  n: "pivotpine",   d: "the Pine-side pivot service." },
  ],
};

/* ---------- render ---------- */
function rowHTML(it, href, id) {
  return '<a class="row" href="' + esc(href) + '" data-id="' + id + '" data-s="' +
    esc((it.n + " " + it.r + " " + it.d).toLowerCase()) + '">' +
    '<span class="dot chk" data-dot="' + id + '"></span>' +
    '<span class="m"><span class="nm">' + esc(it.n) + '<span class="rt">' + esc(it.r) + "</span></span>" +
    '<span class="ds">' + esc(it.d) + "</span>" +
    '<span class="flag">not answering — reported, not hidden</span></span>' +
    '<span class="chev">›</span></a>';
}
const ALL = [];
function render() {
  let h = "";
  for (const g of GROUPS) {
    h += '<section><h2>' + esc(g.t) + '<span class="h">' + esc(g.h) + "</span></h2><div class=\"grid\">";
    for (const it of g.items) { const id = ALL.length; ALL.push({ it, url: it.r, kind: "route" }); h += rowHTML(it, it.r, id); }
    h += "</div></section>";
  }
  h += '<section><h2>' + esc(LIVEDESK.t) + '<span class="h">' + esc(LIVEDESK.h) + "</span></h2><div class=\"grid\">";
  for (const it of LIVEDESK.items) {
    const id = ALL.length; const url = LIVEDESK.base + it.r;
    ALL.push({ it, url, kind: "fn" });
    h += rowHTML(it, url, id);
  }
  h += "</div></section>";
  el("body").innerHTML = h;
}

/* ---------- the status sweep: nothing is silently listed ---------- */
const CACHE_KEY = "sc_home_status_v2", TTL = 10 * 60 * 1000;
function setDot(id, state) {
  const d = document.querySelector('[data-dot="' + id + '"]');
  if (!d) return;
  d.className = "dot " + state;
  const row = d.closest(".row");
  if (row) row.classList.toggle("isbad", state === "bad");
}
function counts(states) {
  const ok = states.filter((s) => s === "ok").length;
  const bad = states.filter((s) => s === "bad").length;
  const unk = states.filter((s) => s === "unk").length;
  el("counts").innerHTML = '<b class="ok">' + ok + " live</b>" +
    (bad ? ' · <b class="bad">' + bad + " not answering</b>" : "") +
    (unk ? ' · <b class="unk">' + unk + " unknown</b>" : "");
}
async function probe(entry) {
  /* HEAD, not GET — we want the status code, not 25 pages of HTML down a
     phone connection. This is the difference between a front door that
     paints in a second and one that costs a megabyte every time. */
  try {
    const r = await fetch(entry.url, { method: "HEAD", cache: "no-store", redirect: "follow" });
    /* an authenticated function answering 401/403 IS alive — it answered */
    if (entry.kind === "fn") return (r.status === 401 || r.status === 403 || r.ok) ? "ok" : "bad";
    if (r.status === 405 || r.status === 501) {          /* HEAD refused — ask properly */
      const g = await fetch(entry.url, { method: "GET", cache: "no-store", redirect: "follow" });
      return g.ok ? "ok" : "bad";
    }
    return r.ok ? "ok" : "bad";
  } catch (e) {
    /* cross-origin or offline — say unknown, never a false red */
    return entry.kind === "fn" ? "unk" : "bad";
  }
}
async function sweep(force) {
  let cached = null;
  try { cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}
  if (!force && cached && Date.now() - cached.t < TTL && cached.s.length === ALL.length) {
    cached.s.forEach((st, i) => setDot(i, st));
    counts(cached.s);
    el("stamp").textContent = "status from cache · re-check to refresh";
    return;
  }
  const states = new Array(ALL.length).fill("chk");
  let i = 0;
  const worker = async () => {
    while (i < ALL.length) {
      const my = i++;
      const st = await probe(ALL[my]);
      states[my] = st; setDot(my, st); counts(states);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);   /* 4 at a time — kind to a phone */
  try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), s: states })); } catch (e) {}
  el("stamp").textContent = "status checked just now";
}

/* ---------- filter ---------- */
el("q").addEventListener("input", () => {
  const v = el("q").value.trim().toLowerCase();
  for (const r of document.querySelectorAll(".row")) r.classList.toggle("hide", !!v && r.dataset.s.indexOf(v) < 0);
  for (const s of document.querySelectorAll("section"))
    s.classList.toggle("hide", !!v && s.querySelectorAll(".row:not(.hide)").length === 0);
});
el("q").addEventListener("focus", () => el("q").select());
el("recheck").addEventListener("click", () => { el("counts").textContent = "re-checking…"; sweep(true); });

render();
sweep(false);
</script>
</body>
</html>
