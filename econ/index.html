<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · economic</title>
<!-- ============================================================================
     SCINTILLA COMPONENT · ECONOMIC — the cockpit ECONOMIC tab, standalone.
     Two reads, both served (nothing computed here):
       TOPLINE — econ_dashboard (16 headline topics: label · value · prev ·
         yago · unit · cadence · last_date), ordered by its own sort column;
         each tile prints its own last_date so a stale series says so.
       CALENDAR — econ_calendar (68k rows out to year-end: event · country ·
         impact · actual/previous/estimate · event_ts epoch) — next events
         first, with a recent tail so you see what just printed.
     Params: ?impact=high · ?country=US · ?days=10 (1-90) · ?limit=40 ·
       ?sections=topline,calendar · ?bg=0 · ?refresh=300
     DATA — DB reads only, never FMP · scintilla-live.
     Receipt: HSC-ECON-LIVE-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.02em;
  display:flex; flex-direction:column; overflow:hidden; }
body.nobg{ background:transparent; }
#hd{ flex:none; display:flex; align-items:baseline; gap:10px; padding:8px 14px 6px; border-bottom:1px solid var(--line); }
#hd .k{ color:var(--crk); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; }
#hd .f{ color:var(--ink2); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
#hd .st{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.12em; text-transform:uppercase; }
#top{ flex:none; display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.tile{ flex:1 1 130px; min-width:118px; border:1px solid var(--line); background:var(--panel2); padding:7px 9px; }
.tile .lb{ color:var(--dim); font-size:8px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.tile .vl{ font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; margin:2px 0 1px; }
.tile .dl{ color:var(--mute); font-size:8px; font-variant-numeric:tabular-nums; }
#list{ flex:1; overflow-y:auto; scrollbar-width:thin; }
.r{ display:flex; align-items:baseline; gap:9px; padding:6px 14px; border-bottom:1px solid var(--line); }
.r.past{ opacity:.62; }
.when{ flex:none; width:82px; color:var(--ink3); font-size:9.5px; font-variant-numeric:tabular-nums; }
.imp{ flex:none; font-size:8px; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--line); padding:0 5px; color:var(--dim); }
.imp.high{ color:var(--bear); border-color:rgba(255,45,85,.45); }
.imp.medium{ color:var(--vol); border-color:rgba(255,138,0,.45); }
.ctry{ flex:none; color:var(--crk); font-size:9px; letter-spacing:.1em; width:28px; }
.ev{ color:var(--ink2); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nums{ margin-left:auto; flex:none; color:var(--ink3); font-size:9.5px; font-variant-numeric:tabular-nums; }
.nums b{ color:var(--ink); font-weight:700; }
.up{ color:var(--bull); } .dn{ color:var(--bear); }
.empty{ padding:14px; color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="hd"><span class="k">ECONOMIC</span><span class="f" id="filt">all</span><span class="st" id="stamp"></span></div>
<div id="top"></div>
<div id="list"><div class="empty">loading economic…</div></div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);
const IMPACT  = (QS.get("impact") || "").toLowerCase().replace(/[^a-z]/g, "");
const COUNTRY = (QS.get("country") || "").toUpperCase().replace(/[^A-Z]/g, "");
const DAYS    = Math.max(1, Math.min(90, +(QS.get("days") || 10)));
const LIMIT   = Math.max(5, Math.min(150, +(QS.get("limit") || 40)));
const SECT    = String(QS.get("sections") || "topline,calendar").toLowerCase();
const REFRESH = Math.max(60, Math.min(1800, +(QS.get("refresh") || 300))) * 1000;
if (QS.get("bg") === "0") document.body.classList.add("nobg");
el("filt").textContent = [COUNTRY || "all countries", IMPACT ? IMPACT + " impact" : ""].filter(Boolean).join(" · ");

const fmtV = (v, unit) => v == null ? "—" :
  (Math.abs(v) >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 0 }) : (+v).toFixed(Math.abs(v) < 10 ? 2 : 1)) +
  (unit === "%" ? "%" : "");
const when = (ms) => {
  const d = new Date(ms);
  const day = d.toISOString().slice(5, 10).replace("-", "/");
  const hm = d.toISOString().slice(11, 16);
  return day + " " + hm;
};

async function tick() {
  const wantT = SECT.indexOf("topline") >= 0, wantC = SECT.indexOf("calendar") >= 0;
  const nowS = Math.floor(Date.now() / 1000);
  let q = "econ_calendar?select=event_ts,country,event,actual,previous,estimate,impact&event_ts=gte." + (nowS - 2 * 86400) +
          "&event_ts=lte." + (nowS + DAYS * 86400) + "&order=event_ts.asc&limit=" + LIMIT;
  if (IMPACT) q += "&impact=eq." + encodeURIComponent(IMPACT);
  if (COUNTRY) q += "&country=eq." + encodeURIComponent(COUNTRY);
  /* A FAILED READ IS NEVER DATA. catch(() => null) rendered a dead econ_dashboard read as a
     blank tile strip and a dead calendar read as "no calendar rows for this filter" — claims
     about tables the reads never saw. The failure is kept and named, distinctly from
     emptiness. */
  const READ_FAILED = { failed: true };
  const [dash, cal] = await Promise.all([
    wantT ? pg("econ_dashboard?select=topic,label,unit,cadence,last_date,value,prev,yago,sort&order=sort.asc").catch(() => READ_FAILED) : null,
    wantC ? pg(q).catch(() => READ_FAILED) : null,
  ]);

  if (wantT && dash === READ_FAILED) {
    el("top").innerHTML = '<div class="empty">the econ_dashboard read failed — the tiles are unavailable, not empty · retrying at the next refresh</div>';
  } else if (wantT && Array.isArray(dash) && !dash.length) {
    el("top").innerHTML = '<div class="empty">econ_dashboard has no rows</div>';
  } else if (wantT && Array.isArray(dash) && dash.length) {
    el("top").innerHTML = dash.map((d) => {
      const v = num(d.value), p = num(d.prev);
      const dir = v != null && p != null ? (v > p ? "up" : v < p ? "dn" : "") : "";
      return '<div class="tile"><div class="lb">' + esc(d.label || d.topic) + "</div>" +
        '<div class="vl ' + dir + '">' + fmtV(v, d.unit) + "</div>" +
        '<div class="dl">prev ' + fmtV(p, d.unit) + (d.last_date ? " · " + esc(d.last_date) : "") + "</div></div>";
    }).join("");
  } else el("top").innerHTML = "";

  if (wantC) {
    if (cal === READ_FAILED) el("list").innerHTML = '<div class="empty">the econ_calendar read failed — the calendar is unavailable, not clear · retrying at the next refresh</div>';
    else if (!Array.isArray(cal) || !cal.length) el("list").innerHTML = '<div class="empty">no calendar rows for this filter</div>';
    else {
      const now = Date.now();
      el("list").innerHTML = cal.map((r) => {
        const ms = num(r.event_ts) * 1000, past = ms < now;
        const a = num(r.actual), e = num(r.estimate), p = num(r.previous);
        const beat = a != null && e != null ? (a > e ? "up" : a < e ? "dn" : "") : "";
        return '<div class="r' + (past ? " past" : "") + '"><span class="when">' + when(ms) + "</span>" +
          '<span class="imp ' + esc(String(r.impact || "").toLowerCase()) + '">' + esc(r.impact || "—") + "</span>" +
          '<span class="ctry">' + esc(r.country || "") + "</span>" +
          '<span class="ev">' + esc(r.event || "") + "</span>" +
          '<span class="nums">' + (a != null ? '<b class="' + beat + '">' + a + "</b>" : "—") +
            (e != null ? " vs " + e : "") + (p != null ? " · prev " + p : "") + "</span></div>";
      }).join("");
    }
  }
  el("stamp").textContent = "econ_dashboard + econ_calendar · db reads only";
}
tick().catch(() => { el("list").innerHTML = '<div class="empty">economic data unavailable</div>'; });
setInterval(() => tick().catch(() => {}), REFRESH);
</script>
</body>
</html>
