<!doctype html>
<html lang="en">

<title>SCINTILLA · video pane</title>
<!-- ============================================================================
     SCINTILLA · /pane-video — BUILT FOR THE PANE, not a page squeezed into one.

     Why this exists. /feed-a and /feed-b are full pages. Dropped into a deck
     slot they spend their height on chrome — header, chip row, tools row, a
     hint paragraph, a footer — and the videos end up below the fold. Alan
     opened the deck and saw "Nothing is playing and nothing was chosen for
     you" with no video to click. The data was fine (2,980 videos, every one
     with a thumbnail). The layout was the bug.

     So this is a different thing, sized for a box:
       · THUMBNAILS FIRST. A grid that counts its own columns from its own
         width — 1 column in a phone slot, 5 across an Apple TV third. The
         first thing in the pane is always a picture of a video.
       · ONE thin bar of chrome. Nothing else competes for height.
       · CLICK ONE AND IT PLAYS IN PLACE. The grid gives way to the player
         inside the same box. Back is one tap and you are on the grid again.
       · IT STILL NEVER PICKS FOR YOU. Opens on the grid. ?v= is the only
         preselect, because that is you asking by id.

     PICTURE-IN-PICTURE. The pane keeps the chosen video in its own URL
     (?v=), so whatever hosts it can lift the exact same view — same video —
     into a floating Document Picture-in-Picture window. The deck's PiP
     button does that. Where the browser supports Document PiP and we are
     top-level, the button here does it directly.

     Params: ?feed=personal|scintilla|market · ?list=default|all|shorts|watch · ?v=VIDEOID
             · ?autoplay=1 · ?limit=60 (10-200) · ?t=MU · ?cols=N (force)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-PANEVIDEO-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-btn-size:8px; --ipad-btn-pad-y:3px; --ipad-btn-pad-x:7px;
  --ipad-title-size:9.5px; --ipad-caption-size:8px;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; display:flex; flex-direction:column;
  overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }

/* ---- ONE thin bar. This is the entire chrome budget. ---- */
#bar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px;
  padding-top:calc(4px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  background:var(--panel2); overflow-x:auto; scrollbar-width:none; }
#bar::-webkit-scrollbar{ display:none; }
.k{ flex:none; color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; }
.btn{ flex:none; font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink3); cursor:pointer;
  text-decoration:none; white-space:nowrap; }
.btn:hover{ color:var(--ink); border-color:var(--hair); }
.btn.on{ color:var(--crk); border-color:var(--crk); }
.btn.out{ color:var(--vol); border-color:rgba(255,138,0,.35); }
#auth{ flex:none; color:var(--vol); font-size:8px; letter-spacing:.06em; white-space:nowrap; }
#q{ display:none; flex:1 1 90px; min-width:70px; background:var(--bg); border:1px solid var(--line);
  color:var(--ink); font-family:var(--mono); font-size:11px; padding:3px 6px; outline:none;
  border-radius:0; -webkit-appearance:none; }
body.searching #q{ display:block; }
#q:focus{ border-color:var(--crk); }
#bFull{ margin-left:auto; }

/* ---- THE GRID. Thumbnails, counted from our own width. ---- */
#grid{ flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; display:grid; gap:1px; align-content:start;
  grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); background:var(--line); }
.card{ background:var(--bg); cursor:pointer; display:flex; flex-direction:column; min-width:0; }
.card:hover{ background:var(--panel2); }
.card.on{ outline:1px solid var(--crk); outline-offset:-1px; }
.thumb{ position:relative; width:100%; aspect-ratio:16/9; background:#12121c; overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.star{ position:absolute; top:0; right:0; width:34px; height:34px; padding:0; z-index:2;
  box-sizing:border-box; border:0; border-radius:0; background:transparent;
  color:var(--ink); cursor:pointer;
  -webkit-text-stroke:.35px #000; text-shadow:0 1px 3px #000,0 0 8px #000,0 0 2px #000; }
.star > span{ position:absolute; top:1px; right:1px; font:19px/1 var(--mono); }
.star:hover{ color:var(--ink); }
.star.on{ color:var(--vol); }
.dur{ position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.82); color:#fff;
  font-size:8px; padding:1px 4px; letter-spacing:.02em; }
.tk{ position:absolute; left:3px; top:3px; background:rgba(0,212,255,.9); color:#04040a;
  font-size:8px; padding:1px 4px; letter-spacing:.04em; font-weight:600; }
.cap{ padding:4px 5px 6px; }
.cap .t{ color:var(--ink2); font-size:9.5px; line-height:1.3; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.cap .s{ color:var(--mute); font-size:8px; margin-top:2px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
/* very small slots: drop the caption, the picture is the interface */
body.tiny .cap .s{ display:none; }
body.tiny .cap{ padding:3px 4px 4px; }
body.tiny .cap .t{ -webkit-line-clamp:2; font-size:9px; }
html[data-view="desk"] .btn{ font-size:9px; padding:4px 8px; }
html[data-view="desk"] .cap .t{ font-size:11px; }
html[data-view="desk"] .cap .s{ font-size:8.5px; }
html[data-view="ipad"] .btn{ font-size:var(--ipad-btn-size); padding:var(--ipad-btn-pad-y) var(--ipad-btn-pad-x); }
html[data-view="ipad"] .cap .t{ font-size:var(--ipad-title-size); }
html[data-view="ipad"] .cap .s{ font-size:var(--ipad-caption-size); }
html[data-view="compact"] .btn{ font-size:7px; padding:2px 5px; }
html[data-view="compact"] .cap .t{ font-size:8.5px; }

/* ---- THE PLAYER. Same box, no navigation away. ---- */
#stage{ display:none; flex:1 1 0; min-height:0; flex-direction:column; }
body.playing #stage{ display:flex; }
body.playing #grid{ display:none; }
#video{ flex:1 1 0; min-height:0; position:relative; background:#000; }
#video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
#nowbar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px;
  background:var(--panel2); border-top:1px solid var(--line); }
#nowt{ flex:1 1 0; min-width:0; color:var(--ink2); font-size:9px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.msg{ grid-column:1/-1; padding:16px 12px; color:var(--mute); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; text-align:center; background:var(--bg); }
</style>

<script>

const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
const PUBLIC = "sb_publishable_AutibLpFtTns-WHAg67Pvw_I0HmjqE9";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries; let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + r.status);
      else throw new Error("pg " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 400 * (i + 1) + Math.random() * 250));
  }
  throw lastErr;
}
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);
const VIEW_PROFILES = ["auto","desk","ipad","display","compact"];
let VIEW_PROFILE = VIEW_PROFILES.includes(QS.get("view")) ? QS.get("view") : "auto";
document.documentElement.dataset.view = VIEW_PROFILE;
function applyIpadPaneScale(forced) {
  const raw = Math.min(innerWidth / 410, innerHeight / 180);
  const scale = VIEW_PROFILE === "ipad"
    ? Math.max(.72, Math.min(1.08, Number.isFinite(+forced) ? +forced : raw)) : 1;
  const root = document.documentElement.style;
  root.setProperty("--ipad-btn-size", (8 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-btn-pad-y", (3 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-btn-pad-x", (7 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-title-size", (9.5 * scale).toFixed(2) + "px");
  root.setProperty("--ipad-caption-size", (8 * scale).toFixed(2) + "px");
}
applyIpadPaneScale();
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const FEED   = ["personal", "scintilla", "market"].includes(QS.get("feed")) ? QS.get("feed") : "personal";
const LIMIT  = Math.max(10, Math.min(200, +(QS.get("limit") || 60)));
const TICK   = (QS.get("t") || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
const START  = (QS.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
const AUTO   = QS.get("autoplay") === "1";
const FORCE  = +(QS.get("cols") || 0);

/* A pane keeps its identity through every local filter. Personal and
   SCINTILLA are two intentionally separate authorized subscription feeds.
   The old market-search lane remains available, but it is not used as a
   substitute for either identity. Watch Later is one Station-wide list;
   its authority is the private SCINTILLA · Watch Later playlist. */
const SUBSCRIBED = {
  id: "default", n: "subscribed",
  q: "&subscription_accounts=cs." + encodeURIComponent("{" + FEED + "}") + "&is_short=eq.false"
};
const LISTS = FEED === "market" ? [
  { id: "default", n: "market",     q: "&tickers=not.is.null&tickers=neq.&is_short=eq.false" },
  { id: "shorts",  n: "shorts",     q: "&tickers=not.is.null&tickers=neq.&is_short=eq.true" },
  { id: "all",     n: "all market", q: "&tickers=not.is.null&tickers=neq." },
] : FEED === "scintilla" ? [
  SUBSCRIBED,
  { id: "watch", n: "watch later", q: "" },
] : [SUBSCRIBED];
let LIST = LISTS.some((l) => l.id === QS.get("list")) ? QS.get("list") : "default";
el("kk").textContent = FEED === "market" ? "MARKET SEARCH" :
  FEED === "scintilla" ? "SCINTILLA" : "PERSONAL";

let ROWS = [], BYID = {}, CUR = null, WATCH = new Set(), WATCH_READY = false, WATCH_ERROR = "";
let AUTH_STATUS = null;
let PLAYER_TOKEN = 0, PLAYER_READY_TOKEN = 0, PLAYER_FALLBACK = 0, PLAYER_POSITION_POLL = 0;
/* Local-only continuation state. It belongs to this device/browser, never to
   a Station scene, account, or backend record. */
const VIDEO_POSITION_KEY = "scintilla.station.video.positions.v1";
const VIDEO_POSITION_SAVE_MS = 10000;
const VIDEO_POSITION_NEAR_END_SECONDS = 12;
let PLAYER_POSITION = { time:0, duration:0, savedAt:0 };

function videoPositionMap(storage = localStorage) {
  try {
    const value = JSON.parse(storage.getItem(VIDEO_POSITION_KEY) || "{}");
    return value && typeof value === "object" ? value : {};
  } catch (_) { return {}; }
}
function resumePositionFor(videoId, storage = localStorage) {
  const entry = videoPositionMap(storage)[videoId];
  const time = Number(typeof entry === "object" ? entry.time : entry) || 0;
  const duration = Number(entry?.duration) || 0;
  return time > 5 && (!duration || time < duration - VIDEO_POSITION_NEAR_END_SECONDS) ? Math.floor(time) : 0;
}
function writeVideoPosition(videoId, time, duration, storage = localStorage) {
  if (!videoId) return;
  const map = videoPositionMap(storage);
  const t = Number(time) || 0, d = Number(duration) || 0;
  if (t <= 5 || (d && t >= d - VIDEO_POSITION_NEAR_END_SECONDS)) delete map[videoId];
  else map[videoId] = { time:Math.floor(t), duration:Math.floor(d) || 0 };
  try { storage.setItem(VIDEO_POSITION_KEY, JSON.stringify(map)); } catch (_) {}
}
function clearVideoPosition(videoId, storage = localStorage) {
  if (!videoId) return;
  const map = videoPositionMap(storage);
  delete map[videoId];
  try { storage.setItem(VIDEO_POSITION_KEY, JSON.stringify(map)); } catch (_) {}
}
function saveActiveVideoPosition(force = false) {
  if (!CUR || !PLAYER_POSITION.time) return;
  const now = Date.now();
  if (!force && now - PLAYER_POSITION.savedAt < VIDEO_POSITION_SAVE_MS) return;
  PLAYER_POSITION.savedAt = now;
  writeVideoPosition(CUR.video_id, PLAYER_POSITION.time, PLAYER_POSITION.duration);
}
function clearPlayerPositionPoll() {
  if (PLAYER_POSITION_POLL) clearTimeout(PLAYER_POSITION_POLL);
  PLAYER_POSITION_POLL = 0;
}
function requestActiveVideoPosition(frame) {
  if (!frame?.contentWindow) return;
  try {
    frame.contentWindow.postMessage(JSON.stringify({ event:"command", func:"getCurrentTime", args:[] }), "https://www.youtube.com");
    frame.contentWindow.postMessage(JSON.stringify({ event:"command", func:"getDuration", args:[] }), "https://www.youtube.com");
  } catch (_) {}
}
function startPlayerPositionPoll(token, frame) {
  clearPlayerPositionPoll();
  const tick = () => {
    if (token !== PLAYER_TOKEN || !CUR || !frame?.isConnected) return;
    requestActiveVideoPosition(frame);
    PLAYER_POSITION_POLL = setTimeout(tick, 5000);
  };
  tick();
}

async function ytAct(action, payload) {
  const r = await fetch(SB + "/functions/v1/yt-act", {
    method: "POST",
    headers: { apikey: PUBLIC, "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, payload || {})),
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ("yt-act " + r.status));
  return d;
}

async function syncWatch(force) {
  if (WATCH_READY && !force) return WATCH;
  const d = await ytAct("list");
  WATCH = new Set(Array.isArray(d.ids) ? d.ids : []);
  WATCH_READY = true;
  WATCH_ERROR = "";
  return WATCH;
}

async function oauth(step, account) {
  const suffix = account ? "&account=" + encodeURIComponent(account) : "";
  const r = await fetch(SB + "/functions/v1/yt-oauth?step=" + step + suffix, { headers: { apikey: PUBLIC } });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ("yt-oauth " + r.status));
  return d;
}

async function pollOauth(account, interval, expiresAt) {
  if (Date.now() >= expiresAt) { el("auth").textContent = "code expired · reconnect"; return; }
  let d;
  try { d = await oauth("poll", account); }
  catch (e) { el("auth").textContent = "reconnect failed"; return; }
  if (d.connected) {
    el("auth").textContent = (d.channel_title || account) + " connected";
    try { AUTH_STATUS = await oauth("status"); } catch (e) {}
    WATCH_ERROR = ""; WATCH_READY = false;
    try { await syncWatch(true); } catch (e) { WATCH_ERROR = e.message || "Watch Later unavailable"; }
    paintChips(); load(true);
    return;
  }
  if (d.status === "authorization_pending" || d.status === "slow_down" || d.status === "pending") {
    setTimeout(() => pollOauth(account, interval + (d.status === "slow_down" ? 5000 : 0), expiresAt), interval);
  } else el("auth").textContent = "reconnect: " + (d.status || "failed");
}

async function connectYouTube(account) {
  const popup = window.open("about:blank", "sc_youtube_connect_" + account, "width=560,height=760");
  el("auth").textContent = "connecting " + account + "…";
  try {
    const d = await oauth("start", account);
    el("auth").textContent = account + " · CODE " + d.user_code + " · waiting";
    if (popup) popup.location = d.url; else window.open(d.url, "_blank", "noopener");
    const interval = Math.max(5000, +(d.interval || 5) * 1000);
    pollOauth(account, interval, Date.now() + +(d.expires_in || 1800) * 1000);
  } catch (e) {
    if (popup) popup.close();
    el("auth").textContent = "reconnect failed";
  }
}

async function toggleWatch(v) {
  if (!v || !v.video_id) return;
  const was = WATCH.has(v.video_id), will = !was;
  if (will) WATCH.add(v.video_id); else WATCH.delete(v.video_id);
  paint();
  try { await ytAct(will ? "star" : "unstar", { videoId: v.video_id }); }
  catch (e) {
    if (was) WATCH.add(v.video_id); else WATCH.delete(v.video_id);
    paint();
  }
}

/* ---- columns counted from OUR width, not the window ---- */
function relayout() {
  const w = document.documentElement.clientWidth;
  let cols = FORCE || (w < 210 ? 1 : w < 340 ? 2 : w < 520 ? 3 : w < 760 ? 4 : w < 1100 ? 5 : 6);
  document.body.classList.toggle("tiny", w < 340);
  el("grid").style.setProperty("--cols", cols);
}
let raf = 0;
const nudge = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; applyIpadPaneScale(); relayout(); }); };
if (window.ResizeObserver) new ResizeObserver(nudge).observe(document.documentElement);
addEventListener("resize", nudge); addEventListener("orientationchange", nudge);

/* ---- play IN PLACE ---- */
function syncUrl() {
  const p = new URLSearchParams(location.search);
  if (CUR) p.set("v", CUR.video_id); else p.delete("v");
  p.set("feed", FEED); p.set("list", LIST);
  history.replaceState(null, "", "?" + p.toString());
}
function queueRows(rows, list, watch) {
  return list === "watch" ? rows.filter((v) => watch.has(v.video_id)) : rows.slice();
}
function nextQueuedVideo(rows, currentId, skipped) {
  const at = rows.findIndex((v) => v.video_id === currentId);
  for (let i = at + 1; i < rows.length; i += 1) {
    if (!skipped.has(rows[i].video_id)) return rows[i];
  }
  return null;
}
function clearPlayerFallback() {
  if (PLAYER_FALLBACK) clearTimeout(PLAYER_FALLBACK);
  PLAYER_FALLBACK = 0;
}
function advanceQueue(skipped = new Set()) {
  if (!CUR) return;
  const next = nextQueuedVideo(queueRows(ROWS, LIST, WATCH), CUR.video_id, skipped);
  if (!next) { el("nowt").textContent = "end of queue · " + (CUR.title || CUR.video_id); return; }
  play(next, true, true, skipped);
}
function armPlayerFallback(token, skipped) {
  clearPlayerFallback();
  PLAYER_FALLBACK = setTimeout(() => {
    if (token !== PLAYER_TOKEN || PLAYER_READY_TOKEN === token || !CUR) return;
    const nextSkipped = new Set(skipped); nextSkipped.add(CUR.video_id);
    el("nowt").textContent = "skipping unavailable video…";
    advanceQueue(nextSkipped);
  }, 10000);
}
function play(v, auto, queued = false, skipped = new Set()) {
  if (!v) return;
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback();
  CUR = v;
  PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
  const resumeAt = resumePositionFor(v.video_id);
  const token = ++PLAYER_TOKEN;
  document.body.classList.add("playing");
  el("video").innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(v.video_id) +
    "?playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin) +
    (resumeAt ? "&start=" + encodeURIComponent(resumeAt) : "") + (auto ? "&autoplay=1" : "") +
    '" title="' + esc(v.title) +
    '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  const frame = el("video").querySelector("iframe");
  frame.addEventListener("load", () => {
    try {
      frame.contentWindow.postMessage(JSON.stringify({ event:"command", func:"addEventListener", args:["onReady"] }), "https://www.youtube.com");
      frame.contentWindow.postMessage(JSON.stringify({ event:"command", func:"addEventListener", args:["onStateChange"] }), "https://www.youtube.com");
    } catch (_) {}
  });
  el("nowt").textContent = (v.title || v.video_id) + (v.channel ? "  ·  " + v.channel : "");
  el("bBack").style.display = "";
  el("bYt").style.display = ""; el("bYt").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.video_id);
  el("bYt").textContent = IOS ? "app ↗" : "youtube ↗";
  el("bPip").style.display = canPip() ? "" : "none";
  syncUrl();
  if (queued) armPlayerFallback(token, skipped);
}
function back() {
  saveActiveVideoPosition(true);
  clearPlayerPositionPoll();
  clearPlayerFallback(); ++PLAYER_TOKEN;
  CUR = null;
  el("video").innerHTML = "";                 /* the iframe is really gone */
  document.body.classList.remove("playing");
  for (const b of ["bBack", "bPip", "bYt"]) el(b).style.display = "none";
  syncUrl(); paint();
}
el("bBack").addEventListener("click", back);
window.addEventListener("message", (event) => {
  if (event.origin !== "https://www.youtube.com") return;
  const frame = el("video").querySelector("iframe");
  if (!frame || event.source !== frame.contentWindow) return;
  let data = event.data;
  if (typeof data === "string") { try { data = JSON.parse(data); } catch (_) { return; } }
  if (data?.event === "onReady") {
    PLAYER_READY_TOKEN = PLAYER_TOKEN; clearPlayerFallback(); startPlayerPositionPoll(PLAYER_TOKEN, frame);
  }
  if (data?.event === "infoDelivery" && data.info) {
    PLAYER_POSITION.time = Number(data.info.currentTime) || PLAYER_POSITION.time;
    PLAYER_POSITION.duration = Number(data.info.duration) || PLAYER_POSITION.duration;
    saveActiveVideoPosition(false);
  }
  if (data?.event === "onStateChange" && Number(data.info) === 0) {
    clearPlayerPositionPoll();
    clearVideoPosition(CUR?.video_id);
    PLAYER_POSITION = { time:0, duration:0, savedAt:0 };
    advanceQueue();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveActiveVideoPosition(true);
});
window.addEventListener("pagehide", () => saveActiveVideoPosition(true));

/* ---- PICTURE-IN-PICTURE ----
   Document PiP hosts real DOM, so it can carry the YouTube player into a
   floating always-on-top window. It needs a top-level context, so inside a
   deck pane this button hides and the DECK's pip button does the same job
   from the top level using this pane's own ?v= URL. */
function canPip() {
  try { return !!window.documentPictureInPicture && window.top === window.self; } catch (e) { return false; }
}
el("bPip").addEventListener("click", async () => {
  if (!CUR || !canPip()) return;
  try {
    const w = await documentPictureInPicture.requestWindow({ width: 480, height: 300 });
    const d = w.document;
    d.body.style.cssText = "margin:0;background:#000;height:100%";
    d.documentElement.style.height = "100%";
    const f = d.createElement("iframe");
    f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(CUR.video_id) +
            "?playsinline=1&rel=0&modestbranding=1&autoplay=1";
    d.body.appendChild(f);
  } catch (e) { /* user dismissed, or the browser said no */ }
});

/* ---- render ---- */
function paint() {
  const q = "";
  let rows = LIST === "watch" ? ROWS.filter((v) => WATCH.has(v.video_id)) : ROWS;
  rows = q ? rows.filter((v) => ((v.title || "") + " " + (v.channel || "") + " " + (v.tickers || "")).toLowerCase().indexOf(q) >= 0) : rows;
  if (!rows.length) { el("grid").innerHTML = '<div class="msg">' + (q ? "nothing matches" : "no videos in this list") + "</div>"; return; }
  el("grid").innerHTML = rows.map((v) =>
    '<div class="card' + (CUR && CUR.video_id === v.video_id ? " on" : "") + '" data-v="' + esc(v.video_id) + '">' +
      '<div class="thumb"><img loading="lazy" decoding="async" src="' +
        esc(v.thumb_url || ("https://i.ytimg.com/vi/" + v.video_id + "/mqdefault.jpg")) + '" alt="">' +
        (FEED === "scintilla" ? '<button class="star' + (WATCH.has(v.video_id) ? " on" : "") + '" data-star="' + esc(v.video_id) +
          '" aria-label="' + (WATCH.has(v.video_id) ? "remove from" : "save to") + ' SCINTILLA Watch Later" title="' +
          (WATCH.has(v.video_id) ? "remove from" : "save to") + ' SCINTILLA · Watch Later"><span aria-hidden="true">' +
          (WATCH.has(v.video_id) ? "★" : "☆") + '</span></button>' : "") +
        (v.tickers ? '<span class="tk">' + esc(String(v.tickers).split(",")[0]) + "</span>" : "") +
        (v.duration ? '<span class="dur">' + esc(v.duration) + "</span>" : "") +
      "</div>" +
      '<div class="cap"><div class="t">' + esc(v.title) + "</div>" +
      '<div class="s">' + esc(v.channel || "") + "</div></div>" +
    "</div>").join("");
  for (const n of el("grid").querySelectorAll(".card"))
    n.addEventListener("click", () => play(BYID[n.dataset.v], true));
  for (const n of el("grid").querySelectorAll(".star"))
    n.addEventListener("click", (e) => { e.stopPropagation(); toggleWatch(BYID[n.dataset.star]); });
}

function paintChips() {
  const box = el("chips"); box.innerHTML = "";
  for (const l of LISTS) {
    const b = document.createElement("span");
    b.className = "btn" + (l.id === LIST ? " on" : "");
    b.textContent = l.n;
    b.addEventListener("click", () => { LIST = l.id; paintChips(); load(LIST === "watch"); });
    box.appendChild(b);
  }
  const own = AUTH_STATUS && AUTH_STATUS.accounts && AUTH_STATUS.accounts[FEED];
  if (FEED !== "market" && LIST === "watch" && own && !own.connected) {
    const b = document.createElement("span");
    b.className = "btn out"; b.textContent = "connect " + FEED;
    b.title = "connect the " + FEED + " YouTube identity";
    b.addEventListener("click", () => connectYouTube(FEED));
    box.appendChild(b);
  }
  if (WATCH_ERROR && LIST === "watch") {
    const b = document.createElement("span");
    b.className = "btn out"; b.textContent = "reconnect SCINTILLA";
    b.title = WATCH_ERROR + " — Watch Later is owned by SCINTILLA";
    b.addEventListener("click", () => connectYouTube("scintilla"));
    box.appendChild(b);
  }
}

async function load(forceWatch, quiet) {
  if (!quiet && !ROWS.length) el("grid").innerHTML = '<div class="msg">loading…</div>';
  /* Personal is subscriptions-only. Do not involve that pane in the private
     SCINTILLA Watch Later credential or show it reconnect noise. */
  if (FEED === "scintilla") {
    try { await syncWatch(!!forceWatch); }
    catch (e) {
      WATCH_READY = false; WATCH_ERROR = e.message || "Watch Later unavailable";
      paintChips();
    }
  }
  let q = "youtube_feed?select=video_id,title,channel,tickers,duration,is_short,thumb_url,published_at,subscription_accounts" +
          "&order=published_at.desc&limit=" + LIMIT;
  const chosen = LISTS.find((l) => l.id === LIST);
  if (LIST === "watch") {
    if (WATCH_ERROR) {
      if (quiet && ROWS.length) return;
      ROWS = []; BYID = {};
      el("grid").innerHTML = '<div class="msg">YouTube reconnect required</div>';
      relayout(); return;
    }
    if (!WATCH.size) { ROWS = []; BYID = {}; paint(); relayout(); return; }
    q += "&video_id=in.(" + Array.from(WATCH).slice(0, 200).map(encodeURIComponent).join(",") + ")";
  } else q += chosen.q;
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  let rows;
  try { rows = await pg(q); }
  catch (e) {
    if (!quiet || !ROWS.length) el("grid").innerHTML = '<div class="msg">feed unavailable</div>';
    return;
  }
  const nextRows = Array.isArray(rows) ? rows : [];
  const signature = (items) => items.map((v) => [v.video_id, v.title, v.channel, v.published_at,
    Array.isArray(v.subscription_accounts) ? v.subscription_accounts.join("+") : ""].join("|")).join("\n");
  const changed = signature(nextRows) !== signature(ROWS);
  ROWS = nextRows;
  BYID = {}; for (const v of ROWS) BYID[v.video_id] = v;
  if (changed || !quiet) { paint(); relayout(); }
  /* the ONLY preselect: you asked for a video by id */
  if (START && BYID[START]) play(BYID[START], AUTO);
}

el("bFull").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_TOGGLE_FULL" }, location.origin);
});
el("bCover").addEventListener("click", () => {
  parent.postMessage({ type: "SCINTILLA_DECK_MEDIA_COVER_X" }, location.origin);
});
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    relayout(); return;
  }
  if (event.data?.type === "SCINTILLA_DECK_FULL_STATE") {
    const stage = +event.data.stage || 0;
    el("bFull").textContent = stage === 2 ? "↙ youtube" : stage === 1 ? "↙ normal" : "⛶";
    el("bFull").title = stage === 2 ? "return to YouTube region" : stage === 1 ? "return to normal media layout" : "expand across YouTube region";
    el("bCover").style.display = event.data.canCoverX ? "" : "none";
  }
});
async function start() {
  try { AUTH_STATUS = await oauth("status"); } catch (e) {}
  paintChips(); relayout(); load();
  /* Keep the account-scoped feed current without touching the YouTube API on
     every pass. load(false) reuses the already-synced Watch Later set and
     rereads only the database while this pane is visible and idle. */
  setInterval(() => {
    if (document.visibilityState === "visible" && !CUR) load(false, true);
  }, 120000);
}
start();
</script>
