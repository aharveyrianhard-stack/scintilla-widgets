<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#08090b">
<title>The Image Menu</title>
<style>html,body{margin:0;height:100%;background:#08090b;color:#e9e4d8;
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#b{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:14px;text-align:center;padding:24px}
#b .k{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.30em;color:#cfa15a}
#b .m{color:#918c82;font-size:14px;max-width:34ch}
#b a{color:#e9e4d8;font-size:13px;border-bottom:1px solid #3a3a3f;text-decoration:none}
.sp{width:22px;height:22px;border:2px solid #2c2f37;border-top-color:#cfa15a;
 border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div id="b"><div class="sp"></div><div class="k">T H E   I M A G E   M E N U</div>
<div class="m" id="msg">Opening.</div>
<a href="/visuals">Back to the lab</a></div>
<script>
(function(){
 "use strict";
 var SRC = "https://wadinxqplrggagkvrdag.supabase.co/functions/v1/lab";
 var PAGE = "imagegen-v1.html";
 /* Readable routes, mapped to the pages behind them. Any link inside a
    loaded page that points at something we have a route for is rewritten,
    so the readable address survives navigation instead of falling back to
    the machine one. */
 var ROUTES = {"menu-v1.html":"/visuals/menu","imagegen-v1.html":"/visuals/images",
  "port-v2.html":"/visuals/bench","port-guide-v1.html":"/visuals/template",
  "urth-theme-v1.html":"/visuals/theme","index.html":"/visuals/archive",
  "catalog.html":"/visuals/archive"};
 var msg = document.getElementById("msg");
 function fail(why){
  var sp = document.querySelector(".sp"); if (sp) sp.style.display = "none";
  msg.innerHTML = "This did not open (" + why + ").<br>It is not lost — try again in a moment.";
 }
 var slow = setTimeout(function(){ msg.textContent = "Still opening — the shelf is waking up."; }, 2600);
 fetch(SRC + "?p=" + encodeURIComponent(PAGE), { cache: "no-store" })
  .then(function(r){ if (!r.ok) throw new Error("status " + r.status); return r.text(); })
  .then(function(html){
   clearTimeout(slow);
   /* A base tag makes every relative reference in the page - images and
      links alike - resolve against the shelf, so nothing 404s. */
   var base = '<base href="' + SRC + '">';
   var inject = "<scr" + "ipt>(function(){document.addEventListener('click',function(e){" +
     "var a = e.target && e.target.closest ? e.target.closest('a') : null; if(!a) return;" +
     "var h = a.getAttribute('href') || ''; var m = h.match(/[?&]p=([^&]+)/); if(!m) return;" +
     "var R = " + JSON.stringify(ROUTES) + "; var t = R[decodeURIComponent(m[1])];" +
     "if(t){ e.preventDefault(); location.href = t; }});})();</scr" + "ipt>";
   if (/<head[^>]*>/i.test(html)) html = html.replace(/<head([^>]*)>/i, "<head$1>" + base);
   else html = base + html;
   if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, inject + "</body>");
   else html = html + inject;
   document.open(); document.write(html); document.close();
  })
  .catch(function(e){ clearTimeout(slow); fail(String(e.message || e)); });
})();
</script></body></html>
