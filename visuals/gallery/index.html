<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Gallery — like / don't like</title>
<style>
:root{--bg:#08090b;--ink:#e9e4d8;--dim:#918c82;--dimmer:#5f5a52;
 --gold:#cfa15a;--yes:#7d9c5a;--no:#c4736a;--line:#1e2026;
 --mono:ui-monospace,"SF Mono",Menlo,monospace;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
 -webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
 font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
.top{flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
 display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--dim)}
.pos b{color:var(--ink)}
.tally{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dimmer)}
.tally .y{color:var(--yes)}.tally .n{color:var(--no)}
.prog{flex:0 0 auto;height:2px;background:#191b20;margin:0 16px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}

/* stage */
.stage{flex:1 1 auto;position:relative;margin:12px 14px 10px;border-radius:14px;
 overflow:hidden;background:#000;border:1px solid var(--line);touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;z-index:3;
 background:linear-gradient(180deg,rgba(8,9,11,0),rgba(8,9,11,.88));pointer-events:none}
.cap .n{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cap .f{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);
 margin-top:5px}
.stamp{position:absolute;top:14px;left:14px;z-index:4;font-family:var(--mono);font-size:11px;
 letter-spacing:.16em;padding:6px 10px;border-radius:5px;display:none}
.stamp.on{display:block}
.stamp.like{background:rgba(125,156,90,.92);color:#0d1408}
.stamp.no{background:rgba(196,115,106,.92);color:#180a08}

/* controls */
.ctl{flex:0 0 auto;display:flex;gap:10px;padding:0 14px
 calc(12px + env(safe-area-inset-bottom))}
button{font-family:var(--sans);border-radius:13px;border:1px solid var(--line);
 background:#101217;color:var(--ink);cursor:pointer;font-size:15px;font-weight:600;
 letter-spacing:-.005em;transition:transform .08s,background .12s}
button:active{transform:scale(.97)}
.big{flex:1 1 0;min-height:62px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:3px}
.big .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dimmer);
 font-weight:500}
#no{border-color:rgba(196,115,106,.42)}
#no:active{background:rgba(196,115,106,.2)}
#yes{border-color:rgba(125,156,90,.46)}
#yes:active{background:rgba(125,156,90,.2)}
#back{flex:0 0 66px;min-height:62px;font-family:var(--mono);font-size:10px;
 letter-spacing:.14em;color:var(--dim);font-weight:500}

/* end screen */
.end{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
 -webkit-overflow-scrolling:touch;display:none;
 padding:calc(26px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom))}
.end.on{display:block}
.end h1{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.end .sum{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--dim);
 margin-bottom:20px}
.end .sum b{color:var(--yes)}
.end h2{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--gold);
 margin:22px 0 9px}
.end ul{list-style:none;padding:0;margin:0}
.end li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;
 display:flex;justify-content:space-between;gap:12px;color:var(--ink)}
.end li span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dimmer);
 flex:0 0 auto;align-self:center}
.end .none{color:var(--dimmer);font-size:14px}
.endbtns{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.endbtns button{flex:1 1 150px;min-height:54px;padding:0 14px;font-size:14px}
.saved{margin-top:20px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
 color:var(--dimmer);line-height:1.9}
</style></head><body>
<div id="app">
 <div class="top"><span class="pos" id="pos">—</span><span class="tally" id="tally"></span></div>
 <div class="prog"><i id="bar"></i></div>
 <div class="stage" id="stage">
   <canvas id="cv"></canvas>
   <div class="stamp" id="stamp"></div>
   <div class="cap"><div class="n" id="capn">—</div><div class="f" id="capf">—</div></div>
 </div>
 <div class="ctl">
  <button id="back">BACK</button>
  <button class="big" id="no">Don't like<span class="s">MARK &amp; NEXT</span></button>
  <button class="big" id="yes">Like<span class="s">MARK &amp; NEXT</span></button>
 </div>
 <div class="end" id="end">
  <h1>That's all of them.</h1>
  <div class="sum" id="endsum"></div>
  <h2>W H A T &nbsp; Y O U &nbsp; L I K E D</h2>
  <ul id="likelist"></ul>
  <div class="endbtns">
   <button id="again">Go through them again</button>
   <button id="onlyliked">Show only the ones I liked</button>
  </div>
  <div class="saved" id="savednote"></div>
 </div>
</div>
<script>
(()=>{

 for(let i=0;i<3;i++){const p=(t*.28+i/3)%1,rr=R*(.35+p*1.25),a=1-p;
  c.strokeStyle=`rgba(150,186,110,${a})`;c.lineWidth=2.4-p*1.3;
  c.beginPath();c.arc(cx,cy,rr,Math.PI*1.08,Math.PI*1.92);c.stroke()}

 c.quadraticCurveTo(cx+Math.sin(t*.6)*R*.16,cy-R*.6,cx+Math.sin(t*.6)*R*.3,cy-R*1.0);c.stroke();
 c.font='600 '+(h*.13|0)+'px '+getComputedStyle(document.body).fontFamily;

}
function sTheme(c,w,h,t){

 bg.addColorStop(0,'#181510');bg.addColorStop(.55,'#221d15');bg.addColorStop(1,'#12100c');
 c.fillStyle=bg;c.fillRect(0,0,w,h);
 for(let i=0;i<44;i++){const x=(vn(i*3.1,7.7)*.5+.5)*w,y=(vn(i*1.7,3.3)*.5+.5)*h;
  c.fillStyle=`rgba(146,112,66,${.03+((i*7)%5)*.012})`;

 c.font='600 '+(h*.105|0)+'px '+F;c.fillText('Ground that',w*.06,h*.53);
 c.fillStyle='#7d9c5a';c.fillText('keeps its shape.',w*.06,h*.68);
 [['SITES','142'],['CREW','31'],['ACRES','06']].forEach((s,i)=>{const x=w*.06+i*(w*.26);
  c.font='500 '+Math.max(7,h*.030|0)+'px var(--mono),monospace';

const bars=[];{let p=100;for(let i=0;i<44;i++){const o=p,cl=p+(Math.random()-.48)*4.2;

let btk=0;
function sChart(c,w,h,t){
 c.fillStyle='#0a0b0e';c.fillRect(0,0,w,h);

  bars.push({o:last,c:cl,h:Math.max(last,cl)+Math.random()*2,l:Math.min(last,cl)-Math.random()*2});bars.shift()}

 const bw=iw/bars.length;
 c.beginPath();c.moveTo(pad.l,pad.t+ih);
 bars.forEach((b,i)=>c.lineTo(pad.l+i*bw+bw/2,Y(b.c)));
 c.lineTo(pad.l+iw,pad.t+ih);c.closePath();
 const ag=c.createLinearGradient(0,pad.t,0,pad.t+ih);
 ag.addColorStop(0,'rgba(95,127,147,.36)');ag.addColorStop(1,'rgba(95,127,147,0)');
 c.fillStyle=ag;c.fill();
 bars.forEach((b,i)=>{const x=pad.l+i*bw+bw/2,up=b.c>=b.o;
  c.strokeStyle=up?'#8fbf7a':'#c4736a';c.lineWidth=1;
  c.beginPath();c.moveTo(x+.5,Y(b.h));c.lineTo(x+.5,Y(b.l));c.stroke();
  c.fillStyle=up?'#8fbf7a':'#c4736a';
  const y0=Y(Math.max(b.o,b.c)),y1=Y(Math.min(b.o,b.c));
  c.fillRect(x-bw*.30,y0,bw*.60,Math.max(1,y1-y0))});

 c.strokeStyle='#cfa15a';c.setLineDash([3,3]);
 c.beginPath();c.moveTo(pad.l,ly+.5);c.lineTo(w-pad.r,ly+.5);c.stroke();c.setLineDash([]);
 c.font='500 10px ui-monospace,Menlo,monospace';c.textBaseline='middle';c.textAlign='left';
 c.fillStyle='rgba(233,228,216,.6)';
 for(let i=0;i<=3;i++)c.fillText((hi-(rng/3)*i).toFixed(1),w-pad.r+5,pad.t+(ih/3)*i);

const rows=['LOAM','SLATE','CEDAR','BASALT','SEDGE','QUARTZ'].map((n,i)=>({n,v:40+Math.random()*55,y:i,ty:i,d:0}));
function sTable(c,w,h,t){
 c.fillStyle='#0a0b0e';c.fillRect(0,0,w,h);
 for(const r of rows){r.d=r.d*.94+(Math.random()-.5)*.16;r.v=clamp(r.v+r.d,18,100)}

 for(const r of rows)r.y+=(r.ty-r.y)*.18;

 c.strokeStyle='rgba(233,228,216,.12)';c.beginPath();c.moveTo(0,hd+.5);c.lineTo(w,hd+.5);c.stroke();

 c.fillStyle='rgba(233,228,216,.42)';c.textAlign='left';c.fillText('BED',12,hd/2);
 c.textAlign='right';c.fillText('INDEX',w-64,hd/2);c.fillText('LOAD',w-12,hd/2);

 for(const r of rows){const y=hd+3+r.y*rh,cy=y+rh/2;
  if((r.ty&1)===0){c.fillStyle='rgba(233,228,216,.022)';c.fillRect(0,y,w,rh)}

  c.font='500 '+fs+'px ui-monospace,Menlo,monospace';
  c.textAlign='left';c.fillStyle='#e9e4d8';c.fillText(r.n,12,cy);
  c.textAlign='right';c.fillStyle='#cfa15a';c.fillText(r.v.toFixed(1),w-64,cy);

function arcPt(u,w,h){const a=Math.PI*(1.06+u*.88);

 c.fillStyle='#cfa15a';c.beginPath();c.arc(w*.5,h*.62,3.4,0,TAU);c.fill();
 c.font='500 10px ui-monospace,Menlo,monospace';c.textAlign='center';c.textBaseline='top';

function sGlitter(c,w,h,t){

  g.addColorStop(.3,`rgba(217,164,65,${.26*e})`);g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,r*3.4,0,TAU);c.fill();
  c.strokeStyle=`rgba(255,252,242,${.5*e})`;c.lineWidth=.7;
  c.beginPath();c.moveTo(x-r*2,y);c.lineTo(x+r*2,y);
  c.moveTo(x,y-r*2);c.lineTo(x,y+r*2);c.stroke()}

}
function sArc(c,w,h,t){
 c.fillStyle='#0a0908';c.fillRect(0,0,w,h);
 c.strokeStyle='rgba(233,228,216,.10)';c.lineWidth=1;
 for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,h/4*i+.5);c.lineTo(w,h/4*i+.5);c.stroke()}
 const geo=[0,1,2].map(k=>(u)=>{
  const a=Math.PI*(1.06+u*.88);
  const rx=w*(.30+k*.045), ry=h*(.44-k*.05);
  return{x:w*.5+Math.cos(a)*rx,y:h*.60+Math.sin(a)*ry*(1+k*.12*Math.sin(u*Math.PI))}});
 geo.forEach((f,k)=>{
  c.strokeStyle=['rgba(207,161,90,.95)','rgba(125,156,90,.7)','rgba(95,127,147,.6)'][k];
  c.lineWidth=[2.4,1.5,1.2][k];
  c.beginPath();
  for(let i=0;i<=90;i++){const p=f(i/90); i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)}
  c.stroke()});
 const u=(t*.3)%1, p=geo[0](u);
 c.fillStyle='#fff3d8';c.beginPath();c.arc(p.x,p.y,3.6,0,TAU);c.fill();
}
function sBreath(c,w,h,t){
 c.fillStyle='#08090b';c.fillRect(0,0,w,h);
 const cyc=16, ph=(t%cyc)/cyc;
 let v,phase;
 if(ph<.25){const p=ph/.25;v=p*p*(3-2*p);phase='INHALE'}
 else if(ph<.5){v=1;phase='HOLD'}
 else if(ph<.75){const p=(ph-.5)/.25;v=1-Math.pow(p,1.45);phase='EXHALE'}
 else {v=0;phase='HOLD'}
 const cx=w/2,cy=h*.46,R=Math.min(w,h)*.16*(1+v*.85);
 const g=c.createRadialGradient(cx,cy,0,cx,cy,R*3);
 g.addColorStop(0,`rgba(125,156,90,${.30+v*.42})`);
 g.addColorStop(.45,`rgba(95,127,147,${.14+v*.16})`);g.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=g;c.fillRect(0,0,w,h);
 for(let i=0;i<4;i++){
  const rr=R*(1+i*.42), a=(1-i/4)*(.30+v*.5);
  c.strokeStyle=`rgba(160,196,118,${a})`;c.lineWidth=1.5-i*.25;
  c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke()}
 c.fillStyle=`rgba(233,240,220,${.65+v*.3})`;
 c.beginPath();c.arc(cx,cy,R*.34,0,TAU);c.fill();
 c.font='500 11px ui-monospace,Menlo,monospace';c.textAlign='center';c.textBaseline='middle';
 c.fillStyle='rgba(233,228,216,.62)';c.fillText(phase,cx,h*.84);
 c.strokeStyle='rgba(233,228,216,.18)';c.lineWidth=2;
 c.beginPath();c.moveTo(w*.2,h*.9);c.lineTo(w*.8,h*.9);c.stroke();
 c.strokeStyle='#cfa15a';c.beginPath();c.moveTo(w*.2,h*.9);c.lineTo(w*.2+w*.6*ph,h*.9);c.stroke();
}
function sVolume(c,w,h,t){
 c.fillStyle='#08090b';c.fillRect(0,0,w,h);
 const pts=[];const N=13;
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const u=i/(N-1)-.5, v=j/(N-1)-.5;
  pts.push([u,Math.sin(u*6+t*.5)*.12+Math.cos(v*5-t*.4)*.12,v])}
 const yaw=t*.35, pit=.52;
 const cy0=Math.cos(yaw),sy0=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
 const proj=pts.map(([x,y,z])=>{
  const X=x*cy0-z*sy0, Z=x*sy0+z*cy0;
  const Y=y*cp-Z*sp, Zz=y*sp+Z*cp+2.4;
  const f=Math.min(w,h)*1.25/Zz;
  return{x:w/2+X*f,y:h/2+Y*f,d:Zz}});
 proj.sort((a,b)=>b.d-a.d);
 for(const p of proj){
  const k=clamp((3.0-p.d)/1.2,0,1);
  const r=1.2+k*3.4;
  c.fillStyle=`rgba(${(90+k*165)|0},${(120+k*120)|0},${(70+k*90)|0},${.28+k*.7})`;
  c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill()}
}
function sTape(c,w,h,t){
 c.fillStyle='#0a0b0e';c.fillRect(0,0,w,h);
 const syms=['MU','SPY','NVDA','AAPL','VIX','ES','GOOGL','NBIS','SNDK','US10Y'];
 const rowsN=Math.max(3,Math.floor(h/44));
 c.textBaseline='middle';
 for(let r=0;r<rowsN;r++){
  const y=(r+.5)*(h/rowsN);
  const off=((t*(28+r*7))%(w+340))-170;
  for(let k=0;k<7;k++){
   const x=w-off+k*180-540;
   if(x<-160||x>w+60)continue;
   const s=syms[(r*3+k)%syms.length];
   const up=((r+k)%3)!==0;
   const val=(80+((r*37+k*13)%700)/6).toFixed(2);
   c.font='600 13px ui-monospace,Menlo,monospace';c.textAlign='left';
   c.fillStyle='rgba(233,228,216,.92)';c.fillText(s,x,y);
   c.fillStyle=up?'#8fbf7a':'#c4736a';
   c.fillText(val,x+52,y);
   c.fillText(up?'▲':'▼',x+118,y)}
  c.strokeStyle='rgba(233,228,216,.05)';c.lineWidth=1;
  c.beginPath();c.moveTo(0,y+h/rowsN/2);c.lineTo(w,y+h/rowsN/2);c.stroke()}
}
function sFlow(c,w,h,t){
 c.fillStyle='#07080a';c.fillRect(0,0,w,h);
 const step=Math.max(9,Math.round(Math.min(w,h)/26));
 for(let y=step/2;y<h;y+=step)for(let x=step/2;x<w;x+=step){
  const a=vn(x*.008+t*.10,y*.008)*Math.PI*3;
  const m=vn(x*.004-t*.06,y*.004+30)*.5+.5;
  const len=step*(.4+m*.8);
  c.strokeStyle=`rgba(${(70+m*180)|0},${(110+m*120)|0},${(140+m*60)|0},${.20+m*.6})`;
  c.lineWidth=.8+m*1.5;
  c.beginPath();c.moveTo(x-Math.cos(a)*len/2,y-Math.sin(a)*len/2);
  c.lineTo(x+Math.cos(a)*len/2,y+Math.sin(a)*len/2);c.stroke()}
}

const SUBJECTS=[
 ['photograph','A landscape photograph',sPhoto],
 ['mark','The URTH mark',sMark],
 ['theme','A full themed page',sTheme],
 ['chart','A live candle chart',sChart],
 ['table','A dense data table',sTable],
 ['wake','The golf swing wake',sWake],
 ['glitter','The glitter swing',sGlitter],
 ['arc','The swing arc geometry',sArc],
 ['breath','The breathing core',sBreath],
 ['volume','A rotating 3D volume',sVolume],
 ['tape','A market tape',sTape],
 ['flow','A flow field texture',sFlow],
];

/* ---------------- FINISHES ---------------- */
const FINISHES=[
 ['none','No finish','ride',()=>{}],
 ['pixel','Deep pixelation','replace',(ctx,sm,gw,gh,w,h)=>{
   ctx.imageSmoothingEnabled=false;ctx.drawImage(sm,0,0,gw,gh,0,0,w,h);
   ctx.imageSmoothingEnabled=true}],
 ['dither','Ordered dither','replace',(ctx,sm,gw,gh,w,h,cell)=>{
   const sc=sm.getContext('2d'),id=sc.getImageData(0,0,gw,gh),d=id.data;
   const q1=clamp(Math.round(9-cell*.30),2,8)-1;
   /* The floor stops flat shadow checkerboarding, but a fixed one erases
      sparse subjects that are only a few bright marks on black. Tie it to
      how bright the picture actually is. */
   let mean=0;
   for(let i=0;i<d.length;i+=4)mean+=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
   mean/=(d.length/4);
   const floor=Math.min(.38/q1, mean*.55);
   for(let y=0;y<gh;y++){const row=BAYER[y&7];
    for(let x=0;x<gw;x++){const i=(y*gw+x)*4,r=d[i],g=d[i+1],b=d[i+2];
     const L=(r*.2126+g*.7152+b*.0722)/255;
     if(L<floor){d[i]=d[i+1]=d[i+2]=0;continue}
     const q=clamp(Math.round((L+(row[x&7]-.5)/q1)*q1),0,q1)/q1;
     const s=clamp(q/(L>.014?L:.014),0,2.35);
     d[i]=clamp(r*s,0,255);d[i+1]=clamp(g*s,0,255);d[i+2]=clamp(b*s,0,255)}}
   sc.putImageData(id,0,0);ctx.imageSmoothingEnabled=false;
   ctx.drawImage(sm,0,0,gw,gh,0,0,w,h);ctx.imageSmoothingEnabled=true}],
 ['halftone','Halftone dots','replace',(ctx,sm,gw,gh,w,h,cell)=>{
   const d=sm.getContext('2d').getImageData(0,0,gw,gh).data;
   ctx.fillStyle='#07080a';ctx.fillRect(0,0,w,h);
   for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const i=(y*gw+x)*4,L=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
    if(L<.02)continue;
    ctx.fillStyle=`rgb(${d[i]},${d[i+1]},${d[i+2]})`;
    ctx.beginPath();ctx.arc((x+.5)*cell,(y+.5)*cell,Math.sqrt(L)*cell*.66,0,TAU);ctx.fill()}}],
 ['duotone','Two-colour duotone','replace',(ctx,sm,gw,gh,w,h)=>{
   const sc=sm.getContext('2d'),id=sc.getImageData(0,0,gw,gh),d=id.data;
   const A=[14,16,20],B=[217,164,65];
   for(let i=0;i<d.length;i+=4){
    const L=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255, e=L*L*(3-2*L);
    d[i]=A[0]+(B[0]-A[0])*e;d[i+1]=A[1]+(B[1]-A[1])*e;d[i+2]=A[2]+(B[2]-A[2])*e}
   sc.putImageData(id,0,0);ctx.imageSmoothingEnabled=false;
   ctx.drawImage(sm,0,0,gw,gh,0,0,w,h);ctx.imageSmoothingEnabled=true}],
 ['glitterfin','Sparkle on the bright parts','ride',(ctx,sm,gw,gh,w,h,cell,t)=>{
   const d=sm.getContext('2d').getImageData(0,0,gw,gh).data;
   ctx.save();ctx.globalCompositeOperation='lighter';
   for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const i=(y*gw+x)*4,L=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
    if(L<.30)continue;
    const ph=t*1.5+((x*73+y*131)%97)*.13, tw=Math.sin(ph)*.5+.5;
    if(tw<.73)continue;
    const e=(tw-.73)/.27*(L-.30)/.70;
    const px=(x+.5)*cell,py=(y+.5)*cell,r=cell*(.2+e*.52);
    const g=ctx.createRadialGradient(px,py,0,px,py,r*3.1);
    g.addColorStop(0,`rgba(255,246,224,${.32*e})`);
    g.addColorStop(.3,`rgba(207,161,90,${.22*e})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*3.1,0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(255,250,238,${.46*e})`;ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(px-r*1.8,py);ctx.lineTo(px+r*1.8,py);
    ctx.moveTo(px,py-r*1.8);ctx.lineTo(px,py+r*1.8);ctx.stroke()}
   ctx.restore()}],
 ['bloom','Light bleed','ride',(ctx,sm,gw,gh,w,h,cell)=>{
   const d=sm.getContext('2d').getImageData(0,0,gw,gh).data;
   ctx.save();ctx.globalCompositeOperation='lighter';
   for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const i=(y*gw+x)*4,L=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
    if(L<.46)continue;
    const e=(L-.46)/.54,px=(x+.5)*cell,py=(y+.5)*cell,r=cell*(1.4+e*2.6);
    const g=ctx.createRadialGradient(px,py,0,px,py,r);

    g.addColorStop(1,'rgba(0,0,0,0)');

   ctx.restore()}],
 ['scan','Scanlines','ride',(ctx,sm,gw,gh,w,h,cell,t)=>{
   const gap=Math.max(2,Math.round(cell*.55));

   for(let y=0;y<h;y+=gap)ctx.fillRect(0,y,w,Math.max(1,gap*.42));
   ctx.restore();
   const by=((t*.22)%1.4-.2)*h;
   const g=ctx.createLinearGradient(0,by-h*.09,0,by+h*.09);
   g.addColorStop(0,'rgba(255,255,255,0)');
   g.addColorStop(.5,'rgba(207,161,90,.09)');g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.save();ctx.globalCompositeOperation='lighter';
   ctx.fillStyle=g;ctx.fillRect(0,by-h*.09,w,h*.18);ctx.restore()}],
 ['grain','Film grain','ride',(ctx,sm,gw,gh,w,h,cell,t)=>{
   ctx.save();ctx.globalAlpha=clamp(.07+cell*.011,0,.34);
   ctx.globalCompositeOperation='overlay';
   ctx.drawImage(GRAIN,(t*97)%256-256,(t*61)%256-256,w+512,h+512);ctx.restore()}],
];

/* ---------------- BUILD THE DECK ---------------- */
const CELL=9;
const DECK=[];
for(const [sid,sname,sdraw] of SUBJECTS)
 for(const [fid,fname,fmode,fapply] of FINISHES)
  DECK.push({id:sid+':'+fid,name:sname,finish:fname,draw:sdraw,mode:fmode,apply:fapply});
/* fixed shuffle so the order is mixed but the same every visit */
(function(){let s=20260807;
 for(let i=DECK.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;
  const j=s%(i+1);[DECK[i],DECK[j]]=[DECK[j],DECK[i]]}})();

/* ---------------- MARKS ---------------- */
const KEY='urth.gallery.marks.v1';
let MARKS={};
try{MARKS=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){MARKS={}}
const SAVE_URL='https://wadinxqplrggagkvrdag.supabase.co/functions/v1/mark';
let synced=0, syncFailed=0;
function setMark(item,v,label){
 MARKS[item]=v;
 try{localStorage.setItem(KEY,JSON.stringify(MARKS))}catch(e){}
 fetch(SAVE_URL+'?id='+encodeURIComponent(item)+'&v='+v+'&l='+encodeURIComponent(label),
  {cache:'no-store',keepalive:true})
  .then(r=>{if(r.ok)synced++;else syncFailed++})
  .catch(()=>{syncFailed++});
}

/* ---------------- RENDER ---------------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const buf=document.createElement('canvas'), bctx=buf.getContext('2d',{willReadFrequently:true});
const grid=document.createElement('canvas'); grid.getContext('2d',{willReadFrequently:true});
let W=0,H=0,idx=0,clk=0,last=performance.now(),order=DECK;

function fit(){const r=cv.getBoundingClientRect();
 const w=Math.round(r.width),h=Math.round(r.height);
 if(w<2||h<2)return false;
 if(w===W&&h===H)return true;
 W=w;H=h;cv.width=w*DPR;cv.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 buf.width=w;buf.height=h;return true}

function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;clk+=dt;
 if(fit()&&idx<order.length){
  const it=order[idx];
  bctx.setTransform(1,0,0,1,0,0);bctx.clearRect(0,0,W,H);
  try{it.draw(bctx,W,H,clk)}catch(e){}
  const gw=Math.max(1,Math.ceil(W/CELL)),gh=Math.max(1,Math.ceil(H/CELL));
  if(grid.width!==gw||grid.height!==gh){grid.width=gw;grid.height=gh}
  const gc=grid.getContext('2d');gc.imageSmoothingEnabled=true;
  gc.clearRect(0,0,gw,gh);gc.drawImage(buf,0,0,W,H,0,0,gw,gh);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(it.mode==='ride')ctx.drawImage(buf,0,0,W,H);
  try{it.apply(ctx,grid,gw,gh,W,H,CELL,clk)}catch(e){}
 }
 requestAnimationFrame(frame);
}

/* ---------------- UI ---------------- */
const pos=document.getElementById('pos'), tally=document.getElementById('tally'),
 bar=document.getElementById('bar'), capn=document.getElementById('capn'),
 capf=document.getElementById('capf'), stamp=document.getElementById('stamp'),
 end=document.getElementById('end');

function counts(){let y=0,n=0;
 for(const k in MARKS){if(MARKS[k]==='like')y++;else if(MARKS[k]==='no')n++}
 return{y,n}}

function show(){
 if(idx>=order.length){finish();return}
 end.classList.remove('on');
 const it=order[idx];
 capn.textContent=it.name; capf.textContent=it.finish.toUpperCase();
 pos.innerHTML='<b>'+(idx+1)+'</b> / '+order.length;
 const c=counts();
 tally.innerHTML='<span class="y">'+c.y+' liked</span> &nbsp; <span class="n">'+c.n+' not</span>';
 bar.style.width=((idx)/order.length*100)+'%';
 const m=MARKS[it.id];
 stamp.className='stamp'+(m?(' on '+(m==='like'?'like':'no')):'');
 stamp.textContent=m==='like'?'LIKED':(m==='no'?"DIDN'T LIKE":'');
}
function mark(v){
 if(idx>=order.length)return;
 const it=order[idx];
 setMark(it.id,v,it.name+' — '+it.finish);
 idx++; show();
}
function finish(){
 const c=counts();
 document.getElementById('endsum').innerHTML=
  '<b>'+c.y+' liked</b> &nbsp;·&nbsp; '+c.n+' not &nbsp;·&nbsp; '+DECK.length+' total';
 const ul=document.getElementById('likelist'); ul.innerHTML='';
 const liked=DECK.filter(d=>MARKS[d.id]==='like');
 if(!liked.length) ul.innerHTML='<li class="none">You have not marked anything as liked yet.</li>';
 else liked.forEach(d=>{const li=document.createElement('li');
  li.innerHTML=d.name+'<span>'+d.finish.toUpperCase()+'</span>';ul.appendChild(li)});
 document.getElementById('savednote').textContent=
  'Saved on this device and to your shortlist. '+synced+' marks stored'+
  (syncFailed?(', '+syncFailed+' still only on this device'):'')+'.';
 bar.style.width='100%';
 end.classList.add('on');
}
document.getElementById('yes').onclick=()=>mark('like');
document.getElementById('no').onclick=()=>mark('no');
document.getElementById('back').onclick=()=>{if(idx>0){idx--;show()}};
document.getElementById('again').onclick=()=>{order=DECK;idx=0;show()};
document.getElementById('onlyliked').onclick=()=>{
 const liked=DECK.filter(d=>MARKS[d.id]==='like');
 if(!liked.length)return;
 order=liked;idx=0;show()};

/* swipe: left = don't like, right = like */
let sx=0,sy=0,tracking=false;
const stage=document.getElementById('stage');
stage.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true},{passive:true});
stage.addEventListener('touchend',e=>{
 if(!tracking)return;tracking=false;
 const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
 if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.5) mark(dx>0?'like':'no');
},{passive:true});
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')mark('like');
 else if(e.key==='ArrowLeft')mark('no');
 else if(e.key==='Backspace'){e.preventDefault();if(idx>0){idx--;show()}}});

show();
requestAnimationFrame(()=>{fit();requestAnimationFrame(frame)});
addEventListener('resize',()=>{W=0;fit()});
})();
</script></body></html>
