<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · geiger wall</title>
<!-- ============================================================================
     SCINTILLA · GEIGER WALL — the geiger in ALL its states at once.
     CONSOLIDATION, NOT A NEW COMPONENT: every pane is the live /compare or
     /cohort route in an iframe. Nothing rebuilt; this file owns layout only.
       BAND 1 — ALL TICKERS RANKED EACH WAY: /compare?stat=median (robust),
         ?stat=mean (average-pull), ?sort=name (unranked reference).
       BAND 2 — THE SAME GEIGER PER COHORT: one /cohort tile per primary
         cohort, leaders first by median composite.

     ---- v2, 2026-08-06 night: MOBILE SAFARI FIX -------------------------------
     v1 opened 14 nested browsing contexts at once. On a 1920x1080 wall that is
     fine; on iPhone Safari it is not — each iframe is a whole document with its
     own JS heap, its own fetches and its own refresh timer, and WebKit kills
     the tab. Measured at iPhone viewport: 14 frames, 45 network requests on
     open. That was the crash, and it was weight, not a broken link.
     THE FIX — a hard phone guard, no nested pages until asked:
       · phone/tablet (or ?lite=1): NOTHING auto-loads. Every tile is a
         tap-to-load placeholder showing that cohort's numbers (counts +
         median) read straight from the data this page already fetched, so the
         wall is still readable with zero iframes.
       · at most LIVE_CAP panes may be open at once (2 on phone, 14 on
         desktop); opening one past the cap unloads the oldest — memory can
         never run away.
       · panes still stagger, and pane auto-refresh is OFF on phone.
       · ?panes=N caps the desktop wall too. ?lite=1 forces the light path
         anywhere; ?lite=0 forces the full wall (at your own risk on a phone).
     Params: ?cols=4 (2-6) · ?dense=1 · ?only=compare|cohort · ?lite=1|0 ·
       ?panes=N · ?refresh=0 (minutes; ignored on phone) · ?bg=0
     DB reads only, never FMP; geiger never recomputed.
     Receipts: HSC-GEIGERWALL-LIVE-001 (v1) · HSC-MOBILE-FIX-001 (v2).
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.02em;
  padding:10px 12px 26px; -webkit-text-size-adjust:100%; }
body.nobg{ background:transparent; }
#hd{ display:flex; align-items:baseline; gap:9px; margin-bottom:6px; flex-wrap:wrap; }
#hd .k{ color:var(--crk); font-size:9px; letter-spacing:.24em; text-transform:uppercase; }
#hd .s{ color:var(--dim); font-size:9px; }
#hd .st{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }
#mode{ font-size:8px; letter-spacing:.14em; text-transform:uppercase; padding:1px 7px; border:1px solid; }
#mode.lite{ color:var(--bull); border-color:rgba(0,255,163,.45); }
#mode.full{ color:var(--vol); border-color:rgba(255,138,0,.45); }
.bandhd{ display:flex; align-items:baseline; gap:9px; margin:12px 0 6px; border-bottom:1px solid var(--line); padding-bottom:5px; flex-wrap:wrap; }
.bandhd .t{ color:var(--crk); font-size:9px; letter-spacing:.22em; text-transform:uppercase; }
.bandhd .d{ color:var(--dim); font-size:9px; }
.grid{ display:grid; gap:8px; }
.cell{ border:1px solid var(--line); background:var(--panel2); display:flex; flex-direction:column; overflow:hidden; }
.cell.live{ border-color:var(--hair); }
.ch{ flex:none; display:flex; align-items:baseline; gap:7px; padding:4px 8px; border-bottom:1px solid var(--line);
  text-decoration:none; color:var(--ink2); }
.ch:hover .nm{ color:var(--crk); }
.ch .nm{ font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
.ch .rk{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
.cell iframe{ width:100%; border:0; display:block; background:transparent; }
.ph{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:14px 10px; cursor:pointer; text-align:center; }
.ph:hover{ background:rgba(0,212,255,.05); }
.ph .big{ font-weight:700; font-size:19px; font-variant-numeric:tabular-nums; }
.ph .sub{ color:var(--dim); font-size:8.5px; letter-spacing:.1em; }
.ph .tap{ color:var(--crk); font-size:8px; letter-spacing:.18em; text-transform:uppercase;
  border:1px solid var(--hair); padding:2px 9px; }
.up{ color:var(--bull); } .dn{ color:var(--bear); } .neu{ color:var(--ink3); }
.empty{ padding:20px; color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
#ft{ margin-top:18px; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; line-height:1.8; }
#ft a{ color:var(--dim); }
</style>
</head>
<body>
<div id="hd">
  <span class="k">GEIGER WALL</span>
  <span class="s">every ranking · all tickers, then per cohort · reusing /compare + /cohort</span>
  <span id="mode"></span>
  <span class="st" id="stamp"></span>
</div>
<div id="stage"><div class="empty">building wall…</div></div>
<div id="ft">
  consolidation, not a new component — every live pane is the /compare or /cohort route<br>
  composite_staged tf=D · the one geiger, never recomputed · ticker_cohorts is_primary · db reads only<br>
  <span id="ftmode"></span>
</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);

/* ---- THE PHONE GUARD (v2) ----
   Small screen OR coarse pointer OR iOS = light path. ?lite=1 forces it on,
   ?lite=0 forces the full wall anywhere. */
const COARSE = matchMedia("(hover: none), (pointer: coarse)").matches;
const SMALL  = Math.min(innerWidth, innerHeight) < 820;
const IOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const LITE   = QS.get("lite") === "1" ? true : QS.get("lite") === "0" ? false : (SMALL || (COARSE && IOS));

const COLS   = Math.max(2, Math.min(6, +(QS.get("cols") || (LITE ? 2 : 4))));
const DENSE  = QS.get("dense") === "1";
const ONLY   = ["compare", "cohort"].indexOf(QS.get("only")) >= 0 ? QS.get("only") : null;
const RELOAD = LITE ? 0 : Math.max(0, Math.min(240, +(QS.get("refresh") || 0))) * 60000;
const LIVE_CAP = Math.max(1, Math.min(20, +(QS.get("panes") || (LITE ? 2 : 14))));
if (QS.get("bg") === "0") document.body.classList.add("nobg");

el("mode").className = LITE ? "lite" : "full";
el("mode").textContent = LITE ? "light · tap to load" : "full wall";
el("ftmode").innerHTML = LITE
  ? 'light mode: nothing auto-loads, max ' + LIVE_CAP + ' live panes at once (opening more unloads the oldest) — this is the mobile-safari fix. force the full wall with <a href="?lite=0">?lite=0</a>.'
  : 'full wall: up to ' + LIVE_CAP + ' live panes. on a phone use <a href="?lite=1">?lite=1</a>.';

const paneArgs = "&bg=0" + (DENSE ? "&labels=0" : "");
const COMPARE_RANKINGS = [
  { nm: "ALL · ranked by MEDIAN", rk: "robust",       src: "/compare?stat=median&sort=value" },
  { nm: "ALL · ranked by MEAN",   rk: "average-pull", src: "/compare?stat=mean&sort=value" },
  { nm: "ALL · unranked (A→Z)",   rk: "reference",    src: "/compare?stat=median&sort=name" },
];
function median(arr){ const a = arr.slice().sort((x,y)=>x-y), n = a.length;
  return n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2; }
const fmt = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
const tone = (v) => (v > 0 ? "up" : v < 0 ? "dn" : "neu");

/* ---- live-pane budget: never more than LIVE_CAP nested documents alive ---- */
const LIVE = [];                      /* [{cell, frame, src, h}] oldest first */
function unload(entry) {
  const i = LIVE.indexOf(entry); if (i >= 0) LIVE.splice(i, 1);
  entry.frame.remove();
  entry.cell.classList.remove("live");
  entry.cell.appendChild(entry.makePlaceholder());
}
function loadPane(cell, src, h, makePlaceholder) {
  const ph = cell.querySelector(".ph"); if (ph) ph.remove();
  const f = document.createElement("iframe");
  f.style.height = h + "px"; f.loading = "lazy"; f.src = src;
  cell.appendChild(f); cell.classList.add("live");
  const entry = { cell, frame: f, src, h, makePlaceholder };
  LIVE.push(entry);
  while (LIVE.length > LIVE_CAP) unload(LIVE[0]);
}

function placeholder(stat, onTap) {
  const d = document.createElement("div");
  d.className = "ph";
  d.innerHTML = (stat.big != null ? '<div class="big ' + tone(stat.big) + '">' + fmt(stat.big) + "</div>" : "") +
    '<div class="sub">' + esc(stat.sub) + "</div>" +
    '<div class="tap">tap to load</div>';
  d.addEventListener("click", onTap);
  return d;
}

function cell(nm, rk, src, h, stat, autoload) {
  const d = document.createElement("div");
  d.className = "cell";
  const a = document.createElement("a");
  a.className = "ch"; a.href = src.replace("&bg=0", "").replace("&labels=0", ""); a.target = "_top";
  a.innerHTML = '<span class="nm">' + esc(nm) + '</span><span class="rk">' + esc(rk) + "</span>";
  d.appendChild(a);
  const mk = () => placeholder(stat, () => loadPane(d, src, h, mk));
  if (autoload) { const f = document.createElement("iframe"); f.style.height = h + "px"; f.loading = "lazy"; f.title = nm;
                  d.appendChild(f); QUEUE.push([d, f, src, h, mk]); }
  else d.appendChild(mk());
  return d;
}

const QUEUE = [];
function runQueue(stepMs) {
  let i = 0;
  const step = () => {
    if (i >= QUEUE.length) return;
    const [d, f, src, h, mk] = QUEUE[i++];
    f.src = src; d.classList.add("live");
    LIVE.push({ cell: d, frame: f, src, h, makePlaceholder: mk });
    while (LIVE.length > LIVE_CAP) unload(LIVE[0]);
    setTimeout(step, stepMs);
  };
  step();
}

async function build() {
  const stage = el("stage");
  const [tc, cs] = await Promise.all([
    pg("ticker_cohorts?is_primary=eq.true&select=ticker,cohort"),
    pg("composite_staged?tf=eq.D&select=ticker,composite"),
  ]);
  const comp = {};
  for (const r of (cs || [])) { const v = num(r.composite); if (v != null && isFinite(v)) comp[r.ticker] = v; }
  const by = {};
  for (const r of (tc || [])) { const v = comp[r.ticker]; if (v == null) continue; (by[r.cohort] = by[r.cohort] || []).push(v); }
  const cohorts = Object.keys(by).map((name) => {
    const c = by[name], g = c.filter((v) => v > 0).length, r = c.filter((v) => v < 0).length;
    return { name, n: c.length, g, r, med: median(c) };
  }).filter((c) => c.n).sort((a, b) => b.med - a.med);

  stage.innerHTML = ""; QUEUE.length = 0; LIVE.length = 0;
  let planned = 0;

  if (ONLY !== "cohort") {
    const h1 = document.createElement("div"); h1.className = "bandhd";
    h1.innerHTML = '<span class="t">Band 1 · all tickers, ranked each way</span>' +
      '<span class="d">same bars, three rankings — what leads depends on how you sort</span>';
    stage.appendChild(h1);
    const g1 = document.createElement("div"); g1.className = "grid";
    g1.style.gridTemplateColumns = "repeat(" + Math.min(3, COLS) + ", 1fr)";
    const allMed = cohorts.length ? median(cohorts.map((c) => c.med)) : null;
    for (const r of COMPARE_RANKINGS) {
      g1.appendChild(cell(r.nm, r.rk, r.src + paneArgs, 240,
        { big: allMed, sub: cohorts.length + " cohorts · " + Object.keys(comp).length + " tickers" }, !LITE));
      planned++;
    }
    stage.appendChild(g1);
  }

  if (ONLY !== "compare") {
    const h2 = document.createElement("div"); h2.className = "bandhd";
    h2.innerHTML = '<span class="t">Band 2 · the same geiger, per cohort</span>' +
      '<span class="d">' + cohorts.length + " primary cohorts · leaders first (median composite)" +
      (LITE ? " · numbers shown, tap any tile for the live bar" : " · each tile is /cohort") + "</span>";
    stage.appendChild(h2);
    if (!cohorts.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "no cohort data"; stage.appendChild(e);
    } else {
      const g2 = document.createElement("div"); g2.className = "grid";
      g2.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
      for (const c of cohorts) {
        const rk = c.g + "↑ " + c.r + "↓";
        g2.appendChild(cell(c.name.replace(/_/g, " "), rk,
          "/cohort?c=" + encodeURIComponent(c.name) + paneArgs, DENSE ? 130 : 190,
          { big: c.med, sub: c.n + " members · " + c.g + "↑ " + c.r + "↓" }, !LITE));
        planned++;
      }
      stage.appendChild(g2);
    }
  }

  el("stamp").textContent = (ONLY ? ONLY + " only · " : "") + planned + " tiles · " +
    (LITE ? "0 loaded (tap to load, cap " + LIVE_CAP + ")" : "loading up to " + LIVE_CAP);
  if (!LITE) runQueue(220);
}

build().catch(() => { el("stage").innerHTML = '<div class="empty">cohort data unavailable — wall cannot compose</div>'; });
if (RELOAD) setInterval(() => build().catch(() => {}), RELOAD);
</script>
</body>
</html>
