<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>SCINTILLA · X pane · TEST REPLAY</title>
<!-- STATION TESTING TWIN: local static replay only; no production runtime or external authority. -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --vol:#FF8A00; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-btn-size:8px; --ipad-btn-pad-y:3px; --ipad-btn-pad-x:7px; --ipad-icon-size:24px; --ipad-icon-height:20px;
}
*{ box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; display:flex; flex-direction:column;
  overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
#bar{ position:relative; flex:none; display:flex; align-items:center; gap:4px; padding:4px 34px 4px 6px;
  padding-top:calc(4px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  background:var(--panel2); overflow-x:auto; scrollbar-width:none; }
#bar::-webkit-scrollbar{ display:none; }
.k{ flex:none; color:var(--crk); font-size:7.5px; letter-spacing:.18em; text-transform:uppercase; }
.btn{ flex:none; font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink3); cursor:pointer;
  text-decoration:none; white-space:nowrap; }
.btn:hover{ color:var(--ink); border-color:var(--hair); }
.btn.on{ color:var(--crk); border-color:var(--crk); }
.btn.go{ color:var(--crk); border-color:var(--crk); }
.btn.out{ color:var(--vol); border-color:rgba(255,138,0,.35); }
.btn.icon{ width:24px; height:20px; padding:3px; align-items:center; justify-content:center;
  appearance:none; font:inherit; line-height:1; }
.btn.icon svg{ width:12px; height:12px; display:block; fill:none; stroke:currentColor;
  stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
input[type=range]{ flex:none; width:64px; accent-color:var(--crk); }
.lbl{ flex:none; color:var(--mute); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; }

#body{ flex:1 1 0; min-height:0; position:relative; background:#000; overflow:hidden; }
#v{ position:absolute; top:50%; left:50%; transform-origin:center center; display:none;
  max-width:none; background:#000; }
#cv{ position:absolute; inset:0; width:100%; height:100%; display:none; background:#000; }
body.live #v{ display:block; }
body.live #card, body.xfloat #card{ display:none; }
body.xfloat #cv{ display:block; }
.btn.xf{ color:var(--bull); border-color:rgba(0,255,163,.42); }
.btn.xf.on{ background:rgba(0,255,163,.10); }
.btn.pair{ color:var(--crk); border-color:rgba(0,212,255,.55); }
#pairInfo{ position:absolute; z-index:5; inset:auto 8px 8px 8px; display:none; padding:8px;
  border:1px solid rgba(0,212,255,.45); background:rgba(10,10,15,.96); color:var(--ink2);
  font-size:8px; line-height:1.55; box-shadow:0 8px 24px rgba(0,0,0,.45); }
#pairInfo b{ color:var(--crk); font-weight:500; } #pairLink{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink3); }

#card{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:9px; text-align:center; padding:14px; background:var(--bg); }
#card .n{ color:var(--ink2); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
#card .d{ color:var(--mute); font-size:8.5px; line-height:1.65; max-width:330px; }
#card .d b{ color:var(--ink3); font-weight:400; }
#card .go{ color:var(--crk); font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--crk); padding:6px 14px; cursor:pointer; }
#card .go:hover{ background:rgba(0,212,255,.08); }
#card .alt{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
#err{ color:var(--bear); font-size:8.5px; line-height:1.5; max-width:330px; display:none; }
/* small slots: the prose would eat the box */
body.tiny #card .d{ display:none; }
#bFull{ position:absolute; z-index:3; right:5px; top:calc(4px + env(safe-area-inset-top));
  margin:0; background:var(--panel2); box-shadow:-7px 0 8px var(--panel2); }
html[data-view="desk"] .btn{ font-size:9px; padding:4px 8px; }
html[data-view="desk"] .btn.icon{ width:28px; height:23px; padding:4px; }
html[data-view="ipad"] .btn{ font-size:var(--ipad-btn-size); padding:var(--ipad-btn-pad-y) var(--ipad-btn-pad-x); }
html[data-view="ipad"] .btn.icon{ width:var(--ipad-icon-size); height:var(--ipad-icon-height); padding:var(--ipad-btn-pad-y); }
html[data-view="compact"] .btn{ font-size:7px; padding:2px 5px; }
html[data-view="compact"] .btn.icon{ width:22px; height:18px; padding:2px; }
body.test-replay #bar{ padding-right:38px; }
body.test-replay #xfState{ display:inline; color:var(--vol); font-size:7.5px; letter-spacing:.1em; }
body.test-replay #testReplayBadge{ position:absolute; z-index:4; top:10px; left:10px; display:flex; flex-direction:column;
  gap:3px; padding:7px 9px; border:1px solid rgba(255,138,0,.72); background:rgba(0,0,0,.86);
  pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.42); }
body.test-replay #testReplayBadge b{ color:var(--vol); font-size:10px; letter-spacing:.18em; }
body.test-replay #testReplayBadge span{ color:var(--ink3); font-size:7px; letter-spacing:.08em; }
body.test-replay #testReplayTelemetry{ position:absolute; z-index:4; left:8px; right:8px; bottom:8px; display:grid;
  grid-template-columns:auto auto; gap:4px 12px; padding:7px 9px; border:1px solid rgba(0,212,255,.42);
  background:rgba(0,0,0,.88); color:var(--ink3); font-size:7.5px; letter-spacing:.05em; pointer-events:none; }
body.test-replay #testReplayTelemetry span:nth-child(even){ text-align:right; }
body.test-replay #testReplayTelemetry b{ grid-column:1/-1; color:var(--vol); letter-spacing:.14em; }
body.test-replay #testReplayTelemetry b.pass{ color:var(--bull); }
body.test-replay #testReplayTelemetry b.check{ color:var(--vol); }
body.test-replay #bXList.on,body.test-replay #bXNotify.on{ color:var(--bull); border-color:var(--bull); background:rgba(0,255,163,.1); }

</style>
</head>
<body>
<div id="bar">
  <span class="k">X · XFLOAT</span>
  <span id="xfState" hidden>waiting</span>
  <button class="btn icon" id="bXList" type="button" style="display:none" title="Trading list" aria-label="Show trading list">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4h8M5 8h8M5 12h8"/><path d="M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg>
  </button>
  <button class="btn icon" id="bXNotify" type="button" style="display:none" title="Notifications" aria-label="Show notifications">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 11.5h9l-1.1-1.7V7a3.4 3.4 0 0 0-6.8 0v2.8z"/><path d="M6.6 13.2a1.6 1.6 0 0 0 2.8 0"/></svg>
  </button>
  <span class="btn" id="bXBack" style="display:none">−30s</span>
  <span class="btn" id="bXRefresh" style="display:none">refresh</span>
  <span class="btn go" id="bStart" style="display:none">browser picker</span>
  <span class="btn" id="bStop" style="display:none">stop</span>
  <button class="btn pair" id="bPair" type="button" style="display:none">pair iPad</button>
  <span class="btn" id="bPip" style="display:none" title="float this in its own always-on-top window">pip</span>
  <span class="lbl" id="lz" style="display:none">zoom</span>
  <input type="range" id="z" min="100" max="400" value="150" style="display:none">
  <span class="lbl" id="lx" style="display:none">pan</span>
  <input type="range" id="px" min="-50" max="50" value="0" style="display:none">
  <span class="btn" id="bFull" title="expand this pane">⛶</span>
</div>

<div id="body">
  <video id="v" autoplay muted playsinline></video>
  <canvas id="cv"></canvas>
  <div id="card">
    <div class="n">TEST REPLAY IS LOADING</div>
    <div class="d">The Station testing twin uses one local, read-only fixture. No live X source or transport is available.</div>
    <div id="err"></div>
  </div>
</div>
<div id="pairInfo" hidden><span id="pairState">waiting for iPad</span><span id="pairLink"></span></div>

<script src="./pane-x-presentation-core.js"></script>
<script src="./fixtures/x-crop-motion.js"></script>
<script src="./pane-x-test-replay.js"></script>
</body>
</html>
