    <text x="78" y="84" class="copy">Three things for the next hour:</text><text x="92" y="116" class="copy">1. Respect the range.</text><text x="92" y="146" class="copy">2. Let breadth confirm.</text><text x="92" y="176" class="copy">3. Avoid chasing the first extension.</text>
