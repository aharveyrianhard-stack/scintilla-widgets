<!-- ============================================================================
     SCINTILLA WIDGET · COHORT GEIGER — standalone scene module (stage-1 extraction)

     geigerSummaryHTML + gs* builders + buildGeigerSummary ported VERBATIM (the

     Williams and moving averages are resolved by /_provider/provider.js. The indicator
     values are raw FMP daily rows; unsupported intraday indicators and MACD stay unavailable.
     Params: ?t=MU (pin) · ?auto=1 (rotate hub_favorites) · ?dwell=10 (s/ticker)
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A;
  --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --coin:#8B5CF6;
  --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --trend:#2D9CFF; --momentum:#A24BFF; --structure:#FFD400; --volume:#FF8A00; --volatility:#FF3DBE;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:12px; letter-spacing:.02em;
  display:flex; flex-direction:column; overflow:hidden; }
/* widget ident bar — thin, hub-toned (plumbing chrome only) */
.sc-whead{ flex:none; display:flex; align-items:baseline; gap:12px; padding:7px 12px 6px;
  border-bottom:.8px solid var(--hair); background:var(--panel2); }
.sc-whead .wt{ color:var(--crk); font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
.sc-whead .tk{ color:var(--ink); font-size:13px; font-weight:600; letter-spacing:.06em; }
.sc-whead .px{ color:var(--ink2); font-size:11px; font-variant-numeric:tabular-nums; }
.sc-whead .px .up{ color:var(--bull); } .sc-whead .px .dn{ color:var(--bear); }
.sc-whead .auto{ margin-left:auto; color:var(--dim); font-size:8.5px; letter-spacing:.18em; text-transform:uppercase; }
.sc-whead .auto b{ color:var(--crk); font-weight:400; }
#coRailContent{ flex:1 1 auto; min-height:0; }

/* ============================================================================
   GEIGER SUMMARY (gsum) — ported verbatim from scintilla-hub (scoped under .gsum)
   ============================================================================ */
.gsum{
  --gs-bg:#0A0A0F; --gs-bg2:#08080C; --gs-ink:#E8E8F0; --gs-ink2:#A6AAC4; --gs-dim:#5A5C76;
  --gs-line:rgba(0,212,255,.14); --gs-crk:#00D4FF; --gs-bull:#00FFA3; --gs-bear:#FF2D55;
  --gs-neut:#C9CEE0; --gs-ma:#9FB0CC; --gs-trend:#2D9CFF; --gs-mom:#A24BFF;
  --gs-struc:#FFD400; --gs-vol:#FF8A00;
  --gs-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --gt-title:8px;
  --gt-label:7px;
  --gt-value:11px;
  --gt-big:19px;
  display:block; height:100%; min-height:0; color:var(--gs-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
.gsum *{ box-sizing:border-box; }
.gsum .gs-body{ height:100%; display:grid; grid-template-columns:38% 62%;
  grid-template-rows:1fr 1fr; min-height:0; }
.gsum .gs-zh{ display:flex; align-items:center; gap:7px; }
.gsum .gs-zh .gs-d{ width:6px; height:6px; border-radius:50%; }
.gsum .gs-zh h2{ font-family:var(--gs-mono); font-size:var(--gt-title); letter-spacing:.2em;
  text-transform:uppercase; font-weight:400; margin:0; }
.gsum .gs-zG{ grid-column:1; grid-row:1; padding:9px 12px; min-height:0; display:flex; flex-direction:column;
  overflow:hidden; align-items:center; border-right:1px solid var(--gs-line); border-bottom:1px solid var(--gs-line); }
.gsum .gs-comp{ text-align:center; }
.gsum .gs-comp .gs-lab{ font-family:var(--gs-mono); font-size:calc(var(--gt-title) + .5px); letter-spacing:.22em;
  color:var(--gs-dim); text-transform:uppercase; }
.gsum .gs-comp .gs-cgr{ height:9px; border-radius:2px; background:#15151d; position:relative; overflow:hidden;
  width:94%; max-width:220px; margin:8px auto 0; }
.gsum .gs-comp .gs-cgr::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--gs-dim); z-index:2; }
.gsum .gs-comp .gs-cgr i{ position:absolute; top:0; bottom:0; border-radius:2px; }
.gsum .gs-comp .gs-big{ font-family:var(--gs-mono); font-size:var(--gt-big); line-height:1.15;
  display:block; margin-top:5px; }
.gsum .gs-comp .gs-st{ font-family:var(--gs-mono); font-size:var(--gt-title); letter-spacing:.2em;
  color:var(--gs-ink2); text-transform:uppercase; margin-top:2px; }
.gsum .gs-meterwrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
.gsum .gs-flegend{ display:flex; justify-content:center; gap:18px; padding-top:3px; }
.gsum .gs-fl{ text-align:center; }
.gsum .gs-fl .gs-k{ font-family:var(--gs-mono); font-size:var(--gt-label); letter-spacing:.12em; text-transform:uppercase; }
.gsum .gs-fl .gs-v{ font-family:var(--gs-mono); font-size:var(--gt-value); display:block; margin-top:3px; }
.gsum .gs-asof{ font-family:var(--gs-mono); font-size:calc(var(--gt-label) - 1px); color:var(--gs-dim);
  letter-spacing:.06em; white-space:nowrap; overflow-x:auto; padding-top:5px; text-align:center; scrollbar-width:none; }
.gsum .gs-asof::-webkit-scrollbar{ display:none; }
.gsum .gs-zT{ grid-column:1; grid-row:2; padding:9px 12px; min-height:0; display:flex; flex-direction:column;
  overflow:hidden; border-right:1px solid var(--gs-line); }
.gsum .gs-tv{ flex:1; position:relative; min-height:0; margin-top:3px; }
.gsum .gs-tv svg{ position:absolute; inset:0; width:100%; height:100%; }
.gsum .gs-zI{ grid-column:2; grid-row:1 / span 2; display:grid; grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; gap:1px; background:var(--gs-line); padding:0; min-height:0; }
.gsum .gs-ip{ background:var(--gs-bg2); padding:9px 11px; display:flex; flex-direction:column;
  min-height:0; overflow:hidden; }
.gsum .gs-ih{ font-family:var(--gs-mono); font-size:var(--gt-title); letter-spacing:.18em; text-transform:uppercase; }
.gsum .gs-sub{ font-family:var(--gs-mono); font-size:calc(var(--gt-label) - .5px); letter-spacing:.14em;
  color:var(--gs-dim); text-transform:uppercase; margin-top:2px; }
.gsum .gs-mtf{ flex:1; display:flex; flex-direction:column; margin-top:4px; min-height:0; }
.gsum .gs-mhd{ position:relative; height:9px; margin:0 20px 2px 26px; flex:none; }
.gsum .gs-mhd span{ position:absolute; transform:translateX(-50%); font-family:var(--gs-mono);
  font-size:calc(var(--gt-label) - .5px); color:var(--gs-dim); }
.gsum .gs-mrow{ display:grid; grid-template-columns:24px 1fr 22px; align-items:center; gap:9px; flex:1; min-height:0; }
.gsum .gs-mrow.gs-day{ flex:1.35; position:relative; }
.gsum .gs-mrow.gs-day::before{ content:""; position:absolute; top:50%; left:-6px; right:-6px; transform:translateY(-50%); height:20px; border:1.3px dashed var(--gs-mom); border-radius:6px; pointer-events:none; }
.gsum .gs-mrow .gs-tf{ font-family:var(--gs-mono); font-size:var(--gt-label); color:var(--gs-ink2); text-transform:uppercase; }
.gsum .gs-mrow.gs-day .gs-tf{ color:var(--gs-mom); font-size:9px; font-weight:600; }
.gsum .gs-mbar{ position:relative; height:5px; border-radius:3px; background:#15151d; }
.gsum .gs-mrow.gs-day .gs-mbar{ height:7px; }
.gsum .gs-mbar .gs-zt{ position:absolute; top:-1px; bottom:-1px; width:1px; background:rgba(255,255,255,.13); }
.gsum .gs-mbar .gs-mfill{ position:absolute; left:0; top:0; bottom:0; border-radius:3px; opacity:.26; }
.gsum .gs-mbar .gs-mth{ position:absolute; top:50%; width:7px; height:7px; border-radius:50%; transform:translate(-50%,-50%); }
.gsum .gs-mrow.gs-day .gs-mbar .gs-mth{ width:10px; height:10px; }
.gsum .gs-mrow .gs-mv{ font-family:var(--gs-mono); font-size:calc(var(--gt-value) - 3px); text-align:right; font-variant-numeric:tabular-nums; }
.gsum .gs-mrow.gs-day .gs-mv{ font-size:var(--gt-value); }
.gsum .gs-hist{ flex:1; position:relative; margin-top:3px; }
.gsum .gs-hist svg{ position:absolute; inset:0; width:100%; height:100%; }
.gsum .gs-histfoot{ font-family:var(--gs-mono); font-size:var(--gt-label); color:var(--gs-dim); margin-top:2px;
  display:flex; justify-content:space-between; }
.gsum .gs-volp{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; }
.gsum .gs-vgauge{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; width:100%; }
.gsum .gs-vgauge svg{ height:100%; max-height:150px; width:auto; }
.gsum .gs-vgc{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.gsum .gs-vgc .gs-state{ font-family:var(--gs-mono); font-size:calc(var(--gt-value) + 4px); font-weight:500; letter-spacing:.02em; white-space:nowrap; }
.gsum .gs-vgc .gs-vl{ font-family:var(--gs-mono); font-size:var(--gt-label); letter-spacing:.24em; color:var(--gs-dim); text-transform:uppercase; margin-top:4px; }
.gsum .gs-vmeta{ display:flex; flex-direction:column; align-items:center; gap:1px; font-family:var(--gs-mono); font-size:calc(var(--gt-value) - 1.5px); color:var(--gs-vol); margin-top:6px; text-align:center; }
.gsum .gs-vmeta .gs-vsub{ font-size:calc(var(--gt-value) - 3px); color:var(--gs-dim); letter-spacing:.02em; }
.gsum .gs-empty{ font-family:var(--gs-mono); font-size:10px; letter-spacing:.1em; color:var(--gs-dim);
  text-transform:uppercase; padding:24px; text-align:center; }
/* R44 — GEIGER TILE RESTACK (≤900px, ported verbatim) */
@media (max-width:900px){
  .gsum .gs-body{
    display:flex; flex-direction:column; height:auto; min-height:0;
    grid-template-columns:none; grid-template-rows:none;
  }
  .gsum{ overflow-y:auto; }
  .gsum .gs-zG, .gsum .gs-zT{
    grid-column:auto; grid-row:auto; border-right:none;
    border-bottom:1px solid var(--gs-line);
  }
  .gsum .gs-zG{ min-height:250px; }
  .gsum .gs-zT{ min-height:200px; }
  .gsum .gs-zI{
    grid-column:auto; grid-row:auto;
    display:flex; flex-direction:column; gap:1px; background:var(--gs-line);
  }
  .gsum .gs-ip{ min-height:190px; }
}
</style>

<div class="sc-whead">
  <span class="wt">GEIGER</span>
  <span class="tk" id="whTk">—</span>

  <span class="auto" id="whAuto"></span>

<script src="/_provider/provider.js"></script>
<script>
/* EXPLICIT PROVIDER CLIENT — bind the page's narrow Supabase reader once.
   Market surfaces below call SC_PROVIDER by product result; pg remains non-market only. */
try { scBindProviderClient(); } catch (_) {}

"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
function lsGet(k) { try { return localStorage.getItem(k); } catch (err) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (err) {} }
const CACHE_MAX_AGE = 24 * 60 * 60 * 1000;
function cacheGet(k, staleOk) {
  try {
    const raw = lsGet(k);
    if (!raw) return null;
    const env = JSON.parse(raw);
    if (!env || typeof env.ts !== "number") return null;
    if (staleOk === false && (Date.now() - env.ts) > CACHE_MAX_AGE) return null;
    return env;
  } catch (err) { return null; }
}
function cacheSet(k, payload) {
  try { lsSet(k, JSON.stringify(Object.assign({ ts: Date.now() }, payload))); } catch (err) {}
}
const CB = { "BTC-USD":"BTCUSD", "ETH-USD":"ETHUSD", "SOL-USD":"SOLUSD", "XRP-USD":"XRPUSD",
             "DOGE-USD":"DOGEUSD", "ADA-USD":"ADAUSD", "AVAX-USD":"AVAXUSD",
             "LINK-USD":"LINKUSD", "LTC-USD":"LTCUSD" };
const cryptoSet = new Set(Object.values(CB));
const chFmpSym = (t) => (cryptoSet.has(t) && !t.endsWith("USD") ? t + "USD" : t);

/* ---- hub state stubs the verbatim geiger code reads ---- */
let PRICES = {};
let LEFT_T = null;
const S = { coTab: "GEIGER", coData: null, focusT: null };
const GEIGER_MEM = {};

/* ---- widget params ---- */
const QS = new URLSearchParams(location.search);
const PIN_T  = (QS.get("t") || "").toUpperCase().trim() || null;
const AUTO   = QS.get("auto") === "1" || (!PIN_T && QS.get("auto") !== "0");   // no pin → rotate favorites
const DWELL  = Math.max(4, Math.min(120, +(QS.get("dwell") || 10))) * 1000;    // hub AUTO dwell = 10 s

/* ============================================================================
   GEIGER SUMMARY — data + markup + builders ported VERBATIM from scintilla-hub
   ============================================================================ */
const GS_LADDER = ["1m","3m","5m","10m","15m","30m","1h","2h","3h","4h","6h","12h","1D","3D","1W","2W","1M"];
function gsNormTf(k){ const m={ "1d":"1D","3d":"3D","1w":"1W","2w":"2W" }; const s=String(k||""); return m[s.toLowerCase()] || s; }

async function geigerSummaryData(t) {
  const enc = encodeURIComponent(t);
  const dailyCandles = SC_PROVIDER.equityCandles(t, "D", { limit:30 }).catch(() => []);
  const [comp, der, ser, vol, last, ow, bvol] = await Promise.all([
    SC_PROVIDER.equityGeiger([t], { detail:true }).catch(() => []),
    (async () => {
      const rows = await SC_PROVIDER.dailyIndicators([t]).catch(() => []);
      return rows.map((r) => ({
        tf:"1D", rsi_raw:r.rsi14, wpr_raw:r.williams14,
        fan_ema5:r.ema5, fan_ema8:r.ema8, fan_ema13:r.ema13,
        fan_ema21:r.ema21, fan_ema34:r.ema34,
        fan_sma50:r.sma50, fan_sma100:r.sma100, fan_sma150:r.sma150, fan_sma200:r.sma200,
        source_date:r.source_date, session_state:r.session_state, updated_ts:r.fetched_at
      }));
    })(),
    Promise.resolve([]),
    dailyCandles,
    dailyCandles,
    pg("operator_weights?dim=eq.timeframe&select=key,weight,enabled").catch(() => []),
    pg("board_volume?ticker=eq." + enc + "&select=rvol_at_time,cum_rvol,updated_ts&order=updated_ts.desc&limit=1").catch(() => []),
  ]);

  const c = (comp && comp[0]) || {};
  const derRows = der || [];
  const d1 = derRows.find((r) => String(r.tf) === "1D") || derRows.find((r) => String(r.tf) === "D") || derRows[0] || {};
  const maDefs = [["EMA 5","fan_ema5"],["EMA 8","fan_ema8"],["EMA 13","fan_ema13"],["EMA 21","fan_ema21"],
                  ["EMA 34","fan_ema34"],["SMA 50","fan_sma50"],["SMA 100","fan_sma100"],["SMA 150","fan_sma150"],["SMA 200","fan_sma200"]];
  const mas = maDefs.map(([n, k]) => ({ n, v: num(d1[k]) })).filter((m) => m.v != null && isFinite(m.v));

  const byTf = {}; for (const r of derRows) byTf[String(r.tf)] = r;
  const rsiMtf = [], wprMtf = [];
  for (const tf of GS_LADDER) {
    const r = byTf[tf]; if (!r) continue;
    const rv = num(r.rsi_raw); if (rv != null && isFinite(rv)) rsiMtf.push([tf, rv]);
    const wv = num(r.wpr_raw); if (wv != null && isFinite(wv)) wprMtf.push([tf, wv]);
  }

  const macd = (ser || []).map((r) => num(r.macd_signed)).filter((v) => v != null && isFinite(v)).reverse();

  const volRows = (vol || []).map((r) => num(r.volume)).filter((v) => v != null && isFinite(v));
  const volSeries = volRows.slice().reverse();
  let rvol = null;
  if (volRows.length) {
    const win = volRows.slice(0, 20);
    const avg = win.reduce((a, b) => a + b, 0) / (win.length || 1);
    if (avg > 0) rvol = volRows[0] / avg;
  }

  let activeTfs = [];
  for (const w of (ow || [])) {
    const wt = num(w.weight);
    if (w.enabled !== false && wt != null && wt > 0) activeTfs.push(gsNormTf(w.key));
  }
  if (!activeTfs.length) activeTfs = GS_LADDER.slice();

  const ohlcvClose = (last && last[0] && num(last[0].close)) != null ? num(last[0].close)
                   : (d1 && d1.price != null ? num(d1.price) : null);
  const livePx = (typeof PRICES !== "undefined" && PRICES[t] != null) ? num(PRICES[t]) : null;
  return {
    t,
    composite: num(c.composite), trend: num(c.trend), momentum: num(c.momentum),
    structure: num(c.structure), conviction: num(c.conviction), updated_ts: c.updated_ts || null,
    geigerRungs: c.rungs || {},
    indicatorSourceDate: d1.source_date || null, indicatorSessionState: d1.session_state || null,
    indicatorFetchedAt: d1.updated_ts || null,
    price: livePx != null ? livePx : ohlcvClose,
    mas, rsiMtf, wprMtf, macd, volSeries, rvol, activeTfs,
    rvolAtTime: (bvol && bvol[0] && num(bvol[0].rvol_at_time) != null) ? num(bvol[0].rvol_at_time) : null,
    cumRvol: (bvol && bvol[0] && num(bvol[0].cum_rvol) != null) ? num(bvol[0].cum_rvol) : null,
  };
}

function geigerSummaryHTML() {
  return '<div class="gsum"><div class="gs-body">' +
    '<div class="gs-zG">' +
      '<div class="gs-comp"><span class="gs-lab">Geiger Composite</span>' +
        '<div class="gs-cgr" data-gs="cgr"></div>' +
        '<span class="gs-big" data-gs="comp"></span><span class="gs-st" data-gs="compst"></span></div>' +
      '<div class="gs-meterwrap">' +
        '<svg width="100%" height="100%" viewBox="0 0 340 240" preserveAspectRatio="xMidYMid meet" fill="none" style="max-height:150px">' +
          '<path d="M53.09,267.50 A135,135,0,1,1,286.91,267.50" stroke="rgba(255,255,255,.06)" stroke-width="10" stroke-linecap="round"/>' +
          '<path d="M76.47,254.00 A108,108,0,1,1,263.53,254.00" stroke="rgba(255,255,255,.06)" stroke-width="10" stroke-linecap="round"/>' +
          '<path d="M99.85,240.50 A81,81,0,1,1,240.15,240.50" stroke="rgba(255,255,255,.06)" stroke-width="10" stroke-linecap="round"/>' +
          '<path data-gs="f_trend" d="M53.09,267.50 A135,135,0,1,1,286.91,267.50" pathLength="100" stroke="var(--gs-trend)" stroke-width="10" stroke-linecap="round" style="filter:drop-shadow(0 0 5px var(--gs-trend))"/>' +
          '<path data-gs="f_mom" d="M76.47,254.00 A108,108,0,1,1,263.53,254.00" pathLength="100" stroke="var(--gs-mom)" stroke-width="10" stroke-linecap="round" style="filter:drop-shadow(0 0 5px var(--gs-mom))"/>' +
          '<path data-gs="f_struc" d="M99.85,240.50 A81,81,0,1,1,240.15,240.50" pathLength="100" stroke="var(--gs-struc)" stroke-width="10" stroke-linecap="round" style="filter:drop-shadow(0 0 5px var(--gs-struc))"/>' +
        '</svg>' +
      '</div>' +

// ── GEIGER MOTION ────────────────────────────────────────────────────────────
// THE RULE, from the approved reference at /visuals/geiger-motion:
//   Same measure, new numbers  -> the order stays continuous, so it ANIMATES.
//   A different measure        -> continuity would be a lie, so it CUTS.
// Animating a discontinuity implies a relationship that does not exist.
//
// Implemented as a FLIP: remember where each named rung sat, draw the new
// layout, then start each rung from its OLD position and let it travel to the
// new one. Nothing is faked - the final frame is exactly what would have been
// drawn without any animation at all.
const GS_TREND_PREV = new Map();   // rung name -> last y, per measure
let   GS_TREND_KEY  = null;        // which measure the remembered positions belong to

function gsTrendMotion(node, svg){
  const key = node.getAttribute("data-gs-key") || "";
  const groups = svg.querySelectorAll("g[data-gn]");
  const now = new Map();
  groups.forEach((g) => {
    const line = g.querySelector("line");
    if (line) now.set(g.getAttribute("data-gn"), parseFloat(line.getAttribute("y1")));
  });

  // A NEW MEASURE CUTS. No transition, no ghost of an order that no longer applies.
  if (key !== GS_TREND_KEY){
    GS_TREND_KEY = key;
    GS_TREND_PREV.clear();
    now.forEach((y, n) => GS_TREND_PREV.set(n, y));
    return;
  }

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    now.forEach((y, n) => GS_TREND_PREV.set(n, y));
    return;

    g.style.transform  = "translateY(" + dy + "px)";

        g.style.transition = "transform 620ms cubic-bezier(.22,.61,.36,1)";

let GS_BOUND = false;
function buildGeigerSummary(d) {
  const root = document.querySelector("#coRailContent .gsum");
  if (!root || !d) return;
  const q = (k) => root.querySelector('[data-gs="' + k + '"]');
  const setf = (k, s) => { const n = q(k); if (n != null && s != null) n.setAttribute("stroke-dasharray", Math.max(2, Math.min(100, (s+1)/2*100)) + " 100"); };

  if (d.trend != null) setf("f_trend", d.trend);
  if (d.momentum != null) setf("f_mom", d.momentum);
  if (d.structure != null) setf("f_struc", d.structure);
  const C = q("comp"), CS = q("compst");
  if (C){ if (d.composite != null){ C.textContent = gsSgn(d.composite); C.style.color = gsTone(d.composite); C.style.filter = "drop-shadow(0 0 9px " + gsTone(d.composite) + ")"; } else C.textContent = "—"; }
  if (CS) CS.textContent = d.composite == null ? "" : (Math.abs(d.composite) < 0.10 ? "neutral" : (d.composite > 0 ? "bull lean" : "bear lean"));
  const CGR = q("cgr");
  if (CGR){ if (d.composite != null){ const w = Math.min(Math.abs(d.composite), 1) * 50, cc = d.composite >= 0 ? "var(--gs-bull)" : "var(--gs-bear)";
      CGR.innerHTML = '<i style="' + (d.composite >= 0 ? "left" : "right") + ":50%;width:" + w + "%;background:" + cc + ";box-shadow:0 0 7px " + cc + '"></i>'; } else CGR.innerHTML = ""; }
  const lt = q("lt"), lm = q("lm"), lsr = q("lsr");
  if (lt) lt.textContent = d.trend == null ? "—" : gsSgn(d.trend);
  if (lm) lm.textContent = d.momentum == null ? "—" : gsSgn(d.momentum);
  if (lsr) lsr.textContent = d.structure == null ? "RSI → MOM" : gsSgn(d.structure);

  /* The Geiger uses eight provider-bar rungs. `newest` is the completed bar's exact period-start
     timestamp, not the artifact compute clock; show every rung so one stale daily input cannot hide
     behind a fresh composite timestamp. A named absence stays visibly ABSENT. */
  const ra = q("rungasof");
  if (ra) {
    const rr = Object.values(d.geigerRungs || {});
    ra.textContent = rr.length ? "BAR AS-OF · " + rr.map((r) => {
      const lab = String(r.tf_token || "?").toUpperCase();
      return lab + " " + (r.availability === "ABSENT" ? "ABSENT" : String(r.newest || "UNKNOWN").replace("T", " ").replace(/:00\.000Z$/, "Z"));
    }).join(" · ") : "BAR AS-OF · unavailable";
  }
  const indStamp = [d.indicatorSourceDate, d.indicatorSessionState].filter(Boolean).join(" · ");
  const rsub = q("rsisub"), wsub = q("wprsub");
  if (rsub) rsub.textContent = "raw FMP provider" + (indStamp ? " · " + indStamp : " · as-of unavailable");
  if (wsub) wsub.textContent = "raw FMP provider" + (indStamp ? " · " + indStamp : " · as-of unavailable");

  const active = new Set(d.activeTfs && d.activeTfs.length ? d.activeTfs : GS_LADDER);
  const rsiRows = (d.rsiMtf || []).filter(([tf]) => active.has(tf));
  const wprRows = (d.wprMtf || []).filter(([tf]) => active.has(tf));
  gsMtf(q("rsitable"), rsiRows, { mn:0, mx:100, lo:30, hi:70, loL:"30", hiL:"70" }, gsTipR, (v) => Math.round(v));
  gsMtf(q("wprtable"), wprRows, { mn:-100, mx:0, lo:-80, hi:-20, loL:"−80", hiL:"−20" }, gsTipW, (v) => Math.round(v));

  const mn = q("macdnow");
  if (mn){ if (d.macd && d.macd.length){ const last = d.macd[d.macd.length-1]; mn.textContent = "now " + Math.round(last) + (last < 0 ? " · bearish" : " · bullish"); } else mn.textContent = ""; }

  const draw = () => {
    gsTrend(q("tv"), d.price, d.mas);
    gsMacdHist(q("macd"), d.macd);
    gsVolume(q("vol"), d);
  };
  requestAnimationFrame(draw);
  if (!GS_BOUND){ GS_BOUND = true; window.addEventListener("resize", () => {
    if (S.coTab === "GEIGER" && S.coData && S.coData.t === LEFT_T) requestAnimationFrame(() => buildGeigerSummary(S.coData._gsum || null)); }); }
}

  } catch (err) { console.error("geigerSummary " + t, err); }
}

/* ---- boot: pin or rotate hub_favorites (hub FAV seed as fallback) ---- */
let ROT = ["MU", "NBIS", "SNDK"], ROT_I = 0;
async function boot() {
  if (PIN_T) {
    el("whAuto").textContent = "pinned";
    mountGeiger(PIN_T);
    setInterval(() => mountGeiger(PIN_T), 60000);   // pinned refresh, 60 s
    return;
  }
  try {
    const rows = await pg("hub_favorites?select=ticker");
    const favs = Array.isArray(rows) ? rows.map((r) => String(r.ticker).toUpperCase()).filter(Boolean) : [];
    if (favs.length) ROT = favs;
  } catch (_) {}
  el("whAuto").innerHTML = "<b>AUTO</b> · " + ROT.length + " fav · " + Math.round(DWELL/1000) + "s";
  mountGeiger(ROT[0]);
  setInterval(() => { ROT_I = (ROT_I + 1) % ROT.length; mountGeiger(ROT[ROT_I]); }, DWELL);
}
boot();
</script>
