# AeroSpace — iMac (Sprint B). Pair of the MacBook Pro config (Sprint A).
#
# Installed path on the iMac:  ~/.config/aerospace/aerospace.toml
# Helper scripts:              ~/.config/aerospace/bin/
# Edit this file, then press  ⌥ ⇧ R   (or run:  aerospace reload-config)
#
# What this config decides, and what it does not:
#   • three EMPTY workspaces, contents undecided:  alan-personal · ai-sandbox · vault-background
#   • sizing is MANUAL ONLY (big / half / park). There is no [[on-window-detected]] rule,
#     so a new window is never demoted or moved on its own.
#   • "alt" below is the Option (⌥) key.

start-at-login = true            # AeroSpace registers itself as a login item

after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Small gaps so a parked (narrow) window still shows its own title bar clearly.
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# Let the helper scripts find `aerospace` whether Homebrew is Apple-silicon or Intel.
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/usr/local/bin:${PATH}'

[mode.main.binding]

# ── Workspaces ────────────────────────────────────────────────────────────────
alt-1 = 'workspace alan-personal'
alt-2 = 'workspace ai-sandbox'
alt-3 = 'workspace vault-background'
alt-tab = 'workspace-back-and-forth'

# Send the focused window to a workspace and follow it there.
alt-shift-1 = ['move-node-to-workspace alan-personal',     'workspace alan-personal']
alt-shift-2 = ['move-node-to-workspace ai-sandbox',        'workspace ai-sandbox']
alt-shift-3 = ['move-node-to-workspace vault-background',  'workspace vault-background']

# ── Set the table ─────────────────────────────────────────────────────────────
# Makes sure all three workspaces exist (still empty) and lands on alan-personal.
alt-t = 'exec-and-forget ~/.config/aerospace/bin/set-the-table.sh'

# ── Kickoff sizing (manual) ───────────────────────────────────────────────────
alt-b = 'exec-and-forget ~/.config/aerospace/bin/size.sh big'    # fill the screen
alt-h = 'exec-and-forget ~/.config/aerospace/bin/size.sh half'   # half the screen width
alt-p = 'exec-and-forget ~/.config/aerospace/bin/size.sh park'   # narrow, title still readable

# ── Readable titles when small ────────────────────────────────────────────────
# Pops a plain list "App — window title" for every window on this workspace.
alt-l = 'exec-and-forget ~/.config/aerospace/bin/show-titles.sh'

# ── Focus / move (arrow keys) ─────────────────────────────────────────────────
alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'

alt-shift-left  = 'move left'
alt-shift-down  = 'move down'
alt-shift-up    = 'move up'
alt-shift-right = 'move right'

# ── Layout ────────────────────────────────────────────────────────────────────
alt-f     = 'layout floating tiling'             # toggle: float this window / tile it again
alt-slash = 'layout tiles horizontal vertical'   # side-by-side  ⇄  stacked
alt-comma = 'layout accordion horizontal vertical'
alt-equal = 'balance-sizes'                      # give every tiled window an equal share

# ── Housekeeping ──────────────────────────────────────────────────────────────
alt-shift-r = 'reload-config'
alt-shift-p = 'exec-and-forget ~/.config/aerospace/bin/preflight.sh --dialog'
