<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · chart</title>
<!-- ============================================================================
     SCINTILLA WIDGET · CHART — standalone scene module (stage-1 extraction)
     Extracted from scintilla-hub index.html (SC_BUILD 2026-07-16T0330, repo main
     aafbc9b): scChart R18 native canvas renderer — scChartHTML/Draw/Load/Scrub/
     Wire, explicit provider-native fetchChartSeries, cache-first chart layer,
     range ladder, and in-app TradingView modal. Completed provider bars are
     immutable. The narrow Supabase Realtime lane is retained only for verified
     non-equity symbols and refuses equities or unknown ownership. The hub's R20 touch-guard overlay is dropped (a dedicated chart window
     has no page scroll to trap — the one intentional trim, flagged here).
     Chrome addition (plumbing only): a ticker field in the range bar, since the
     widget has no cohort board to click. PRICE BASIS: provider-built completed
     candles and provider quotes for equities; retained-owner ticks for non-equities.
     Params: ?t=MU · ?range=1D (15m 30m 1h 2h 3h 4h 6h 12h 1D 3D 1W)
       · ?steps=1 (cloud ribbon drawn stepped; the default is smoothed for the eye, labels exact)
       · ?bare=1 (pane mode — see the BARE note in the script)
       · ?tvrange=1D|5D|1M|3M|6M|YTD|12M|60M|ALL (TradingView opening window)
     LOOK rides the Visuals sprint — plumbing only, hub tokens as-is.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A;
  --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --coin:#8B5CF6;
  --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ipad-live-top:6px; --ipad-live-left:7px; --ipad-live-gap:6px;
  --ipad-live-pad-y:4px; --ipad-live-pad-x:6px; --ipad-live-size:14px;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
body{ background:var(--bg); color:var(--ink3); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:12px; letter-spacing:.02em; overflow:hidden;
  -webkit-text-size-adjust:100%; text-size-adjust:100%; }
#chartSlot{ position:absolute; inset:0; overflow:hidden; overscroll-behavior:none; }

/* SCINTILLA · scChart — ported verbatim */
.sc-nchart{ position:absolute; inset:0; display:flex; flex-direction:column;
  min-width:0; overflow:hidden; }
.sc-nchart__bar{ flex:none; display:flex; align-items:center; gap:4px;
  padding:6px 10px 4px; min-width:0; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.sc-nchart__bar::-webkit-scrollbar{ display:none; }
.sc-crange{ flex:none; background:none; border:.6px solid var(--line2); border-radius:3px;
  cursor:pointer; font-family:var(--mono); font-size:8.5px; letter-spacing:.08em;
  color:var(--dim); padding:3px 7px; white-space:nowrap; }
.sc-crange:hover{ color:var(--ink3); }
.sc-crange.on{ color:var(--crk); border-color:rgba(0,212,255,.45);
  box-shadow:inset 0 -2px 0 var(--crk); }
.sc-nchart__bar .sc-tv__pop{ position:static; margin-left:auto; flex:none; }
.sc-nchart__area{ position:relative; flex:1 1 0; min-height:0; min-width:0; overflow:hidden;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; }
.sc-nchart__area *{ -webkit-user-select:none; user-select:none; -webkit-user-drag:none; }
.sc-nchart__cv{ position:absolute; inset:0; width:100%; height:100%; display:block;
  touch-action:none; overscroll-behavior:none; cursor:crosshair; }
.sc-nchart__cv.is-panning{ cursor:grabbing; }
.sc-nchart__live{ position:absolute; top:7px; left:8px; z-index:3; pointer-events:auto;
  display:flex; flex-direction:row; align-items:baseline; gap:8px; max-width:calc(100% - 52px);
  background:rgba(5,6,12,.76); border:.6px solid rgba(151,166,198,.2); border-radius:4px;
  padding:5px 7px; color:var(--dim); white-space:nowrap; box-sizing:border-box;
  font:700 clamp(12px,1.65vw,16px) var(--mono); letter-spacing:.01em; line-height:1;
  box-shadow:0 2px 10px rgba(0,0,0,.38); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.sc-nchart__live:hover{ filter:brightness(1.18); }
.sc-nchart__live-ticker{ appearance:none; border:0; background:transparent; color:inherit; padding:0;
  font:inherit; letter-spacing:inherit; line-height:inherit; cursor:text; text-decoration:underline;
  text-decoration-color:rgba(134,138,170,.55); text-underline-offset:3px; }
.sc-nchart__live-change{ font:700 .86em var(--mono); letter-spacing:.02em; line-height:1; }
.sc-nchart__live-prev{ color:var(--ink3); font:600 .58em var(--mono); letter-spacing:.025em; line-height:1; }
/* The companion reading UNDER a put/call pane. The badge is a nowrap flex row, so the companion
   claims a full row of its own (flex-basis 100%) and is allowed to wrap inside it -- at 390 it
   was otherwise painted straight over the Cboe number and cut off at the edge (proof, 24 Sep). */
.sc-nchart__live--pc{ flex-wrap:wrap; white-space:normal; row-gap:3px; max-width:calc(100% - 20px); }
.sc-nchart__live-companion{ flex:1 0 100%; color:var(--ink3); font:600 11px var(--mono);
  letter-spacing:.02em; line-height:1.3; white-space:normal; overflow-wrap:anywhere; }
.sc-nchart__live-companion[data-state="waiting"]{ color:var(--ink3); opacity:.9; }
.sc-nchart__live-companion[data-change="up"]{ color:var(--bull); }
.sc-nchart__live-companion[data-change="down"]{ color:var(--bear); }
/* THE TWO PARTS (M56, 24 Sep). Alan: "puts traded and calls traded side by side would be pretty,
   pretty great. Which moved would be pretty great." A ratio hides which of its two inputs moved:
   0.46 can rise because puts were bought or because calls were sold. So the pane draws both
   amounts as bars against the larger of the two, and says in one line which side moved. Each bar
   takes the same up / down colour every other reading takes (Alan, 23 Sep); the track is grey. */
.sc-nchart__live-parts{ flex:1 0 100%; display:grid; grid-template-columns:auto 1fr auto; gap:2px 6px;
  align-items:center; margin-top:2px;
  /* The badge is as wide as its widest line; at 1680 that let two bars stretch a thousand pixels
     across the chart. A readout, not a second chart: the bars keep a fixed comfortable width and
     the phone width (390) simply uses all it has. */
  max-width:min(100%, 340px); }
.sc-nchart__live-parts[data-state="waiting"]{ display:block; color:var(--ink3); font:600 11px var(--mono);
  letter-spacing:.02em; line-height:1.3; white-space:normal; overflow-wrap:anywhere; }
.sc-nchart__pcp-label{ color:var(--ink3); font:700 11px var(--mono); letter-spacing:.04em; }
.sc-nchart__pcp-track{ height:7px; background:rgba(176,176,176,.16); border-radius:1px; overflow:hidden; }
.sc-nchart__pcp-fill{ height:100%; width:0; background:var(--dim); display:block; }
.sc-nchart__pcp-fill[data-change="up"]{ background:var(--bull); }
.sc-nchart__pcp-fill[data-change="down"]{ background:var(--bear); }
.sc-nchart__pcp-val{ color:var(--ink3); font:700 11px var(--mono); letter-spacing:.02em; white-space:nowrap; }
.sc-nchart__pcp-move{ grid-column:1 / -1; color:var(--ink3); font:600 11px var(--mono);
  letter-spacing:.02em; line-height:1.3; white-space:normal; overflow-wrap:anywhere; }
/* THE PUT/CALL TABLE (24 Sep, Alan: "think how TradingView does tables"). Pinned top-right inside the
   plot, clear of the price scale; numbers only, 10px mono, one hairline border, no bars. */
.sc-nchart__pctable{ position:absolute; top:7px; right:58px; z-index:3; display:grid;
  grid-template-columns:auto auto auto; gap:0 7px; padding:2px 5px; pointer-events:auto;
  background:rgba(5,6,12,.55); border:0; border-radius:2px;
  font:600 9px var(--mono); letter-spacing:.02em; line-height:1.3; color:var(--ink3); }
.sc-nchart__pctable[data-state="waiting"]{ display:block; opacity:.8; }
.sc-pct__h{ color:var(--dim); font-weight:700; text-align:right; }
.sc-pct__k{ color:var(--dim); font-weight:700; }
.sc-pct__v{ text-align:right; font-variant-numeric:tabular-nums; }
.sc-pct__v[data-change="up"]{ color:var(--bull); }
.sc-pct__v[data-change="down"]{ color:var(--bear); }
.sc-pct__f{ grid-column:1 / -1; color:var(--dim); }
@media (max-width:520px){ .sc-nchart__pctable{ top:auto; bottom:22px; right:46px; } }
.sc-nchart__live--pc .sc-nchart__live-companion{ flex:0 1 auto; max-width:300px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-size:10px; }
/* A line that only says "waiting" is not worth a row of chart: it lives in the badge's tooltip until
   the Scintilla line actually exists. */
.sc-nchart__live--pc .sc-nchart__live-companion[data-state="waiting"]{ display:none; }
.sc-nchart__live-window{ color:var(--dim); font:600 .58em var(--mono); letter-spacing:.025em; line-height:1; }
/* THE REFERENCE TEXT STEPS BACK, THE PRICE AND THE LINE LEAD. "Prev 762.60 ≈41 trading days · since Jul 23" sat at full
   strength in a shadowed box over the top-left of every chart (Alan, live review 2026-09-18: the badges compete with the
   chart). Same words, same place, same size - only quieter; pointing at the badge or focusing the ticker brings them back. */
.sc-nchart__live{ background:rgba(5,6,12,.6); border-color:rgba(151,166,198,.12); box-shadow:none; }
.sc-nchart__live-prev, .sc-nchart__live-window{ opacity:.72; transition:opacity .12s ease; }
.sc-nchart__live:hover .sc-nchart__live-prev, .sc-nchart__live:hover .sc-nchart__live-window,
.sc-nchart__live:focus-within .sc-nchart__live-prev, .sc-nchart__live:focus-within .sc-nchart__live-window{ opacity:1; }
.sc-nchart__live[data-change="up"]{ color:var(--bull); }
.sc-nchart__live[data-change="down"]{ color:var(--bear); }
.sc-nchart__live[data-change="flat"]{ color:var(--dim); }
.sc-nchart__live[data-fresh="0"]{ opacity:.72; }
/* A quote whose observation time the provider did not supply is neither fresh nor stale.
   It is marked so it cannot be read as either. */
.sc-nchart__live[data-untimed="1"]{ border-bottom:1px dotted rgba(134,138,170,.7); }
.sc-nchart__msg{ position:absolute; inset:0; z-index:2; display:flex; align-items:center;
  justify-content:center; color:var(--dim); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
.sc-nchart__msg[hidden]{ display:none; }
/* THE RIBBON'S ONE-LINE CAPTION, AND ITS SWITCH. "smoothed for the eye · labels exact · 400 daily bars ·
   60 warm-up not drawn": what the curve is, what it is not, and how much history built it, stated on the
   pane instead of hidden in a tooltip (Alan, 22 Sep). Click it and the ribbon is drawn stepped, one level
   per session, exactly as before; click again to smooth. Dim ink, never white. */
.sc-nchart__cap{ position:absolute; left:8px; bottom:24px; z-index:3; appearance:none; border:0; border-radius:3px;
  background:rgba(5,6,12,.62); color:var(--dim); font:600 7.5px var(--mono); letter-spacing:.06em; line-height:1;
  padding:3px 6px; cursor:pointer; white-space:nowrap; opacity:.85; }
.sc-nchart__cap:hover{ opacity:1; color:var(--ink3); }
.sc-nchart__cap[hidden]{ display:none; }
.sc-tv__pop{ z-index:3;
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--mono); font-size:8px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--crk); text-decoration:none;
  background:none; border:0; padding:0; cursor:pointer;
  filter:drop-shadow(0 0 4px rgba(0,212,255,.4)); }
.sc-tv__pop:hover{ filter:drop-shadow(0 0 7px rgba(0,212,255,.8)); }
.sc-tv__pop-lbl{ white-space:nowrap; }
@media (max-width:640px){ .sc-tv__pop-lbl{ display:none; } }

/* widget ticker field (chrome addition — no cohort board in a standalone window) */
.sc-ctkin{ flex:none; width:74px; background:var(--panel2); border:.6px solid var(--line2); border-radius:3px;
  color:var(--ink3); font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 7px; outline:none; text-align:center; }
.sc-ctkin:focus{ border-color:rgba(0,212,255,.45); color:var(--crk); }
/* bare mode — the Station owns ticker and timeframe. Hide the duplicated
   chart bar so the actual chart gets the full pane; standalone /chart keeps it. */
html.bare .sc-nchart__bar{ display:none; }
html[data-view="desk"] .sc-nchart__live{ font-size:18px; }
html[data-view="ipad"] .sc-nchart__live{ top:var(--ipad-live-top); left:var(--ipad-live-left); gap:var(--ipad-live-gap); padding:var(--ipad-live-pad-y) var(--ipad-live-pad-x); font-size:var(--ipad-live-size); max-width:calc(100% - 44px); }
html[data-view="compact"] .sc-nchart__live{ font-size:11px; }

/* FIX 5 — IN-APP TradingView modal — ported verbatim */
body.tvmodal-open{ overflow:hidden; }
.sc-tvmodal{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  padding:24px; box-sizing:border-box; }
.sc-tvmodal__backdrop{ position:absolute; inset:0; background:rgba(4,4,10,.78);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); cursor:pointer; }
.sc-tvmodal__panel{ position:relative; z-index:1; width:min(1180px,94vw); height:min(760px,88vh);
  display:flex; flex-direction:column; background:var(--panel2);
  border:.8px solid var(--hair); border-radius:0; overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,212,255,.08); }
.sc-tvmodal__bar{ flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:9px 12px; border-bottom:.8px solid var(--line2); background:var(--panel); }
.sc-tvmodal__ttl{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--crk); text-shadow:0 0 7px rgba(0,212,255,.5); }
.sc-tvmodal__out{ margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  color:var(--ink3); text-decoration:none; border:.5px solid var(--line2); border-radius:3px; padding:2px 8px; }
.sc-tvmodal__out:hover{ color:var(--crk); border-color:rgba(0,212,255,.4); }
.sc-tvmodal__x{ flex:0 0 auto; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center;
  background:none; border:.5px solid var(--line2); border-radius:4px; color:var(--ink3);
  font-size:13px; line-height:1; cursor:pointer; }
.sc-tvmodal__x:hover{ color:var(--crk); border-color:var(--crk); background:rgba(0,212,255,.08); }
.sc-tvmodal__body{ position:relative; flex:1 1 auto; min-height:0; background:var(--bg); }
.sc-tvmodal__load{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.06em; }
.sc-tvmodal__frame{ position:relative; z-index:1; width:100%; height:100%; border:0; display:block; background:var(--bg); }
.sc-tvmodal__fallback{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:11px; text-align:center; padding:24px; }
.sc-tvmodal__fallback .ttl{ font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--ink3); }
.sc-tvmodal__fallback .sub{ font-size:11px; color:var(--ink3); line-height:1.5; max-width:360px; }
.sc-tvmodal__fallback .btn{ margin-top:4px; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--crk); text-decoration:none; border:.8px solid rgba(0,212,255,.45); border-radius:5px;
  padding:8px 18px; background:linear-gradient(180deg,rgba(0,212,255,.10),rgba(0,212,255,.02)); }
.sc-tvmodal__fallback .btn:hover{ background:rgba(0,212,255,.16); border-color:var(--crk); }
@media (max-width:640px){ .sc-tvmodal{ padding:10px; } .sc-tvmodal__panel{ width:100vw; height:92vh; border-radius:0; } }

/* Pane text after Alan's 22 Sep review: ticker, price, change. Reference close and window dates
   are hover text. A range change keeps the old line dimmed instead of a blank pane. Internals
   without a retained series show TradingView's free chart, labelled as such. */
.sc-nchart__live-prev, .sc-nchart__live-window{ display:none; }
.sc-nchart[data-holding="1"] .sc-nchart__cv{ opacity:.42; transition:opacity .12s ease; }
.sc-tvinternal{ position:absolute; inset:0; z-index:4; background:var(--bg); }
/* The frame sits ABOVE the waiting line (z 2 over z 1) and starts transparent: while TradingView has
   painted nothing, the line shows through; the moment their page paints, it is covered. It can no
   longer sit on top of a chart that has drawn (Alan, 23 Sep: the faint "TRADINGVIEW · DRAWING"
   caption over internals that were already there). */
.sc-tvinternal__frame{ position:relative; z-index:2; width:100%; height:100%; border:0; display:block; background:transparent; }
/* Small and dim: a label, not a paragraph. It sits top-left because TradingView
   puts its own mark bottom-left and the two must not collide. */
.sc-tvinternal__cap{ position:absolute; left:6px; top:4px; z-index:3;
  font:600 10px var(--mono); color:var(--ink3); opacity:.9; letter-spacing:.05em;
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  /* stop short of TradingView's price axis on the right — at 260px wide the two
     otherwise sit on top of each other */
  max-width:calc(100% - 74px); padding:1px 4px; border-radius:2px;
  background:rgba(10,10,15,.66); pointer-events:none; }
/* Held UNDER the frame while TradingView is still drawing: seen only through a frame that has not
   painted yet, and tidied away for good shortly after the frame loads. */
.sc-tvinternal__wait{ position:absolute; inset:0; z-index:1; display:flex; align-items:center;
  justify-content:center; font:600 9px var(--mono); color:var(--dim);
  opacity:.72; letter-spacing:.1em; text-transform:uppercase; pointer-events:none;
  transition:opacity .7s ease; }
.sc-tvinternal__wait.out{ opacity:0; }
/* A symbol TradingView will not draw says so in words. Never an empty black box. */
.sc-tvinternal__miss{ position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:7px; padding:20px 16px; text-align:center; }
.sc-tvinternal__miss .ttl{ font:700 10px var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink3); }
.sc-tvinternal__miss .sub{ font:500 9px var(--mono); line-height:1.55; color:var(--dim);
  letter-spacing:.01em; max-width:34em; }
.sc-tvinternal__miss .lnk{ font:600 8.5px var(--mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink3); text-decoration:none; border:.6px solid var(--line2); border-radius:3px; padding:3px 9px; }
.sc-tvinternal__miss .lnk:hover{ color:var(--dim); border-color:var(--mute); }
.sc-nchart--tv .sc-nchart__live, .sc-nchart--tv .sc-nchart__msg{ display:none; }
</style>
</head>
<body>
<div id="chartSlot"></div>
<script src="/_provider/provider.js"></script>
<!-- The cloud ribbon's arithmetic and geometry, ported from the Indicator Lab's
     approved Cloud Workshop. Pure functions: it reads no data and draws nothing. -->
<script src="/_indicators/station-clouds.js"></script>
<script>
/* ONE SOURCE (2026-09-22). This page holds no Supabase client, no anon key and no realtime
   channel. Every price, candle and previous close comes from the chart API through SC_PROVIDER;
   a symbol the chart API does not carry is painted as a NAMED absence, never a stale line. */
try { scBindProviderClient(); } catch (_) {}

"use strict";
/* THE PULL LAYER IS GONE. The direct Supabase price path (SB, ANON, pg, the "lq" realtime
   channel) was the second data path that let the VIX pane draw a line frozen on 2026-08-14 under
   a live badge. Retired 2026-09-22. The realtime state is stated as retired so the deck reads true. */
window.SC_REALTIME = { available: false, channel: "retired",
  reason: "realtime tick channel retired 2026-09-22 — every price on this pane comes from the chart API" };
const num = (x) => (x == null ? null : Number(x));
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
const el = (id) => document.getElementById(id);
const todayISO = () => new Date().toISOString().slice(0, 10);
function lsGet(k) { try { return localStorage.getItem(k); } catch (err) { return null; } }
/* in bare mode we never write — see the BARE note below. Two same-origin
   chart frames sharing one localStorage key is the whole timeframe bug. */
let BARE = false;   /* set from ?bare=1 a few lines down */
function lsSet(k, v) { if (BARE) return; try { localStorage.setItem(k, v); } catch (err) {} }
const CACHE_MAX_AGE = 24 * 60 * 60 * 1000;
function cacheGet(k, staleOk) {
  try {
    const raw = lsGet(k);
    if (!raw) return null;
    const env = JSON.parse(raw);
    if (!env || typeof env.ts !== "number") return null;
    if (staleOk === false && (Date.now() - env.ts) > CACHE_MAX_AGE) return null;
    return env;
  } catch (err) { return null; }
}
function cacheSet(k, payload) {
  /* Bare Station panes must not persist selected ticker/range, but their
     ticker-and-range keyed data cache is safe to share and lets a fresh
     Station window draw before a slow database refresh returns. */
  try { localStorage.setItem(k, JSON.stringify(Object.assign({ ts: Date.now() }, payload))); } catch (err) {}
}

/* ---- crypto map + TV symbols — ported verbatim ---- */
const CB = { "BTC-USD":"BTCUSD", "ETH-USD":"ETHUSD", "SOL-USD":"SOLUSD", "XRP-USD":"XRPUSD",
             "DOGE-USD":"DOGEUSD", "ADA-USD":"ADAUSD", "AVAX-USD":"AVAXUSD",
             "LINK-USD":"LINKUSD", "LTC-USD":"LTCUSD" };
const cryptoSet = new Set(Object.values(CB));
const futureSet = new Set(["ESUSD","NQUSD","CLUSD","GCUSD","SIUSD","DXUSD"]);
const TV_MAP = { BTC: "COINBASE:BTCUSD", ETH: "COINBASE:ETHUSD", SOL: "COINBASE:SOLUSD",
  BTCUSD: "COINBASE:BTCUSD", ETHUSD: "COINBASE:ETHUSD", SOLUSD: "COINBASE:SOLUSD",

function chartView(host, pts) {
  const last = Math.max(1, pts.length - 1);
  let view = host._view;
  if (!view || !isFinite(view.start) || !isFinite(view.end)) {
    view = { start:0, end:last };
    host._followLatest = true;
  }
  let span = Math.max(8, Math.min(last, Math.round(view.end - view.start)));
  let start = Math.round(view.start), end = start + span;
  if (start < 0) { end -= start; start = 0; }
  if (end > last) { start -= end - last; end = last; }
  host._view = { start:Math.max(0, start), end:Math.min(last, end) };
  return host._view;
}

function broadcastChartView(host) {
  if (!BARE || window.parent === window || host._broadcastQueued) return;

  requestAnimationFrame(() => {
    host._broadcastQueued = false;
    const pts = host._series, view = host._view;
    if (!pts || !view || !pts[view.start] || !pts[view.end]) return;
    try {
      parent.postMessage({ sc:"chart-view", ticker:host.dataset.t,
        from:pts[view.start].d, to:pts[view.end].d,
        followLatest:host._followLatest !== false }, location.origin);
    } catch (_) {}

function setChartView(host, start, end, followLatest, notify) {
  const pts = host._series;
  if (!pts || pts.length < 2) return;
  const last = pts.length - 1;
  let span = Math.max(8, Math.min(last, Math.round(end - start)));
  start = Math.round(start); end = start + span;
  if (start < 0) { end -= start; start = 0; }
  if (end > last) { start -= end - last; end = last; }
  host._view = { start:Math.max(0, start), end:Math.min(last, end) };

function chartIndexAt(pts, iso, after) {
  const target = new Date(iso).getTime();
  if (!Number.isFinite(target) || !pts.length) return after ? 0 : Math.max(0, pts.length - 1);
  let lo = 0, hi = pts.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (new Date(pts[mid].d).getTime() < target) lo = mid + 1; else hi = mid;
  }
  if (after) return Math.min(pts.length - 1, lo);
  return Math.max(0, Math.min(pts.length - 1, lo < pts.length && pts[lo].d === iso ? lo : lo - 1));

function scChartDraw(host, scrub) {

     nobody sent — a baseline that MOVES with the range control, so the same prices painted
     green at one range and red at another with no market event between them. The badge

  if (!last) return null;
  for (let i = pts.length - 2; i >= 0 && i >= pts.length - 400; i--) {
    if (etDay(pts[i].d) !== last) { const v = +pts[i].p; return Number.isFinite(v) && v !== 0 ? v : null; }
  }
  return null;
}
function chDayRef(host) {
  const t = host && host.dataset ? host.dataset.t : null;
  const v = prevClose[t];
  if (v != null && Number.isFinite(+v) && +v !== 0) return +v;
  const s = chSeriesPrevClose(host);
  if (s != null && t) prevClose[t] = s;   /* the badge and the live marker read the same baseline */
  return s;
}

/* The price the DAY is judged by: the live quote when one has arrived, otherwise the newest bar of the
   series - never the visible edge, so panning into history cannot recolour today. */
function chDayPrice(host, pts) {
  const live = quotePrice(liveQuote[host && host.dataset ? host.dataset.t : ""]);
  if (live != null) return live;
  const last = Array.isArray(pts) && pts.length ? +pts[pts.length - 1].p : NaN;
  return Number.isFinite(last) ? last : null;
}

function chDayChange(price, previousClose) {
  if (!Number.isFinite(+price) || !Number.isFinite(+previousClose) || +previousClose === 0)
    return { text:"—", tone:"flat" };
  const pct = ((+price - +previousClose) / +previousClose) * 100;
  /* No grey band (Alan: "Daily up, daily down, green, red"). A move too small to print still has a
     direction, and the text says 0.00% while the sign and colour say which way; exactly unchanged is
     at-or-above yesterday, the same rule the line has always used. Only an unknown baseline is
     unclaimed ("—"). */
  const tone = +price >= +previousClose ? "up" : "down";
  if (Math.abs(pct) < .005) return { text:"0.00%", tone };
  return { text:pct > 0 ? pct.toFixed(2) + "%" : "(" + Math.abs(pct).toFixed(2) + "%)", tone };
}

function paintLiveStatus(host, quote) {
  const badge = host?.querySelector(".sc-nchart__live");
  if (!badge) return;
  /* A published daily ratio has no quote and never will; it is painted from the
     session values themselves, which is why this returns before the live path. */
  if (scPutCallPane(host?.dataset?.t)) { paintPutCallStatus(host); return; }
  const hasQuote = quotePrice(quote) != null;
  const observedAt = quoteInstant(quote);
  const at = observedAt == null ? null : new Date(observedAt);
  const age = observedAt == null ? null : Date.now() - observedAt;
  /* Freshness is a claim about time. With no observation time there is no claim to make, so
     the badge is not fresh - and it is not stale either; it simply says the time is unknown. */
  const fresh = age != null && age < 90000;
  badge.dataset.fresh = hasQuote && fresh ? "1" : "0";
  badge.dataset.untimed = hasQuote && observedAt == null ? "1" : "0";
  const dayRef = chDayRef(host);   /* the line's own baseline, so badge and line cannot disagree */
  const day = hasQuote ? chDayChange(quotePrice(quote), dayRef) : { text:"", tone:"flat" };
  badge.dataset.change = day.tone;
  const parts = ensureLiveParts(badge, host);
  const ticker = parts.ticker, change = parts.change, previous = parts.previous, historyWindow = parts.historyWindow;
  ticker.textContent = host.dataset.t;
  /* Alan, 22 Sep: "ticker, dollar value price, percentage change difference" - nothing else. */
  const signedPct = day.tone === "up" ? "+" + day.text : day.tone === "down" ? "\u2212" + day.text.replace(/[()]/g, "") : day.text;
  change.textContent = hasQuote ? chPx(quotePrice(quote), host.dataset.t) + "  " + signedPct : "";
  /* "Prev" named a relationship, not a day. The reference close belongs to a specific session, so
     the label names that session when the plotted series can identify it, and otherwise says
     plainly that it is the last close rather than inventing a date. */
  previous.textContent = dayRef != null && Number.isFinite(+dayRef) && +dayRef !== 0
    ? chartReferenceCloseLabel(host) + " " + chPx(+dayRef, host.dataset.t) : "";
  const quoteAsOf = hasQuote && age != null && age > CHART_STALE_MS ? "quote as of " + chartStartDate(at.toISOString()) : "";
  if (quoteAsOf) previous.textContent = [previous.textContent, quoteAsOf].filter(Boolean).join(" · ");
  paintChartHistoryWindow(host);
  badge.title = !hasQuote
    ? "live quote loading · ticker remains editable"
    : at == null
      ? "observation time unknown · the provider supplied no observation time for this quote"
      : (futureSet.has(host.dataset.t) ? "delayed futures quote · " : "provider quote · ") + at.toISOString();
  /* The reference close and the window dates moved out of the pane into the hover text. */
  badge.title += [previous.textContent, historyWindow.textContent].filter(Boolean).map((x) => "\n" + x).join("");
  reportChartDataState(host, { quote:hasQuote ? "ready" : "loading" });
  if (!hasQuote) return;
  try {
    /* updatedTs travels as null when it is unknown. The deck's header already refuses to fold
       an unstamped row into an age; handing it a clock reading here would defeat that. */
    parent.postMessage({ sc:"chart-status", ticker:host.dataset.t,
      updatedTs:at == null ? null : at.toISOString(),
      fresh, delayed:futureSet.has(host.dataset.t), source:"provider" }, location.origin);
  } catch (_) {}
}

/* Previous regular-session close is the day reference for every timeframe.
   The visible window controls geometry only; it must not change red/green. */
async function pullPrevClose(t) {
  if (DECK_QUOTE_MODE) { requestDeckQuote(t); return; }
  try {
    const rows = await SC_PROVIDER.marketQuotes([t]);
    if (Array.isArray(rows) && rows[0]) {
      if (rows[0].prev_close != null) prevClose[t] = +rows[0].prev_close;
      if (rows[0].price != null) scChartLive(t, +rows[0].price, rows[0].updated_ts);
    } else {
      /* The read returned without this row. Settled ONLY if something named it - a PostgREST
         result cannot say "this symbol does not exist", it just omits it. An unnamed omission
         stays in the retrying lane. */
      const named = chartNamedAbsenceFor(t);
      for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
        reportChartDataState(host, named ? { quote:"absent", quoteAbsence:named } : { quote:"delayed" });
    }
  } catch (err) {
    if (isNamedAbsence(err)) {
      const named = err.scAbsence;
      for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
        reportChartDataState(host, { quote:"absent", quoteAbsence:named });
      return;
    }
    for (const host of CHART_HOSTS) if (host.isConnected && host.dataset.t === t)
      reportChartDataState(host, { quote:"delayed" });
  }
}

/* The retained non-equity realtime lane (the "lq" database-change channel) was removed with the
   pull layer above. Macro symbols (VIX, DXY, US10Y) refresh through SC_PROVIDER.marketQuotes, which
   reads the chart API. Nothing on this page opens a socket to a database. */

function requestDeckQuote(ticker) {
  try { parent.postMessage({ sc:"chart-quote-ready", ticker:String(ticker || "").toUpperCase().trim() }, location.origin); } catch (_) {}
}
function applyDeckQuote(ticker, quote, state, absence) {
  const clean = String(ticker || "").toUpperCase().trim();
  const hosts = Array.from(CHART_HOSTS).filter((host) => host.isConnected && host.dataset.t === clean);
  if (quotePrice(quote) == null) {
    /* "absent" reaches here only when the deck's read SUCCEEDED and carried no row for this
       symbol. That is the stream's answer and is reported under its name, never as a delay. */
    const quoteState = state === "absent" ? "absent" : state === "delayed" ? "delayed" : "loading";
    for (const host of hosts) {
      paintLiveStatus(host, null);
      reportChartDataState(host, { quote:quoteState,
        quoteAbsence:quoteState === "absent" ? (absence || CHART_ABSENCE_NOT_OBSERVED) : null });
    }
    return;
  }
  scChartLive(clean, +quote.price, quote.updated_ts, quote.prev_close);
}

/* delegated actions (hub data-act names) */
document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]");
  if (!n) return;
  const act = n.dataset.act;
  if (act === "chartrange") {
    S.chartRange = n.dataset.r;
    document.querySelectorAll('.sc-crange[data-act="chartrange"]').forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) holdAndReload(host, S.chartRange);
  }
  else if (act === "clouds") setClouds(!CLOUDS_ON);
  else if (act === "cloudsteps") setCloudSteps(!CLOUD_STEPS);
  else if (act === "tvmodal") openTvModal(n.dataset.sym);
  else if (act === "tvmodalclose") closeTvModal();
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTvModal();
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "tkin") {
    setChartTicker(document.activeElement.value);
    document.activeElement.blur();
  }
});

/* TICKER FIELD — click in, the old symbol is already selected, so typing
   replaces it. It never jumbles with what was there. iOS Safari clears the
   selection on the touch that follows focus, so we re-select on the next
   frame and again on the click that lands. */
function selAll(n) { try { n.select(); n.setSelectionRange(0, n.value.length); } catch (err) {} }
document.addEventListener("focusin", (e) => {
  const n = e.target;
  if (n && n.id === "tkin") { selAll(n); requestAnimationFrame(() => selAll(n)); }
});
document.addEventListener("click", (e) => {
  const n = e.target;
  if (n && n.id === "tkin" && n.selectionStart === n.selectionEnd) selAll(n);
});

/* the deck (parent frame) drives the timeframe for BOTH charts through one bar */
addEventListener("message", (e) => {
  const d = e.data;
  if (!d) return;
  if (d.sc === "deck-quote") { applyDeckQuote(d.ticker, d.quote, d.state, d.absence); return; }
  if (d.sc === "chart-load-grant") {
    const grant = chartLoadPermits.get(d.token);
    if (grant) { chartLoadPermits.delete(d.token); grant(); }
    return;
  }
  if (d.sc === "chart-transition") {
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._transitionGeneration = Math.max(host._transitionGeneration || 0, Number(d.generation) || 0); clearChartRetry(host); }
    return;
  }
  if (d.sc !== "chart") return;
  /* The Station dock owns one clouds switch for the whole wall. */
  if (typeof d.clouds === "boolean") setClouds(d.clouds);
  if (typeof d.steps === "boolean") setCloudSteps(d.steps);
  if (d.range && CHART_RANGES.includes(d.range)) {
    S.chartRange = d.range;
    document.querySelectorAll('.sc-crange[data-act="chartrange"]').forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) holdAndReload(host, S.chartRange);
  }
  if (d.ticker) setChartTicker(d.ticker);
});

/* boot */
el("chartSlot").innerHTML = scChartHTML(S.chartT);
const initialChartHost = document.querySelector("#chartSlot .sc-nchart");
if (initialChartHost) initialChartHost._transitionGeneration = CHART_TRANSITION_GENERATION;
scChartWire(el("chartSlot"));
if (DECK_QUOTE_MODE) requestDeckQuote(S.chartT);
else pullPrevClose(S.chartT);
/* In the deck, the baseline normally arrives by push. If it has not within 1.2 s (a quote read
   still in flight, or a scene of new symbols), read this one ticker's previous close directly. */
if (DECK_QUOTE_MODE) setTimeout(() => { if (prevClose[S.chartT] == null) pullPrevClose(S.chartT); }, 1200);
/* A ten-second read-only heartbeat makes live status dependable even if the
   browser's realtime socket sleeps. The full history remains a 60-second pull. */
if (!DECK_QUOTE_MODE) setInterval(() => pullPrevClose(S.chartT), 10000);
/* refresh cadence — re-pull the active series every 60 s */
setInterval(() => { const host = document.querySelector("#chartSlot .sc-nchart"); if (host) scChartLoad(host); }, 60000);

var STATION_ACTIVITY_PANE = "chart";
/* ---- M51: TELL THE DECK WHEN ALAN IS USING THIS PANE --------------------------------------------
   The deck watches for a newer version of itself and reloads when the Station looks idle, but it
   can only hear pointer, wheel, key and scroll events in its OWN document: everything that happens
   inside this frame is invisible to it. That is why a feed being scrolled was reloaded under his
   hand (24 Sep). One message, on the same postMessage path the X pane uses for "live", at most once
   a second, carrying nothing but the fact that this pane is in use. */
(function reportStationActivity() {
  if (window.parent === window) return;
  var last = 0;
  var send = function () {
    var now = Date.now();
    if (now - last < 1000) return;
    last = now;
    try { window.parent.postMessage({ sc: "station-activity", pane: STATION_ACTIVITY_PANE, at: now }, location.origin); } catch (e) {}
  };
  var events = ["pointermove", "pointerdown", "wheel", "touchstart", "touchmove", "keydown", "scroll"];
  for (var i = 0; i < events.length; i++)
    window.addEventListener(events[i], send, { passive: true, capture: true });
})();
</script>
