     aafbc9b): scChart R18 native canvas renderer — scChartHTML/Draw/Load/Scrub/
     Wire, DB-only fetchChartSeries (R30 — reads ohlcv_history via pg(), NEVER
     FMP from the page), cache-first chart layer, R22 range ladder, in-app
     TradingView modal (FIX 5 / R52) — all ported verbatim. Live last-point
     patch (R22 FIX 8) rides supabase-js realtime on live_quotes, same as the
     hub. The hub's R20 touch-guard overlay is dropped (a dedicated chart window
     has no page scroll to trap — the one intentional trim, flagged here).
     Chrome addition (plumbing only): a ticker field in the range bar, since the
     widget has no cohort board to click. PRICE BASIS: RAW DB prints
     (ohlcv_history, unadjusted) + live_quotes ticks — the hub chart's basis.
     Params: ?t=MU · ?range=1D (15m 30m 1h 2h 3h 4h 6h 12h 1D 3D 1W)
       · ?bare=1 (pane mode — see the BARE note in the script)
       · ?tvrange=1D|5D|1M|3M|6M|YTD|12M|60M|ALL (TradingView opening window)

<style>

  --ipad-live-top:6px; --ipad-live-left:7px; --ipad-live-gap:6px;

const PG_TIMEOUT_MS = 4500;

  const controller = typeof AbortController === "undefined" ? null : new AbortController();
  const timer = controller ? setTimeout(() => controller.abort(), PG_TIMEOUT_MS) : null;

    return await fetch(SB + "/rest/v1/" + path, {

      if (r.ok) return r.json();

        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);

  BTCUSD: "COINBASE:BTCUSD", ETHUSD: "COINBASE:ETHUSD", SOLUSD: "COINBASE:SOLUSD",
  XRPUSD: "COINBASE:XRPUSD", DOGEUSD: "COINBASE:DOGEUSD", ADAUSD: "COINBASE:ADAUSD",
  AVAXUSD: "COINBASE:AVAXUSD", LINKUSD: "COINBASE:LINKUSD", LTCUSD: "COINBASE:LTCUSD" };
const POPOUT_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5 h5 v5 M19 5 L10 14 M9 5 H5 v14 h14 v-4"/></svg>';

const QS = new URLSearchParams(location.search);

let VIEW_PROFILE = VIEW_PROFILES.includes(QS.get("view")) ? QS.get("view") : "auto";

};

const chTimeFull = (d) => (d.length > 10 ? d.slice(0, 16) : d);
const EV_MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function chTimeLbl(d, range, compact, spanMs) {

async function fetchChartSeries(t, range, requestedLimit){
  const key = t + "|" + range;
  const hit = chartCache.get(key);
  const e = CHART_DB_RANGE[range] || CHART_DB_RANGE["1D"];
  const limit = Math.max(e[1], Math.round(requestedLimit || e[1]));
  if (hit && Date.now() - hit.ts < 300000 && (hit.limit || hit.pts.length) >= limit)
    return chApplyLivePoint(t, hit.pts, liveQuote[t]);

  if (chartInflight.has(inflightKey)) return chartInflight.get(inflightKey);
  const work = (async () => {
    const rows = await pg("ohlcv_history?ticker=eq." + encodeURIComponent(chFmpSym(t)) + "&tf=eq." + encodeURIComponent(e[0]) + "&select=timestamp,close&order=timestamp.desc&limit=" + limit);

}

async function fetchOlderChartSeries(t, range, before, limit) {
  const e = CHART_DB_RANGE[range] || CHART_DB_RANGE["1D"];

  const rows = await pg("ohlcv_history?ticker=eq." + encodeURIComponent(chFmpSym(t)) +
    "&tf=eq." + encodeURIComponent(e[0]) + "&timestamp=lt." + beforeTs +
    "&select=timestamp,close&order=timestamp.desc&limit=" + Math.max(1, Math.round(limit || CHART_HISTORY_PAGE)));
  const pts = (Array.isArray(rows) ? rows : []).map((r) => ({

function chartView(host, pts) {
  const last = Math.max(1, pts.length - 1);
  let view = host._view;
  if (!view || !isFinite(view.start) || !isFinite(view.end)) {
    view = { start:0, end:last };
    host._followLatest = true;
  }
  let span = Math.max(8, Math.min(last, Math.round(view.end - view.start)));
  let start = Math.round(view.start), end = start + span;
  if (start < 0) { end -= start; start = 0; }
  if (end > last) { start -= end - last; end = last; }
  host._view = { start:Math.max(0, start), end:Math.min(last, end) };
  return host._view;
}

function broadcastChartView(host) {
  if (!BARE || window.parent === window || host._broadcastQueued) return;
  host._broadcastQueued = true;

    host._broadcastQueued = false;
    const pts = host._series, view = host._view;
    if (!pts || !view || !pts[view.start] || !pts[view.end]) return;
    try {
      parent.postMessage({ sc:"chart-view", ticker:host.dataset.t,
        from:pts[view.start].d, to:pts[view.end].d,
        followLatest:host._followLatest !== false }, location.origin);

  const pts = host._series;

  start = Math.round(start); end = start + span;
  if (start < 0) { end -= start; start = 0; }
  if (end > last) { start -= end - last; end = last; }
  host._view = { start:Math.max(0, start), end:Math.min(last, end) };

function chartIndexAt(pts, iso, after) {
  const target = new Date(iso).getTime();
  if (!Number.isFinite(target) || !pts.length) return after ? 0 : Math.max(0, pts.length - 1);
  let lo = 0, hi = pts.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (new Date(pts[mid].d).getTime() < target) lo = mid + 1; else hi = mid;
  }
  if (after) return Math.min(pts.length - 1, lo);
  return Math.max(0, Math.min(pts.length - 1, lo < pts.length && pts[lo].d === iso ? lo : lo - 1));
}

function scChartDraw(host, scrubIx) {

function clearChartRetry(host) {
  if (host._retryTimer) clearTimeout(host._retryTimer);

  host._retryReq = null;

    host._retryTimer = null;
    if (host.isConnected && host._req === req && host._transitionGeneration === generation) {
      /* Keep the retry state painted during the next bounded request. This is
         essential when several fresh panes all hit the same delayed backend. */

    }

async function scChartLoad(host) {
  const t = host.dataset.t, range = S.chartRange;
  const req = t + "|" + range;
  if (host._req !== req) {
    host._view = null;

    host._historyLimit = CHART_INITIAL_LIMIT;
    host._historyExhausted = false;
  }
  host._req = req; host._range = range;
  const generation = host._transitionGeneration || 0;
  const msg = host.querySelector(".sc-nchart__msg");
  const cachedPts = chartSeriesCached(t, range);
  if (cachedPts && cachedPts.length >= 2) {
    host._series = cachedPts;
    host._ref = prevClose[t] != null ? +prevClose[t] : cachedPts[0].p;
    if (msg) msg.hidden = true;
    scChartDraw(host);
  } else if (host.dataset.dataState === "delayed") {
    /* A new bounded attempt must not make an uncached pane look blank again. */
    showChartDelayed(host, t);

  try {

    const pts = await fetchChartSeries(t, range, limit);
    if (host._req !== req || !host.isConnected || host._transitionGeneration !== generation) return;
    if (!pts || pts.length < 2) throw new Error("empty");
    host._series = pts;
    host._historyExhausted = pts.length < limit;
    host._ref = prevClose[t] != null ? +prevClose[t] : pts[0].p;
    clearChartRetry(host);

async function expandChartHistory(host, targetFrom, notify) {
  if (host._historyExhausted) return;
  if (host._historyLoading) return host._historyLoading;
  host._historyLoading = (async () => {
    try {
      let pages = 0;
      do {
        const current = host._series || [];
        if (!current.length) return;
        const older = await fetchOlderChartSeries(host.dataset.t, host._range || S.chartRange,
          current[0].d, CHART_HISTORY_PAGE);
        if (!host.isConnected || !older.length) { host._historyExhausted = true; break; }
        const merged = new Map();
        for (const p of older.concat(current)) merged.set(p.d, p);
        host._series = Array.from(merged.values()).sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
        host._historyLimit = host._series.length;
        host._historyExhausted = older.length < CHART_HISTORY_PAGE;
        const key = host.dataset.t + "|" + (host._range || S.chartRange);
        chartCache.set(key, { ts:Date.now(), pts:host._series, limit:host._series.length });
        try { cacheSet("sc_chart_" + key, { pts:host._series }); } catch (_) {}
        pages++;
      } while (targetFrom && !host._historyExhausted &&
        new Date(host._series[0].d) > new Date(targetFrom) && pages < 12);

      if (!targetFrom) {
        host._view = null;
        host._followLatest = true;
        scChartDraw(host);
        if (notify !== false) broadcastChartView(host);
      }
    } catch (_) {
      /* Keep the current usable view if older history is unavailable. */
    }
  })();
  try { await host._historyLoading; } finally { host._historyLoading = null; }
}

async function applySharedChartView(host, msg) {
  const token = (host._syncToken || 0) + 1;
  host._syncToken = token;
  let attempts = 0;
  while (host._series?.length && !host._historyExhausted &&
    new Date(host._series[0].d) > new Date(msg.from) && attempts++ < 2)
    await expandChartHistory(host, msg.from, false);
  if (host._syncToken !== token || !host._series?.length) return;
  const start = chartIndexAt(host._series, msg.from, true);
  const end = chartIndexAt(host._series, msg.to, false);
  setChartView(host, start, Math.max(start + 8, end), !!msg.followLatest, false);
}

function scChartScrub(host) {
  const cv = host.querySelector(".sc-nchart__cv");
  const hud = host.querySelector(".sc-nchart__hud");
  if (!cv) return;
  const pointers = new Map();
  let gesture = null;
  const show = (clientX) => {
    const pts = host._series, plot = host._plot;
    if (!pts || pts.length < 2 || !plot) return;
    const r = cv.getBoundingClientRect();
    let f = (clientX - r.left - plot.padL) / plot.iw;
    f = Math.max(0, Math.min(1, f));
    const ix = Math.round(plot.start + f * (plot.end - plot.start));
    scChartDraw(host, ix);
    if (hud) {
      hud.textContent = chPx(pts[ix].p, host.dataset.t) + " · " + chTimeFull(pts[ix].d);
      hud.style.left = Math.max(44, Math.min(r.width - 44, plot.padL + f * plot.iw)) + "px";
      hud.hidden = false;
    }
  };
  const hideHud = () => { if (hud) hud.hidden = true; };
  const snapshot = () => {
    const pts = host._series || [], v = chartView(host, pts);
    return { start:v.start, end:v.end };
  };
  const pinchStart = () => {
    const a = Array.from(pointers.values()).slice(0, 2);
    if (a.length < 2) return;
    const r = cv.getBoundingClientRect(), v = snapshot();
    gesture = { type:"pinch", distance:Math.max(1, Math.hypot(a[1].x-a[0].x, a[1].y-a[0].y)),
      center:(a[0].x+a[1].x)/2, rect:r, view:v };
    hideHud();
  };
  cv.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size >= 2) pinchStart();
    else gesture = { type:"pending", x:e.clientX, view:snapshot() };
  });
  cv.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) { if (e.pointerType === "mouse") show(e.clientX); return; }
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size >= 2) {
      if (!gesture || gesture.type !== "pinch") pinchStart();
      const a = Array.from(pointers.values()).slice(0, 2);
      const distance = Math.max(1, Math.hypot(a[1].x-a[0].x, a[1].y-a[0].y));
      const base = gesture.view, baseSpan = base.end - base.start;
      const span = Math.max(8, Math.min((host._series?.length || 2)-1, baseSpan * gesture.distance / distance));
      /* Scale gestures always preserve the newest point. A deliberate drag is
         still the one explicit way to leave the live edge and inspect history. */
      const last = (host._series?.length || 1) - 1;
      setChartView(host, last - span, last, true);
      return;
    }
    const dx = e.clientX - gesture.x;
    if (gesture.type === "pending" && Math.abs(dx) > 4) gesture.type = "pan";
    if (gesture.type === "pan") {
      cv.classList.add("is-panning"); hideHud();
      const span = gesture.view.end - gesture.view.start;
      const shift = -dx / Math.max(1, host._plot?.iw || cv.clientWidth) * span;
      setChartView(host, gesture.view.start + shift, gesture.view.end + shift, false);
    } else if (e.pointerType === "mouse") show(e.clientX);
  });
  const release = (e) => {
    pointers.delete(e.pointerId); cv.classList.remove("is-panning"); hideHud();
    if (pointers.size === 1) {
      const p = Array.from(pointers.values())[0]; gesture = { type:"pending", x:p.x, view:snapshot() };
    } else gesture = null;
    if (host._series) scChartDraw(host);
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);
  cv.addEventListener("pointerleave", (e) => {
    if (!pointers.has(e.pointerId)) { hideHud(); if (host._series) scChartDraw(host); }
  });
  cv.addEventListener("wheel", (e) => {
    e.preventDefault(); hideHud();
    const pts = host._series, plot = host._plot;
    if (!pts || pts.length < 2 || !plot) return;
    const oldSpan = plot.end-plot.start;
    /* A horizontal two-finger gesture pans, as it does on TradingView. */
    if (Math.abs(e.deltaX) > 2 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.35) {
      const shift = e.deltaX / Math.max(1, plot.iw) * oldSpan;
      setChartView(host, plot.start + shift, plot.end + shift, false);
      return;
    }
    const newSpan = Math.max(8, Math.min(pts.length-1, oldSpan * Math.exp(e.deltaY*.0018)));
    if (e.deltaY > 0 && newSpan >= pts.length - 2) expandChartHistory(host);
    const last = pts.length - 1;
    setChartView(host, last-newSpan, last, true);
  }, { passive:false });
  cv.addEventListener("dblclick", (e) => { e.preventDefault(); hideHud(); resetChartView(host); });
}

function scChartWire(slot) {
  if (!slot) return;
  const host = slot.querySelector(".sc-nchart");
  if (!host || host._wired) return;
  host._wired = true;
  for (const old of CHART_HOSTS)
    if (!old.isConnected) { if (old._ro) old._ro.disconnect(); CHART_HOSTS.delete(old); }
  CHART_HOSTS.add(host);
  const area = host.querySelector(".sc-nchart__area");
  if (window.ResizeObserver && area) {
    host._ro = new ResizeObserver(() => { applyIpadPaneScale(); scChartDraw(host); });
    host._ro.observe(area);
  }
  scChartScrub(host);
  paintLiveStatus(host, liveQuote[host.dataset.t]);
  scChartLoad(host);
}

window.addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "SCINTILLA_VIEW_PROFILE") {
    VIEW_PROFILE = VIEW_PROFILES.includes(event.data.view) ? event.data.view : "auto";
    document.documentElement.dataset.view = VIEW_PROFILE;
    applyIpadPaneScale(event.data.scale);
    for (const host of CHART_HOSTS) if (host.isConnected) scChartDraw(host);
    return;
  }
  if (event.data?.type !== "SCINTILLA_CHART_VIEW") return;
  for (const host of CHART_HOSTS) if (host.isConnected) applySharedChartView(host, event.data);
});

function setChartTicker(t) {
  t = String(t || "").toUpperCase().trim();
  if (!t) return;
  S.chartT = t;
  lsSet("scw_chartT", t);
  const host = document.querySelector("#chartSlot .sc-nchart");
  if (!host) return;
  host.dataset.t = t;
  host._series = null;
  host._view = null;
  const sym = TV_MAP[t] || t;
  const pop = host.querySelector(".sc-tv__pop");
  if (pop) pop.dataset.sym = sym;
  const tin = el("tkin"); if (tin && tin.value.toUpperCase().trim() !== t) tin.value = t;
  pullPrevClose(t);
  scChartLoad(host);
}

/* R22 FIX 8 — live tick → cheap last-point update (ported verbatim) */
function scChartLive(t, price, updatedTs) {
  liveQuote[t] = { price:+price, updated_ts:updatedTs || Date.now() };
  for (const host of CHART_HOSTS) {
    if (!host.isConnected || host.dataset.t !== t) continue;
    if (prevClose[t] != null && isFinite(prevClose[t])) host._ref = +prevClose[t];
    paintLiveStatus(host, liveQuote[t]);
    const s = host._series;
    if (!s || !s.length) continue;
    const atRight = !host._view || host._view.end >= s.length - 1;
    const span = host._view ? host._view.end - host._view.start : 0;
    chApplyLivePoint(t, s, liveQuote[t]);
    if (atRight && host._view) host._view = { start:Math.max(0, s.length-1-span), end:s.length-1 };
    scChartDraw(host);
  }
}

/* Stable Station overlay: daily performance is measured from the regular
   previous close, never from the visible chart window. */
function chDayChange(price, previousClose) {
  if (!Number.isFinite(+price) || !Number.isFinite(+previousClose) || +previousClose === 0)
    return { text:"—", tone:"flat" };
  const pct = ((+price - +previousClose) / +previousClose) * 100;
  if (Math.abs(pct) < .005) return { text:"0.00%", tone:"flat" };
  return { text:pct > 0 ? pct.toFixed(2) + "%" : "(" + Math.abs(pct).toFixed(2) + "%)",
    tone:pct > 0 ? "up" : "down" };
}

function paintLiveStatus(host, quote) {
  const badge = host?.querySelector(".sc-nchart__live");
  if (!badge) return;
  let ticker = badge.querySelector(".sc-nchart__live-ticker");
  let price = badge.querySelector(".sc-nchart__live-price");
  let change = badge.querySelector(".sc-nchart__live-change");
  if (!ticker || !price || !change) {
    badge.replaceChildren();
    ticker = document.createElement("button");
    ticker.type = "button";
    ticker.className = "sc-nchart__live-ticker";
    ticker.title = "Edit ticker";
    ticker.addEventListener("click", () => {
      try { parent.postMessage({ sc:"chart-focus-ticker" }, location.origin); } catch (_) {}
    });
    price = document.createElement("strong");
    price.className = "sc-nchart__live-price";
    change = document.createElement("span");
    change.className = "sc-nchart__live-change";
    badge.append(ticker, price, change);
  }
  ticker.textContent = host.dataset.t;
  if (!quote || !isFinite(+quote.price)) {
    badge.dataset.fresh = "0";
    badge.dataset.change = "flat";
    price.textContent = "—";
    change.textContent = "";
    badge.title = "live quote unavailable";
    return;
  }
  const at = new Date(quote.updated_ts || Date.now());
  const age = Date.now() - at.getTime();
  const fresh = Number.isFinite(age) && age < 90000;
  badge.dataset.fresh = fresh ? "1" : "0";
  const dayRef = prevClose[host.dataset.t];
  const day = chDayChange(+quote.price, dayRef);
  badge.dataset.change = day.tone;
  price.textContent = chPx(+quote.price, host.dataset.t);
  change.textContent = day.text;
  badge.title = (futureSet.has(host.dataset.t) ? "delayed futures quote · database refresh " : "live_quotes · ") + at.toISOString();
  try {
    parent.postMessage({ sc:"chart-status", ticker:host.dataset.t, updatedTs:at.toISOString(),
      fresh, delayed:futureSet.has(host.dataset.t), source:"live_quotes" }, location.origin);
  } catch (_) {}
}

/* Previous regular-session close is the day reference for every timeframe.
   The visible window controls geometry only; it must not change red/green. */
async function pullPrevClose(t) {
  try {
    const rows = await pg("live_quotes?ticker=eq." + encodeURIComponent(t) + "&select=ticker,prev_close,price,updated_ts", 1);
    if (Array.isArray(rows) && rows[0]) {
      if (rows[0].prev_close != null) prevClose[t] = +rows[0].prev_close;
      if (rows[0].price != null) scChartLive(t, +rows[0].price, rows[0].updated_ts);
    }
  } catch (_) {}
}

/* realtime — live_quotes ticks patch the active chart (hub channel, verbatim shape) */
if (sb) {
  sb.channel("lq").on("postgres_changes", { event: "*", schema: "public", table: "live_quotes" }, (p) => {
    if (p.new && p.new.ticker && p.new.price != null) scChartLive(String(p.new.ticker).toUpperCase(), +p.new.price, p.new.updated_ts);
  }).subscribe();
}

/* delegated actions (hub data-act names) */
document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]");
  if (!n) return;
  const act = n.dataset.act;
  if (act === "chartrange") {
    S.chartRange = n.dataset.r;
    lsSet("scw_chartRange", S.chartRange);
    document.querySelectorAll(".sc-crange").forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._series = null; scChartLoad(host); }
  }
  else if (act === "tvmodal") openTvModal(n.dataset.sym);
  else if (act === "tvmodalclose") closeTvModal();
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTvModal();
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "tkin") {
    setChartTicker(document.activeElement.value);
    document.activeElement.blur();
  }
});

/* TICKER FIELD — click in, the old symbol is already selected, so typing
   replaces it. It never jumbles with what was there. iOS Safari clears the
   selection on the touch that follows focus, so we re-select on the next
   frame and again on the click that lands. */
function selAll(n) { try { n.select(); n.setSelectionRange(0, n.value.length); } catch (err) {} }
document.addEventListener("focusin", (e) => {
  const n = e.target;
  if (n && n.id === "tkin") { selAll(n); requestAnimationFrame(() => selAll(n)); }
});
document.addEventListener("click", (e) => {
  const n = e.target;
  if (n && n.id === "tkin" && n.selectionStart === n.selectionEnd) selAll(n);
});

/* the deck (parent frame) drives the timeframe for BOTH charts through one bar */
addEventListener("message", (e) => {
  const d = e.data;
  if (!d) return;
  if (d.sc === "chart-transition") {
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._transitionGeneration = Math.max(host._transitionGeneration || 0, Number(d.generation) || 0); clearChartRetry(host); }
    return;
  }
  if (d.sc !== "chart") return;
  if (d.range && CHART_RANGES.includes(d.range)) {
    S.chartRange = d.range;
    document.querySelectorAll(".sc-crange").forEach((b) => b.classList.toggle("on", b.dataset.r === S.chartRange));
    const host = document.querySelector("#chartSlot .sc-nchart");
    if (host) { host._series = null; scChartLoad(host); }
  }
  if (d.ticker) setChartTicker(d.ticker);
});

/* boot */
el("chartSlot").innerHTML = scChartHTML(S.chartT);
scChartWire(el("chartSlot"));
const initialChartHost = document.querySelector("#chartSlot .sc-nchart");
if (initialChartHost) initialChartHost._transitionGeneration = CHART_TRANSITION_GENERATION;
pullPrevClose(S.chartT);
/* A ten-second read-only heartbeat makes live status dependable even if the
   browser's realtime socket sleeps. The full history remains a 60-second pull. */
setInterval(() => pullPrevClose(S.chartT), 10000);
/* refresh cadence — re-pull the active series every 60 s */
setInterval(() => { const host = document.querySelector("#chartSlot .sc-nchart"); if (host) scChartLoad(host); }, 60000);
</script>
</body>
