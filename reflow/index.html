<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · reflow</title>
<!-- ============================================================================
     SCINTILLA · REFLOW — the geiger that moves.
     Alan: the rankings are the win, and the MOTION in the Visuals pieces
     (HEATMAP MATRIX + TREEMAP REFLOW) is the feel he wants here. So the same
     universe, re-ranked and re-coloured green→red by a different metric — but
     the cells TRAVEL to their new positions and bleed to their new colour
     instead of hard-swapping. The geiger breathes.

     THE MOTION (matched to the Visuals idiom, spine rows 222 + 257 — spring
     reorder on overtake, per-cell breathing, hot cells bloom, treemap reflow):
       · FLIP reordering — measure every cell's rect, apply the new layout,
         invert with a transform, then release. The travel runs on transform
         only, which stays on the compositor and off the main thread.
       · colour bleeds through a CSS transition on the same clock, so a name
         that goes from top of one ranking to the bottom of another is watched
         moving AND changing colour rather than teleporting.
       · the top cells of the current ranking carry a slow bloom so the field
         is never dead still.
       · prefers-reduced-motion is honoured: everything lands instantly.

     TWO LAYOUTS, one dataset:
       MATRIX  — uniform cells in ranked order, reading left→right, top→bottom.
       TREEMAP — squarified: AREA = size metric (market cap by default),
                 COLOUR = the ranking metric. Big name, bad day = a large red
                 block you cannot miss.
     RANK BY: chg % · P/E · market cap · RSI · geiger · SECTOR (rolls the same
     universe up by sector and colours the sectors — the sector-cohort geiger).
     Missing metric = a grey hatched cell that says so. Never a fake colour.

     REUSE, NOT REBUILD: the geiger value is composite_staged tf=D, the exact
     read /cohort and /compare use, never recomputed here. /ranks stays the
     static side-by-side reader; this is the same data in motion.

     MOBILE-SAFE — this is the page that must not repeat the /geigerwall crash:
       · ZERO iframes. Nothing nested, ever.
       · cell count capped (36 phone / 80 desktop, ?limit= to override).
       · transform-driven motion, one rAF batch per relayout, no per-cell timers.
       · auto-cycle is OFF by default; ?cycle=8 turns it on for the wall.
     Params: ?rank=chg|pe|mcap|rsi|geiger|sector · ?view=matrix|treemap ·
       ?size=mcap|chg|rsi|geiger (treemap area) · ?limit=N · ?cycle=SECONDS ·
       ?etf=0 · ?bg=0 · ?refresh=90
     Equity RSI is the raw FMP provider value; Geiger is never recomputed here.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --vol:#FF8A00;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.28,1);      /* the settle — slow out, no bounce overshoot */
  --dur:720ms;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.02em;
  display:flex; flex-direction:column; overflow:hidden; -webkit-text-size-adjust:100%; }
body.nobg{ background:transparent; }
#hd{ flex:none; display:flex; align-items:center; gap:7px; padding:8px 10px 6px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); }
#hd .k{ color:var(--crk); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; }
.chip{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 9px;
  border:1px solid var(--line); background:var(--panel2); color:var(--ink3); cursor:pointer;
  transition:border-color .2s, color .2s; }
.chip:hover{ color:var(--ink); border-color:var(--hair); }
.chip.on{ color:var(--crk); border-color:var(--crk); }
.chip.view{ color:var(--vol); border-color:rgba(255,138,0,.4); }
.chip.view.on{ color:#0A0A0F; background:var(--vol); border-color:var(--vol); }
#stamp{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
#rule{ flex:none; padding:4px 10px; color:var(--dim); font-size:8.5px; letter-spacing:.06em;
  border-bottom:1px solid var(--line); }
#rule b{ color:var(--ink2); font-weight:400; }
#stage{ flex:1; position:relative; overflow:hidden; margin:0; }
.cellw{ position:absolute; left:0; top:0; will-change:transform;
  transition:transform var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease); }
.cellw.noanim{ transition:none; }
.cell{ position:absolute; inset:2px; display:flex; flex-direction:column; justify-content:center;
  align-items:center; overflow:hidden; border-radius:2px; cursor:pointer;
  transition:background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), opacity .3s; }
.cell .tk{ font-weight:700; font-size:11px; letter-spacing:.04em; line-height:1.1;
  max-width:96%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cell .vl{ font-size:9px; font-variant-numeric:tabular-nums; opacity:.9; margin-top:1px; }
.cell.sm .tk{ font-size:9px; } .cell.sm .vl{ display:none; }
.cell.gap{ background:repeating-linear-gradient(45deg,#15151f,#15151f 4px,#101018 4px,#101018 8px) !important;
  color:var(--mute); box-shadow:none !important; }
/* The size metric is unknown for this node: its AREA is a placeholder, not a measurement,
   so the cell is outlined to say the geometry carries no claim. */
.cell.nosize{ outline:1px dashed var(--mute); outline-offset:-3px; }
.cell.bloom{ animation:bloom 3.6s var(--ease) infinite; }
@keyframes bloom{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.22); } }
.cell.sel{ outline:2px solid var(--crk); outline-offset:-2px; }
#ft{ flex:none; padding:5px 10px; color:var(--mute); font-size:7.5px; letter-spacing:.08em;
  text-transform:uppercase; border-top:1px solid var(--line); }
.empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
@media (prefers-reduced-motion: reduce){
  :root{ --dur:1ms; }
  .cell.bloom{ animation:none; }
}
</style>
</head>
<body>
<div id="hd">
  <span class="k">REFLOW</span>
  <span id="ranks"></span>
  <span id="views"></span>
  <span id="stamp"></span>
</div>
<div id="rule"></div>
<div id="stage"><div class="empty">building the field…</div></div>
<div id="ft">cells travel to their new rank and bleed to their new colour · grey hatch = no data · provider quote + raw FMP RSI · Geiger never recomputed</div>
<script src="/_provider/provider.js"></script>
<script>
/* PROVIDER AUTHORITY SHIM — installed before this page issues any query. pg() is a hoisted
   top-level declaration, so it is already bound here. The shim answers live_quotes,
   composite_staged and ohlcv_history from the accepted provider APIs and passes
   non-equities through to their existing owner. */
try { scInstallProviderShim(); } catch (_) {}

"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const num = (x) => (x == null ? null : Number(x));
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const QS = new URLSearchParams(location.search);
const PHONE = Math.min(innerWidth, innerHeight) < 820 ||
              (matchMedia("(pointer: coarse)").matches && /iPad|iPhone|iPod/.test(navigator.userAgent));
const LIMIT   = Math.max(6, Math.min(200, +(QS.get("limit") || (PHONE ? 36 : 80))));
const CYCLE   = Math.max(0, Math.min(120, +(QS.get("cycle") || 0))) * 1000;
const REFRESH = Math.max(30, Math.min(900, +(QS.get("refresh") || 90))) * 1000;
const DROP_ETF = QS.get("etf") === "0";
if (QS.get("bg") === "0") document.body.classList.add("nobg");

const RANKS = [
  { k: "chg",    t: "CHG %",  rule: "colour: biggest gain today is green, biggest loss red",  dir: "desc", fmt: (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%" },
  { k: "pe",     t: "P/E",    rule: "colour: cheapest P/E is green, most expensive red",      dir: "asc",  fmt: (v) => v.toFixed(1) },
  { k: "mcap",   t: "MKT CAP",rule: "colour: largest company green, smallest red",            dir: "desc", fmt: (v) => v >= 1e12 ? (v/1e12).toFixed(2)+"T" : v >= 1e9 ? (v/1e9).toFixed(1)+"B" : (v/1e6).toFixed(0)+"M" },
  { k: "rsi",    t: "RSI",    rule: "colour: highest RSI green, lowest red",                  dir: "desc", fmt: (v) => v.toFixed(0) },
  { k: "geiger", t: "GEIGER", rule: "colour: highest composite green, lowest red — the one geiger, never recomputed", dir: "desc", fmt: (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) },
  { k: "sector", t: "SECTOR", rule: "cells become sectors — the same universe rolled up, coloured by average change", dir: "desc", fmt: (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%" },
];
let RANK = RANKS.some((r) => r.k === QS.get("rank")) ? QS.get("rank") : "chg";
let VIEW = QS.get("view") === "treemap" ? "treemap" : "matrix";
let SIZE = ["mcap","chg","rsi","geiger"].indexOf(QS.get("size")) >= 0 ? QS.get("size") : "mcap";
let SEL = null, DATA = null;

/* ---- colour: position in the ranking, so every metric reads the same way ---- */
function rankColor(i, n) {
  if (n < 2) return "rgb(120,120,140)";
  const t = i / (n - 1);
  const g = [0, 200, 130], mid = [58, 58, 76], r = [210, 36, 70];
  const mix = (a, b, k) => a.map((v, j) => Math.round(v + (b[j] - v) * k));
  const c = t < 0.5 ? mix(g, mid, t * 2) : mix(mid, r, (t - 0.5) * 2);
  return "rgb(" + c.join(",") + ")";
}
const inkFor = (i, n) => (n > 1 && (i / (n - 1) > 0.28 && i / (n - 1) < 0.72)) ? "#C6C8DE" : "#08080c";

/* ---- squarified treemap (Bruls/Huizing/van Wijk) ---- */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((a, b) => a + b.area, 0) || 1;
  let list = items.map((it) => ({ ...it, area: (it.area / total) * (w * h) }));
  const worst = (row, len) => {
    const s = row.reduce((a, b) => a + b.area, 0);
    const mx = Math.max.apply(null, row.map((r) => r.area)), mn = Math.min.apply(null, row.map((r) => r.area));
    return Math.max((len * len * mx) / (s * s), (s * s) / (len * len * mn));
  };
  let cx = x, cy = y, cw = w, ch = h;
  while (list.length) {
    const horizontal = cw >= ch, len = horizontal ? ch : cw;
    let row = [list[0]], rest = list.slice(1);
    while (rest.length && worst(row.concat([rest[0]]), len) <= worst(row, len)) { row.push(rest[0]); rest = rest.slice(1); }
    const rowArea = row.reduce((a, b) => a + b.area, 0);
    const thick = len > 0 ? rowArea / len : 0;
    let off = horizontal ? cy : cx;
    for (const it of row) {
      const seg = thick > 0 ? it.area / thick : 0;
      if (horizontal) { out.push({ ...it, x: cx, y: off, w: thick, h: seg }); off += seg; }
      else            { out.push({ ...it, x: off, y: cy, w: seg, h: thick }); off += seg; }
    }
    if (horizontal) { cx += thick; cw -= thick; } else { cy += thick; ch -= thick; }
    list = rest;
    if (cw <= 0.5 || ch <= 0.5) { for (const it of list) out.push({ ...it, x: cx, y: cy, w: 0, h: 0 }); break; }
  }
  return out;
}

/* ---- cell registry: one DOM node per key, reused forever so FLIP can work ---- */
const NODES = new Map();
function nodeFor(key) {
  let n = NODES.get(key);
  if (!n) {
    const wrap = document.createElement("div"); wrap.className = "cellw noanim";
    const c = document.createElement("div"); c.className = "cell";
    c.innerHTML = '<span class="tk"></span><span class="vl"></span>';
    wrap.appendChild(c); el("stage").appendChild(wrap);
    n = { wrap, cell: c, tk: c.querySelector(".tk"), vl: c.querySelector(".vl"), x: null, y: null, w: 0, h: 0 };
    NODES.set(key, n);
    c.addEventListener("click", () => { SEL = (SEL === key) ? null : key; paint(); });
  }
  return n;
}

/* ---- the layout pass: compute rects, then FLIP every cell into place ---- */
function layout() {
  if (!DATA) return;
  const def = RANKS.find((r) => r.k === RANK);
  const stage = el("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;

  /* A failed read renders as a failure, never as a field of unranked grey. */
  if (DATA.failure && DATA.failure(RANK)) {
    stage.innerHTML = '<div class="empty">' + DATA.failure(RANK) +
      " did not answer — this ranking is unavailable, not empty · retrying at the next refresh" +
      (DATA.etfFilterDown ? " · ETF filter unavailable (company_profile read failed)" : "") + "</div>";
    return;
  }

  const rows = DATA.rows(RANK);                       /* [{key,label,v,size}] ranked, gaps last */
  const good = rows.filter((r) => r.v != null);
  const n = good.length;

  let rects;
  if (VIEW === "treemap") {
    const items = rows.map((r, i) => ({ key: r.key, area: Math.max(1, r.size || 1), i }));
    rects = squarify(items, 0, 0, W, H);
  } else {
    const count = rows.length || 1;
    const cols = Math.max(1, Math.round(Math.sqrt(count * (W / Math.max(1, H)))));
    const rws = Math.ceil(count / cols);
    const cw = W / cols, chh = H / rws;
    rects = rows.map((r, i) => ({ key: r.key, x: (i % cols) * cw, y: Math.floor(i / cols) * chh, w: cw, h: chh, i }));
  }
  const byKey = {}; for (const rc of rects) byKey[rc.key] = rc;

  /* FIRST — where every cell is now */
  const first = new Map();
  for (const [k, nd] of NODES) if (nd.x != null) first.set(k, { x: nd.x, y: nd.y, w: nd.w, h: nd.h });

  /* LAST — write the new geometry */
  const seen = new Set();
  rows.forEach((r, i) => {
    const rc = byKey[r.key]; if (!rc) return;
    seen.add(r.key);
    const nd = nodeFor(r.key);
    const isGap = r.v == null;
    nd.wrap.style.width = rc.w + "px"; nd.wrap.style.height = rc.h + "px";
    nd.wrap.style.transform = "translate(" + rc.x + "px," + rc.y + "px)";
    /* A node whose SIZE metric is unknown wears it: the area is a placeholder, not a
       measurement, and the title says which metric is missing. */
    const sizeUnknown = r.sizeKnown === false;
    nd.cell.className = "cell" + (isGap ? " gap" : "") + (rc.w < 74 || rc.h < 40 ? " sm" : "") +
      (sizeUnknown ? " nosize" : "") +
      (!isGap && i < Math.max(1, Math.round(n * 0.08)) ? " bloom" : "") + (SEL === r.key ? " sel" : "");
    nd.cell.title = sizeUnknown
      ? r.label + " — " + SIZE + " unknown, so this cell's SIZE is a placeholder, not a measurement"
      : "";
    if (!isGap) {
      const col = rankColor(i, n);
      nd.cell.style.background = col;
      nd.cell.style.color = inkFor(i, n);
      nd.cell.style.boxShadow = i < 3 ? "0 0 14px " + col : "none";
    } else { nd.cell.style.background = ""; nd.cell.style.boxShadow = ""; nd.cell.style.color = ""; }
    nd.tk.textContent = r.label;
    nd.vl.textContent = isGap ? "no data" : def.fmt(r.v);
    nd.wrap.style.display = (rc.w < 2 || rc.h < 2) ? "none" : "";
    nd.x = rc.x; nd.y = rc.y; nd.w = rc.w; nd.h = rc.h;
  });
  for (const [k, nd] of NODES) if (!seen.has(k)) { nd.wrap.remove(); NODES.delete(k); }

  /* INVERT + PLAY — one batch, transform-only, straight to the compositor */
  const moving = [];
  for (const [k, nd] of NODES) {
    const f = first.get(k); if (!f) continue;
    const dx = f.x - nd.x, dy = f.y - nd.y;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(f.w - nd.w) < 0.5 && Math.abs(f.h - nd.h) < 0.5) continue;
    nd.wrap.classList.add("noanim");
    nd.wrap.style.transform = "translate(" + f.x + "px," + f.y + "px)";
    nd.wrap.style.width = f.w + "px"; nd.wrap.style.height = f.h + "px";
    moving.push(nd);
  }
  requestAnimationFrame(() => {
    for (const nd of moving) {
      nd.wrap.offsetWidth;                             /* force the inverted frame */
      nd.wrap.classList.remove("noanim");
      nd.wrap.style.transform = "translate(" + nd.x + "px," + nd.y + "px)";
      nd.wrap.style.width = nd.w + "px"; nd.wrap.style.height = nd.h + "px";
    }
    for (const [, nd] of NODES) nd.wrap.classList.remove("noanim");
  });

  el("rule").innerHTML = "<b>" + esc(def.t) + "</b> — " + esc(def.rule) +
    (VIEW === "treemap" ? " · <b>area</b> = " + esc(SIZE === "mcap" ? "market cap" : SIZE) : "") +
    (SEL ? " · selected <b>" + esc(SEL) + "</b>" : "");
  el("stamp").textContent = rows.length + " cells · " + n + " with data";
}
function paint() { layout(); }

/* ---- chips ---- */
function chips() {
  el("ranks").innerHTML = RANKS.map((r) =>
    '<span class="chip' + (r.k === RANK ? " on" : "") + '" data-r="' + r.k + '">' + r.t + "</span>").join(" ");
  el("views").innerHTML = ['<span class="chip view' + (VIEW === "matrix" ? " on" : "") + '" data-v="matrix">matrix</span>',
                           '<span class="chip view' + (VIEW === "treemap" ? " on" : "") + '" data-v="treemap">treemap</span>'].join(" ");
  for (const c of document.querySelectorAll("[data-r]")) c.addEventListener("click", () => { RANK = c.dataset.r; chips(); layout(); });
  for (const c of document.querySelectorAll("[data-v]")) c.addEventListener("click", () => { VIEW = c.dataset.v; chips(); layout(); });
}

/* ---- data ---- */
async function pull() {
  /* A FAILED READ IS NEVER DATA — same sweep as /ranks. A dead auxiliary read used to
     render the whole field as unranked gray, which reads as "none of these have a value"
     rather than "the read fell over". The failure is kept per source and the layout says
     which read failed instead of drawing a field of grey non-answers. */
  const READ_FAILED = { failed: true };
  const tryPg = (path) => pg(path).catch(() => READ_FAILED);
  const failed = (x) => x === READ_FAILED;
  const [lq, cp, rsi, ratios, comp] = await Promise.all([
    tryPg("live_quotes?select=ticker,chg_pct"),
    tryPg("company_profile?select=ticker,sector,market_cap,is_etf"),
    tryPg("board_rsi?select=ticker,rsi_raw"),
    tryPg("ratios_history?select=ticker,pe,fiscal_date&order=fiscal_date.desc&limit=4000"),
    tryPg("composite_staged?tf=eq.D&select=ticker,composite"),
  ]);
  if (!Array.isArray(lq) || !lq.length) throw new Error("no universe");
  const prof = {}; for (const r of (failed(cp) ? [] : cp || [])) prof[r.ticker] = r;
  const R = {}; for (const r of (failed(rsi) ? [] : rsi || [])) R[r.ticker] = num(r.rsi_raw);
  const C = {}; for (const r of (failed(comp) ? [] : comp || [])) C[r.ticker] = num(r.composite);
  const PE = {}; for (const r of (failed(ratios) ? [] : ratios || [])) if (!(r.ticker in PE) && num(r.pe) != null && num(r.pe) > 0) PE[r.ticker] = num(r.pe);
  const DOWN = {
    pe: failed(ratios) && "ratios_history",
    mcap: failed(cp) && "company_profile",
    rsi: failed(rsi) && "provider_indicators_current",
    geiger: failed(comp) && "composite_staged",
    sector: failed(cp) && "company_profile",
  };
  const chg = {}; for (const q of lq) chg[q.ticker] = num(q.chg_pct);

  let uni = lq.map((q) => q.ticker).filter(Boolean);
  if (DROP_ETF && !failed(cp)) uni = uni.filter((t) => !(prof[t] && prof[t].is_etf));
  uni.sort((a, b) => {
    const ca = prof[a] ? num(prof[a].market_cap) : null, cb = prof[b] ? num(prof[b].market_cap) : null;
    if (ca != null && cb != null) return cb - ca;
    if (ca != null) return -1; if (cb != null) return 1;
    return a.localeCompare(b);
  });
  uni = uni.slice(0, LIMIT);

  const valOf = (k, t) => k === "chg" ? chg[t] : k === "pe" ? PE[t] : k === "rsi" ? R[t] :
    k === "geiger" ? C[t] : k === "mcap" ? (prof[t] ? num(prof[t].market_cap) : null) : null;
  /* A SIZE IS A CLAIM, AND AN UNKNOWN SIZE IS NOT THE SMALLEST SIZE.
     The size metric is chosen independently of the rank metric (?size= vs ?rank=), so a
     ticker can carry a perfectly good rank value and no market cap at all — and this used
     to draw it at 1 against real caps whose sqrt runs to the hundreds of thousands: an
     unmarked sliver that reads as "a negligible company" when the truth is "nobody told us
     how big it is". The gap marking beside it is computed on the RANK value, so nothing
     said otherwise. Unknown is now sized at the median of what IS known — a deliberately
     uninformative middle, never the extreme that would read as a measurement — and the
     node is marked so the viewer can see the size is not a claim. */
  const rawSize = (t) => {
    const v = valOf(SIZE, t);
    if (v == null || !isFinite(v)) return null;
    return SIZE === "mcap" ? Math.sqrt(v) : Math.abs(v) + 0.5;
  };
  const knownSizes = uni.map(rawSize).filter((v) => v != null).sort((a, b) => a - b);
  const medianSize = knownSizes.length
    ? knownSizes[Math.floor((knownSizes.length - 1) / 2)]
    : (SIZE === "mcap" ? 1 : 0.5);
  const sizeOf = (t) => { const v = rawSize(t); return v != null ? v : medianSize; };
  const sizeKnown = (t) => rawSize(t) != null;

  DATA = {
    /* The name of the failed source behind a rank, or null. The layout refuses to draw a
       field of grey non-answers over a failure. */
    failure(rank) { return DOWN[rank] || null; },
    etfFilterDown: DROP_ETF && failed(cp),
    rows(rank) {
      if (rank === "sector") {
        const bySec = {};
        for (const t of uni) {
          const s = prof[t] && prof[t].sector, v = chg[t];
          if (!s || v == null) continue;
          (bySec[s] = bySec[s] || []).push({ t, v });
        }
        const rows = Object.keys(bySec).map((s) => ({
          key: "SEC:" + s, label: s,
          v: bySec[s].reduce((a, b) => a + b.v, 0) / bySec[s].length,
          size: bySec[s].reduce((a, b) => a + (prof[b.t] ? Math.sqrt(num(prof[b.t].market_cap) || 1) : 1), 0),
        }));
        rows.sort((a, b) => b.v - a.v);
        return rows;
      }
      const def = RANKS.find((r) => r.k === rank);
      const rows = uni.map((t) => ({ key: t, label: t, v: valOf(rank, t),
                                     size: sizeOf(t), sizeKnown: sizeKnown(t) }));
      const have = rows.filter((r) => r.v != null && isFinite(r.v))
        .sort((a, b) => def.dir === "asc" ? a.v - b.v : b.v - a.v);
      return have.concat(rows.filter((r) => !(r.v != null && isFinite(r.v))));
    },
  };
}

(async function init() {
  chips();
  try { await pull(); el("stage").innerHTML = ""; layout(); }
  catch (e) { el("stage").innerHTML = '<div class="empty">field unavailable — live_quotes did not answer</div>'; return; }
  let rt = null;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 180); });
  if (CYCLE) setInterval(() => { RANK = RANKS[(RANKS.findIndex((r) => r.k === RANK) + 1) % RANKS.length].k; chips(); layout(); }, CYCLE);
  setInterval(async () => { try { await pull(); layout(); } catch (e) {} }, REFRESH);
})();
</script>
