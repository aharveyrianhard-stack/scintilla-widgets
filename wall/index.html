<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCINTILLA · chart wall</title>
<!-- ============================================================================
     SCINTILLA WIDGET · CHART WALL — stage-2 auto-rotating chart view
     (HUB/SURFACE COMMAND). Composition route: the LIVE /chart widget arranged
     into a rotating scene — each cycle loads /chart?t=<next>&range=<range> into
     a hidden back iframe (double-buffer), swaps it to front when loaded, and
     dwells. The chart widget itself is untouched; this page only composes it,
     so /wall inherits every /chart behavior (DB-only ohlcv_history reads, raw
     basis stated there, realtime last-point, scrub, TV modal).
     Rotation list: ?list=MU,NVDA,SPY else hub_favorites (DB) else hub FAV seed.
     Params: ?list= · ?dwell=20 (s, 5-300) · ?range=1D · ?shuffle=1
     Controls: hover pauses (tape-marquee convention) · ←/→ step · space pauses.
     Hammerspoon can place several /wall windows with different lists — that IS
     the scene composition model. LOOK rides the Visuals sprint — plumbing only.
     Data: hub_favorites via pg() — DB reads ONLY, never FMP from pages.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ min-width:0; box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono); overflow:hidden; }
#stage{ position:absolute; inset:0; }
.pane{ position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0;
  transition:opacity .18s linear; pointer-events:none; background:var(--bg); }
.pane.front{ opacity:1; pointer-events:auto; }
/* wall HUD — thin, hub-toned (plumbing chrome only) */
#hud{ position:fixed; right:10px; bottom:8px; z-index:10; display:flex; align-items:center; gap:10px;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  background:rgba(10,10,15,.82); border:.8px solid var(--hair); padding:5px 10px; }
#hud b{ color:var(--crk); font-weight:400; }
#hud .tk{ color:var(--ink2); letter-spacing:.08em; }
#hud .st{ color:var(--mute); }
#hud .bar{ position:relative; width:64px; height:3px; background:var(--line2); overflow:hidden; }
#hud .bar i{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--crk); }
#hud button{ background:none; border:.6px solid var(--line2); color:var(--ink2); font-family:var(--mono);
  font-size:9px; padding:2px 7px; cursor:pointer; letter-spacing:.08em; }
#hud button:hover{ color:var(--crk); border-color:rgba(0,212,255,.45); }
</style>
</head>
<body>
<div id="stage">
  <iframe class="pane" id="p0" title="chart A"></iframe>
  <iframe class="pane" id="p1" title="chart B"></iframe>
</div>
<div id="hud">
  <b>WALL</b>
  <span class="tk" id="hTk">—</span>
  <span class="st" id="hIx"></span>
  <span class="bar"><i id="hBar"></i></span>
  <span class="st" id="hSt"></span>
  <button data-act="prev" title="previous (←)">◀</button>
  <button data-act="pause" id="hPause" title="pause/resume (space)">❚❚</button>
  <button data-act="next" title="next (→)">▶</button>
</div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON },
      });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) {
        lastErr = new Error("pg " + path + " → " + r.status);
      } else {
        throw new Error("pg " + path + " → " + r.status);
      }
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const el = (id) => document.getElementById(id);

/* ---- wall params ---- */
const QS = new URLSearchParams(location.search);
const DWELL  = Math.max(5, Math.min(300, +(QS.get("dwell") || 20))) * 1000;
const RANGE  = QS.get("range") || "1D";
const SHUFFLE = QS.get("shuffle") === "1";
const LIST_P = String(QS.get("list") || "").toUpperCase().split(",").map(s=>s.trim()).filter(Boolean);
const SWAP_PRELOAD_MS = 2600;   // start loading the next chart this long before the dwell ends
const SWAP_MAX_WAIT   = 6000;   // swap anyway if the back pane never fires load (chart shows its own honest empty state)

/* ---- rotation state ---- */
let LIST = ["MU", "NBIS", "SNDK"];   // hub FAV seed fallback (hub boot list)
let IX = 0;                          // index of the chart currently FRONT
let FRONT = 0;                       // which pane is front (0/1)
let PAUSED = false;
let HOVERING = false;
let cycleT0 = 0, rafId = null, swapTimer = null, loadTimer = null, pendingSwap = false;

const chartURL = (t) => "/chart?t=" + encodeURIComponent(t) + "&range=" + encodeURIComponent(RANGE);
const pane = (k) => el("p" + k);

function hud() {
  el("hTk").textContent = LIST[IX] || "—";
  el("hIx").textContent = (IX + 1) + "/" + LIST.length + " · " + RANGE;
  el("hSt").textContent = PAUSED ? "paused" : (HOVERING ? "hover-hold" : Math.round(DWELL/1000) + "s");
  el("hPause").textContent = PAUSED ? "▶" : "❚❚";
}
function tickBar() {
  if (rafId) cancelAnimationFrame(rafId);
  const step = () => {
    const stalled = PAUSED || HOVERING;
    const f = stalled ? 0 : Math.min(1, (Date.now() - cycleT0) / DWELL);
    el("hBar").style.width = (f * 100) + "%";
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

/* double-buffer swap: PRELOAD next into the back pane early, but FLIP only at the
   full dwell mark (manual steps flip as soon as loaded). Flip holds while the
   pointer is on the wall — never yank a chart mid-scrub (tape-hover convention). */
function beginSwap(nextIx, immediate) {
  if (pendingSwap) return;
  pendingSwap = true;
  const back = 1 - FRONT, bp = pane(back);
  const flip = () => {
    if (!pendingSwap) return;
    if (!immediate && (HOVERING || PAUSED)) { setTimeout(flip, 500); return; }   // hold under the cursor
    pendingSwap = false;
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    bp.classList.add("front");
    pane(FRONT).classList.remove("front");
    FRONT = back;
    IX = nextIx;
    cycleT0 = Date.now();
    hud();
    schedule();
  };
  bp.onload = () => {
    const remaining = immediate ? 60 : Math.max(350, (cycleT0 + DWELL) - Date.now());
    setTimeout(flip, remaining);                              // full dwell honored — preload just hides the load
  };
  loadTimer = setTimeout(flip, Math.max(SWAP_MAX_WAIT, (cycleT0 + DWELL) - Date.now() + 1500));   // dead-load failsafe
  bp.src = chartURL(LIST[nextIx]);
}
function schedule() {
  if (swapTimer) clearTimeout(swapTimer);
  if (PAUSED) return;
  const wait = Math.max(200, DWELL - SWAP_PRELOAD_MS);
  swapTimer = setTimeout(() => {
    if (PAUSED || HOVERING) { schedule0(1200); return; }      // hover/pause holds the wall — re-check shortly
    beginSwap((IX + 1) % LIST.length, false);
  }, wait);
}
function schedule0(ms) { if (swapTimer) clearTimeout(swapTimer); swapTimer = setTimeout(() => {
  if (PAUSED || HOVERING) { schedule0(1200); return; }
  beginSwap((IX + 1) % LIST.length, false);
}, ms); }
function step(d) {
  if (pendingSwap) return;
  const n = ((IX + d) % LIST.length + LIST.length) % LIST.length;
  beginSwap(n, true);
}
function setPaused(p) { PAUSED = p; hud(); if (!PAUSED) { cycleT0 = Date.now(); schedule(); } }

/* hover holds rotation (tape-marquee convention) — pointer over the stage or HUD */
document.addEventListener("pointerover", () => { HOVERING = true; hud(); });
document.addEventListener("pointerleave", () => { HOVERING = false; cycleT0 = Date.now(); hud(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === " ") { e.preventDefault(); setPaused(!PAUSED); }
});
el("hud").addEventListener("click", (e) => {
  const n = e.target.closest("[data-act]"); if (!n) return;
  const a = n.dataset.act;
  if (a === "next") step(1);
  else if (a === "prev") step(-1);
  else if (a === "pause") setPaused(!PAUSED);
});

/* ---- boot: explicit ?list= else hub_favorites (DB) else hub FAV seed ---- */
async function boot() {
  if (LIST_P.length) {
    LIST = LIST_P;
  } else {
    try {
      const rows = await pg("hub_favorites?select=ticker");
      const favs = Array.isArray(rows) ? rows.map((r) => String(r.ticker).toUpperCase()).filter(Boolean) : [];
      if (favs.length) LIST = favs;
    } catch (_) {}
  }
  if (SHUFFLE) for (let i = LIST.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [LIST[i], LIST[j]] = [LIST[j], LIST[i]]; }
  IX = 0;
  const fp = pane(FRONT);
  fp.onload = () => { cycleT0 = Date.now(); hud(); schedule(); };
  fp.src = chartURL(LIST[0]);
  fp.classList.add("front");
  cycleT0 = Date.now();
  hud(); tickBar();
}
boot();
</script>
</body>
</html>
