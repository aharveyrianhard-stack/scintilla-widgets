<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCINTILLA · feed A — market</title>
<!-- ============================================================================
     SCINTILLA · FEED A — the curated Scintilla market/news video feed.
     ONE clean surface: a single player at the top, the feed underneath.
     Nothing to crop out. Its own route. Feed B (personal) is /feed-b.
     FEED SPLIT is real, not invented: youtube_feed rows carrying ticker tags
     (tickers non-empty) = the market feed — 1,884 rows at build time.
     PICTURE-IN-PICTURE, honestly: the player is YouTube's own iframe with
     playsinline=1, which is the only legal way to show this content. On iOS a
     cross-origin iframe cannot be pushed into PiP by our script — the browser
     forbids it. What works: press play, then use the player's own
     fullscreen → PiP control. The route's job is to hand you ONE clean video
     with nothing else fighting it, which it does.
     MOBILE-SAFE: exactly one iframe, ever. Thumbnails are lazy <img>. No
     nested pages, no rotation, no animation loop.
     Params: ?v=VIDEOID (deep-link a video) · ?limit=40 (10-120) ·
       ?shorts=1 (include shorts; default off) · ?t=MU (only that ticker's videos)
     DB reads only, never FMP · youtube_feed · scintilla-live.
     Receipt: HSC-FEEDA-LIVE-001.
     ============================================================================ -->
<style>
:root{
  --bg:#0A0A0F; --panel2:#0F0F1A; --line:#1A1A2A; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --bull:#00FFA3;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--mono);
  -webkit-font-smoothing:antialiased; font-size:11px; letter-spacing:.02em;
  display:flex; flex-direction:column; overflow:hidden; -webkit-text-size-adjust:100%; }
#hd{ flex:none; display:flex; align-items:baseline; gap:8px; padding:9px 12px 7px;
  padding-top:calc(9px + env(safe-area-inset-top)); border-bottom:1px solid var(--line); }
#hd .k{ color:var(--crk); font-size:9px; letter-spacing:.22em; text-transform:uppercase; }
#hd .s{ color:var(--dim); font-size:9px; }
#hd .o{ margin-left:auto; color:var(--mute); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }
#hd .o a{ color:var(--crk); text-decoration:none; }
#player{ flex:none; width:100%; aspect-ratio:16/9; background:#000; border-bottom:1px solid var(--line); }
#player iframe{ width:100%; height:100%; border:0; display:block; }
#now{ flex:none; padding:7px 12px; border-bottom:1px solid var(--line); }
#now .t{ color:var(--ink); font-size:11.5px; line-height:1.4; }
#now .c{ color:var(--dim); font-size:9px; margin-top:3px; }
#pip{ flex:none; padding:5px 12px; color:var(--mute); font-size:8px; letter-spacing:.08em;
  text-transform:uppercase; border-bottom:1px solid var(--line); }
#list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.it{ display:flex; gap:9px; padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start; }
.it:hover{ background:var(--panel2); }
.it.on{ background:rgba(0,212,255,.08); border-left:3px solid var(--crk); padding-left:9px; }
.it img{ flex:none; width:88px; height:50px; object-fit:cover; background:#12121c; border:1px solid var(--line); }
.it .m{ flex:1; min-width:0; }
.it .t{ color:var(--ink2); font-size:10.5px; line-height:1.35; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.it .s{ color:var(--mute); font-size:8.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.it .tk{ color:var(--crk); }
.empty{ margin:auto; padding:20px; color:var(--mute); font-size:9px; letter-spacing:.14em; text-transform:uppercase; text-align:center; }
</style>
</head>
<body>
<div id="hd"><span class="k">FEED A</span><span class="s">scintilla · market</span>
  <span class="o"><a href="/feed-b">feed B →</a></span></div>
<div id="player"></div>
<div id="now"><div class="t" id="nt">pick a video</div><div class="c" id="nc"></div></div>
<div id="pip">play, then use the player's own fullscreen → picture-in-picture button · youtube_feed · db reads only</div>
<div id="list"><div class="empty">loading feed…</div></div>
<script>
"use strict";
/* ---- THE PULL LAYER — ported verbatim from scintilla-hub ---- */
const SB   = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
async function pg(path, _tries) {
  const tries = _tries == null ? 3 : _tries;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status === 503 || r.status === 504 || r.status === 429) lastErr = new Error("pg " + path + " → " + r.status);
      else throw new Error("pg " + path + " → " + r.status);
    } catch (e) { lastErr = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1) + Math.random() * 300));
  }
  throw lastErr;
}
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ==== THE ONLY LINE THAT DIFFERS BETWEEN FEED A AND FEED B ==== */
const FEED = "market";   /* market = ticker-tagged (Scintilla curated) */

const QS = new URLSearchParams(location.search);
const START  = (QS.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
const LIMIT  = Math.max(10, Math.min(120, +(QS.get("limit") || 40)));
const SHORTS = QS.get("shorts") === "1";
const TICK   = (QS.get("t") || "").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");

const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
};

/* one iframe for the life of the page — we only ever change its src */
function play(v) {
  el("player").innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(v.video_id) +
    '?playsinline=1&rel=0&modestbranding=1" title="' + esc(v.title) +
    '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  el("nt").textContent = v.title || v.video_id;
  el("nc").textContent = [v.channel, v.tickers ? "$" + String(v.tickers).replace(/,/g, " $") : "", v.duration || ""]
    .filter(Boolean).join("  ·  ");
  for (const n of document.querySelectorAll(".it")) n.classList.toggle("on", n.dataset.v === v.video_id);
}

async function load() {
  let q = "youtube_feed?select=video_id,title,channel,tickers,duration,is_short,thumb_url,published_at" +
          "&order=published_at.desc&limit=" + LIMIT;
  q += FEED === "market" ? "&tickers=not.is.null&tickers=neq." : "&or=(tickers.is.null,tickers.eq.)";
  if (!SHORTS) q += "&is_short=eq.false";
  if (TICK) q += "&tickers=ilike.*" + encodeURIComponent(TICK) + "*";
  const rows = await pg(q);
  if (!Array.isArray(rows) || !rows.length) { el("list").innerHTML = '<div class="empty">no videos in this feed right now</div>'; return; }
  el("list").innerHTML = rows.map((v) =>
    '<div class="it" data-v="' + esc(v.video_id) + '">' +
    (v.thumb_url ? '<img loading="lazy" src="' + esc(v.thumb_url) + '" alt="">' : '<img alt="">') +
    '<div class="m"><div class="t">' + esc(v.title) + "</div>" +
    '<div class="s">' + esc(v.channel || "") + (v.published_at ? " · " + ago(v.published_at) : "") +
      (v.tickers ? ' · <span class="tk">$' + esc(String(v.tickers).split(",")[0]) + "</span>" : "") +
      (v.duration ? " · " + esc(v.duration) : "") + "</div></div></div>").join("");
  const byId = {}; for (const v of rows) byId[v.video_id] = v;
  for (const n of document.querySelectorAll(".it"))
    n.addEventListener("click", () => play(byId[n.dataset.v]));
  play(START && byId[START] ? byId[START] : rows[0]);
}
load().catch(() => { el("list").innerHTML = '<div class="empty">feed unavailable</div>'; });
</script>
</body>
</html>
