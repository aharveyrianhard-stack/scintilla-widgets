<!-- ============================================================================================================================
     THE STATION, BROADCAST LAYOUT (19 Nov 2026, coordinator)
     Alan, 17:20 ET on his photo of the TV (relayed): "It's garbage... The proportions, these tapes, the relative volume, they stacked it...
     cropped... the tapes are shit... we have to have earnings, economic, scintillas, sigma moves, these bar alerts, the volume alerts...
     I don't use these charts... and these sliders", and a live AI read. 17:55 in his own words: "The proportions of the relative volume
     don't make sense like that. Compressed and ugly. Like, the fonts are all inconsistent... Tapes in one place, other tapes in another.
     Inconsistent tapes."
     THE RULES THIS PAGE KEEPS (tests/station-broadcast-20261119.test.mjs holds them):
       - ONE stage, 1920 x 1080, scaled as a whole to the window: the TV, the MacBook and the iMac show the same picture, bigger or
         smaller - nothing re-flows, nothing is cropped.
       - ONE typeface; FOUR sizes: 22 labels, 30 details, 44 tape text, 72 the big lines.
       - 19 Nov 18:30 ("impossible to read... too much text, too small"): ONE SPOTLIGHT line for whatever just became relevant, giant,
         over TWO big tapes (ECONOMIC + EARNINGS, SCINTILLAS with the big candles and volume alerts), same size and speed, fading at
         the edges instead of cutting words.
       - The relative volume is one real panel with its own chart (no second copy, no strip squeezed under the tapes).
       - No lens charts, no sliders, no FAVORITES strip, no X.
     Data (read-only, the public key): news_reads (AI read), econ_calendar, earnings_events, scintillas, rpc station_tape_alerts (big
     candles + volume alerts), and the volume-pulse feed (heartbeat + ratios) like the old volume panel.
     The old wall stays at /deck/?deck=1.
     22 Nov 2026 (coordinator, Alan's ask relayed by the markets session, dispatch STATION-20261122-01):
       - WALLS · VOLUME AT RESISTANCE under the relative volume: two rows he switches by name (tap a row), ALL opens every name over
         the whole stage. Read-only from the markets session's volume-pulse /api/walls; its states and thresholds are theirs.
         A name that turns PUSHING, BROKE, REJECTED or LOSING flashes its row, takes the spotlight and lands in the SCINTILLAS tape.
         To make room the chart is shorter and the three ratio pairs ride in the ECONOMIC + EARNINGS tape (RATIOS).
       - The tapes take the Hub's economic tape look (his favourite): a glowing dot per item, still while it is far off, breathing
         inside the hour, a hard pulse at the minute (one at a time), still once it has landed; a NOW mark where the past ends.
     ============================================================================================================================ -->
<style>
:root{ --bg:#0A0A0F; --panel:#0F0F19; --box:#141424; --line:#24243A; --ink:#F2F2F8; --ink2:#C9CBE0; --dim:#8A8EAE;
  --crk:#00D4FF; --bull:#00FFA3; --bear:#FF3B62; --amber:#FFB020;
  --f:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace; --s1:22px; --s2:30px; --s3:44px; --s4:72px; }
*{ box-sizing:border-box; margin:0; }
html,body{ height:100%; background:var(--bg); color:var(--ink); font-family:var(--f); overflow:hidden; -webkit-font-smoothing:antialiased; }
body{ display:flex; align-items:center; justify-content:center; }
#stage{ position:relative; width:1920px; height:1080px; flex:none; background:var(--bg); overflow:hidden; }
.lab{ font-size:var(--s1); font-weight:700; letter-spacing:.12em; color:var(--crk); text-transform:uppercase; white-space:nowrap; }
.dim{ color:var(--dim); } .up{ color:var(--bull); } .dn{ color:var(--bear); } .am{ color:var(--amber); }
#top{ display:grid; grid-template-columns:1280px 636px; gap:4px; height:640px; }
/* the video part (feed + player), the same shell the old wall mounts, drawn bigger so its type sits with ours */
#video{ position:relative; overflow:hidden; background:#000; }
#video iframe{ position:absolute; left:0; top:0; border:0; width:calc(1280px / 1.5); height:calc(640px / 1.5); zoom:1.5; }
/* RELATIVE VOLUME */
#vol{ background:var(--panel); padding:18px 22px; display:flex; flex-direction:column; }
.head{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.big{ display:flex; align-items:baseline; gap:18px; margin-top:10px; }
.big b{ font-size:var(--s4); font-weight:800; line-height:1; }
.big span{ font-size:var(--s1); color:var(--ink2); white-space:nowrap; }
#chart{ display:block; margin-top:12px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:8px; }
.stat{ background:var(--box); padding:10px 14px; min-width:0; }
.stat .l{ display:block; font-size:var(--s1); letter-spacing:.1em; color:var(--dim); white-space:nowrap; }
.stat .v{ display:block; font-size:var(--s2); font-weight:800; line-height:1.3; white-space:nowrap; }
/* THE BOTTOM (19 Nov 18:30, Alan from the couch): one SPOTLIGHT - whatever just became relevant, giant - over two big tapes */
#bottom{ position:absolute; left:0; right:0; bottom:0; height:436px; display:grid; grid-template-rows:196px 116px 116px; gap:4px; }
.row{ display:grid; grid-template-columns:360px 1fr; background:var(--panel); min-width:0; }
.row .name{ display:flex; flex-direction:column; justify-content:center; gap:8px; padding:0 24px; background:var(--box); white-space:nowrap; }
.row .name em{ font-style:normal; font-size:var(--s1); color:var(--ink2); letter-spacing:.04em; }
.row .name.soon em{ color:var(--amber); animation:soon 1.4s ease-in-out infinite; }
#spot .body{ display:flex; flex-direction:column; justify-content:center; gap:10px; padding:0 36px; min-width:0; overflow:hidden; }
#spot .a{ font-size:var(--s4); font-weight:800; line-height:1.08; white-space:nowrap; }
#spot .a.long{ font-size:var(--s3); white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
#spot .b{ font-size:var(--s2); font-weight:500; line-height:1.3; color:var(--ink2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
#spot.flash{ animation:flash 1s ease-in-out 6; }
#spot.soon .a{ color:var(--amber); }
@keyframes soon{ 50%{ opacity:.35; } }
@keyframes flash{ 50%{ background:rgba(0,212,255,.22); box-shadow:inset 0 0 0 3px rgba(0,212,255,.85); } }
.win{ position:relative; overflow:hidden; min-width:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 110px,#000 calc(100% - 180px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 110px,#000 calc(100% - 180px),transparent 100%); }
.track{ position:absolute; left:0; top:0; height:100%; display:flex; align-items:center; white-space:nowrap; padding-left:30px;
  font-size:var(--s3); font-weight:600; will-change:transform; }
.track.run{ animation:crawl linear infinite; }
@keyframes crawl{ from{ transform:translateX(0); } to{ transform:translateX(var(--lap)); } }
.track .it{ display:inline-flex; align-items:baseline; gap:16px; }
.track .sep{ color:var(--dim); padding:0 34px; }
.track b{ font-weight:800; }
.track .t{ color:var(--dim); font-weight:500; }
.track .quiet{ color:var(--dim); }
.ck{ color:var(--crk); }
/* THE SCINTILLATE LOOK (22 Nov, Alan's favourite tape - the Hub's economic one): every item carries a dot in its own colour with a
   glow; the dot is still while the thing is far off, breathes inside the hour (2.4 s), tightens inside ten minutes (1.1 s), pulses
   hard at its minute (one at a time) and goes still once it has landed. Only opacity moves, so no word ever shifts. */
.dot{ display:inline-block; flex:none; align-self:center; width:18px; height:18px; border-radius:50%; background:currentColor;
  box-shadow:0 0 14px 3px currentColor; }
.s-still .dot, .s-up .dot, .dot.s-still{ opacity:.55; box-shadow:none; }
.s-soon .dot, .dot.s-soon{ animation:breathe 2.4s ease-in-out infinite; }
.s-near .dot, .dot.s-near{ animation:breathe 1.1s ease-in-out infinite; }
.s-due .dot, .dot.s-due{ animation:hard .38s ease-in-out infinite; }
.s-past .dot{ opacity:.9; box-shadow:none; }
@keyframes breathe{ 0%,100%{ opacity:1; } 50%{ opacity:.22; } }
@keyframes hard{ 0%,100%{ opacity:1; } 50%{ opacity:.12; } }
.track .now{ color:var(--crk); font-size:var(--s1); font-weight:700; letter-spacing:.16em; align-items:center; transform:translateY(-5px); }
.track .now i{ display:inline-block; width:44px; height:2px; background:var(--crk); opacity:.6; }
/* WALLS · VOLUME AT RESISTANCE (22 Nov): two rows he picks, ALL for every name */
#walls{ position:relative; margin-top:auto; }
#walls > .head{ align-items:center; height:32px; }
.wbtn{ font:inherit; font-size:var(--s1); font-weight:700; background:none; border:1px solid var(--line); padding:1px 12px; cursor:pointer; }
.wbtn:hover{ border-color:var(--crk); }
.wrows{ display:grid; grid-template-rows:88px 88px; gap:4px; margin-top:6px; }
.wrow{ --wc:var(--dim); background:var(--box); padding:6px 14px; display:flex; flex-direction:column; justify-content:center; gap:2px;
  min-width:0; cursor:pointer; }
.wrow:hover{ box-shadow:inset 0 0 0 1px var(--line); }
.wrow.flash{ animation:wflash 1s ease-in-out 6; }
@keyframes wflash{ 50%{ background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 3px var(--wc); } }
.wl1{ display:flex; align-items:center; gap:14px; height:48px; min-width:0; }
.wl2{ display:flex; align-items:baseline; gap:14px; font-size:var(--s1); color:var(--ink2); white-space:nowrap; min-width:0; }
.wl2 .lv{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.wnm{ font-size:var(--s3); font-weight:800; line-height:1; white-space:nowrap; }
.wst{ font-size:var(--s2); font-weight:800; letter-spacing:.04em; white-space:nowrap; color:var(--wc); }
.wsp{ display:block; }
.wl1 .sp{ margin-left:auto; flex:none; }
.wl2 .vx{ flex:none; }
.wl2 b, .arow b{ font-weight:800; }
#wpick{ position:absolute; inset:0; z-index:5; background:var(--panel); display:flex; flex-direction:column; gap:10px; }
#wpick .chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font:inherit; font-size:var(--s1); font-weight:700; letter-spacing:.06em; color:var(--ink2); background:var(--box);
  border:1px solid var(--line); padding:3px 10px; cursor:pointer; }
.chip.on{ color:var(--crk); border-color:var(--crk); }
#wallsAll{ position:absolute; inset:0; z-index:20; background:var(--bg); padding:24px 40px; display:flex; flex-direction:column; gap:12px; }
#wallsAll > .head{ align-items:center; justify-content:flex-start; height:40px; }
#wallsAll > .head .wbtn{ margin-left:auto; }
#aclock{ font-size:var(--s1); color:var(--dim); white-space:nowrap; }
#arows{ flex:1 1 auto; min-height:0; display:grid; gap:4px; }
.arow{ --wc:var(--dim); display:grid; grid-template-columns:200px 210px 1fr 280px 240px; gap:24px; align-items:center; background:var(--panel);
  padding:0 18px; min-height:0; overflow:hidden; }
.arow .c1{ display:flex; align-items:center; gap:14px; min-width:0; }
.arow .c2, .arow .c3, .arow .c4{ display:flex; flex-direction:column; gap:2px; min-width:0; font-size:var(--s1); white-space:nowrap; }
.arow .c3 span{ overflow:hidden; text-overflow:ellipsis; }
.arow .c2 .wst{ font-size:var(--s2); }
#arows.dense .c2 .px, #arows.dense .c3 .nx, #arows.dense .c4 .sz{ display:none; }
#wallsAll[hidden], #wpick[hidden]{ display:none; }   /* their own display:flex would otherwise beat the hidden attribute */
</style>

<body>
<div id="stage">
  <div id="top">
    <div id="video"><iframe id="videoFrame" title="Videos" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div id="vol">
      <div class="head"><span class="lab">Relative volume</span><span class="lab am" id="volState">—</span></div>
      <div class="big"><b id="volNow">—</b><span id="volSub">its usual</span></div>
      <svg id="chart" width="592" height="168" viewBox="0 0 592 168" aria-label="relative volume today, 5-minute bars"></svg>
      <div class="stats">
        <div class="stat"><span class="l">BLOCK</span><span class="v" id="stBlock">—</span></div>
        <div class="stat"><span class="l">2-MIN FLOW</span><span class="v" id="stFlow">—</span></div>
        <div class="stat"><span class="l">BREADTH</span><span class="v" id="stBreadth">—</span></div>
      </div>
      <div id="walls">
        <div class="head"><span class="lab">Walls · volume at resistance</span><button class="wbtn lab" id="wallsAllBtn" title="every name, over the whole Station">ALL ⛶</button></div>
        <div class="wrows" id="wrows">
          <div class="wrow" data-slot="0" title="tap to pick the name"></div>
          <div class="wrow" data-slot="1" title="tap to pick the name"></div>
        </div>
        <div id="wpick" hidden></div>
      </div>
    </div>
  </div>
  <div id="bottom">
    <div class="row" id="spot"><div class="name"><span class="lab" id="spotKind">—</span><em id="spotWhen"></em></div><div class="body"><div class="a" id="spotA"></div><div class="b" id="spotB"></div></div></div>
  </div>
  <div id="wallsAll" hidden>
    <div class="head"><span class="lab">Walls · volume at resistance</span><span id="aclock"></span><button class="wbtn lab" id="wallsClose">✕ close</button></div>
    <div id="arows"></div>
  </div>
</div>
<script>
"use strict";
/* ---- the stage: one 1920 x 1080 picture, scaled whole to the window ---- */
const STAGE_W = 1920, STAGE_H = 1080;
function fitStage() {
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  document.documentElement.style.zoom = String(Math.round(s * 10000) / 10000);
}
fitStage(); addEventListener("resize", fitStage);

const SB = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g";
const PG = { apikey: ANON, Authorization: "Bearer " + ANON };
const VP = "https://volume-pulse-pied.vercel.app";
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const remembered = (k, d) => { try { return localStorage.getItem(k) || d; } catch (_) { return d; } };
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const etParts = (d) => Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false }).formatToParts(d).map((p) => [p.type, p.value]));
const etHM = (d) => { const p = etParts(d); return (p.hour === "24" ? "00" : p.hour) + ":" + p.minute; };
const etDate = (d) => { const p = etParts(d); return p.year + "-" + p.month + "-" + p.day; };
const etDay = (d) => etParts(d).weekday.toUpperCase();
const pct = (v, dp = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(dp) + "%";
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "");
const cls = (v) => (v > 0 ? "up" : v < 0 ? "dn" : "");
async function getJSON(url, opt) { const r = await fetch(url, Object.assign({ cache: "no-store" }, opt || {})); if (!r.ok) throw new Error(r.status); return r.json(); }
const rest = (path) => getJSON(SB + "/rest/v1/" + path, { headers: PG });
const rpc = (fn, body) => getJSON(SB + "/rest/v1/rpc/" + fn, { method: "POST", headers: Object.assign({ "content-type": "application/json" }, PG), body: JSON.stringify(body || {}) });
/* midnight in New York, as an instant: 05:00 UTC in winter (EST), 04:00 UTC in summer (EDT) */
const todayStartIso = () => { const now = new Date(), p = etParts(now);
  const edt = /EDT/.test(now.toLocaleString("en-US", { timeZone: "America/New_York", timeZoneName: "short" }));
  return p.year + "-" + p.month + "-" + p.day + "T0" + (edt ? 4 : 5) + ":00:00.000Z"; };

/* ---- the video part: the Station's own feed + player shell, the feed tab remembered ---- */
const SHELL = { personal: "/station-shells/personal-video-v1", scintilla: "/station-shells/scintilla-video-v1" };
const FEED_KEY = "station.broadcast.feed";
let VIDEO_ON = false;
const videoSrc = (a, cue) => (SHELL[a] || SHELL.scintilla) + "/?shell=v1&feed=" + encodeURIComponent(a) + "&cols=1&beside=1&besideCol=154&fixed=1" + (cue ? "&v=" + cue : "");
function mountVideo(account) {
  const a = String(account || "scintilla").toLowerCase().replace(/[^a-z0-9_-]/g, "") || "scintilla";
  remember(FEED_KEY, a);
  el("videoFrame").src = videoSrc(a, "");
  cueNewest(a);
}
/* never a black box: once the feed has drawn its cards, the newest one is CUED in the player (loaded, not played - he presses play).
   Same-origin read of the feed's first card; one remount with ?v=; skipped if a video is already on. */
let CUE_TRY = 0;
function cueNewest(a) {
  const my = ++CUE_TRY, t0 = Date.now();
  const tick = () => {
    if (my !== CUE_TRY || VIDEO_ON) return;
    let id = "";
    try { const d = el("videoFrame").contentDocument; id = (d && d.querySelector("[data-v]") && d.querySelector("[data-v]").dataset.v) || ""; } catch (_) {}
    if (/^[A-Za-z0-9_-]{11}$/.test(id)) { el("videoFrame").src = videoSrc(a, id); return; }
    if (Date.now() - t0 < 20000) setTimeout(tick, 700);
  };
  setTimeout(tick, 1200);
}
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.sc === "video-feed") mountVideo(e.data.account);
  if (e.data.sc === "video-playing") VIDEO_ON = !!e.data.on;
});
/* 19 Nov 21:55: the self-update (at the bottom) waited for "no video", and the shell calls a merely CUED video "playing", so this page -
   which cues the newest video itself - never updated again: his TV sat on the 18:08 six-tape version all evening. Busy now means what he
   would call busy: a video playing, buffering or paused, or floating in its own window. An older shell (no marks): its message, as before. */
function videoBusy() {
  try {
    const b = el("videoFrame").contentDocument.body;
    if (b && b.dataset.scShell === "2") return b.dataset.scFloat === "1" || ["1", "2", "3"].includes(b.dataset.scPlay || "");
  } catch (_) {}
  return VIDEO_ON;
}
mountVideo(remembered(FEED_KEY, "scintilla"));

/* ---- THE BOTTOM: one SPOTLIGHT + two big tapes ----
   Alan, 19 Nov 18:30 (relayed), on the six-tape version: "impossible to read" from the couch - "too much text, too small"; "the
   economic and scintillas tapes are the better ones"; he needs "a way to show info as it becomes relevant, bigger".
   - SPOTLIGHT: anything NEW (a scintilla, a big candle, a volume alert, an economic print, an earnings result, the AI read) takes the
     big line for 40 s (20 s when several wait), flashing as it lands; then it lives in its tape. With nothing new it shows what is next
     (the next economic release, counting down, amber in its last 10 minutes) and the latest AI read, in turn.
   - Two tapes, the same size and speed: ECONOMIC + EARNINGS (what happens today, in time order) and SCINTILLAS (the moves: scintillas,
     big candles, volume alerts, newest first). Short items: the spotlight carries the detail. */
const SPEED = 90;   /* stage px a second, both tapes */
const TAPES = [{ key: "today", label: "Economic + earnings" }, { key: "moves", label: "Scintillas" }];
const T = {};
for (const d of TAPES) {
  const row = document.createElement("div"); row.className = "row tape"; row.dataset.tape = d.key;
  row.innerHTML = '<div class="name"><span class="lab">' + esc(d.label) + '</span><em></em></div><div class="win"><div class="track"></div></div>';
  el("bottom").appendChild(row);
  const t = { row, name: row.querySelector(".name"), meta: row.querySelector(".name em"), win: row.querySelector(".win"), track: row.querySelector(".track"), pending: null, html: "" };
  t.track.addEventListener("animationiteration", () => { if (t.pending != null) { const h = t.pending; t.pending = null; paint(t, h); } });
  T[d.key] = t;
}
const zoomNow = () => parseFloat(document.documentElement.style.zoom) || 1;
function paint(t, html) { lay(t, html); refreshDots(); }
function lay(t, html) {
  t.html = html; t.track.classList.remove("run"); t.track.style.removeProperty("--lap");
  t.track.innerHTML = '<span class="copy">' + html + "</span>";
  const one = t.track.firstChild.getBoundingClientRect().width / zoomNow(), room = t.win.getBoundingClientRect().width / zoomNow();
  if (one + 30 <= room) return;   /* it fits: it stands still, whole */
  t.track.innerHTML = '<span class="copy">' + html + '<span class="sep">·</span></span><span class="copy">' + html + '<span class="sep">·</span></span>';
  const lap = t.track.firstChild.getBoundingClientRect().width / zoomNow();
  t.track.style.setProperty("--lap", "-" + lap.toFixed(1) + "px");
  t.track.style.animationDuration = (lap / SPEED).toFixed(2) + "s";
  void t.track.offsetWidth; t.track.classList.add("run");
}
function setTape(key, items, meta, soon, empty) {
  const t = T[key]; if (!t) return;
  t.meta.textContent = meta || ""; t.name.classList.toggle("soon", !!soon);
  const html = items.length ? items.join('<span class="sep">·</span>') : '<span class="quiet">' + esc(empty || "nothing yet today") + "</span>";
  if (html === t.html && t.pending == null) return;
  /* a running tape takes new content at the end of its lap (no jump mid-read); in the first 20 s after load the feeds are still
     arriving one by one, so they go straight in */
  if (t.track.classList.contains("run") && Date.now() - BOOT > 20000) t.pending = html; else paint(t, html);
}
const BOOT = Date.now();
/* an item carries what its dot needs: its kind (k), the moment it is about (at, ms), landed (l) and whether a number is expected (x).
   The dot's state is never written into the tape's text - refreshDots sets it on the drawn items - so a tape is only re-laid when
   its words change, never because a clock ticked. */
const dotHTML = (col) => '<i class="dot" style="color:' + col + '"></i>';
const item = (parts, o) => '<span class="it"' + (o ? ' data-k="' + o.k + '" data-at="' + Math.round(o.at || 0) + '"' + (o.l ? ' data-l="1"' : "") + (o.x ? ' data-x="1"' : "") : "") +
  ">" + (o && o.col ? dotHTML(o.col) : "") + parts + "</span>";

function dotState(k, at, landed, expects, now) {

    if (k === "earn") return -dt < 3600 ? "s-near" : "s-past";   /* a report has no minute: it breathes until it lands or the hour is out */
    return -dt < (expects ? 3600 : 900) ? "s-due" : "s-past";

const STATE = { "pre-market": "PRE-MARKET", open: "MARKET OPEN", regular: "MARKET OPEN", "after-hours": "AFTER HOURS", closed: "CLOSED" };
function drawChart(slots) {
  const W = 592, H = 168, T0 = 6, base = H - 30, max = 4, rth = slots.filter((s) => !s.ext && s.ratio != null);
  const n = 78, bw = W / n, y = (v) => base - (Math.min(v, max) / max) * (base - T0), f = 'font-family="ui-monospace,SF Mono,Menlo,monospace"';
  let s = "";
  rth.forEach((v, i) => { s += '<rect x="' + (i * bw + 1).toFixed(1) + '" y="' + y(v.ratio).toFixed(1) + '" width="' + (bw - 2).toFixed(1) + '" height="' + (base - y(v.ratio)).toFixed(1) + '" fill="' + (v.ratio >= 1.5 ? "#FFB020" : v.ratio >= 1 ? "#00D4FF" : "#2B5F78") + '"/>'; });
  s += '<line x1="0" x2="' + W + '" y1="' + y(1) + '" y2="' + y(1) + '" stroke="#C9CBE0" stroke-width="1.5" stroke-dasharray="6 6"/>';
  s += '<text x="2" y="' + (y(1) - 8) + '" fill="#C9CBE0" font-size="22" ' + f + '>1×</text>';
  if (rth.length) { const pk = rth.reduce((a, b) => (b.ratio > a.ratio ? b : a)), i = rth.indexOf(pk), right = i * bw > W - 200;
    s += '<text x="' + (right ? i * bw - 8 : i * bw + bw + 8).toFixed(0) + '" y="' + (y(pk.ratio) + 20).toFixed(0) + '" text-anchor="' + (right ? "end" : "start") + '" fill="#FFB020" font-size="22" font-weight="700" ' + f + ">" + pk.ratio.toFixed(1) + "× " + esc(pk.t) + "</text>"; }
  [["09:30", 0, "start"], ["12:00", 30, "middle"], ["14:00", 54, "middle"], ["16:00", 78, "end"]].forEach(([t, i, a]) => { s += '<text x="' + (i * bw).toFixed(0) + '" y="' + (H - 4) + '" text-anchor="' + a + '" fill="#8A8EAE" font-size="22" ' + f + ">" + t + "</text>"; });
  el("chart").innerHTML = s;
}
async function loadVolume() {
  const d = await getJSON(VP + "/api/heartbeat");
  const live = d.forming && d.forming.pace != null && d.marketState !== "closed" ? d.forming.pace : d.latest && d.latest.ratio;
  el("volNow").textContent = live != null ? Number(live).toFixed(1) + "×" : "—";
  el("volSub").textContent = "its usual" + (d.dayRatio != null ? " · day " + Number(d.dayRatio).toFixed(2) + "×" : "");
  el("volState").textContent = (STATE[d.marketState] || String(d.marketState || "").toUpperCase()) + " " + String(d.nyClock || "").slice(0, 5);
  drawChart(d.slots || []);
  const b = d.blocks && d.blocks.items && d.blocks.items[0];
  el("stBlock").innerHTML = b ? '<span class="' + (b.dir === "up" ? "up" : "dn") + '">' + esc(b.sym) + " " + (b.dir === "up" ? "▲" : "▼") + Number(b.sizeX).toFixed(1) + "×</span>" : '<span class="dim">none</span>';
  const fl = d.flow;
  el("stFlow").innerHTML = fl ? (fl.buyPct >= fl.sellPct ? '<span class="up">BUY ' + fl.buyPct + "%</span>" : '<span class="dn">SELL ' + fl.sellPct + "%</span>") : "—";
  const br = d.breadth;
  el("stBreadth").innerHTML = br && br.adv && br.dec ? (br.adv >= br.dec ? '<span class="up">' + (br.adv / br.dec).toFixed(1) + " : 1</span>" : '<span class="dn">1 : ' + (br.dec / br.adv).toFixed(1) + "</span>") : "—";
}
async function loadPairs() {
  const d = await getJSON(VP + "/api/ratios");
  D.pairs = (d.pairs || []).slice(0, 3).filter((p) => p && p.a && p.b && Number.isFinite(Number(p.day)));
  composeToday();
}

/* ---- WALLS · VOLUME AT RESISTANCE (22 Nov 2026) ----
   Alan, relayed by the markets session (dispatch STATION-20261122-01): "a couple of these on Station that he can switch between target
   names, with a button that opens the full screen of all names", in the Station's look. The feed is the markets session's volume-pulse
   /api/walls (Massive 5-minute bars, all hours, CORS open, kept 20 s at its edge): per name the nearest chart walls (the 13/21/50/100/
   200-day averages, the prior day's high, Friday's low, the pre-market high) and how the last 30 minutes meet them - vol (volume against
   the usual for that time of day), buy (the share traded in up bars), size (the average trade against usual) - and a state. The states,
   the walls and every threshold are the markets session's; this page only draws them. No sound: the Station is on the living-room TV. */
const WALL_COL = { PUSHING: "var(--bull)", BROKE: "var(--bull)", RETEST: "var(--crk)", "AT WALL": "var(--amber)", DRIFTING: "var(--amber)",
  "BROKE-LIGHT": "var(--amber)", REJECTED: "var(--bear)", LOSING: "var(--bear)", CLEAR: "var(--dim)" };
const WALL_ORDER = ["REJECTED", "LOSING", "PUSHING", "BROKE", "BROKE-LIGHT", "DRIFTING", "AT WALL", "RETEST", "CLEAR"];
const WALL_LOUD = { PUSHING: "up", BROKE: "up", REJECTED: "dn", LOSING: "dn" };   /* the four that flash, take the spotlight, land in the tape */
const WALL_WATCH = { "AT WALL": 1, DRIFTING: 1, RETEST: 1, "BROKE-LIGHT": 1 };     /* at a wall, nothing decided yet: the dot breathes */
const WALL_BELOW = { BROKE: 1, "BROKE-LIGHT": 1, RETEST: 1, LOSING: 1 };         /* these are about the level just under the price */
const SLOTS_KEY = "station.walls.slots", WALLS_DAY_KEY = "station.walls.day", WALL_DEFAULT = ["SPY", "QQQ"];
let WALLS = [], WALL_AT = 0, PICK = -1;
const WPREV = {}, WSINCE = {}, WSEEN = {}, AROWS = {};
const f1x = (v) => (v == null || !Number.isFinite(Number(v)) ? "–" : Number(v).toFixed(1));
const wallPct = (p) => (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(Number(p)).toFixed(1) + "%";
const volCls = (v) => (v == null ? "dim" : v >= 1.5 ? "am" : v >= 1 ? "ck" : "dim");   /* the relative volume chart's own colours */
try { const j = JSON.parse(localStorage.getItem(WALLS_DAY_KEY) || "null"); if (j && j.day === etDate(new Date()) && Array.isArray(j.ev)) D.wallEv = j.ev.slice(0, 30); } catch (_) {}
function wallLevel(r) {
  const L = WALL_BELOW[r.state] ? r.floor : r.wall;
  if (!L) return r.state === "CLEAR" ? "no wall overhead" : "";
  return (r.state === "CLEAR" ? "next " : "") + L.name + " " + num(L.v) + " " + wallPct(L.pct);
}
/* the dot: still when nothing is near, breathing at a wall or within 1% of one, a hard pulse for the first ten minutes of a loud state */
function wallDot(r) {
  if (!r) return "s-still";
  if (WALL_LOUD[r.state]) return Date.now() - (WSINCE[r.s] || 0) < 600000 ? "s-due" : "s-near";
  if (WALL_WATCH[r.state] || (r.state === "CLEAR" && r.wall && r.wall.pct <= 1)) return "s-soon";
  return "s-still";
}
/* the last two hours: bars = volume against usual (up bars green, down bars red, bright from 1.3x, the dashed line = usual), line = price */
function wallSpark(sp, w, h) {
  if (!sp || !sp.length) return '<svg class="wsp" width="' + w + '" height="' + h + '"></svg>';
  const ps = sp.map((x) => Number(x[0])), lo = Math.min(...ps), hi = Math.max(...ps), n = sp.length, bw = w / n, bh = h * 0.55, lh = h - bh - 3;
  let s = "";
  sp.forEach((x, i) => { const v = Number(x[1]) || 0, hg = Math.min(bh, (v / 2.8) * bh);
    s += '<rect x="' + (i * bw + 0.5).toFixed(1) + '" y="' + (h - hg).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + hg.toFixed(1) +
      '" fill="' + (x[2] ? "#00FFA3" : "#FF3B62") + '" opacity="' + (v >= 1.3 ? 0.9 : 0.38) + '"/>'; });
  const u = (h - bh / 2.8).toFixed(1);
  s += '<line x1="0" x2="' + w + '" y1="' + u + '" y2="' + u + '" stroke="#8A8EAE" stroke-width="1" stroke-dasharray="3 3"/>';
  const pts = ps.map((p, i) => (i * bw + bw / 2).toFixed(1) + "," + (hi > lo ? 1 + (1 - (p - lo) / (hi - lo)) * lh : lh / 2).toFixed(1)).join(" ");
  return '<svg class="wsp" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '">' + s + '<polyline points="' + pts + '" fill="none" stroke="#C9CBE0" stroke-width="2"/></svg>';
}
/* the two rows: the names he picked (kept in this browser), SPY and QQQ until he picks */
function wallSlots() {
  let s = []; try { s = JSON.parse(remembered(SLOTS_KEY, "[]")); } catch (_) {}
  const names = WALLS.map((r) => r.s), ok = (n) => typeof n === "string" && n && (!names.length || names.includes(n)), out = [];
  for (let i = 0; i < 2; i++) out.push(ok(s[i]) ? s[i] : null);
  for (let i = 0; i < 2; i++) if (!out[i]) out[i] = WALL_DEFAULT.concat(names).find((n) => ok(n) && !out.includes(n)) || "";
  return out;
}
/* every field is written in place, so a dot keeps its rhythm between reads and only restarts when its state changes */
function paintWalls() {
  const slots = wallSlots(), by = Object.fromEntries(WALLS.map((r) => [r.s, r]));
  document.querySelectorAll("#wrows .wrow").forEach((row) => {
    const name = slots[Number(row.dataset.slot)], r = by[name], col = r ? WALL_COL[r.state] || "var(--dim)" : "var(--dim)";
    if (!row.firstChild) row.innerHTML = '<div class="wl1"><i class="dot"></i><span class="wnm"></span><span class="wst"></span><span class="sp"></span></div>' +
      '<div class="wl2"><span class="lv"></span><span class="vx"></span></div>';
    row.dataset.name = name || "";
    row.style.setProperty("--wc", col);
    const dot = row.querySelector(".dot"), ds = wallDot(r);
    dot.style.color = col; if (dot.dataset.s !== ds) { dot.className = "dot " + ds; dot.dataset.s = ds; }
    row.querySelector(".wnm").textContent = name || "—";
    row.querySelector(".wst").textContent = r ? r.state : WALL_AT ? "no data" : "reading…";
    row.querySelector(".sp").innerHTML = r ? wallSpark(r.spark, 150, 44) : "";
    row.querySelector(".lv").textContent = r ? wallLevel(r) : "";
    row.querySelector(".vx").innerHTML = r && r.volX != null ? 'vol <b class="' + volCls(r.volX) + '">' + f1x(r.volX) + "×</b>" : "";
  });
}
/* ALL: every name over the whole stage, in the markets session's order (the loud ones first, then the nearest walls) */
function paintWallsAll() {
  const box = el("arows");
  const R = WALLS.slice().sort((a, b) => WALL_ORDER.indexOf(a.state) - WALL_ORDER.indexOf(b.state) || ((a.wall ? a.wall.pct : 99) - (b.wall ? b.wall.pct : 99)));
  box.classList.toggle("dense", R.length > 14);
  box.style.gridTemplateRows = "repeat(" + Math.max(R.length, 14) + ", minmax(0, 1fr))";
  const r0 = WALLS[0];
  el("aclock").textContent = r0 ? "bar " + (r0.clock || "") + " New York" + (r0.ext ? " · extended hours, thin tape" : "") + (r0.session && r0.session !== etDate(new Date()) ? " · session of " + r0.session : "") : "";
  if (!R.length) { box.innerHTML = '<div class="arow"><span class="wst">' + (WALL_AT ? "the walls feed is empty" : "reading the walls…") + "</span></div>"; return; }
  for (const r of R) {
    let row = AROWS[r.s];
    if (!row) { row = document.createElement("div"); row.className = "arow";
      row.innerHTML = '<div class="c1"><i class="dot"></i><span class="wnm"></span></div><div class="c2"><span class="wst"></span><span class="px dim"></span></div>' +
        '<div class="c3"><span class="why"></span><span class="nx dim"></span></div><div class="c4"><span class="vb"></span><span class="sz"></span></div><span class="sp"></span>';
      AROWS[r.s] = row; }
    const col = WALL_COL[r.state] || "var(--dim)", dot = row.querySelector(".dot"), ds = wallDot(r), buy = r.upShare == null ? null : Math.round(r.upShare * 100);
    row.style.setProperty("--wc", col); dot.style.color = col; if (dot.dataset.s !== ds) { dot.className = "dot " + ds; dot.dataset.s = ds; }
    row.querySelector(".wnm").textContent = r.s;
    row.querySelector(".wst").textContent = r.state;
    row.querySelector(".px").textContent = num(r.px);
    row.querySelector(".why").textContent = r.why || "";
    row.querySelector(".nx").textContent = (r.walls || []).slice(r.state === "CLEAR" ? 1 : 0, 3).map((w) => w.name + " " + wallPct(w.pct)).join(" · ");
    row.querySelector(".vb").innerHTML = 'vol <b class="' + volCls(r.volX) + '">' + f1x(r.volX) + '×</b> · buy <b class="' + (buy == null ? "" : buy >= 60 ? "up" : buy <= 40 ? "dn" : "") + '">' + (buy == null ? "–" : buy + "%") + "</b>";
    row.querySelector(".sz").innerHTML = 'size <b class="' + (r.sizeX != null && r.sizeX >= 1.5 ? "am" : "") + '">' + f1x(r.sizeX) + "×</b>";
    row.querySelector(".sp").innerHTML = wallSpark(r.spark, 240, 56);
  }
  const want = R.map((r) => AROWS[r.s]), have = [...box.children];   /* re-order only when the order changed: moving a row restarts its dot */
  if (want.length !== have.length || want.some((x, i) => x !== have[i])) { box.textContent = ""; want.forEach((x) => box.appendChild(x)); }
}
function openWallsAll() { closePick(); el("wallsAll").hidden = false; paintWallsAll(); }
function closeWallsAll() { el("wallsAll").hidden = true; }
function openPick(i) {
  PICK = i;
  const names = WALLS.length ? WALLS.map((r) => r.s) : WALL_DEFAULT, cur = wallSlots();
  el("wpick").innerHTML = '<div class="head"><span class="lab">Row ' + (i + 1) + ' · pick a name</span><button class="wbtn lab" data-pick="">✕</button></div><div class="chips">' +
    names.map((n) => '<button class="chip' + (n === cur[i] ? " on" : "") + '" data-pick="' + esc(n) + '">' + esc(n) + "</button>").join("") + "</div>";
  el("wpick").hidden = false;
}
function closePick() { el("wpick").hidden = true; PICK = -1; }
el("wrows").addEventListener("click", (e) => { const row = e.target.closest(".wrow"); if (row) openPick(Number(row.dataset.slot)); });
el("wpick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  const v = b.dataset.pick;
  if (v && PICK >= 0) { const s = wallSlots(), j = 1 - PICK; if (s[j] === v) s[j] = s[PICK]; s[PICK] = v; remember(SLOTS_KEY, JSON.stringify(s)); paintWalls(); }
  closePick();
});
el("wallsAllBtn").addEventListener("click", openWallsAll);
el("wallsClose").addEventListener("click", closeWallsAll);
addEventListener("keydown", (e) => { if (e.key === "Escape") { closeWallsAll(); closePick(); } });
/* one tape item for a wall moment, in the SCINTILLAS tape with the day's other moves */
function wallMoveItem(e) {
  const c = WALL_LOUD[e.state] === "up" ? "up" : "dn";
  return { at: e.at, html: item('<span class="t">' + etHM(new Date(e.at)) + '</span><b class="' + c + '">' + esc(e.s) + '</b><span class="' + c + '">' + esc(String(e.state).toLowerCase()) + "</span>" +
    esc(e.lvl || "") + (e.volX != null ? '<span class="t">vol</span>' + f1x(e.volX) + "×" : ""), { k: "move", at: e.at, col: WALL_COL[e.state] || "var(--dim)" }) };
}
/* a name ENTERING PUSHING, BROKE, REJECTED or LOSING: its row flashes, the spotlight names it (three or more at once = one line), and the
   SCINTILLAS tape keeps it. The first read is the backlog and says nothing; a name and a state at most once in 20 minutes. */
function wallsAnnounce(fresh) {
  const clock = fresh[0].clock || etHM(new Date()), ext = fresh[0].ext ? " ext" : "";
  const vb = (r) => [r.volX != null ? "vol " + f1x(r.volX) + "×" : "", r.upShare != null ? "buy " + Math.round(r.upShare * 100) + "%" : ""].filter(Boolean).join(" · ");
  if (fresh.length >= 3) {
    const ups = fresh.filter((r) => WALL_LOUD[r.state] === "up").length;
    announce("walls", "many" + clock + fresh.map((r) => r.s).join(""), { kind: "Walls", when: clock + ext, a: fresh.length + " names at their walls",
      b: fresh.map((r) => r.s + " " + r.state.toLowerCase()).join(" · "), cls: ups * 2 >= fresh.length ? "up" : "dn" });
  } else for (const r of fresh) announce("walls", r.s + r.state + clock, { kind: "Walls", when: clock + ext, a: r.s + " " + r.state, b: (r.why || "") + (vb(r) ? " · " + vb(r) : ""), cls: WALL_LOUD[r.state] });
  for (const r of fresh) D.wallEv.unshift({ at: Date.now(), s: r.s, state: r.state, lvl: wallLevel(r), volX: r.volX });
  D.wallEv = D.wallEv.slice(0, 30);
  try { localStorage.setItem(WALLS_DAY_KEY, JSON.stringify({ day: etDate(new Date()), ev: D.wallEv })); } catch (_) {}
  composeMoves();
  document.querySelectorAll("#wrows .wrow").forEach((row) => { if (fresh.some((r) => r.s === row.dataset.name)) { row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); } });
}
async function loadWalls() {
  const d = await getJSON(VP + "/api/walls");
  const rows = (d.rows || []).filter((r) => r && !r.err && r.s && r.state), fresh = [];
  WALL_AT = Date.now();
  if (!rows.length) { paintWalls(); return; }
  for (const r of rows) {
    const was = WPREV[r.s]; WPREV[r.s] = r.state;
    if (was === undefined || was === r.state) continue;
    WSINCE[r.s] = Date.now();
    const k = r.s + r.state;
    if (!WALL_LOUD[r.state] || (WSEEN[k] && Date.now() - WSEEN[k] < 1200000)) continue;
    WSEEN[k] = Date.now(); fresh.push(r);
  }
  WALLS = rows;
  paintWalls(); if (!el("wallsAll").hidden) paintWallsAll();
  if (fresh.length && PRIMED.walls) wallsAnnounce(fresh);
  PRIMED.walls = true;
}
/* every 30 s from 03:55 to 20:10 New York on weekdays (the feed covers 04:00-20:00), every 5 minutes otherwise; the dots and the
   full screen are kept current every 5 s; the full screen goes back to the Station after two minutes untouched (the TV has no hands) */
const wallsHours = () => { const p = etParts(new Date()), m = (Number(p.hour) % 24) * 60 + Number(p.minute); return !/Sat|Sun/.test(p.weekday) && m >= 235 && m <= 1210; };
let WALL_NEXT = 0;
function wallsTick() {
  if (Date.now() >= WALL_NEXT) { WALL_NEXT = Date.now() + (wallsHours() ? 30000 : 300000); loadWalls().catch(() => {}); }
  else { paintWalls(); if (!el("wallsAll").hidden) paintWallsAll(); }
  if (!el("wallsAll").hidden && Date.now() - LAST_INPUT > 120000) closeWallsAll();
}
setTimeout(() => { wallsTick(); setInterval(wallsTick, 5000); }, 0);

/* ---- the clock: every feed on its own cadence; a failed read keeps the last picture ---- */
const guard = (fn) => () => fn().catch(() => {});
const JOBS = [[loadVolume, 8000], [loadPairs, 30000], [loadRead, 60000], [loadEcon, 30000], [loadEarn, 120000], [loadScint, 20000], [loadAlerts, 20000], [loadMacro, 300000]];
for (const [fn, ms] of JOBS) { const g = guard(fn); g(); setInterval(g, ms); }

/* ---- self-update: a new release reloads the page once nobody is touching it and no video is in use ----
   Touching counts inside the video column too (the feed and the player's buttons live in their own page). Night valve: a video left
   playing or paused must not hold a release forever - from 01:00 to 06:00 in New York, an hour untouched is enough. */
let LAST_INPUT = Date.now(), SEEN = null;
const touched = () => { LAST_INPUT = Date.now(); };
const INPUTS = ["pointerdown", "keydown", "wheel"];
for (const ev of INPUTS) addEventListener(ev, touched, { passive: true, capture: true });
const watchVideoInput = () => { try { const d = el("videoFrame").contentDocument; for (const ev of INPUTS) d.addEventListener(ev, touched, { passive: true, capture: true }); } catch (_) {} };
el("videoFrame").addEventListener("load", watchVideoInput); watchVideoInput();
const nightNY = () => { const h = +etParts(new Date()).hour % 24; return h >= 1 && h < 6; };
setInterval(guard(async () => {
  const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
  const tag = r.headers.get("etag") || r.headers.get("last-modified");
  if (!tag) return;
  if (SEEN == null) { SEEN = tag; return; }
  const idle = Date.now() - LAST_INPUT;
  if (tag !== SEEN && ((idle > 120000 && !videoBusy()) || (nightNY() && idle > 3600000))) location.reload();
}), 180000);
</script>
