<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F"><link rel="icon" href="/notify/icon-192.png">
<title>SCINTILLA · brain map</title>
<!-- 1 Nov 2026. Alan: "a vault with my pushes and full reads. I like it. But we should have a way of visualizing tickers and classifications of things." and "Visuals, why make me read so much?"
     Every name the full reads and his pushes talked about, by class (the Hub's cohorts): green bar = called bullish, red = bearish, cyan = named without a call. A tap opens what each read said. Reads the same tables as the read page; works on every device. -->
<style>
:root{ --bg:#0A0A0F; --panel:#12121C; --line:#2C2C46; --ink:#E8EAF4; --dim:#9A9EB8; --crk:#00D4FF; --bull:#00FFA3; --bear:#FF456B; --mute:#2A2A40; }
*{ box-sizing:border-box; } html,body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; -webkit-text-size-adjust:100%; }
main{ max-width:1500px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
header{ display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px; margin-bottom:12px; }
h1{ font:700 14px ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.14em; color:var(--crk); margin:0; }
.key{ color:var(--dim); font-size:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; } .key i{ display:inline-block; width:18px; height:7px; border-radius:2px; margin-right:5px; vertical-align:1px; }
.tabs{ margin-left:auto; display:flex; gap:4px; } .tabs button{ font:600 12px ui-monospace,"SF Mono",Menlo,monospace; color:var(--dim); background:none; border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; } .tabs button.on{ color:#04121A; background:var(--crk); border-color:var(--crk); }
#grid{ columns:300px; column-gap:12px; }
.cls{ break-inside:avoid; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px 8px; margin:0 0 12px; }
.cls h2{ font:700 12px ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.1em; color:var(--ink); margin:0 0 7px; display:flex; justify-content:space-between; } .cls h2 span{ color:var(--dim); font-weight:500; }
.nm{ display:grid; grid-template-columns:58px 1fr 22px; gap:8px; align-items:center; padding:3px 2px; border-radius:5px; cursor:pointer; width:100%; background:none; border:0; color:inherit; text-align:left; font:inherit; } .nm:hover{ background:rgba(0,212,255,.07); }
.nm b{ font:700 12.5px ui-monospace,"SF Mono",Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .nm .n{ font:12px ui-monospace,"SF Mono",Menlo,monospace; color:var(--dim); text-align:right; }
.track{ display:flex; height:9px; background:var(--mute); border-radius:3px; overflow:hidden; } .track i{ display:block; height:100%; } .up{ background:var(--bull); box-shadow:0 0 5px var(--bull); } .dn{ background:var(--bear); box-shadow:0 0 5px var(--bear); } .fl{ background:var(--crk); box-shadow:0 0 5px var(--crk); }
.said{ margin:4px 2px 8px; font-size:13.5px; border-top:1px solid var(--line); } .said a{ display:block; color:inherit; text-decoration:none; padding:7px 0; border-bottom:1px solid var(--line); } .said .v{ font:700 11px ui-monospace,"SF Mono",Menlo,monospace; margin-right:6px; } .said .wh{ color:var(--dim); font-size:12px; display:block; margin-bottom:1px; }
.msg{ color:var(--dim); padding:24px 0; }
</style>
</head>
<body><main>
<header><h1>BRAIN MAP</h1>
<div class="key"><span><i class="up"></i>called bullish</span><span><i class="dn"></i>called bearish</span><span><i class="fl"></i>named, no call</span></div>
<div class="tabs" id="tabs"><button type="button" data-d="7" class="on">7 days</button><button type="button" data-d="30">30 days</button><button type="button" data-d="3650">All</button></div></header>
<div id="grid"><div class="msg">reading…</div></div>
</main>
<script>
const SB = "https://wadinxqplrggagkvrdag.supabase.co", ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY-g", PG = { apikey: ANON, Authorization: "Bearer " + ANON };
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pg = (q) => fetch(SB + "/rest/v1/" + q, { headers: PG }).then((r) => { if (!r.ok) throw new Error("status " + r.status); return r.json(); });
/* names the reads use that are not tickers, placed in the class they belong to */
const PLAIN = { SILVER: "METALS", GOLD: "METALS", OIL: "MACRO", WTI: "MACRO", BRENT: "MACRO", SPX: "INDEXES", "S&P 500": "INDEXES", NASDAQ: "INDEXES", NDX: "INDEXES", SOX: "INDEXES", DOW: "INDEXES", RUT: "INDEXES", VIX: "INDEXES", BITCOIN: "CRYPTO", BTC: "CRYPTO", ETH: "CRYPTO", DXY: "MACRO", TLT: "MACRO", "10Y": "MACRO", OPENAI: "AI SOFTWARE", ANTHROPIC: "AI SOFTWARE" };
let READS = [], COHORT = {}, DAYS = 7, OPEN = null;
function paint() {
  const since = Date.now() - DAYS * 86400000, names = {};
  for (const r of READS) {
    if (Date.parse(r.published_at || 0) < since) continue;
    for (const t of r.tickers || []) {
      const name = String(t.t || "").trim().toUpperCase(); if (!name) continue;   /* "Gold" and "GOLD" are one name */
      (names[name] = names[name] || { up: 0, dn: 0, fl: 0, said: [] });
      const v = String(t.view || "").toLowerCase(); names[name][v === "bullish" ? "up" : v === "bearish" ? "dn" : "fl"]++;
      names[name].said.push({ v, why: t.why, levels: t.levels, who: String(r.channel || "").trim(), day: String(r.published_at || "").slice(5, 10), id: r.video_id });
    }
  }
  const classes = {}; let max = 1;
  for (const [name, x] of Object.entries(names)) { const c = COHORT[name] || PLAIN[name] || "OTHER"; (classes[c] = classes[c] || []).push([name, x]); x.n = x.up + x.dn + x.fl; if (x.n > max) max = x.n; }
  const order = Object.entries(classes).map(([c, rows]) => [c, rows.sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0])), rows.reduce((s, r) => s + r[1].n, 0)]).sort((a, b) => b[2] - a[2]);
  el("grid").innerHTML = order.length ? order.map(([c, rows, total]) => '<section class="cls"><h2>' + esc(c.replace(/_/g, " ")) + "<span>" + total + "</span></h2>" + rows.map(([name, x]) => {
    const pct = (k) => (x[k] / max * 100).toFixed(1) + "%", open = OPEN === name;
    return '<button type="button" class="nm" data-n="' + esc(name) + '" title="' + x.up + " bullish, " + x.dn + " bearish, " + x.fl + ' named"><b>' + esc(name) + '</b><span class="track"><i class="up" style="width:' + pct("up") + '"></i><i class="dn" style="width:' + pct("dn") + '"></i><i class="fl" style="width:' + pct("fl") + '"></i></span><span class="n">' + x.n + "</span></button>" +
      (open ? '<div class="said">' + x.said.map((s) => '<a href="/notify/read.html?v=' + encodeURIComponent(s.id) + '"><span class="wh"><span class="v" style="color:var(--' + (s.v === "bullish" ? "bull" : s.v === "bearish" ? "bear" : "crk") + ')">' + esc(s.v.toUpperCase()) + "</span>" + esc(s.who) + " · " + esc(s.day) + "</span>" + esc(s.why) + (s.levels ? " (" + esc(s.levels) + ")" : "") + "</a>").join("") + "</div>" : "");
  }).join("") + "</section>").join("") : '<div class="msg">No full reads in this window yet.</div>';
}
el("grid").addEventListener("click", (e) => { const b = e.target.closest(".nm"); if (!b) return; OPEN = OPEN === b.dataset.n ? null : b.dataset.n; paint(); });
el("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; DAYS = +b.dataset.d; OPEN = null; for (const x of el("tabs").children) x.classList.toggle("on", x === b); paint(); });
Promise.all([pg("youtube_reads?select=video_id,channel,title,published_at,tickers&tier=eq.deep&order=published_at.desc&limit=500"), pg("cohorts?select=ticker,cohort&limit=2000")]).then(([reads, cohorts]) => {
  READS = reads; for (const c of cohorts) COHORT[String(c.ticker).toUpperCase()] = c.cohort; paint();
}).catch((e) => { el("grid").innerHTML = '<div class="msg">Could not read the map: ' + esc(e.message) + "</div>"; });
</script>
</body>
</html>
